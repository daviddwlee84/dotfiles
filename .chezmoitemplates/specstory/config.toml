# SpecStory CLI Configuration
#
# MANAGED BY CHEZMOI via modify_ overlay
# (source: .chezmoitemplates/specstory/config.toml). Every *active* key below
# is re-asserted on `chezmoi apply`; other keys and tables (e.g. SpecStory's own
# [resume] state, or a key you uncomment here) are preserved. Per-project
# overrides belong in ./.specstory/cli/config.toml.
#
# This is the user-level config file for SpecStory CLI.
# Settings here act as global defaults for all projects when you run `specstory`.
#
# Project-local `./.specstory/cli/config.toml` settings override these defaults.
# CLI flags override both user-level and project-level configuration.
#
# Uncomment (remove the #) any setting below to change the default behavior.
# For more information, see:
# https://docs.specstory.com/integrations/terminal-coding-agents/usage#configuration

[local_sync]
# Write markdown files locally. (default: true)
# enabled = false # equivalent to --only-cloud-sync

# Custom output directory for markdown files.
# Default: ./.specstory/history (relative to the project directory)
# output_dir = "~/.specstory/history" # equivalent to --output-dir "~/.specstory/history"

# Use local timezone for file name and content timestamps (default: false, UTC)
# local_time_zone = true # equivalent to --local-time-zone

[cloud_sync]
# Sync session data to SpecStory Cloud. (default: true, when logged in to SpecStory Cloud)
# enabled = false # equivalent to --no-cloud-sync

[logging]
# Write logs to .specstory/debug/debug.log (default: false)
# log = true # equivalent to --log

# Debug-level output, requires console or log (default: false)
# debug = true # equivalent to --debug

# Custom output directory for debug data.
# Default: ./.specstory/debug (relative to the project directory)
# debug_dir = "~/.specstory/debug" # equivalent to --debug-dir "~/.specstory/debug"

# Error/warn/info output to stdout (default: false)
# console = true # equivalent to --console

# Suppress all non-error output (default: false)
# silent = true # equivalent to --silent

[version_check]
# Check for new versions of the CLI on startup.
# Default: true
# enabled = false # equivalent to --no-version-check

[analytics]
# Send anonymous product usage analytics to help improve SpecStory.
# Default: true
# enabled = false # equivalent to --no-usage-analytics

[telemetry]
# OTLP gRPC collector endpoint (e.g., "localhost:4317" or "http://localhost:4317")
# endpoint = "localhost:4317"

# Override the default service name (default: "specstory-cli")
# service_name = "my-service-name"

# Include user prompt text in telemetry spans (default: true). Only matters
# once an endpoint is set; set `prompts = false` then if prompts are sensitive.
# prompts = false

[redaction]
# Redact secrets and API keys from saved markdown history and cloud-synced
# session data. (default: true)
# Detection uses the betterleaks ruleset, covering API keys, tokens, private
# keys, and other credentials for many providers.
# Pinned on explicitly so an upstream default change can't silently disable it.
enabled = true # `false` is equivalent to --no-redact-secrets

[providers]
# Agent execution commands by provider (used by `specstory run`)
# Pass custom flags (e.g. `claude_cmd = "claude --allow-dangerously-skip-permissions"`).
# Use of these is equivalent to `-c "custom command"`.
#
# These only customise HOW a provider launches — they do NOT pick the default.
# Bare `specstory run` resolves to the alphabetically-first registered
# provider (2.9.0 added `antigravity`, which displaced `claude`), and there is
# no config key to override that. Always name the provider explicitly:
# `specstory run claude`. See pitfalls/specstory-run-default-agent-drift.md.

# Defaults favour zero-prompt runs (bypass / YOLO). Flags verified against
# each CLI's `--help`; see docs/tools/specstory.md § Safety Tradeoff.
# IDE/cloud providers (copilotide, cursoride, cursorcloud) don't launch a
# local CLI via `run`, so they have no entry here.

# Antigravity CLI (binary is `agy`; add `--effort high` if wanted)
antigravity_cmd = "agy --dangerously-skip-permissions"

# Claude Code (`--permission-mode auto` is the classifier-gated alternative)
claude_cmd = "claude --dangerously-skip-permissions"

# Codex CLI: one flag = `-a never -s danger-full-access`. The summary override
# keeps reasoning text in the saved markdown; model / effort stay in
# ~/.codex/config.toml.
codex_cmd = 'codex --dangerously-bypass-approvals-and-sandbox -c model_reasoning_summary="detailed"'

# GitHub Copilot CLI (`--yolo` = `--allow-all`: tools, paths, URLs)
copilot_cmd = "copilot --yolo"

# Cursor CLI (`--yolo` is an alias)
cursor_cmd = "cursor-agent --force"

# Factory Droid CLI
droid_cmd = "droid --yolo"

# Gemini CLI (`--yolo` auto-approves tools; `--sandbox` is a separate axis)
gemini_cmd = "gemini --yolo"

# OpenCode (auto-approve everything not explicitly denied)
opencode_cmd = "opencode --auto"

# Pi has no permission prompts; listed for completeness
pi_cmd = "pi"

# Qwen Code (Gemini CLI fork; `--approval-mode auto` is the classifier option)
qwen_cmd = "qwen --yolo"

# Unverified bypass flags: uncomment and add one once installed.
# deepseek_cmd = "deepseek"   # DeepSeek TUI
# grok_cmd = "grok"           # Grok Build
# muse_cmd = "muse"           # Muse Code
