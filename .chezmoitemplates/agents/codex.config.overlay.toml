personality = "pragmatic"
model_reasoning_effort = "xhigh"

[features]
hooks = true
unified_exec = true
shell_snapshot = true
steer = true
multi_agent = true

[tui]
# Stock Codex only supports built-in status items (no Claude-style command
# renderer). Keep this provider-neutral: five-hour/weekly limits can still be
# ChatGPT-account counters when a one-off launcher routes inference elsewhere.
status_line = [
  "model-with-reasoning",
  "fast-mode",
  "git-branch",
  "context-remaining",
  "task-progress",
  "current-dir",
]

[tui.keymap.editor]
insert_newline = ["ctrl-j", "shift-enter", "alt-enter"]

[plugins."github@openai-curated"]
enabled = true

[plugins."google-drive@openai-curated"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true
