# herdr-plus Quick Action — open claude-copilot next to the focused pane.
# Managed by chezmoi. Level 1 is this entry in the Quick Actions list (type
# "agent" to filter to all Agent: actions); level 2 is the select below, grouped
# by recording mode via `heading` rows. ~/.config/herdr/agent-open.sh does the
# split/tab and the shell rc fast path starts the agent before the heavy init.
# See docs/tools/herdr.md § "Open a coding agent".
name = "Agent: Claude (Copilot, once)"
description = "claude-copilot-once beside this pane (SpecStory or direct)"
type = "select"
command = "~/.config/herdr/agent-open.sh {{.Value}}"

[[options]]
heading = "SpecStory (record)"

[[options]]
label = "→ Split right"
value = "right claude-copilot run"
description = "Side by side with the current pane"

[[options]]
label = "↓ Split down"
value = "down claude-copilot run"
description = "Stacked under the current pane"

[[options]]
label = "⊞ New tab"
value = "tab claude-copilot run"
description = "A new tab in this workspace, labelled with the agent"

[[options]]
heading = "Direct"

[[options]]
label = "→ Split right"
value = "right claude-copilot off"
description = "Side by side with the current pane"

[[options]]
label = "↓ Split down"
value = "down claude-copilot off"
description = "Stacked under the current pane"

[[options]]
label = "⊞ New tab"
value = "tab claude-copilot off"
description = "A new tab in this workspace, labelled with the agent"
