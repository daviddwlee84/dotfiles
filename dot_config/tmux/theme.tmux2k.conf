# ~/.config/tmux/theme.tmux2k.conf
# tmux2k theme with bottom status bar.

set -g @plugin '2kabhishek/tmux2k'

# Auto-clone on first use
if-shell '[ ! -d ~/.tmux/plugins/tmux2k ]' \
  'run-shell "git clone --depth 1 https://github.com/2kabhishek/tmux2k.git ~/.tmux/plugins/tmux2k 2>/dev/null"'

# Reset so toggling from another theme leaves no residue
set -g status-left ""
set -g status-right ""
set -g window-status-format ""
set -g window-status-current-format ""

# Bottom status bar, centered window list (explicit reset so switching from
# Catppuccin's status-justify=left doesn't leak into this theme)
set -g status-position bottom
set -g status-justify centre

# Theme options (must be set before the plugin runs)
set -g @tmux2k-theme 'onedark'
set -g @tmux2k-start-icon ""
set -g @tmux2k-left-plugins "git cpu ram"
# NOTE: the `bandwidth` segment has a known uint64 underflow bug that can
# display 18446744073709551615K. See docs/tools/tmux/themes.md troubleshooting.
set -g @tmux2k-right-plugins "bandwidth network time"

# Load plugin explicitly so the status bar renders after a prefix + R reload
# (TPM only auto-runs plugins when the server first starts).
run '~/.tmux/plugins/tmux2k/2k.tmux'
