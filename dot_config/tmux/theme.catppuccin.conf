# ~/.config/tmux/theme.catppuccin.conf
# Catppuccin theme with top status bar.

# Declare plugin so TPM keeps it updated on prefix + U
set -g @plugin 'catppuccin/tmux'

# Auto-clone on first use (TPM only installs on prefix + I)
if-shell '[ ! -d ~/.tmux/plugins/tmux ]' \
  'run-shell "git clone --depth 1 https://github.com/catppuccin/tmux.git ~/.tmux/plugins/tmux 2>/dev/null"'

# Top status bar, left-aligned window list
set -g status-position top
set -g status-justify left

# Catppuccin options -- must be set BEFORE running the plugin
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'

# Window text (what each tab shows). #I = index, #W = window name.
#
# Two parallel per-window user-options stack into the tab label:
#
#   #{?@workmux_status, #{@workmux_status},}
#     workmux agent state (🤖 working / 💬 waiting / ✅ done), written by
#     `workmux set-window-status` from Claude Code hooks
#     (dot_claude/modify_settings.json) and the OpenCode plugin
#     (dot_config/opencode/plugins/workmux-status.ts). `waiting` and `done`
#     auto-clear on window focus; `working` is sticky and relies on `Stop` /
#     `session.idle` hooks to transition to `done`. Cleared from CLI via
#     `wmclear` (dot_config/shell/38_workmux.sh) or from the right-click tab
#     menu's "Clear agent status" entry (dot_config/tmux/keybindings.conf.tmpl).
#     We set `status_format: false` in dot_config/workmux/config.yaml so workmux
#     does NOT also append its own format per-tmux-session — that path is
#     per-session and doesn't survive new sessions or chezmoi diffs.
#
#   #{?@bookmark_status, #{@bookmark_status},}
#     Manual user tag (⭐/📌/🔖/🚩), toggled from the right-click tab menu via
#     ~/.config/tmux/toggle-bookmark.sh. Independent of workmux — both render
#     side-by-side so a window can show e.g. `1: shell 🤖 ⭐` (agent working +
#     bookmarked). Settable from CLI too: `tmux_status_set bookmark <glyph>`
#     (dot_config/shell/60_tmux_status.sh).
#
# See docs/tools/workmux.md for the full integration story.
set -g @catppuccin_window_text ' #W#{?@workmux_status, #{@workmux_status},}#{?@bookmark_status, #{@bookmark_status},}'
set -g @catppuccin_window_current_text ' #W#{?window_zoomed_flag, 󰊓 ,}#{?@workmux_status, #{@workmux_status},}#{?@bookmark_status, #{@bookmark_status},}'
set -g @catppuccin_window_number_position 'left'

# Module tweaks
set -g @catppuccin_directory_text "#{b:pane_current_path}"
set -g @catppuccin_date_time_text "%Y-%m-%d %H:%M"

# Load plugin -- this populates @catppuccin_status_*, window-status-format,
# window-status-current-format with Catppuccin styling
run '~/.tmux/plugins/tmux/catppuccin.tmux'

# Responsive status line: status-left/status-right are conditional formats
# that select module bundles based on each client's #{client_width}, so
# multi-client attaches at different widths each see the right tier without
# stomping on each other.
run '~/.config/tmux/responsive.sh'

# NOTE: intentionally do NOT override window-status-format /
# window-status-current-format here -- the plugin has already set those based
# on @catppuccin_window_status_style above, and overriding them with
# non-existent v1 variables wipes the window list.
