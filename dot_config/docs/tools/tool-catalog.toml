# Tool catalog — SSOT for "what does this repo install, what is it, who installs it".
#
# Consumers (keep in sync with the schema below):
#   - `tv inventory`            dot_config/television/cable/inventory.toml
#   - helper / generator        dot_config/television/executable_tool-catalog.py
#   - generated Tool index      docs/this_repo/tool-managers.md § Tool index (A–Z)
#                               (`just gen-tool-index`; never hand-edit the marker region)
#   - guardrail tests           tests/unit/test_tool_catalog.py
#
# The role defaults (dot_ansible/roles/*/defaults/main.yml), Brewfiles and mise config
# stay the INSTALL source of truth — this file only adds metadata (category,
# description, gate, docs). The test fails when a role list / Brewfile names a
# tool this catalog doesn't know about.
#
# [[tool]] fields
#   id          canonical, lowercase-ish id (unique)
#   label       markdown for the index "Tool" column (default: **id**)
#   bins        binaries to probe on PATH (default: [id]; [] = nothing to probe)
#   pkgs        extra package / cask names this entry covers (coverage test only)
#   category    one of `categories` below
#   desc        one-line "what is it"
#   role        installing ansible role, or a pseudo-role from [roles.*]
#   role_linux  role on Linux when it differs from `role` (e.g. Brewfile.darwin → gui_apps_linux)
#   tag         ansible tag when it differs from the role name
#   gate        gate expression REPLACING the role's gate (see [roles.*])
#   gate_linux  gate on Linux when it differs from `gate`
#   app         macOS .app bundle name (probed in /Applications, ~/Applications)
#   docs        repo-relative doc path
#   upgrade     explicit upgrade command (default: derived from the install method)
#   mac / linux install method markdown (verbatim in the index; "n/a"/"—" = not for this OS)
#   role_md     verbatim index "Role" column when it carries more than the role name
#
# Gate expressions: terms joined by `&`; a term is `key` (truthy), `!key`, or
# `key=value`, evaluated against chezmoi data (the init prompts). Missing keys
# fall back to [gate_defaults], else false.

categories = [
  "File & Search", "Git & Diff", "Sessions & Multiplexing", "Navigation & Shell",
  "Process & System", "Dev Tools", "Data & Docs", "Networking", "AI / Coding Agents",
  "Media", "Runtimes & Package Managers", "Security & Secrets", "Cloud & Containers",
  "Terminals & Editors", "GUI Apps", "Fonts & Input", "Homelab & Hardware",
  "System Libraries", "Fun",
]

# Prompt defaults for keys absent from an older chezmoi.toml (mirror the
# `hasKey` fallbacks in .chezmoiscripts/global/run_onchange_after_20_ansible_roles.sh.tmpl).
[gate_defaults]
installExtraRuntimes = true
installPersonalTools = true
agentSounds = "notify"
profile = ""

# Role → gate / tag / OS. Mirrors the TAGS assembly in
# .chezmoiscripts/global/run_onchange_after_20_ansible_roles.sh.tmpl.
# `install` overrides the derived `just ansible-tags <tag>` hint.
[roles.base]
[roles.zsh]
[roles.bash]
[roles.starship]
[roles.atuin]
[roles.neovim]
[roles.lazyvim_deps]
[roles.devtools]
[roles.docker]
[roles.nerdfonts]
[roles.security_tools]
[roles.personal_tools]
gate = "installPersonalTools"
[roles.rust_cargo_tools]
gate = "installExtraRuntimes"
[roles.go_tools]
gate = "installExtraRuntimes"
[roles.ruby_gem_tools]
gate = "installExtraRuntimes"
[roles.coding_agents]
gate = "installCodingAgents"
[roles.bitwarden]
gate = "installBitwarden"
[roles.python_uv_tools]
gate = "installPythonUvTools"
[roles.js_cli_tools]
gate = "installJsCliTools"
[roles.llm_tools]
gate = "installLlmTools"
[roles.summarize]
gate = "installSummarize"
[roles.input_method]
gate = "installInputMethod"
[roles.networking_tools]
gate = "installNetworkingTools"
[roles.iac_tools]
gate = "installIacTools"
[roles.media_tools]
gate = "installMediaTools"
[roles.media_control]
gate = "installMediaControl"
[roles.dotnet_tools]
gate = "installDotnetTools"
[roles.gui_apps_linux]
gate = "profile=ubuntu_desktop"
tag = "gui_apps"
os = ["linux"]
[roles.auditd]
gate = "installAuditd"
os = ["linux"]
[roles.homelab_tools]
gate = "installHomelabTools"
os = ["linux"]
[roles.resilio_sync]
gate = "installResilioSync"
os = ["linux"]
[roles.wake_on_lan]
gate = "installWakeOnLan"
os = ["linux"]
[roles.niri]
gate = "installNiri&profile=ubuntu_desktop"
os = ["linux"]

# Pseudo-roles (not ansible)
[roles."Brewfile.darwin"]
gate = "installBrewApps"
os = ["darwin"]
install = "brew bundle --file=~/.config/homebrew/Brewfile.darwin"
[roles.Brewfile]
os = ["darwin"]
install = "brew bundle --file=~/.config/homebrew/Brewfile"
[roles.bootstrap]
install = "chezmoi apply (run_once_before bootstrap script)"
[roles.mise]
install = "mise install --yes"
[roles.chezmoi-external]
install = "chezmoi apply --refresh-externals"
[roles.in-house]
install = "chezmoi apply"
[roles.mason]
install = "nvim → :Mason"

