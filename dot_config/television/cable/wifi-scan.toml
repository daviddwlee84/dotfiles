# Wi-Fi scan channel for television (tv)
# Fuzzy-search nearby Wi-Fi networks: band, channel, width, RSSI, SNR,
# security, flags (current / DFS). Use it to pick a clean, non-DFS channel.
#
# Usage:
#   tv wifi-scan
#   wifiscan                # shell alias, runs a scan up front
#
# Reads ~/.cache/tv/wifi-scan.tsv, populated by
# ~/.config/television/wifi-scan.sh. See docs/playbooks/wifi-latency-spikes.md.
#
# Source cycling (Ctrl+S):
#   1. All networks (sorted by band then channel)
#   2. 5 GHz only
#   3. 5 GHz non-DFS only (the channels you actually want)
#
# Keybindings (Alt+ namespace to avoid tmux/TV conflicts):
#   Alt+R   Rescan + reload
#   Alt+C   Clear cache + reload
#   Ctrl+Y  Copy the selected channel number (OSC 52 over SSH)
#   Enter   Show full detail for the selected network

[metadata]
name = "wifi-scan"
description = "Nearby Wi-Fi: SSID, band, channel, width, RSSI, SNR, security, flags"

[source]
# Columns (tab-separated, matches wifi-scan.sh TSV_HEADER):
# 0:ssid 1:band 2:channel 3:width 4:rssi 5:noise 6:snr 7:security 8:flags
command = [
  """
  tsv="$HOME/.cache/tv/wifi-scan.tsv"
  if [ ! -s "$tsv" ]; then "$HOME/.config/television/wifi-scan.sh" scan >/dev/null 2>&1; fi
  awk -F'\\t' 'NR>1' "$tsv" | sort -t'\\t' -k2,2 -k3,3n
  """,
  """
  tsv="$HOME/.cache/tv/wifi-scan.tsv"
  awk -F'\\t' 'NR>1 && $2 ~ /^5/' "$tsv" | sort -t'\\t' -k3,3n
  """,
  """
  tsv="$HOME/.cache/tv/wifi-scan.tsv"
  awk -F'\\t' 'NR>1 && $2 ~ /^5/ && $9 !~ /DFS/' "$tsv" | sort -t'\\t' -k3,3n
  """,
]
display = "{split:\\t:1}  ch{split:\\t:2} {split:\\t:3}  {split:\\t:4}dBm snr{split:\\t:6}  {split:\\t:7}  {split:\\t:8}  {split:\\t:0}"
output = "{split:\\t:2}"

[preview]
command = [
  """
  tsv="$HOME/.cache/tv/wifi-scan.tsv"
  python3 - "$tsv" <<'PY'
import sys
from collections import defaultdict
rows=[l.rstrip("\\n").split("\\t") for l in open(sys.argv[1])][1:]
def occ(predicate):
    d=defaultdict(list)
    for r in rows:
        if len(r)<9: continue
        if predicate(r): d[r[2]].append(r)
    return d
print("# 5 GHz channel occupancy (APs / strongest RSSI)")
d=occ(lambda r: r[1].startswith("5"))
for ch in sorted(d, key=lambda c:(len(c),c)):
    aps=d[ch]; best=max((int(a[4]) for a in aps if a[4].lstrip('-').isdigit()), default=0)
    dfs=" DFS" if any("DFS" in a[8] for a in aps) else ""
    print(f"  ch{ch:>3}{dfs}: {len(aps)} AP, best {best} dBm")
print("\\n# 2.4 GHz channel occupancy")
d=occ(lambda r: r[1].startswith("2"))
for ch in sorted(d, key=lambda c:(len(c),c)):
    print(f"  ch{ch:>3}: {len(d[ch])} AP")
nondfs=[36,40,44,48,149,153,157,161,165]
used={int(r[2]) for r in rows if r[1].startswith("5") and r[2].isdigit()}
free=[c for c in nondfs if c not in used]
print("\\n# Recommendation (non-DFS 5 GHz)")
print("  clearest:", free[0] if free else "all in use — pick the one with fewest/weakest APs above")
PY
  """,
]
header = "Wi-Fi neighbourhood"

[ui]
input_header = "Wi-Fi scan"

[ui.preview_panel]
size = 50

[keybindings]
alt-r = ["actions:rescan", "reload_source"]
alt-c = ["actions:clean", "reload_source"]
ctrl-y = ["actions:copy_channel", "reload_source"]
enter = "actions:detail"

[actions.rescan]
description = "Rescan Wi-Fi"
command = "$HOME/.config/television/wifi-scan.sh scan >/dev/null 2>&1 &"
mode = "fork"

[actions.clean]
description = "Clear Wi-Fi scan cache"
command = "$HOME/.config/television/wifi-scan.sh clean >/dev/null 2>&1"
mode = "fork"

[actions.detail]
description = "Show full detail for selected network"
command = """
ch='{split:\\t:2}'
tsv="$HOME/.cache/tv/wifi-scan.tsv"
echo "# Networks on channel $ch"
awk -F'\\t' -v c="$ch" 'NR==1 || $3==c' "$tsv" | column -t -s'\\t'
echo
echo '[Press Enter to exit]'; read -r _
"""
mode = "execute"

[actions.copy_channel]
description = "Copy selected channel number"
command = """
d='{split:\\t:2}'
[ -z "$d" ] && exit 0
if command -v pbcopy >/dev/null 2>&1; then printf '%s' "$d" | pbcopy
elif command -v wl-copy >/dev/null 2>&1; then printf '%s' "$d" | wl-copy
elif command -v xclip >/dev/null 2>&1; then printf '%s' "$d" | xclip -selection clipboard
else printf '\\033]52;c;%s\\007' "$(printf '%s' "$d" | base64 | tr -d '\\n')" > /dev/tty
fi
"""
mode = "fork"
