# Agent quota wakeup dashboard.
#
# Shows live coding-agent panes, conservatively detected quota/rate-limit wait
# states, parsed reset times, and queued pueue wakeup tasks.
#
# Keybindings:
#   Enter      Jump to pane
#   Alt+C      Schedule smart wakeup at detected reset time + 2 minutes
#   Alt+T      Prompt for custom time/delay
#   Alt+N      Smart send now (Enter for rate-limit menus, otherwise continue)
#   Alt+X      Cancel queued wakeup task(s)
#   Ctrl+F     Cycle preview (live pane capture via agent-wakeup.py)

[metadata]
name = "agent-wakeup"
description = "Agent quota wakeup dashboard: quota waits, reset timers, scheduled continue tasks"
requirements = ["python3", "pueue"]

[source]
command = "~/.config/television/agent-wakeup.py status --tsv"
display = "{split:\t:0} {split:\t:1} {split:\t:2}  │ action {split:\t:12} │ reset {split:\t:4} │ wake {split:\t:6} │ {split:\t:8}"
output = "{split:\t:2}"
watch = 5.0
no_sort = true

[preview]
command = "~/.config/television/agent-wakeup.py preview --pane '{split:\t:3}' --backend '{split:\t:13}' --herdr-session '{split:\t:14}' || true"
header = "{split:\t:0}  {split:\t:1}  {split:\t:2}"

[ui]
input_header = "Agent Wakeup"

[ui.preview_panel]
size = 60

[keybindings]
enter = "actions:switch_pane"
alt-c = ["actions:schedule_detected", "reload_source"]
alt-t = ["actions:schedule_custom", "reload_source"]
alt-n = ["actions:send_now", "reload_source"]
alt-x = ["actions:cancel", "reload_source"]

[actions.switch_pane]
description = "Focus the selected tmux/Herdr pane"
command = '''
~/.config/television/agent-wakeup.py focus --pane '{split:\t:3}' --backend '{split:\t:13}' --herdr-session '{split:\t:14}' --agent-session-id '{split:\t:15}'
'''
mode = "fork"

[actions.schedule_detected]
description = "Schedule smart wakeup at detected reset time + 2 minutes"
command = '''
pane='{split:\t:3}'
epoch='{split:\t:5}'
if [ -z "$pane" ] || [ -z "$epoch" ]; then
  echo "No detected reset time for this pane."
  echo "[Press Enter]"; read -r _
  exit 0
fi
~/.config/television/agent-wakeup.py schedule --pane "$pane" --backend '{split:\t:13}' --herdr-session '{split:\t:14}' --agent-session-id '{split:\t:15}' --at-epoch "$epoch" --buffer-minutes 2 --auto
echo "[Press Enter]"; read -r _
'''
mode = "execute"

[actions.schedule_custom]
description = "Prompt for custom time/delay, then schedule continue"
command = '''
pane='{split:\t:3}'
[ -z "$pane" ] && exit 0
printf 'Time/delay (examples: 01:52am, 2026-06-19 01:52:00, 70m, 5h): '
read -r when
[ -z "$when" ] && exit 0
~/.config/television/agent-wakeup.py schedule --pane "$pane" --backend '{split:\t:13}' --herdr-session '{split:\t:14}' --agent-session-id '{split:\t:15}' --when "$when" --no-expect-quota --auto
echo "[Press Enter]"; read -r _
'''
mode = "execute"

[actions.send_now]
description = "Smart send now"
command = '''
pane='{split:\t:3}'
[ -z "$pane" ] && exit 0
~/.config/television/agent-wakeup.py send-now --pane "$pane" --backend '{split:\t:13}' --herdr-session '{split:\t:14}' --agent-session-id '{split:\t:15}' --auto
echo "[Press Enter]"; read -r _
'''
mode = "execute"

[actions.cancel]
description = "Cancel queued wakeup tasks for selected pane"
command = '''
pane='{split:\t:3}'
[ -z "$pane" ] && exit 0
~/.config/television/agent-wakeup.py cancel --pane "$pane" --backend '{split:\t:13}' --herdr-session '{split:\t:14}' --agent-session-id '{split:\t:15}'
echo "[Press Enter]"; read -r _
'''
mode = "execute"
