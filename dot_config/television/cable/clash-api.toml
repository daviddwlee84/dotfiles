# Live Clash / mihomo controller channel for television (tv).
# Fuzzy-search the external-controller API directly: proxies, proxy groups,
# rules, and runtime summary rows from /version, /configs, and /connections.
#
# Usage:
#   tv clash-api
#   CLASH_CONTROLLER=192.168.222.207:9090 tv clash-api
#   CLASH_CONTROLLER=192.168.222.207:9090 CLASH_SECRET=mytoken tv clash-api
#
# Controller discovery:
#   $CLASH_CONTROLLER / $CLASH_SECRET           (explicit override)
#   runtime external-controller from local Clash config
#   reachable Docker/local controller at 127.0.0.1:9090
#
# Prereqs: `curl`. `uv` is optional here: it is only used when no controller
# env vars are set and the helper falls back to the local YAML config.
#
# Source cycling (Ctrl+S):
#   1. Proxies              live /proxies leaf entries
#   2. Proxy Groups         live /proxies selector/url-test/fallback entries
#   3. Rules                live /rules entries
#   4. Summary              /version + /configs + /connections
#
# Preview cycling (Ctrl+F):
#   1. Main      selected entry's controller JSON
#   2. Latency   Clash API /proxies/:name/delay
#   3. Meta      proxy-group references, group members, nearby rules

[metadata]
name = "clash-api"
description = "Live Clash/mihomo controller: proxies, groups, rules, runtime summary"
requirements = ["curl", "uv"]

[source]
command = [
  "$HOME/.config/television/clash-source.sh api-proxies",
  "$HOME/.config/television/clash-source.sh api-groups",
  "$HOME/.config/television/clash-source.sh api-rules",
  "$HOME/.config/television/clash-source.sh api",
]
display = "{split:\\t:0}  {split:\\t:1}  [{split:\\t:2}]  {split:\\t:3}  {split:\\t:4}"
output = "{split:\\t:0}\t{split:\\t:1}"
no_sort = true

[preview]
command = [
  "$HOME/.config/television/clash-preview.sh api-main '{split:\\t:0}' '{split:\\t:1}'",
  "$HOME/.config/television/clash-preview.sh latency  '{split:\\t:0}' '{split:\\t:1}'",
  "$HOME/.config/television/clash-preview.sh api-meta '{split:\\t:0}' '{split:\\t:1}'",
]
header = "{split:\\t:0}: {split:\\t:1}"

[ui]
input_header = "Clash API"

[ui.preview_panel]
size = 55

[keybindings]
enter = "actions:show"
alt-t = "actions:test_latency"
alt-s = ["actions:switch_proxy", "reload_source"]
alt-c = ["actions:close_connections", "reload_source"]
alt-r = ["actions:reload_config", "reload_source"]
alt-d = "actions:open_dashboard"
ctrl-y = "actions:copy_server"
alt-y = "actions:copy_name"

[actions.show]
description = "Show full controller JSON for the selected entry"
command = """
"$HOME/.config/television/clash-preview.sh" api-main '{split:\\t:0}' '{split:\\t:1}'
echo
echo '[Press Enter to exit]'
read -r _
"""
mode = "execute"

[actions.test_latency]
description = "Test proxy latency (Clash API /delay or direct TCP probe fallback)"
command = """
kind='{split:\\t:0}'
if [ "$kind" != "proxy" ] && [ "$kind" != "group" ]; then
  printf 'Alt+T only applies to proxies/groups (got kind=%s)\\n' "$kind"
  sleep 1
  exit 0
fi
"$HOME/.config/television/clash-preview.sh" latency '{split:\\t:0}' '{split:\\t:1}'
echo
echo '[Press Enter to exit]'
read -r _
"""
mode = "execute"

[actions.switch_proxy]
description = "Switch a proxy-group's selection to the highlighted proxy"
command = """
kind='{split:\\t:0}'
name='{split:\\t:1}'
if [ "$kind" != "proxy" ]; then
  printf 'Alt+S requires a proxy row (got kind=%s)\\n' "$kind"
  sleep 1
  exit 0
fi
if ! command -v fzf >/dev/null 2>&1; then
  echo 'fzf not on PATH — install via devtools ansible role'
  sleep 1
  exit 0
fi
{ read -r host; read -r secret; } < <("$HOME/.config/television/clash-source.sh" controller 2>/dev/null)
if [ -z "${host:-}" ]; then
  echo 'external-controller not set'
  sleep 1
  exit 0
fi
auth=()
[ -n "${secret:-}" ] && auth=(-H "Authorization: Bearer $secret")
if ! curl -sS --max-time 2 "${auth[@]}" "http://$host/version" >/dev/null 2>&1; then
  printf 'Controller %s unreachable\\n' "$host"
  sleep 1
  exit 0
fi
pick=$("$HOME/.config/television/clash-source.sh" api-groups-for-switch 2>/dev/null \\
  | awk -F'\\t' -v n="$name" '
      $1 == "group" {
        count = split($4, arr, / \\| /)
        for (i = 1; i <= count; i++) if (arr[i] == n) { printf "%s\\t%s\\n", $2, $3; next }
      }
    ' \\
  | fzf --with-nth=1 --delimiter='\\t' --prompt='Switch group> ' --height=40% --reverse)
if [ -z "${pick:-}" ]; then
  echo 'aborted'
  sleep 1
  exit 0
fi
group=$(printf '%s' "$pick" | awk -F'\\t' '{print $1}')
encoded_group=$(python3 -c 'import sys, urllib.parse as u; print(u.quote(sys.argv[1], safe=""))' "$group")
rc=$(curl -sS -o /tmp/clash-switch.out -w '%{http_code}' --max-time 4 -X PUT \\
  "${auth[@]}" -H 'Content-Type: application/json' \\
  -d "$(python3 -c 'import sys,json; print(json.dumps({"name": sys.argv[1]}))' "$name")" \\
  "http://$host/proxies/$encoded_group" 2>/dev/null || true)
case "$rc" in
  2*) printf 'Switched %s → %s\\n' "$group" "$name" ;;
  *)  printf 'Switch failed (HTTP %s):\\n%s\\n' "$rc" "$(cat /tmp/clash-switch.out 2>/dev/null)" ;;
esac
sleep 1
"""
mode = "execute"

[actions.close_connections]
description = "Close all active connections (DELETE /connections)"
command = """
{ read -r host; read -r secret; } < <("$HOME/.config/television/clash-source.sh" controller 2>/dev/null)
if [ -z "${host:-}" ]; then
  echo 'external-controller not set'
  sleep 1
  exit 0
fi
auth=()
[ -n "${secret:-}" ] && auth=(-H "Authorization: Bearer $secret")
printf 'Close ALL active connections on %s? [y/N]: ' "$host"
read -r confirm
case "$confirm" in y|Y|yes|YES) ;; *) echo 'aborted'; sleep 1; exit 0 ;; esac
rc=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 3 -X DELETE "${auth[@]}" "http://$host/connections" 2>/dev/null || true)
case "$rc" in
  2*) echo 'Connections closed' ;;
  *)  printf 'Close failed (HTTP %s)\\n' "$rc" ;;
esac
sleep 1
"""
mode = "execute"

[actions.reload_config]
description = "Reload Clash config (PUT /configs?force=true)"
command = """
{ read -r host; read -r secret; } < <("$HOME/.config/television/clash-source.sh" controller 2>/dev/null)
if [ -z "${host:-}" ]; then
  echo 'external-controller not set'
  sleep 1
  exit 0
fi
cfg_path="${CLASH_CONFIG:-}"
if [ -z "${cfg_path:-}" ]; then
  cfg_path=$("$HOME/.config/television/clash-parse.py" path 2>/dev/null)
fi
if [ -z "${cfg_path:-}" ]; then
  echo 'no clash config resolved (set CLASH_CONFIG)'
  sleep 1
  exit 0
fi
if [ -n "${CLASH_CONTROLLER:-}" ] && [ -z "${CLASH_CONFIG:-}" ]; then
  default_host=$("$HOME/.config/television/clash-parse.py" controller 2>/dev/null | sed -n '1p')
  if [ -n "${default_host:-}" ] && [ "$default_host" != "$host" ]; then
    echo 'Remote controller reload requires CLASH_CONFIG to point at a config path visible to that host'
    sleep 1
    exit 0
  fi
fi
auth=()
[ -n "${secret:-}" ] && auth=(-H "Authorization: Bearer $secret")
printf 'Reload %s via %s? [y/N]: ' "$cfg_path" "$host"
read -r confirm
case "$confirm" in y|Y|yes|YES) ;; *) echo 'aborted'; sleep 1; exit 0 ;; esac
rc=$(curl -sS -o /tmp/clash-reload.out -w '%{http_code}' --max-time 5 -X PUT \\
  "${auth[@]}" -H 'Content-Type: application/json' \\
  -d "$(python3 -c 'import sys,json; print(json.dumps({"path": sys.argv[1]}))' "$cfg_path")" \\
  "http://$host/configs?force=true" 2>/dev/null || true)
case "$rc" in
  2*) printf 'Reloaded from %s\\n' "$cfg_path" ;;
  *)  printf 'Reload failed (HTTP %s):\\n%s\\n' "$rc" "$(cat /tmp/clash-reload.out 2>/dev/null)" ;;
esac
sleep 1
"""
mode = "execute"

[actions.open_dashboard]
description = "Open Clash dashboard in the browser"
command = """
{ read -r host; read -r _secret; } < <("$HOME/.config/television/clash-source.sh" controller 2>/dev/null)
if [ -n "${host:-}" ]; then
  url="http://$host/ui"
else
  url='https://yacd.haishan.me/'
fi
if command -v open >/dev/null 2>&1; then open "$url"
elif command -v xdg-open >/dev/null 2>&1; then xdg-open "$url" >/dev/null 2>&1 &
elif command -v wslview >/dev/null 2>&1; then wslview "$url"
else printf 'URL: %s\\n' "$url"; sleep 1
fi
"""
mode = "fork"

[actions.copy_server]
description = "Copy server:port when YAML resolves it, or the row name otherwise"
command = """
_clip() { local d; d=$(cat); [ -z "$d" ] && return; if command -v pbcopy >/dev/null; then printf '%s' "$d" | pbcopy; elif command -v wl-copy >/dev/null; then printf '%s' "$d" | wl-copy; elif command -v xclip >/dev/null; then printf '%s' "$d" | xclip -selection clipboard; else printf '%b' "\\033]52;c;$(printf '%s' "$d" | base64 | tr -d '\\n')\\007" > /dev/tty; fi; }
kind='{split:\\t:0}'
name='{split:\\t:1}'
case "$kind" in
  proxy)
    data=$("$HOME/.config/television/clash-parse.py" server --name "$name" 2>/dev/null)
    if [ -n "${data:-}" ]; then
      printf '%s' "$data" | _clip
    else
      printf '%s' "$name" | _clip
    fi
    ;;
  *)
    printf '%s' "$name" | _clip
    ;;
esac
"""
mode = "fork"

[actions.copy_name]
description = "Copy row name to clipboard"
command = """
_clip() { local d; d=$(cat); [ -z "$d" ] && return; if command -v pbcopy >/dev/null; then printf '%s' "$d" | pbcopy; elif command -v wl-copy >/dev/null; then printf '%s' "$d" | wl-copy; elif command -v xclip >/dev/null; then printf '%s' "$d" | xclip -selection clipboard; else printf '%b' "\\033]52;c;$(printf '%s' "$d" | base64 | tr -d '\\n')\\007" > /dev/tty; fi; }
printf '%s' '{split:\\t:1}' | _clip
"""
mode = "fork"
