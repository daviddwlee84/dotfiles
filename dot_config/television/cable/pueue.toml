# Pueue task manager channel for television (tv)
# Fuzzy-search pueue tasks, preview logs, and manage tasks interactively.
#
# Usage:
#   tv pueue
#
# Source cycling (Ctrl+S):
#   1. All tasks (newest first)
#   2. Active only (Running + Queued + Paused)
#   3. Failed only
#   4. Groups overview
#
# Keybindings (Alt+key avoids conflicts with TV built-ins and tmux):
#   Enter      Follow running task / view finished task log / show group status
#   Alt+E      Edit task command (stashed/queued only, opens $EDITOR)
#   Ctrl+Y     Copy raw command to clipboard (overrides TV default)
#   Alt+Y      Copy raw command to clipboard (same as Ctrl+Y)
#   Alt+A      Copy full `pueue add ...` command to clipboard
#   Alt+G      Filter by group (opens new tv with only that group's tasks)
#   Alt+P      Pause task
#   Alt+R      Resume (start) task
#   Alt+K      Kill task
#   Alt+T      Restart task (in-place)
#   Alt+X      Remove task
#   Alt+L      Clean all finished tasks
#   Ctrl+F     Cycle preview (log output / JSON details)
#   Ctrl+O     Toggle preview panel
#
# Auto-refreshes every 2 seconds via watch mode.

[metadata]
name = "pueue"
description = "Pueue task manager: search, preview logs, pause/resume/kill/restart"
requirements = ["pueue", "jq"]

[source]
command = [
  """pueue status --json 2>/dev/null | jq -r '.tasks | to_entries | sort_by(.value.id | tonumber) | reverse | .[].value | (if .status == "Queued" then "\u23f3 Queued" elif .status == "Stashed" then "\u23f9 Stashed" elif (.status | type == "object") then if (.status | has("Running")) then "\u25b6 Running" elif (.status | has("Done")) then if .status.Done.result == "Success" then "\u2713 Done" else "\u2717 Failed" end elif (.status | has("Paused")) then "\u23f8 Paused" else (.status | keys[0]) end else (.status | tostring) end) as $st | [(.id | tostring), $st, .group, .original_command] | @tsv'""",
  """pueue status --json 2>/dev/null | jq -r '.tasks | to_entries | sort_by(.value.id | tonumber) | reverse | .[].value | select(.status == "Queued" or (.status | type == "object" and (has("Running") or has("Paused")))) | (if .status == "Queued" then "\u23f3 Queued" elif (.status | has("Running")) then "\u25b6 Running" elif (.status | has("Paused")) then "\u23f8 Paused" else (.status | keys[0]) end) as $st | [(.id | tostring), $st, .group, .original_command] | @tsv'""",
  """pueue status --json 2>/dev/null | jq -r '.tasks | to_entries | sort_by(.value.id | tonumber) | reverse | .[].value | select(.status | type == "object" and has("Done") and .status.Done.result != "Success") | [(.id | tostring), "\u2717 Failed", .group, .original_command] | @tsv'""",
  """pueue group --json 2>/dev/null | jq -r 'to_entries[] | [.key, .value.status, ("parallel=" + (.value.parallel_tasks | tostring))] | @tsv'""",
]
display = "{split:\\t:0}  {split:\\t:1}  [{split:\\t:2}]  {split:\\t:3}"
output = "{split:\\t:0}"
watch = 2.0
no_sort = true

[preview]
command = [
  "pueue log '{split:\\t:0}' --lines 200 2>/dev/null || pueue log '{split:\\t:0}' 2>/dev/null || echo 'No log available for: {split:\\t:0}'",
  "pueue status --json 2>/dev/null | jq '.tasks[\"{split:\\t:0}\"] | del(.envs)' 2>/dev/null || echo 'No details for: {split:\\t:0}'",
]
header = "Task {split:\\t:0} ({split:\\t:1})"

[ui]
input_header = "Pueue Tasks"

[ui.preview_panel]
size = 55

[keybindings]
enter = "actions:follow"
alt-e = "actions:edit"
# Override TV global ctrl-y (copies full display line) to copy just the command
ctrl-y = ["actions:copy_command", "reload_source"]
alt-y = ["actions:copy_command", "reload_source"]
alt-a = ["actions:copy_pueue_add", "reload_source"]
alt-g = "actions:filter_group"
alt-p = ["actions:pause", "reload_source"]
alt-r = ["actions:resume", "reload_source"]
alt-k = ["actions:kill", "reload_source"]
alt-t = ["actions:restart", "reload_source"]
alt-x = ["actions:remove", "reload_source"]
alt-l = ["actions:clean", "reload_source"]

[actions.follow]
description = "Follow running task, view log, or show group status"
command = "id='{split:\\t:0}'; if [ \"$id\" -eq \"$id\" ] 2>/dev/null; then pueue follow \"$id\" 2>/dev/null || pueue log \"$id\" 2>/dev/null; echo; echo '[Press Enter to exit]'; read -r _; else pueue status -g \"$id\"; echo; echo '[Press Enter to exit]'; read -r _; fi"
mode = "execute"

[actions.edit]
description = "Edit task command (stashed/queued only)"
command = "pueue edit '{split:\\t:0}'"
mode = "execute"

[actions.copy_command]
description = "Copy raw command to clipboard"
command = """pueue status --json 2>/dev/null | jq -j --arg id '{split:\\t:0}' '.tasks[$id].original_command // empty' | { command -v pbcopy >/dev/null && pbcopy || command -v wl-copy >/dev/null && wl-copy || command -v xclip >/dev/null && xclip -selection clipboard; }"""
mode = "fork"

[actions.copy_pueue_add]
description = "Copy full pueue add command to clipboard"
command = """pueue status --json 2>/dev/null | jq -j --arg id '{split:\\t:0}' '(.tasks[$id] // empty) | "pueue add" + (if .group != "default" then " -g " + (.group | @sh) else "" end) + (if .label then " -l " + (.label | @sh) else "" end) + (if .priority > 0 then " -o " + (.priority | tostring) else "" end) + (if (.dependencies | length) > 0 then " -a " + (.dependencies | map(tostring) | join(" ")) else "" end) + " -w " + (.path | @sh) + " " + (.original_command | @sh)' | { command -v pbcopy >/dev/null && pbcopy || command -v wl-copy >/dev/null && wl-copy || command -v xclip >/dev/null && xclip -selection clipboard; }"""
mode = "fork"

[actions.filter_group]
description = "Filter tasks by group (opens filtered view)"
command = """group='{split:\\t:2}'; tv --source-command "pueue status --json --group $group 2>/dev/null | jq -r '.tasks | to_entries | sort_by(.value.id | tonumber) | reverse | .[].value | (if .status == \\\"Queued\\\" then \\\"\\u23f3 Queued\\\" elif .status == \\\"Stashed\\\" then \\\"\\u23f9 Stashed\\\" elif (.status | type == \\\"object\\\") then if (.status | has(\\\"Running\\\")) then \\\"\\u25b6 Running\\\" elif (.status | has(\\\"Done\\\")) then if .status.Done.result == \\\"Success\\\" then \\\"\\u2713 Done\\\" else \\\"\\u2717 Failed\\\" end elif (.status | has(\\\"Paused\\\")) then \\\"\\u23f8 Paused\\\" else (.status | keys[0]) end else (.status | tostring) end) as \\$st | [(.id | tostring), \\$st, .group, .original_command] | @tsv'" --preview-command "pueue log '{}' --lines 200 2>/dev/null || echo 'No log'" --input-header "Pueue [$group]" """
mode = "execute"

[actions.pause]
description = "Pause task"
command = "pueue pause '{split:\\t:0}'"
mode = "fork"

[actions.resume]
description = "Resume/start task"
command = "pueue start '{split:\\t:0}'"
mode = "fork"

[actions.kill]
description = "Kill task"
command = "pueue kill '{split:\\t:0}'"
mode = "fork"

[actions.restart]
description = "Restart task (in-place)"
command = "pueue restart --in-place '{split:\\t:0}'"
mode = "fork"

[actions.remove]
description = "Remove task from list"
command = "pueue remove '{split:\\t:0}'"
mode = "fork"

[actions.clean]
description = "Clean all finished tasks"
command = "pueue clean"
mode = "fork"
