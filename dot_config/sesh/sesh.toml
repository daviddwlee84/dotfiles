#:schema https://github.com/joshmedeski/sesh/raw/main/sesh.schema.json

# Session ordering: active tmux first, then configured, then zoxide history
sort_order = ["tmux", "config", "zoxide"]

# Use last 2 directory components for session names (e.g. "projects/sesh")
dir_length = 2

# Hide scratch, underscore-prefixed, and floax sessions from the picker
blacklist = ["^scratch$", "^_", "^float$"]

[default_session]
startup_command = "nvim"
# Multi-section preview: header (name + git branch) + README + recent commits +
# tree. Falls back to ls/head if bat/eza missing. See
# dot_dotfiles/bin/executable_sesh-preview in the chezmoi source for the script.
# Deployed to ~/.dotfiles/bin/sesh-preview.
preview_command = "~/.dotfiles/bin/sesh-preview {}"

# ── Named sessions ──────────────────────────────────────────────────────────

[[session]]
name = "chezmoi"
path = "~/.local/share/chezmoi"
tmuxinator = "chezmoi"

# Subsets of chezmoi — uncomment if you prefer separate sessions
# [[session]]
# name = "dotfiles"
# path = "~/.local/share/chezmoi"
#
# [[session]]
# name = "ansible"
# path = "~/.ansible"
#
# [[session]]
# name = "neovim config"
# path = "~/.config/nvim"

[[session]]
name = "home"
path = "~"
disable_startup_command = true

# ── Coding agent session (layout: nvim 75% | specstory 25%, btop tab) ────────
#
# DEPRECATED: prefer the `scode` zsh function (dot_config/zsh/tools/22_sesh.zsh)
# which creates a per-repo session named `coding-agent/<repo>`. The named
# session below is the legacy "always reuse the same `coding-agent` session
# regardless of which repo you cd'd from" behavior — it's kept for back-compat
# (sesh picker entry, `sesh connect coding-agent`) but should NOT be your
# muscle-memory default.
#
# Why scode is better: cd to repo A → `scode` → session `coding-agent/A`;
# cd to repo B → `scode` → NEW session `coding-agent/B`. Same workflow, no
# accidental reuse of an existing session pointing at the wrong repo.
#
# Approach B (active): tmuxp --append via startup_command
#   sesh creates the session, then tmuxp appends windows into it.
#   After appending, kills the initial empty window sesh created.
#   Requires: tmuxp (pip/uv install tmuxp)
#
# Approach C (commented): tmuxinator native integration
#   sesh delegates entire session creation to tmuxinator.
#   Cleaner (no empty window to kill), but requires tmuxinator (gem).
#   To switch: comment out Approach B, uncomment Approach C below.
#
# NOTE: sesh's `tmuxp` toml field is dead code as of v2.24 -- the source only
# implements tmuxinator. See docs/tools/sesh.md for details.

# Approach B: tmuxp --append
# After appending windows, kill the empty sesh window, then force the correct
# 75% width on the main pane (works around tmuxp layout not sizing correctly
# when appended into an existing tmux session with a different terminal size).
#
# The leading `cd ~` is load-bearing, and pairs with the deliberate
# OMISSION of `start_directory:` in ~/.config/tmuxp/coding-agent.yaml.
# tmuxp has three silent-failure modes around `start_directory` that make
# every "obvious" yaml value wrong: (a) `os.path.expandvars` doesn't
# understand `${VAR:-default}`, leaving it literal; (b) `.` / `./foo` are
# resolved against the yaml FILE's dir (tmuxp/cli/load.py:359), not the
# process cwd; (c) when any of those reach `tmux new-window -c` as an
# invalid path, tmux silently falls back to $HOME. Omitting the key
# makes libtmux skip `-c` and tmux inherits the caller pane's cwd — which
# `cd ~` controls. See:
# pitfalls/tmuxp-append-ignores-session-start-directory.md
[[session]]
name = "coding-agent"
path = "~"
startup_command = "cd ~ && tmuxp load -a -y ~/.config/tmuxp/coding-agent.yaml && tmux kill-window -t coding-agent:1 && sleep 0.3 && tmux select-window -t coding-agent:editor && tmux select-pane -t .1 && tmux resize-pane -x 75%"

# Approach C: tmuxinator (uncomment to use, comment Approach B above)
# [[session]]
# name = "coding-agent"
# path = "~"
# tmuxinator = "coding-agent"

# Approach C comparison: tmuxinator with different name (for A/B testing)
# Uses sesh's native tmuxinator integration. Try both and compare:
#   sesh connect coding-agent       (tmuxp --append)
#   sesh connect coding-agent-mux   (tmuxinator native)
[[session]]
name = "coding-agent-mux"
path = "~"
tmuxinator = "coding-agent-mux"

# ── Wildcards ────────────────────────────────────────────────────────────────
#
# `startup_command` runs after sesh creates the bare session. We use a tmuxp
# `--append` invocation that adds the project layout (editor / shell / git
# windows) to the session sesh just made, then kills the empty initial window
# sesh always creates. Same trick as the `coding-agent` named session above —
# see ~/.config/tmuxp/project.yaml for the layout.
#
# The wildcard `{}` placeholder is the matched path. The leading `cd {}`
# is load-bearing and pairs with the deliberate OMISSION of
# `start_directory:` in ~/.config/tmuxp/project.yaml. tmuxp has three
# silent-failure modes that make every "obvious" yaml value wrong:
#   (a) `os.path.expandvars` doesn't understand `${VAR:-default}`,
#       leaving it literal.
#   (b) `.` / `./foo` are resolved against the yaml FILE's directory
#       (tmuxp/cli/load.py:359), not the process cwd — so windows land
#       in ~/.config/tmuxp/ instead of the repo.
#   (c) When any of those reach `tmux new-window -c` as an invalid path,
#       tmux silently falls back to $HOME — no error, no log. (sesh's
#       own `tmux new-session -c` still shows up correctly in
#       `#{session_path}`, so this looks like a shell-rc / CDPATH bug —
#       it isn't.)
# By omitting `start_directory` in the yaml entirely, libtmux skips `-c`
# and tmux inherits the caller pane's cwd — which `cd {} &&` here
# controls. See: pitfalls/tmuxp-append-ignores-session-start-directory.md

# All repos under /Volumes/Data/Program/<group>/<repo>
# (e.g. JingleAI/AShare_T0_RL, Personal/career-ops, Tadronaut/tarlin)
# Symlinked surface paths under ~/Documents/Program/* are canonicalized to
# /Volumes/Data/Program/* by _ZO_RESOLVE_SYMLINKS=1 (zsh/tools/20_zoxide.zsh)
# so a single wildcard pattern catches both entry points.
[[wildcard]]
pattern = "/Volumes/Data/Program/*/*"
startup_command = "cd {} && tmuxp load -a -y ~/.config/tmuxp/project.yaml && tmux kill-window -t :1 2>/dev/null; tmux select-window -t :editor 2>/dev/null"

[[wildcard]]
pattern = "~/repos/*"
startup_command = "nvim"

# try-cli ephemeral workspaces: `try some-project` → `shere` or `try-sesh`
# Session name will be "tries/2026-04-14-some-project" (dir_length=2)
# These are short-lived so we use plain nvim, not the full project layout.
[[wildcard]]
pattern = "~/src/tries/*"
startup_command = "nvim"

# Same for canonical /Volumes/Data/Program/tries/* (after symlink resolution)
[[wildcard]]
pattern = "/Volumes/Data/Program/tries/*"
startup_command = "nvim"

# ── Windows ──────────────────────────────────────────────────────────────────

[[window]]
name = "git"
startup_script = "lazygit"
