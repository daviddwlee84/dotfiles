# Coding agent workspace layout (tmuxinator format)
#
# Window 1 "editor": nvim (75%) | specstory run claude (25%) -- 3:1 ratio via main-vertical
# Window 2 "monitor": btop for system monitoring
#
# ── Usage ────────────────────────────────────────────────────────────────────
#
# With sesh (native integration via sesh.toml tmuxinator field):
#   sesh connect coding-agent
#
# Standalone:
#   tmuxinator start coding-agent
#
# For a specific project directory:
#   tmuxinator start coding-agent root=~/repos/myproject
#
# ── Notes ────────────────────────────────────────────────────────────────────
# sesh has native tmuxinator support: when tmuxinator field is set in sesh.toml,
# sesh delegates the entire session creation to tmuxinator (bypasses sesh's own
# NewSession + startup.Exec). This is cleaner than tmuxp integration.
#
# Requires: gem install tmuxinator (installed by ruby_gem_tools ansible role)

name: coding-agent
root: <%= @settings["root"] || "~" %>

# Set main-pane-width after windows are created (3:1 = 75%)
# on_project_start runs before windows; on_project_exit is too late.
# Relying on main-pane-width option here; tmuxinator applies layout after panes.
on_project_start: tmux set-option -g main-pane-width 75%
on_project_exit: tmux set-option -gu main-pane-width

windows:
  - editor:
      layout: main-vertical
      panes:
        - nvim
        - specstory run claude
  - monitor:
      panes:
        - btop
