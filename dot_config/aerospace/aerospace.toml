# AeroSpace config — managed by chezmoi (dot_config/aerospace/aerospace.toml).
#
# Deployed to ~/.config/aerospace/aerospace.toml (XDG) only on macOS when
# installBrewApps=true (the cask lives in Brewfile.darwin.tmpl). Gating:
# .chezmoiignore.tmpl.
#
# IMPORTANT — AeroSpace searches BOTH ~/.aerospace.toml AND this XDG path, and
# *errors out with an ambiguity report if both exist*. So we manage only the
# XDG copy and `.chezmoiremove` deletes any legacy ~/.aerospace.toml on apply
# (backupMode=smart backs it up first). Keep config in this one place.
#
# Linux counterpart (scrollable-tiling) is niri — see dot_config/niri/config.kdl
# and docs/playbooks/niri.md.

config-version = 2

after-startup-command = []

# Run AeroSpace at login (it's the WM, we want it up automatically).
start-at-login = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30

default-root-container-layout = 'tiles'
# wide monitor -> horizontal, tall monitor -> vertical.
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

automatically-unhide-macos-hidden-apps = false

[key-mapping]
    preset = 'qwerty'

# Small gaps, roughly matching niri's gaps 16 feel on Linux.
[gaps]
    inner.horizontal = 8
    inner.vertical =   8
    outer.left =       8
    outer.bottom =     8
    outer.top =        8
    outer.right =      8

[mode.main.binding]
    # Open terminal with alt+enter (mirrors niri Mod+T -> alacritty).
    alt-enter = 'exec-and-forget open -na Alacritty'

    # Layout toggles.
    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'

    # Focus — vim hjkl + arrows (mirrors niri).
    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'
    alt-left = 'focus left'
    alt-down = 'focus down'
    alt-up = 'focus up'
    alt-right = 'focus right'

    # Move — vim hjkl + arrows.
    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'
    alt-shift-left = 'move left'
    alt-shift-down = 'move down'
    alt-shift-up = 'move up'
    alt-shift-right = 'move right'

    # Resize.
    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'
    alt-f = 'fullscreen'

    # Workspaces 1-5 (extend as needed).
    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'

    alt-shift-1 = 'move-node-to-workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2'
    alt-shift-3 = 'move-node-to-workspace 3'
    alt-shift-4 = 'move-node-to-workspace 4'
    alt-shift-5 = 'move-node-to-workspace 5'

    alt-tab = 'workspace-back-and-forth'
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # Enter service mode for config reload / tree ops.
    alt-shift-semicolon = 'mode service'

[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main']
    f = ['layout floating tiling', 'mode main']
    backspace = ['close-all-windows-but-current', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']
