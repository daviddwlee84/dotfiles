# Coding agent workspace layout
#
# Window 1 "editor": nvim (75%) | specstory run (25%) -- 3:1 ratio
# Window 2 "monitor": btop for system monitoring
#
# ── Usage ────────────────────────────────────────────────────────────────────
#
# Standalone (creates new session):
#   tmuxp load -y ~/.config/tmuxp/coding-agent.yaml
#
# With sesh (appended via startup_command in sesh.toml):
#   Configured automatically -- just `sesh connect coding-agent`
#   See ~/.config/sesh/sesh.toml for the startup_command integration.
#
# For a specific project directory:
#   tmuxp load -y -s my-project ~/.config/tmuxp/coding-agent.yaml
#   (or set start_directory env var)
#
# Append to an existing tmux session:
#   tmuxp load -a -y ~/.config/tmuxp/coding-agent.yaml

session_name: coding-agent
start_directory: ${start_directory:-.}

windows:
  - window_name: editor
    layout: main-vertical
    options:
      main-pane-width: 75%
    panes:
      - shell_command: nvim
      - shell_command: specstory run

  - window_name: monitor
    panes:
      - shell_command: btop
