# Coding agent workspace layout
#
# Window 1 "editor": nvim (75%) | specstory run claude (25%) -- 3:1 ratio
# Window 2 "monitor": btop for system monitoring
#
# ── Usage ────────────────────────────────────────────────────────────────────
#
# Standalone (creates new session):
#   tmuxp load -y ~/.config/tmuxp/coding-agent.yaml
#
# With sesh (appended via startup_command in sesh.toml):
#   Configured automatically -- just `sesh connect coding-agent`
#   See ~/.config/sesh/sesh.toml for the startup_command integration.
#
# For a specific project directory (the yaml has no `start_directory:` —
# see note below — so cwd at invocation time is what sticks):
#   cd ~/some/repo && tmuxp load -y -s my-project ~/.config/tmuxp/coding-agent.yaml
#
# Append to an existing tmux session:
#   cd ~/some/repo && tmuxp load -a -y ~/.config/tmuxp/coding-agent.yaml

session_name: coding-agent
# No session-level `start_directory:` — see the sibling note in
# ./project.yaml and pitfalls/tmuxp-append-ignores-session-start-directory.md.
# Short version: tmuxp's two traps (`${VAR:-default}` not expanded;
# `.`/`./*` resolved against the yaml file's dir, not process cwd) make
# every obvious value wrong. Omitting the key lets libtmux skip `-c`, so
# `tmux new-window` inherits the calling pane's cwd, which the sesh
# `startup_command` (`cd ~ && tmuxp load -a …`) controls.

windows:
  - window_name: editor
    layout: main-vertical
    options:
      main-pane-width: 75%
    panes:
      - shell_command: nvim
      - shell_command: specstory run claude

  - window_name: monitor
    panes:
      - shell_command: btop
