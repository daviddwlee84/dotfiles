# Per-project workspace layout
#
# Generic layout for any code repo. Use via sesh wildcard
# (~/.config/sesh/sesh.toml: pattern = "/Volumes/Data/Program/*/*"), or
# directly — the yaml has no `start_directory:` (see note below), so the
# pane's cwd at invocation time controls where windows land:
#
#   cd ~/some/repo && tmuxp load -a -y ~/.config/tmuxp/project.yaml
#
# Windows:
#   1. editor   — nvim (full pane)
#   2. shell    — interactive shell at project root
#   3. git      — lazygit (only if `lazygit` binary exists; otherwise plain git status)
#
# Why no horizontal splits in `editor`:
#   nvim's :terminal + tmux navigator already covers in-editor terminal needs.
#   Keeping `editor` single-pane lets nvim use full width for tree+code+sidebar.
#   For coding-agent layouts (nvim | specstory) use the dedicated
#   ~/.config/tmuxp/coding-agent.yaml — that's the persistent agent workspace,
#   this template is the per-repo workhorse.

session_name: project
# No session-level `start_directory:` on purpose. Two tmuxp traps make
# every "obvious" value wrong in append mode (which is how sesh uses us):
#   1. `${VAR:-default}` isn't expanded by Python's `os.path.expandvars`,
#      so it's passed literally to `tmux new-window -c` → invalid path →
#      tmux silently falls back to $HOME for every window.
#   2. `.` / `./foo` ARE resolved, but relative to the YAML file's
#      directory (tmuxp/cli/load.py:359), not to tmuxp's process cwd —
#      so windows would land in `~/.config/tmuxp/`, not the repo.
# With no `start_directory` in the yaml, libtmux omits `-c` on
# `tmux new-window`, and tmux inherits the calling pane's cwd. The sesh
# `startup_command` (~/.config/sesh/sesh.toml) does `cd {} && tmuxp load
# -a …` from inside the pane, so "calling pane's cwd" IS the matched
# repo path. See pitfalls/tmuxp-append-ignores-session-start-directory.md.

windows:
  - window_name: editor
    panes:
      - shell_command: nvim

  - window_name: shell
    panes:
      - shell_command: ""

  - window_name: git
    panes:
      - shell_command: |
          if command -v lazygit >/dev/null 2>&1; then
            lazygit
          else
            git status
          fi
