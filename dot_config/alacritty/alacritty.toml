[font]
normal = { family = "Hack Nerd Font Mono", style = "Regular" }
bold = { family = "Hack Nerd Font Mono", style = "Bold" }
italic = { family = "Hack Nerd Font Mono", style = "Italic" }
bold_italic = { family = "Hack Nerd Font Mono", style = "Bold Italic" }
size = 14.0

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001b[13;2u"

[[keyboard.bindings]]
key = "Slash"
mods = "Control"
chars = "\u001f"

[[keyboard.bindings]]
key = "Return"
mods = "Control"
chars = "\u001b[13;5u"

# Ctrl+Number → CSI-u sequences for tmux quick window switching
# Format: ESC [ <keycode> ; 5 u  (5 = Ctrl modifier in CSI-u)
# Alacritty doesn't natively send CSI-u for Ctrl+Number; Ghostty/cmux does.
[[keyboard.bindings]]
key = "Key1"
mods = "Control"
chars = "\u001b[49;5u"

[[keyboard.bindings]]
key = "Key2"
mods = "Control"
chars = "\u001b[50;5u"

[[keyboard.bindings]]
key = "Key3"
mods = "Control"
chars = "\u001b[51;5u"

[[keyboard.bindings]]
key = "Key4"
mods = "Control"
chars = "\u001b[52;5u"

[[keyboard.bindings]]
key = "Key5"
mods = "Control"
chars = "\u001b[53;5u"

[[keyboard.bindings]]
key = "Key6"
mods = "Control"
chars = "\u001b[54;5u"

[[keyboard.bindings]]
key = "Key7"
mods = "Control"
chars = "\u001b[55;5u"

[[keyboard.bindings]]
key = "Key8"
mods = "Control"
chars = "\u001b[56;5u"

[[keyboard.bindings]]
key = "Key9"
mods = "Control"
chars = "\u001b[57;5u"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
chars = "\u001b[48;5u"

# https://www.youtube.com/watch?v=uOnL4fEnldA
# https://www.josean.com/posts/how-to-setup-alacritty-terminal
[env]
TERM = "xterm-256color"

[window]
padding.x = 10
padding.y = 10

# Without proper tailing widow manager setting this can be a little tricky
# decorations = "Buttonless"

opacity = 0.7
blur = true

# https://gist.github.com/windsting/d21a07b236acf243c8ebbfe7302765ef
# https://github.com/alacritty/alacritty/issues/7966
option_as_alt = "Both" # 或 "OnlyLeft" / "OnlyRight" / "None"

# Actually this solves the following keyboard bindings in MacOS
# [[keyboard.bindings]]
# key = "T"
# mods = "Alt"
# chars = "\u001bt" # ESC + 't'  (Meta-t)
#
# [[keyboard.bindings]]
# key = "P"
# mods = "Alt"
# chars = "\u001bp" # ESC + 'p'  (Meta-p)
