# =============================================================================
# Initialize TPM (keep this line at the very bottom)
# On macOS, prepend GNU coreutils path for plugins that expect GNU utilities
# =============================================================================

run 'PATH="/opt/homebrew/opt/coreutils/libexec/gnubin:$PATH" ~/.tmux/plugins/tpm/tpm'
