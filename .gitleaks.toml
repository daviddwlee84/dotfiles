# Gitleaks configuration for dotfiles repository
# https://github.com/gitleaks/gitleaks#configuration

title = "Dotfiles Gitleaks Config"

# Extend the default gitleaks ruleset
[extend]
useDefault = true

# Allow chezmoi template patterns + our redaction sentinels (not secrets).
# Uses [[allowlists]] array form — gitleaks v8 forbids mixing with the
# deprecated [allowlist] singular.
[[allowlists]]
  description = "Chezmoi templates + redaction sentinels"
  regexTarget = "line"
  regexes = [
    # Chezmoi template variables: {{ .email }}, {{ .name }}
    '''(?i)\{\{\s*\.?\w+\s*\}\}''',
    # Chezmoi prompt functions: {{ promptString ... }}
    '''(?i)\{\{\s*prompt(String|Bool)(Once)?\s+.*\}\}''',
    # Already-redacted sentinels emitted by scripts/redact_secrets.py
    # (e.g. waka_REDACTED_WAKATIME_KEY) so history-rewrites stay clean.
    '''\b[A-Za-z0-9_-]+_REDACTED(?:_[A-Z_]+)?\b''',
    # Pagination cursors used by MLflow / Google Cloud / many REST APIs.
    # These are opaque session-scoped tokens (often base64-encoded JSON
    # like {"offset": N} for MLflow's search endpoints), not credentials,
    # but gitleaks' generic-api-key entropy heuristic flags them. False
    # positives showed up in tv-channel smoke-test transcripts; safe to
    # allowlist by JSON-field shape.
    '''"next_page_token"\s*:\s*"[A-Za-z0-9+/=_-]*"''',
    '''"nextPageToken"\s*:\s*"[A-Za-z0-9+/=_-]*"''',
  ]

# Path-scoped allowlist: inside agent-artifact directories, tolerate
# explicit example/demo markers so agents can legitimately discuss key
# shapes in plans and transcripts. Both the path AND a regex must match,
# so a real `sk-ant-api03-<95 chars>AA` still fires.
[[allowlists]]
  description = "Example/demo keys inside agent transcripts and plan files"
  # Both path and regex must match, otherwise any .md under these dirs
  # gets allowlisted wholesale (gitleaks v8 defaults to OR semantics).
  condition   = "AND"
  paths = [
    '''\.specstory/history/.*\.md$''',
    '''\.claude/plans/.*\.md$''',
    '''\.cursor/(plans|rules)/.*\.md$''',
    '''\.opencode/plans/.*\.md$''',
    '''\.specify/.*\.md$''',
    '''\.codex/.*\.md$''',
  ]
  regexTarget = "line"
  regexes = [
    '''example[-_]?(key|token|secret)''',
    '''\bREDACTED\b''',
    '''sk-[a-zA-Z0-9]{3,8}\.\.\.''',
    '''your[-_]?(api[-_]?)?key[-_]?here''',
    # Pagination cursor field name (REST API convention, not a credential).
    # Path-scoped to agent transcripts only so the global allowlist stays
    # narrow — a stray `next_page_token` in committed source/docs still
    # gets the entropy check.
    '''\bnext[-_]?[Pp]age[-_]?[Tt]oken\b''',
  ]

# ---------------------------------------------------------------------------
# Custom rules -- patterns GitHub Push Protection detects but gitleaks
# default ruleset misses (or under-specifies). Curated "pragmatic" subset;
# keep entropy lax since the prefix anchors are already strong.
# ---------------------------------------------------------------------------

[[rules]]
  id          = "wakatime-api-key"
  description = "WakaTime API key (waka_ + RFC-4122 UUID)"
  regex       = '''\bwaka_[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\b'''
  tags        = ["key", "wakatime", "auto"]

[[rules]]
  id          = "openai-project-key"
  description = "OpenAI project-scoped API key (sk-proj-...)"
  regex       = '''\bsk-proj-[A-Za-z0-9_-]{80,}\b'''
  tags        = ["key", "openai", "auto"]

[[rules]]
  id          = "anthropic-api-key-strict"
  description = "Anthropic API key (sk-ant-apiNN-..., strict length)"
  regex       = '''\bsk-ant-api\d{2}-[A-Za-z0-9_-]{93}AA\b'''
  tags        = ["key", "anthropic", "auto"]

[[rules]]
  id          = "cursor-api-key"
  description = "Cursor API key (cursor- prefixed)"
  regex       = '''\bcursor-[A-Za-z0-9]{40,}\b'''
  tags        = ["key", "cursor", "auto"]

[[rules]]
  id          = "huggingface-token"
  description = "Hugging Face user access token (hf_...)"
  regex       = '''\bhf_[A-Za-z0-9]{34,40}\b'''
  tags        = ["key", "huggingface", "auto"]

[[rules]]
  id          = "supabase-service-pat"
  description = "Supabase service / personal access token (sbp_...)"
  regex       = '''\bsbp_[a-f0-9]{40}\b'''
  tags        = ["key", "supabase", "auto"]

[[rules]]
  id          = "linear-api-key"
  description = "Linear API key (lin_api_...)"
  regex       = '''\blin_api_[A-Za-z0-9]{40}\b'''
  tags        = ["key", "linear", "auto"]

[[rules]]
  id          = "tailscale-auth-key"
  description = "Tailscale auth/client/api key (tskey-...)"
  regex       = '''\btskey-(?:auth|client|api)-[A-Za-z0-9]+-[A-Za-z0-9]{24,}\b'''
  tags        = ["key", "tailscale", "auto"]

[[rules]]
  id          = "notion-integration-token"
  description = "Notion internal integration token (ntn_...)"
  regex       = '''\bntn_[A-Za-z0-9]{40,}\b'''
  tags        = ["key", "notion", "auto"]

[[rules]]
  id          = "openrouter-api-key"
  description = "OpenRouter API key (sk-or-v1-... 64 hex)"
  # OpenRouter keys are sk-or-v1- prefix + 64 lowercase hex chars (73 chars total).
  # GitHub Push Protection catches these; gitleaks default ruleset under-specifies.
  regex       = '''\bsk-or-v1-[a-f0-9]{64}\b'''
  tags        = ["key", "openrouter", "auto"]

# ---------------------------------------------------------------------------
# Clash / V2Ray / mihomo proxy config leaks. Example sources:
#   - Pasted Clash YAML in SpecStory transcripts / coding-agent plan files
#   - vmess:// share links (base64-encoded server+uuid blob)
#   - Azure VM hostnames under *.cloudapp.azure.com used as proxy server hosts
#
# All three rules use `secretGroup = 1` so `scripts/redact_secrets.py`
# rewrites only the sensitive capture (e.g. `uuid: 418...c56`) instead of
# the whole YAML line, keeping surrounding keys human-readable.
# ---------------------------------------------------------------------------

[[rules]]
  id          = "clash-vmess-uuid"
  description = "Clash / V2Ray vmess / vless UUID in YAML (auth token)"
  regex       = '''(?i)\buuid\s*:\s*['"]?([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})['"]?'''
  secretGroup = 1
  tags        = ["key", "clash", "vmess", "auto"]

[[rules]]
  id          = "clash-vmess-share-link"
  description = "vmess:// base64 share link (embeds host + port + uuid)"
  regex       = '''\b(vmess://[A-Za-z0-9+/=_-]{40,})\b'''
  secretGroup = 1
  tags        = ["key", "clash", "vmess", "share-link", "auto"]

[[rules]]
  id          = "azure-cloudapp-hostname"
  description = "Azure VM hostname under *.cloudapp.azure.com (often proxy server)"
  regex       = '''\b([a-z0-9][a-z0-9-]{0,62}\.(?:[a-z]+\d?\.)?cloudapp\.azure\.com)\b'''
  secretGroup = 1
  tags        = ["hostname", "azure", "clash", "auto"]
