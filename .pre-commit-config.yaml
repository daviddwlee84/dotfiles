# Pre-commit hooks for dotfiles repository
# See https://pre-commit.com for more information
# Run `just pre-commit-setup` to install hooks

repos:
  # Auto-redact secrets in agent artifacts (specstory history + coding-agent
  # plan dirs) BEFORE gitleaks runs. If the script rewrites any file,
  # pre-commit reports "files were modified by this hook" and the user must
  # `git add` + re-commit -- same UX as trailing-whitespace / end-of-file-fixer.
  - repo: local
    hooks:
      - id: redact-agent-secrets
        name: Auto-redact secrets in agent artifacts
        entry: ./scripts/redact_secrets.py --fix
        language: system
        pass_filenames: false
        files: |
          (?x)
          ^(\.specstory/history|\.claude/plans|\.cursor/plans|\.cursor/rules|\.opencode/plans|\.specify|\.codex)/.*\.md$
          | ^raycast/.*\.json$

  # Gitleaks - detect secrets (blocks commit if secrets found)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.22.1
    hooks:
      # Use system-installed gitleaks to avoid Go toolchain build/runtime issues
      - id: gitleaks-system
        pass_filenames: false

  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
        # scripts/redact_secrets.py contains `-----BEGIN[^-]*PRIVATE KEY[^-]*-----`
        # regex literals needed to *match* real PEM blocks; they are not
        # PEM blocks themselves. Exclude the redactor file to avoid a
        # self-referential false positive.
        exclude: ^scripts/redact_secrets\.py$
      - id: check-added-large-files
        args: ['--maxkb=2048']
      - id: check-merge-conflict
      - id: end-of-file-fixer
        exclude: ^\.specstory/
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^\.specstory/
      - id: check-yaml
        # `--unsafe` permits custom Python tags used by mkdocs.yml
        # (`!!python/object/apply:pymdownx.slugs.slugify`) — the structure
        # check still runs across the file; only the *typed* loader phase
        # is relaxed for the Python-specific tags MkDocs accepts.
        args: [--allow-multiple-documents, --unsafe]
        exclude: ^\.specstory/
      - id: check-toml
        # chezmoi .tmpl files contain `{{ ... }}` go-template tokens that
        # aren't valid TOML — their rendered output is what ends up on disk.
        # `modify_*.toml` source files are shell scripts that emit TOML on
        # stdout (see dot_codex/modify_config.toml.tmpl), not static TOML.
        exclude: |
          (?x)
          ^.*\.tmpl$
          | (^|/)modify_[^/]+\.toml$
      - id: check-json
        # chezmoi `modify_*.json` source files are shell scripts that emit
        # JSON on stdout, not static JSON themselves; skip JSON syntax check.
        # Shared chezmoi templates under .chezmoitemplates/ may contain JSONC
        # (leading `//` comments documenting intent) since they are rendered
        # through Go templates before reaching disk.
        exclude: |
          (?x)
          (^|/)modify_[^/]+\.json$
          | ^\.chezmoitemplates/.*\.json$
      - id: check-executables-have-shebangs
        # chezmoi `modify_*.json.tmpl` wrappers are 1-line Go templates that
        # `{{ template ... }}` the shared editor/modify.sh whose rendered
        # output already carries `#!/usr/bin/env bash`. The source wrapper
        # itself has no shebang by design, so skip the shebang check for it.
        exclude: (^|/)modify_[^/]+\.tmpl$

  # shellcheck - static analysis for bash scripts in scripts/
  # Scoped narrowly: top-level scripts only. `.tmpl` files and zsh modules
  # have syntax shellcheck's bash parser rejects (go-template `{{ ... }}`,
  # zsh `(( ))`, `${(P)v}`, `print -u2`, etc). Broaden later if useful.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        files: '^scripts/[^/]+\.sh$'
        args: [--shell=bash, --severity=warning]

  # shfmt - auto-format bash scripts in place. Same UX as
  # trailing-whitespace / end-of-file-fixer / redact-agent-secrets:
  # if the hook rewrites a file, pre-commit reports "files were
  # modified by this hook" and the user must `git add` + re-commit.
  # Previously used `-d` (diff-only, no write) which printed the
  # would-be diff but left working tree untouched, forcing a manual
  # `shfmt -i 2 -ci -bn -w scripts/*.sh` round-trip — easy to mis-run
  # with system shfmt defaults (tabs instead of 2-space).
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.10.0-2
    hooks:
      - id: shfmt
        files: '^scripts/[^/]+\.sh$'
        args: [-i, "2", -ci, -bn, -w]
