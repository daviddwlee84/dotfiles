[project]
name = "chezmoi-docs"
version = "0.0.0"
description = "Docs build environment for daviddwlee84/dotfiles"
requires-python = ">=3.11"

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-llmstxt>=0.2",
    "mkdocs-copy-to-llm>=0.1",
    "mkdocs-static-i18n>=1.2",
    "pymdown-extensions>=10.7",
]
