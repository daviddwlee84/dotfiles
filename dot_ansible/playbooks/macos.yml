---
# macOS playbook - Homebrew-based setup
- name: macOS setup
  hosts: local
  gather_facts: true

  pre_tasks:
    - name: Set target_architecture from gathered facts
      ansible.builtin.set_fact:
        target_architecture: "{{ ansible_facts['architecture'] }}"
      tags: [always]

  roles:
    - role: homebrew
      tags: [homebrew]

    - role: base
      tags: [base]

    - role: zsh
      tags: [zsh]

    - role: bash
      tags: [bash]

    - role: starship
      tags: [starship]

    - role: atuin
      tags: [atuin]

    - role: neovim
      tags: [neovim]

    - role: lazyvim_deps
      tags: [lazyvim_deps]

    - role: devtools
      tags: [devtools]

    - role: docker
      tags: [docker]

    - role: nerdfonts
      tags: [nerdfonts]

    - role: coding_agents
      tags: [coding_agents]

    - role: bitwarden
      tags: [bitwarden]

    - role: security_tools
      tags: [security_tools]

    - role: python_uv_tools
      tags: [python_uv_tools]

    - role: js_cli_tools
      tags: [js_cli_tools]

    - role: rust_cargo_tools
      tags: [rust_cargo_tools]

    - role: go_tools
      tags: [go_tools]

    - role: llm_tools
      tags: [llm_tools]

    - role: ruby_gem_tools
      tags: [ruby_gem_tools]

    # Alacritty on macOS is declared in dot_config/homebrew/Brewfile.darwin.tmpl
    # (`cask "alacritty"`). No ansible role needed. The Linux desktop install
    # lives in dot_ansible/roles/gui_apps_linux/.

    - role: input_method
      tags: [input_method]

    - role: networking_tools
      tags: [networking_tools]

    - role: iac_tools
      tags: [iac_tools]

    - role: media_tools
      tags: [media_tools]

    - role: media_control
      tags: [media_control]

    - role: dotnet_tools
      tags: [dotnet_tools]

    # Note: brew_bundle is now managed by chezmoi run_onchange script
    # See .chezmoiscripts/global/run_onchange_after_30_brew_bundle.sh.tmpl
