---
# =============================================================================
# gui_apps_linux — Ubuntu/Debian desktop GUI app installer
#
# Handles the "desktop-only" category of apps that aren't in the apt default
# repos: Alacritty (cargo), AppImageLauncher (PPA / .deb / Lite), VSCode
# (Microsoft apt repo), Cursor (.deb with graceful fallback), Google Chrome
# (.deb, x86_64-only), Discord (.deb,
# x86_64-only), Steam (Valve apt repo, optional), Zen Browser (AppImage +
# .desktop), libfuse2 (AppImage runtime on Ubuntu 22.04+), and a placeholder
# hook for Antigravity once an official Linux package ships.
#
# No-op on:
#   - macOS  → Brewfile (`cask "alacritty"`, `cask "visual-studio-code"` when
#              you add them) covers the desktop story. This role emits a
#              debug note only on Darwin, no install logic runs.
#   - armhf  → 32-bit ARM has no practical GUI story; cargo builds are slow
#              and AppImages lack first-class armv7 support.
#   - noRoot → `--skip-tags sudo` (set by run_onchange) skips every system
#              apt/deb/PPA task. AppImageLauncher Lite (user-level AppImage)
#              still runs when `gui_apps_linux_no_root=true` is passed via
#              `--extra-vars`.
#
# Editor user-config overlays (settings.json / keybindings.json) are handled
# by chezmoi itself, NOT ansible — see `.chezmoitemplates/editor/` and the
# `modify_settings.json.tmpl` / `create_keybindings.json.tmpl` source files.
#
# Adding a new GUI app: read docs/playbooks/linux-gui-apps.md FIRST. It
# contains the .deb / Snap / Flatpak / AppImage decision tree, the
# "concrete patterns" you'd copy here, and the inventory table you must
# also update so the doc stays in sync with this role.
# =============================================================================

# --- Platform banner ---

- name: Announce gui_apps_linux is Linux-only (macOS uses Brewfile)
  when: ansible_facts['os_family'] == 'Darwin'
  ansible.builtin.debug:
    msg: >-
      gui_apps_linux is Linux-only. macOS GUI apps are declared in
      dot_config/homebrew/Brewfile.darwin.tmpl (alacritty cask, etc.).

- name: Skip gui_apps_linux on armhf
  when:
    - ansible_facts['os_family'] == 'Debian'
    - target_architecture == 'armv7l'
  ansible.builtin.debug:
    msg: >-
      Skipping gui_apps_linux on armhf — no practical GUI stack,
      cargo builds of alacritty are very slow, and upstream AppImages
      do not target armv7.

# =============================================================================
# Alacritty (moved verbatim from the former alacritty role)
# =============================================================================

- name: Install Alacritty build dependencies
  when:
    - ansible_facts['os_family'] == 'Debian'
    - target_architecture != 'armv7l'
  become: true
  tags: [sudo]
  ansible.builtin.apt:
    name:
      - cmake
      - pkg-config
      - libfontconfig1-dev
      - libxcb-xfixes0-dev
      - libxkbcommon-dev
    state: present
    update_cache: false

- name: Check if Alacritty is already installed
  when:
    - ansible_facts['os_family'] == 'Debian'
    - target_architecture != 'armv7l'
  ansible.builtin.command: alacritty --version
  register: alacritty_check
  changed_when: false
  failed_when: false
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.cargo/bin:{{ ansible_facts['env']['HOME'] }}/.local/bin:{{ ansible_facts['env']['PATH'] }}"

- name: Install Alacritty via cargo
  when:
    - ansible_facts['os_family'] == 'Debian'
    - target_architecture != 'armv7l'
    - alacritty_check.rc != 0
  ansible.builtin.command: cargo install alacritty
  args:
    creates: "{{ ansible_facts['env']['HOME'] }}/.cargo/bin/alacritty"
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/share/mise/shims:{{ ansible_facts['env']['HOME'] }}/.cargo/bin:{{ ansible_facts['env']['HOME'] }}/.local/bin:{{ ansible_facts['env']['PATH'] }}"
  timeout: 3600

- name: Ensure user icon + application dirs exist
  when:
    - ansible_facts['os_family'] == 'Debian'
    - target_architecture != 'armv7l'
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - .local/share/icons/hicolor/scalable/apps
    - .local/share/applications

- name: Download Alacritty SVG icon
  when:
    - ansible_facts['os_family'] == 'Debian'
    - target_architecture != 'armv7l'
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/alacritty/alacritty/master/extra/logo/alacritty-term.svg
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/share/icons/hicolor/scalable/apps/alacritty.svg"
    mode: '0644'
  retries: 3
  delay: 5

- name: Install Alacritty .desktop entry
  when:
    - ansible_facts['os_family'] == 'Debian'
    - target_architecture != 'armv7l'
  ansible.builtin.copy:
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/share/applications/alacritty.desktop"
    mode: '0644'
    content: |
      [Desktop Entry]
      Type=Application
      TryExec=alacritty
      Exec=alacritty
      Icon=alacritty
      Terminal=false
      Categories=System;TerminalEmulator;
      Name=Alacritty
      GenericName=Terminal
      Comment=A fast, cross-platform, OpenGL terminal emulator
      StartupWMClass=alacritty

- name: Refresh desktop application database
  when:
    - ansible_facts['os_family'] == 'Debian'
    - target_architecture != 'armv7l'
  ansible.builtin.command: update-desktop-database "{{ ansible_facts['env']['HOME'] }}/.local/share/applications"
  changed_when: false
  failed_when: false

# =============================================================================
# libfuse2 — AppImage runtime on Ubuntu 22.04+
# Ubuntu dropped libfuse2 from the default install around 22.04; AppImages
# compiled against it fail with a cryptic "dlopen(): error loading libfuse.so.2"
# on boot. Installing the compat package fixes every AppImage we ship below.
# =============================================================================

- name: Install libfuse2 for AppImage compatibility
  when:
    - ansible_facts['os_family'] == 'Debian'
    - target_architecture != 'armv7l'
  become: true
  tags: [sudo]
  ansible.builtin.apt:
    name: libfuse2
    state: present
    update_cache: false
  ignore_errors: true

# =============================================================================
# AppImageLauncher — desktop integration for AppImages
#
# Strategy (in order):
#   1. PPA `ppa:appimagelauncher-team/stable` — preferred on 20.04/22.04.
#   2. GitHub `.deb` fallback — PPA is known-broken on Ubuntu 24.04 "noble"
#      as of 2026 (upstream has not published a noble release); the latest
#      GitHub `.deb` still installs cleanly.
#   3. AppImageLauncher **Lite** — a user-level AppImage that integrates
#      itself without root. Enabled when `gui_apps_linux_no_root=true`.
#
# Docs: see docs/tools/appimage.md for install paths, ail-cli usage, and
# the libfuse2 / AppArmor gotchas on recent Ubuntu.
# =============================================================================

- name: Check if AppImageLauncher is installed (system-wide)
  when:
    - ansible_facts['os_family'] == 'Debian'
    - target_architecture != 'armv7l'
  ansible.builtin.command: dpkg -s appimagelauncher
  register: ail_check
  changed_when: false
  failed_when: false

- name: Install AppImageLauncher via PPA
  when:
    - ansible_facts['os_family'] == 'Debian'
    - target_architecture != 'armv7l'
    - not (gui_apps_linux_no_root | bool)
    - ail_check.rc != 0
  become: true
  tags: [sudo]
  block:
    # deb822_repository (apt_repository is deprecated, removed in ansible-core
    # 2.25) doesn't support the ppa: shorthand — spell out the launchpad URI +
    # signing key. Fingerprint from
    # https://api.launchpad.net/devel/~appimagelauncher-team/+archive/ubuntu/stable
    # It also doesn't run `apt update` itself, so verify reachability and roll
    # the .sources file back on failure — a leftover broken source would fail
    # the base role's cache update on every later run.
    # Requires python3-debian (installed by the base role).
    - name: Remove legacy one-line AppImageLauncher PPA source (pre-deb822 format)
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/appimagelauncher-team-stable.list
        state: absent

    - name: Add AppImageLauncher PPA (deb822)
      ansible.builtin.deb822_repository:
        name: appimagelauncher-team-stable
        types: deb
        uris: https://ppa.launchpadcontent.net/appimagelauncher-team/stable/ubuntu
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: main
        signed_by: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xACD802F535B6F55D365285574AF9B16F75EF2FCA
      ignore_errors: true
      register: ail_ppa

    - name: Refresh apt cache (AppImageLauncher PPA)
      when: ail_ppa is succeeded
      ansible.builtin.apt:
        update_cache: true
      ignore_errors: true

    # The apt module treats a partially-failed `apt update` (one unreachable
    # source, others fine) as SUCCESS-with-warnings, so probe the PPA
    # deterministically: package resolvable from the launchpad URI ⇒ keep +
    # install; otherwise roll the .sources file back (a leftover broken
    # source breaks/slows every later apt update) and let the GitHub .deb
    # fallback below take over.
    - name: Check appimagelauncher is resolvable from the PPA
      when: ail_ppa is succeeded
      ansible.builtin.command: apt-cache policy appimagelauncher
      register: ail_policy
      changed_when: false
      failed_when: false

    - name: Remove AppImageLauncher PPA (broken or unreachable)
      when:
        - ail_ppa is succeeded
        - "'ppa.launchpadcontent.net/appimagelauncher-team' not in (ail_policy.stdout | default(''))"
      ansible.builtin.deb822_repository:
        name: appimagelauncher-team-stable
        state: absent

    - name: Install appimagelauncher from PPA
      ansible.builtin.apt:
        name: appimagelauncher
        state: present
      when: "'ppa.launchpadcontent.net/appimagelauncher-team' in (ail_policy.stdout | default(''))"
      register: ail_apt_install
      ignore_errors: true
  rescue:
    - name: Warn AppImageLauncher PPA install failed
      ansible.builtin.debug:
        msg: "AppImageLauncher PPA install failed — trying GitHub .deb fallback next."

- name: Install AppImageLauncher from GitHub .deb (fallback)
  when:
    - ansible_facts['os_family'] == 'Debian'
    - target_architecture in ['x86_64', 'aarch64']
    - not (gui_apps_linux_no_root | bool)
    - ail_check.rc != 0
    - (ail_apt_install is not defined) or (ail_apt_install is not succeeded)
  become: true
  tags: [sudo]
  block:
    - name: Get latest AppImageLauncher release metadata
      ansible.builtin.uri:
        url: https://api.github.com/repos/TheAssassin/AppImageLauncher/releases/latest
        return_content: true
      register: ail_release

    - name: Resolve AppImageLauncher .deb asset URL
      ansible.builtin.set_fact:
        ail_deb_url: >-
          {{ (ail_release.json.assets
              | selectattr('name', 'match', '^appimagelauncher_.*_' + ail_deb_arch + '\\.deb$')
              | map(attribute='browser_download_url')
              | list
              | first) | default('') }}
      vars:
        ail_deb_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[target_architecture] }}"

    - name: Download AppImageLauncher .deb
      when: ail_deb_url | length > 0
      ansible.builtin.get_url:
        url: "{{ ail_deb_url }}"
        dest: /tmp/appimagelauncher.deb
        mode: '0644'
        timeout: 180

    - name: Install AppImageLauncher .deb
      when: ail_deb_url | length > 0
      ansible.builtin.apt:
        deb: /tmp/appimagelauncher.deb
        state: present
  rescue:
    - name: Warn AppImageLauncher .deb install failed
      ansible.builtin.debug:
        msg: "AppImageLauncher .deb install failed — the Lite user-level variant is still available via noRoot mode."

- name: Install AppImageLauncher Lite (user-level, noRoot)
  when:
    - ansible_facts['os_family'] == 'Debian'
    - target_architecture in ['x86_64', 'aarch64']
    - gui_apps_linux_no_root | bool
  block:
    - name: Ensure ~/Applications exists
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/Applications"
        state: directory
        mode: '0755'

    - name: Get latest AppImageLauncher release (for Lite variant)
      ansible.builtin.uri:
        url: https://api.github.com/repos/TheAssassin/AppImageLauncher/releases/latest
        return_content: true
      register: ail_lite_release

    - name: Resolve AppImageLauncher Lite AppImage URL
      ansible.builtin.set_fact:
        ail_lite_url: >-
          {{ (ail_lite_release.json.assets
              | selectattr('name', 'match', '^appimagelauncher-lite-.*-' + target_architecture + '\\.AppImage$')
              | map(attribute='browser_download_url')
              | list
              | first) | default('') }}

    - name: Download AppImageLauncher Lite
      when: ail_lite_url | length > 0
      ansible.builtin.get_url:
        url: "{{ ail_lite_url }}"
        dest: "{{ ansible_facts['env']['HOME'] }}/Applications/appimagelauncher-lite.AppImage"
        mode: '0755'
        timeout: 180
      register: ail_lite_dl
      ignore_errors: true

    - name: Note how to finalise AppImageLauncher Lite integration
      when: ail_lite_dl is defined and ail_lite_dl is succeeded
      ansible.builtin.debug:
        msg: >-
          Downloaded AppImageLauncher Lite to ~/Applications/appimagelauncher-lite.AppImage.
          Run `~/Applications/appimagelauncher-lite.AppImage install` once to register
          the integration; see docs/tools/appimage.md for ail-cli usage.

# =============================================================================
# Visual Studio Code — official Microsoft apt repository
# =============================================================================

- name: Check if VSCode is installed
  when:
    - ansible_facts['os_family'] == 'Debian'
    - target_architecture != 'armv7l'
  ansible.builtin.command: dpkg -s code
  register: vscode_check
  changed_when: false
  failed_when: false

- name: Install VSCode via Microsoft apt repo
  when:
    - ansible_facts['os_family'] == 'Debian'
    - target_architecture in ['x86_64', 'aarch64']
    - not (gui_apps_linux_no_root | bool)
    - vscode_check.rc != 0
  become: true
  tags: [sudo]
  block:
    - name: Ensure /etc/apt/keyrings exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Microsoft GPG key (dearmored)
      ansible.builtin.shell: |
        set -eu
        wget -qO- https://packages.microsoft.com/keys/microsoft.asc \
          | gpg --dearmor -o /etc/apt/keyrings/microsoft.gpg
      args:
        creates: /etc/apt/keyrings/microsoft.gpg

    # apt_repository is deprecated (removed in ansible-core 2.25); deb822
    # doesn't run `apt update` itself, so refresh explicitly. A cache-update
    # failure lands in the rescue below, which rolls the .sources file back
    # so it can't break the base role's cache update on later runs.
    # Requires python3-debian (installed by the base role).
    - name: Remove legacy one-line VSCode source (pre-deb822 format)
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/vscode.list
        state: absent

    - name: Add VSCode apt repository (deb822)
      ansible.builtin.deb822_repository:
        name: vscode
        types: deb
        uris: https://packages.microsoft.com/repos/code
        suites: stable
        components: main
        architectures: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[target_architecture] }}"
        signed_by: /etc/apt/keyrings/microsoft.gpg

    - name: Refresh apt cache (VSCode repo)
      ansible.builtin.apt:
        update_cache: true

    - name: Install VSCode package
      ansible.builtin.apt:
        name: code
        state: present
  rescue:
    - name: Remove VSCode apt repository (install failed; avoid leaving a broken source)
      ansible.builtin.deb822_repository:
        name: vscode
        state: absent
      ignore_errors: true

    - name: Warn VSCode install failed
      ansible.builtin.debug:
        msg: "VSCode install failed — rerun with --tags gui_apps after fixing network/GPG/apt issues."

# =============================================================================
# Cursor — .deb from cursor.com
#
# The download API returns a redirect to the latest build for the given
# platform. The whole block is tolerant: a failed download is logged but
# does not fail the playbook. Users can always fall back to the AppImage
# path documented in docs/tools/appimage.md.
# =============================================================================

- name: Check if Cursor is installed
  when:
    - ansible_facts['os_family'] == 'Debian'
    - target_architecture != 'armv7l'
  ansible.builtin.command: dpkg -s cursor
  register: cursor_check
  changed_when: false
  failed_when: false

- name: Install Cursor via .deb
  when:
    - ansible_facts['os_family'] == 'Debian'
    - target_architecture in ['x86_64', 'aarch64']
    - not (gui_apps_linux_no_root | bool)
    - cursor_check.rc != 0
  become: true
  tags: [sudo]
  block:
    # cursor.com/api/download returns JSON ({downloadUrl, debUrl, rpmUrl, ...}),
    # not a redirect to the binary. Must resolve debUrl first, then fetch.
    - name: Fetch latest Cursor release metadata
      ansible.builtin.uri:
        url: >-
          https://cursor.com/api/download?platform=linux-{{
            {'x86_64': 'x64', 'aarch64': 'arm64'}[target_architecture]
          }}&releaseTrack=stable
        return_content: true
      register: cursor_meta
      ignore_errors: true

    # downloads.cursor.com routes poorly from GFW-region networks and TCP
    # streams frequently drop mid-transfer ("Incomplete read" with partial
    # st_size). get_url has no native resume, so retry the whole fetch up
    # to 4 times — 4 x 174MB is cheaper than babysitting a failed install.
    - name: Download latest Cursor .deb
      when:
        - cursor_meta is defined
        - cursor_meta is succeeded
        - cursor_meta.json is defined
        - cursor_meta.json.debUrl is defined
      ansible.builtin.get_url:
        url: "{{ cursor_meta.json.debUrl }}"
        dest: /tmp/cursor.deb
        mode: '0644'
        timeout: 300
        force: true
      register: cursor_dl
      until: cursor_dl is succeeded
      retries: 4
      delay: 5
      ignore_errors: true

    - name: Install Cursor .deb
      when: cursor_dl is defined and cursor_dl is succeeded
      ansible.builtin.apt:
        deb: /tmp/cursor.deb
        state: present
      ignore_errors: true
  rescue:
    - name: Warn Cursor .deb install failed
      ansible.builtin.debug:
        msg: >-
          Cursor .deb install failed. You can fall back to the AppImage flow —
          download from https://cursor.com/download and drop it under
          ~/Applications/; AppImageLauncher will auto-integrate. See
          docs/tools/appimage.md for the full recipe.

# =============================================================================
# Google Chrome — official .deb, self-registering apt source
#
# Ubuntu ships no Chromium .deb (Canonical's `chromium-browser` is a snap
# shim), so a Chromium-engine browser has to come from upstream. Chrome's
# .deb postinst writes /etc/apt/sources.list.d/google-chrome.list plus its
# keyring, so `apt upgrade` keeps it current afterwards — the same trick
# Cursor/VSCode use, documented in docs/playbooks/linux-gui-apps.md
# "Why .deb auto-update works". That is why we do NOT add a deb822 source
# ourselves: doing both yields duplicate-source warnings on every apt run.
#
# x86_64 only — Google publishes no arm64 Linux build of Chrome (unlike
# VSCode/Cursor). aarch64 desktops fall through to Firefox/Zen.
# =============================================================================

- name: Check if Google Chrome is installed
  when:
    - ansible_facts['os_family'] == 'Debian'
    - target_architecture == 'x86_64'
  ansible.builtin.command: dpkg -s google-chrome-stable
  register: chrome_check
  changed_when: false
  failed_when: false

- name: Install Google Chrome via .deb
  when:
    - ansible_facts['os_family'] == 'Debian'
    - target_architecture == 'x86_64'
    - not (gui_apps_linux_no_root | bool)
    - chrome_check.rc is defined
    - chrome_check.rc != 0
  become: true
  tags: [sudo]
  block:
    - name: Download Google Chrome .deb
      ansible.builtin.get_url:
        url: https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        dest: /tmp/google-chrome-stable.deb
        mode: '0644'
        timeout: 300
        force: true
      register: chrome_dl
      until: chrome_dl is succeeded
      retries: 4
      delay: 5
      ignore_errors: true

    # `is not skipped` alongside `is succeeded` — a task skipped by its `when:`
    # also passes `is succeeded`, which is how the Zen block silently installed
    # nothing for months. See
    # pitfalls/ansible-folded-scalar-regex-empty-url-silent-skip.md
    - name: Install Google Chrome .deb
      when:
        - chrome_dl is defined
        - chrome_dl is not skipped
        - chrome_dl is succeeded
      ansible.builtin.apt:
        deb: /tmp/google-chrome-stable.deb
        state: present
      ignore_errors: true

    - name: Remove downloaded Chrome .deb
      ansible.builtin.file:
        path: /tmp/google-chrome-stable.deb
        state: absent
  rescue:
    - name: Warn Google Chrome install failed
      ansible.builtin.debug:
        msg: >-
          Google Chrome install failed — rerun with --tags gui_apps after
          fixing network/apt issues, or grab the .deb by hand from
          https://www.google.com/chrome/. Zen and Firefox remain available
          in the meantime.

# =============================================================================
# Discord — channel selectable via discord_channel ansible var (default: flatpak)
#
# Values (set by .discordChannel chezmoi prompt, plumbed via
# .chezmoiscripts/global/run_onchange_after_20_ansible_roles.sh.tmpl):
#   - flatpak: Flathub com.discordapp.Discord; auto-updates via `flatpak update`.
#              The recommended path — Discord .deb does NOT ship an apt-source
#              postinst, so .deb installs require manual re-deploy on every
#              release (the in-app updater pops a download modal but cannot
#              actually run dpkg). Flatpak side-steps that pain.
#   - deb:     Fetch the official .deb; only re-fetches when dpkg -s discord
#              fails. Keep this path for users who already standardized on the
#              .deb and don't want a Flatpak runtime on disk.
#   - none:    Skip — install Discord some other way (Vesktop, web app, etc.).
#
# Discord upstream only ships amd64 binaries; both .deb and Flathub follow.
# armhf is not supported by either path. See
# docs/playbooks/linux-gui-apps.md for the full decision tree.
# =============================================================================

- name: Set Discord channel default
  when: ansible_facts['os_family'] == 'Debian'
  ansible.builtin.set_fact:
    discord_channel: "{{ discord_channel | default('flatpak') }}"

- name: Warn Discord is amd64-only on Linux (aarch64)
  when:
    - ansible_facts['os_family'] == 'Debian'
    - target_architecture == 'aarch64'
    - discord_channel != 'none'
  ansible.builtin.debug:
    msg: >-
      Discord does not publish official aarch64 binaries (no .deb, no
      Flatpak ARM build). Skipping. Use a community build like Vesktop on
      ARM64 if you need Discord — see https://github.com/Vencord/Vesktop.

# --- deb channel ----------------------------------------------------------

- name: Check if Discord .deb is installed
  when:
    - ansible_facts['os_family'] == 'Debian'
    - target_architecture == 'x86_64'
    - discord_channel == 'deb'
  ansible.builtin.command: dpkg -s discord
  register: discord_check
  changed_when: false
  failed_when: false

- name: Install Discord via .deb
  when:
    - ansible_facts['os_family'] == 'Debian'
    - target_architecture == 'x86_64'
    - discord_channel == 'deb'
    - not (gui_apps_linux_no_root | bool)
    - discord_check.rc != 0
  become: true
  tags: [sudo]
  block:
    - name: Download latest Discord .deb (redirect from discord.com)
      ansible.builtin.get_url:
        url: https://discord.com/api/download?platform=linux&format=deb
        dest: /tmp/discord.deb
        mode: '0644'
        timeout: 300
      register: discord_dl
      ignore_errors: true

    - name: Install Discord .deb
      when: discord_dl is defined and discord_dl is succeeded
      ansible.builtin.apt:
        deb: /tmp/discord.deb
        state: present
      ignore_errors: true
  rescue:
    - name: Warn Discord .deb install failed
      ansible.builtin.debug:
        msg: >-
          Discord .deb install failed. Fall back to the official tarball at
          https://discord.com/api/download?platform=linux&format=tar.gz
          (extract to ~/Applications/Discord/ and wire up a .desktop entry),
          or switch to Flatpak by setting discordChannel=flatpak in
          ~/.config/chezmoi/chezmoi.toml.

# --- flatpak channel ------------------------------------------------------

- name: Install Discord via Flatpak (channel=flatpak)
  when:
    - ansible_facts['os_family'] == 'Debian'
    - target_architecture == 'x86_64'
    - discord_channel == 'flatpak'
    - not (gui_apps_linux_no_root | bool)
  block:
    - name: Ensure flatpak package is present
      become: true
      tags: [sudo]
      ansible.builtin.apt:
        name: flatpak
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure Flathub remote is configured (per-user)
      community.general.flatpak_remote:
        name: flathub
        flatpakrepo_url: https://flathub.org/repo/flathub.flatpakrepo
        method: user
        state: present

    - name: Install Discord from Flathub (per-user)
      community.general.flatpak:
        name: com.discordapp.Discord
        state: present
        method: user
        remote: flathub
  rescue:
    - name: Warn Discord Flatpak install failed
      ansible.builtin.debug:
        msg: >-
          Discord Flatpak install failed. Manual fallback —
          `flatpak install flathub com.discordapp.Discord` from a shell,
          or set discordChannel=deb in ~/.config/chezmoi/chezmoi.toml to
          revert to the .deb path.

# =============================================================================
# Steam — optional gaming bundle via Valve's official apt repository
#
# Gated by the `installGamingApps` chezmoi prompt, plumbed through
# `gui_apps_linux_install_gaming_apps`. Valve's repo publishes an amd64
# `steam-launcher` package and an i386 transitional package; adding i386 is
# required so Steam can resolve its 32-bit runtime libraries. Avoid hard-coding
# old package names like `libgl1-mesa-glx`, which no longer exists on Ubuntu
# 24.04 — let apt resolve current dependencies/recommends from the package.
# =============================================================================

- name: Skip Steam on non-x86_64 Linux
  when:
    - ansible_facts['os_family'] == 'Debian'
    - gui_apps_linux_install_gaming_apps | bool
    - target_architecture != 'x86_64'
  ansible.builtin.debug:
    msg: >-
      Steam is only installed on x86_64 here. Valve's Ubuntu launcher and
      game runtime expect amd64/i386 packages; skipping on {{ target_architecture }}.

- name: Skip Steam in noRoot mode
  when:
    - ansible_facts['os_family'] == 'Debian'
    - gui_apps_linux_install_gaming_apps | bool
    - target_architecture == 'x86_64'
    - gui_apps_linux_no_root | bool
  ansible.builtin.debug:
    msg: >-
      installGamingApps=true, but Steam requires sudo to add Valve's apt repo,
      enable i386, and install steam-launcher. Skipping in noRoot mode.

- name: Install Steam via Valve apt repo
  when:
    - ansible_facts['os_family'] == 'Debian'
    - gui_apps_linux_install_gaming_apps | bool
    - target_architecture == 'x86_64'
    - not (gui_apps_linux_no_root | bool)
  block:
    - name: Check enabled foreign architectures (Steam)
      ansible.builtin.command: dpkg --print-foreign-architectures
      register: steam_foreign_arches
      changed_when: false
      failed_when: false

    - name: Enable i386 architecture for Steam runtime
      when: "'i386' not in (steam_foreign_arches.stdout_lines | default([]))"
      become: true
      tags: [sudo]
      ansible.builtin.command: dpkg --add-architecture i386

    - name: Ensure /usr/share/keyrings exists (Steam)
      become: true
      tags: [sudo]
      ansible.builtin.file:
        path: /usr/share/keyrings
        state: directory
        mode: '0755'

    - name: Install Valve Steam apt signing key
      become: true
      tags: [sudo]
      ansible.builtin.get_url:
        url: https://repo.steampowered.com/steam/archive/stable/steam.gpg
        dest: /usr/share/keyrings/steam.gpg
        mode: '0644'
        force: true
        timeout: 120

    - name: Remove legacy Steam apt source list files
      become: true
      tags: [sudo]
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/steam.list
        - /etc/apt/sources.list.d/steam-stable.list

    - name: Add Valve Steam apt repository
      become: true
      tags: [sudo]
      ansible.builtin.deb822_repository:
        name: steam
        types: deb
        uris: https://repo.steampowered.com/steam/
        suites: stable
        components: steam
        architectures:
          - amd64
          - i386
        signed_by: /usr/share/keyrings/steam.gpg

    # Refresh ONLY the Steam source, not the whole apt config. A plain
    # `apt-get update` re-fetches every third-party source (vscode, cursor,
    # azure, hashicorp, ngrok, tailscale, …); on a flaky network/proxy any one
    # of them can make the update exit non-zero and (via the block rescue)
    # leave the just-added Valve repo unindexed → `steam-launcher` unresolvable.
    # Scoping to sources.list.d/steam.sources keeps this immune to sibling
    # sources. (No ansible.builtin.apt equivalent — it can't target one source.)
    # cache_valid_time is irrelevant here too: base already refreshed the cache
    # at play start, so an unscoped module call would skip and never index Steam.
    - name: Refresh apt cache for the Steam source only
      become: true
      tags: [sudo]
      ansible.builtin.command:
        cmd: >-
          apt-get update
          -o Dir::Etc::sourcelist=sources.list.d/steam.sources
          -o Dir::Etc::sourceparts=-
          -o APT::Get::List-Cleanup=0
      changed_when: false

    - name: Install Steam launcher
      become: true
      tags: [sudo]
      ansible.builtin.apt:
        name: steam-launcher
        state: present
        install_recommends: true
        update_cache: false
  rescue:
    - name: Warn Steam install failed
      ansible.builtin.debug:
        msg: >-
          Steam install failed. Manual fallback: follow Valve's apt repo
          instructions at https://repo.steampowered.com/steam/ or install the
          latest launcher package from
          https://repo.steampowered.com/steam/archive/stable/steam_latest.deb.

# =============================================================================
# Zen Browser — Firefox-based browser, shipped as an AppImage
#
# User-level install under ~/Applications/. We write the icon + .desktop entry
# ourselves so the browser is searchable in GNOME/KDE launchers immediately.
#
# IMPORTANT — the filename is NOT stable, and writing our own .desktop does NOT
# opt us out of AppImageLauncher. AIL hooks *execution* itself (binfmt_misc →
# binfmt-bypass, visible in `pgrep -af zen`), not just the ~/Applications
# watch, so the first launch integrates the file and renames it to
# `zen_<md5-of-path>.AppImage`. That is upstream by design — the checksum is how
# AIL recognises an already-integrated AppImage (TheAssassin/AppImageLauncher#547).
# Consequences encoded below:
#   - the "is it installed?" guard globs `zen*.AppImage`; a fixed name made
#     every apply re-download 125 MB and then get renamed again, forever;
#   - desktop integration is re-asserted on EVERY apply (not only on download)
#     so a rename self-heals instead of leaving a dangling TryExec, which the
#     launcher hides silently rather than reporting;
#   - AIL's parallel appimagekit_* entry is removed so `zen-browser.desktop`
#     stays the single authority that `linux_app_register Zen --desktop=` and
#     `applaunch Zen` can rely on.
# See pitfalls/appimagelauncher-renames-managed-appimage.md
#
# noRoot-friendly: the whole block is user-level, no `become: true`, no
# `tags: [sudo]`. `ail-cli` is absent under AppImageLauncher Lite, so every
# deintegration task must stay non-fatal.
# =============================================================================

- name: Find any installed Zen AppImage
  when:
    - ansible_facts['os_family'] == 'Debian'
    - target_architecture in ['x86_64', 'aarch64']
  ansible.builtin.find:
    paths: "{{ ansible_facts['env']['HOME'] }}/Applications"
    patterns: 'zen*.AppImage'
    file_type: file
  register: zen_appimage_found

- name: Install / refresh Zen Browser AppImage + desktop integration
  when:
    - ansible_facts['os_family'] == 'Debian'
    - target_architecture in ['x86_64', 'aarch64']
  block:
    - name: Ensure ~/Applications exists (Zen)
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/Applications"
        state: directory
        mode: '0755'

    # Only hit the network when there is genuinely no Zen on disk. A renamed
    # (integrated) AppImage still counts as installed.
    - name: Get latest Zen Browser release metadata
      when: zen_appimage_found.matched | default(0) == 0
      ansible.builtin.uri:
        url: https://api.github.com/repos/zen-browser/desktop/releases/latest
        return_content: true
      register: zen_release

    # Match the asset name literally — NOT with `match`/regex. A regex here
    # has to escape the dot, and `\\.` inside a YAML folded scalar (`>-`)
    # survives as *two* literal backslashes, producing the never-matching
    # pattern `^zen-x86_64\\.AppImage$`. That silently resolved the URL to ''
    # for months. Upstream asset names are exact and stable, so `equalto`
    # removes the escaping hazard entirely.
    # See pitfalls/ansible-folded-scalar-regex-empty-url-silent-skip.md
    - name: Resolve Zen AppImage asset URL
      when: zen_appimage_found.matched | default(0) == 0
      ansible.builtin.set_fact:
        zen_appimage_url: >-
          {{ (zen_release.json.assets
              | selectattr('name', 'equalto', 'zen-' + target_architecture + '.AppImage')
              | map(attribute='browser_download_url')
              | list
              | first) | default('') }}

    # Loud, non-fatal: an unresolved URL means upstream renamed the asset.
    # Without this the whole block degrades to a no-op with zero output.
    - name: Warn that no Zen AppImage asset matched
      when:
        - zen_appimage_found.matched | default(0) == 0
        - zen_appimage_url | default('') | length == 0
      ansible.builtin.debug:
        msg: >-
          No asset named 'zen-{{ target_architecture }}.AppImage' in the latest
          zen-browser/desktop release — upstream probably renamed it. Zen was
          NOT installed. Check
          https://github.com/zen-browser/desktop/releases/latest and update the
          'Resolve Zen AppImage asset URL' task.

    - name: Download Zen AppImage
      when:
        - zen_appimage_found.matched | default(0) == 0
        - zen_appimage_url | default('') | length > 0
      ansible.builtin.get_url:
        url: "{{ zen_appimage_url }}"
        dest: "{{ ansible_facts['env']['HOME'] }}/Applications/zen.AppImage"
        mode: '0755'
        timeout: 300
      register: zen_appimage_dl
      until: zen_appimage_dl is succeeded
      retries: 3
      delay: 5

    # Copies accumulate when AIL integrates a file we later re-download under
    # the stable name. Say so rather than silently picking one.
    - name: Warn about multiple Zen AppImages
      when: zen_appimage_found.matched | default(0) > 1
      ansible.builtin.debug:
        msg: >-
          {{ zen_appimage_found.matched }} Zen AppImages in ~/Applications
          ({{ zen_appimage_found.files | map(attribute='path') | map('basename') | join(', ') }}).
          Using the newest; delete the others once you have confirmed which one
          you launch.

    # Newest by mtime when one is already on disk, otherwise the file we just
    # downloaded under the stable name.
    - name: Resolve which Zen AppImage to integrate
      ansible.builtin.set_fact:
        zen_appimage_path: >-
          {{ (zen_appimage_found.files | sort(attribute='mtime') | last).path
             if (zen_appimage_found.matched | default(0)) > 0
             else ansible_facts['env']['HOME'] + '/Applications/zen.AppImage' }}

    # Guards every integration task below: covers "download skipped because the
    # asset vanished" without depending on the download result at all.
    - name: Check the resolved Zen AppImage exists
      ansible.builtin.stat:
        path: "{{ zen_appimage_path }}"
      register: zen_appimage_stat

    - name: Check whether the Zen icon is already present
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/share/icons/hicolor/scalable/apps/zen-browser.svg"
      register: zen_icon_stat

    - name: Download Zen SVG icon
      when:
        - zen_appimage_stat.stat.exists
        - not zen_icon_stat.stat.exists
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/zen-browser/desktop/dev/docs/assets/zen-browser.svg
        dest: "{{ ansible_facts['env']['HOME'] }}/.local/share/icons/hicolor/scalable/apps/zen-browser.svg"
        mode: '0644'
      register: zen_icon_dl
      until: zen_icon_dl is succeeded
      retries: 3
      delay: 5
      ignore_errors: true

    # Re-written every apply against the CURRENT path — this is the self-heal.
    # `copy` is content-idempotent, so it only reports changed after a rename.
    - name: Install Zen Browser .desktop entry
      when: zen_appimage_stat.stat.exists
      ansible.builtin.copy:
        dest: "{{ ansible_facts['env']['HOME'] }}/.local/share/applications/zen-browser.desktop"
        mode: '0644'
        content: |
          [Desktop Entry]
          Type=Application
          Name=Zen Browser
          GenericName=Web Browser
          Comment=Experience tranquillity while browsing the web without people tracking you
          Exec={{ zen_appimage_path }} %U
          TryExec={{ zen_appimage_path }}
          Icon=zen-browser
          Terminal=false
          StartupNotify=true
          StartupWMClass=zen
          Categories=Network;WebBrowser;
          MimeType=text/html;text/xml;application/xhtml+xml;application/xml;application/rss+xml;application/rdf+xml;image/gif;image/jpeg;image/png;x-scheme-handler/http;x-scheme-handler/https;x-scheme-handler/ftp;x-scheme-handler/chrome;video/webm;application/x-xpinstall;
          Keywords=web;browser;internet;firefox;zen;
      register: zen_desktop_entry

    - name: Find AppImageLauncher's parallel Zen desktop entries
      when: zen_appimage_stat.stat.exists
      ansible.builtin.find:
        paths: "{{ ansible_facts['env']['HOME'] }}/.local/share/applications"
        patterns: 'appimagekit_*Zen*.desktop'
        file_type: file
      register: zen_ail_entries

    # `failed_when: false` is load-bearing: ail-cli ships only with the system
    # AppImageLauncher package, never with Lite (noRoot), where `command` would
    # otherwise abort the play on "Unable to find executable".
    - name: Deintegrate AppImageLauncher's Zen entry
      when:
        - zen_appimage_stat.stat.exists
        - zen_ail_entries.matched | default(0) > 0
      ansible.builtin.command: ail-cli deintegrate "{{ zen_appimage_path }}"
      register: zen_deintegrate
      changed_when: zen_deintegrate.rc == 0
      failed_when: false

    - name: Remove leftover AppImageLauncher Zen desktop entries
      when:
        - zen_appimage_stat.stat.exists
        - zen_ail_entries.matched | default(0) > 0
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ zen_ail_entries.files | default([]) }}"
      loop_control:
        label: "{{ item.path | basename }}"
      register: zen_ail_removed

    - name: Refresh desktop application database (Zen)
      when: >-
        zen_desktop_entry is changed
        or zen_ail_removed is changed
        or zen_icon_dl is changed
      ansible.builtin.command: update-desktop-database "{{ ansible_facts['env']['HOME'] }}/.local/share/applications"
      changed_when: false
      failed_when: false
  rescue:
    - name: Warn Zen install failed
      ansible.builtin.debug:
        msg: >-
          Zen Browser install failed — you can fall back to downloading the
          AppImage manually from https://github.com/zen-browser/desktop/releases/latest
          into ~/Applications/ and re-running `update-desktop-database ~/.local/share/applications`.

