---
# LazyVim dependencies role

# macOS - all via Homebrew
- name: Install LazyVim dependencies (macOS)
  when: ansible_facts["os_family"] == "Darwin"
  community.general.homebrew:
    name:
      - fzf
      - lazygit
      - tree-sitter
      - node
    state: present

# Find the mise binary (installed by bootstrap on Linux, by Homebrew or the
# upstream installer on macOS). Darwin is included on purpose: `mise install`
# below is the ONLY thing that installs the runtimes declared in
# dot_config/mise/config.toml.tmpl, and leaving macOS out silently stranded
# go@latest / rust@stable as permanently "(missing)" — mise then warns on every
# shell prompt. See the "Install mise global tools" comment below.
- name: Check for user-installed mise
  when: ansible_facts["os_family"] in ["Debian", "RedHat", "Darwin"]
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/mise"
  register: mise_user_bin

- name: Set mise binary path (user install)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat", "Darwin"]
    - mise_user_bin.stat.exists | default(false)
  ansible.builtin.set_fact:
    mise_bin: "{{ ansible_facts['env']['HOME'] }}/.local/bin/mise"

- name: Set mise binary path (system install)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat", "Darwin"]
    - mise_bin is not defined
  ansible.builtin.set_fact:
    mise_bin: >-
      {{ ('/opt/homebrew/bin/mise' if target_architecture == 'arm64' else '/usr/local/bin/mise')
         if ansible_facts["os_family"] == "Darwin" else '/usr/bin/mise' }}

# Install mise tools from ~/.config/mise/config.toml (node@lts)
# Non-fatal: mise downloads are flaky and some tools (e.g. ruby) may fail on
# constrained hardware. Partial success is fine — user can re-run `mise install`.
#
# On armv7l (RPi 4 with 32-bit armhf userland), skip bun (no armv7l build),
# ruby (ruby-build source compile is too heavy and fragile), and pin node to
# @20 — the last LTS with armv7l prebuilts. Node 21+ has no armv7l prebuilt and
# source-builds fail linking (`__atomic_load_8`) without `-latomic`.
- name: Install mise global tools (Debian/Ubuntu, armv7l)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - target_architecture in ['armv7l', 'armv6l']
  ansible.builtin.command:
    cmd: "{{ mise_bin }} install --yes node@20 rust@stable"
  register: mise_install
  # mise prints "mise all tools are installed" when there is nothing to do —
  # that string contains "install", so a bare substring test reports `changed`
  # on every single run. Exclude the no-op line explicitly.
  changed_when:
    - "'all tools are installed' not in (mise_install.stdout + mise_install.stderr)"
    - "'install' in mise_install.stderr or 'install' in mise_install.stdout"
  failed_when: false

# Darwin included: nothing else on macOS installs the runtimes declared in
# dot_config/mise/config.toml.tmpl. `rust_cargo_tools` installs rust and
# Homebrew covers node, but go@latest had NO installer at all after commit
# 34cc271 moved Go off the security_tools brew path onto mise — leaving
# `mise ls` permanently showing `go <ver> (missing)`.
- name: Install mise global tools (Debian/Ubuntu/macOS)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat", "Darwin"]
    - target_architecture not in ['armv7l', 'armv6l']
  ansible.builtin.command:
    cmd: "{{ mise_bin }} install --yes"
  register: mise_install
  # mise prints "mise all tools are installed" when there is nothing to do —
  # that string contains "install", so a bare substring test reports `changed`
  # on every single run. Exclude the no-op line explicitly.
  changed_when:
    - "'all tools are installed' not in (mise_install.stdout + mise_install.stderr)"
    - "'install' in mise_install.stderr or 'install' in mise_install.stdout"
  failed_when: false

# TUNA's rustup mirror lags upstream releases: right after a new stable lands,
# the channel manifest already names it but the tarballs 404 ("could not
# download nonexistent rust version `1.96.0-…`"). Leaving rust missing here is
# NOT contained to this task — every later `mise exec -- npm …` (coding_agents,
# js_cli_tools) first tries to auto-install the missing rust, hits the same
# 404, and fails the play. Retry against the canonical rustup server, same
# fallback pattern as rust_cargo_tools. crates.io stays on the user's
# ~/.cargo/config.toml mirror. See pitfalls/mise-rust-cargo-shim-dead.md.
- name: Retry mise global tools against official rustup server (mirror lag)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat", "Darwin"]
    - target_architecture not in ['armv7l', 'armv6l']
    - mise_install.rc is defined
    - mise_install.rc != 0
  ansible.builtin.command:
    cmd: "{{ mise_bin }} install --yes"
  environment:
    RUSTUP_DIST_SERVER: "https://static.rust-lang.org"
    RUSTUP_UPDATE_ROOT: "https://static.rust-lang.org/rustup"
  register: mise_install_retry
  # mise prints "mise all tools are installed" when there is nothing to do —
  # that string contains "install", so a bare substring test reports `changed`
  # on every single run. Exclude the no-op line explicitly.
  changed_when:
    - "'all tools are installed' not in (mise_install_retry.stdout + mise_install_retry.stderr)"
    - "'install' in mise_install_retry.stderr or 'install' in mise_install_retry.stdout"
  failed_when: false

- name: Warn if mise install had failures
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat", "Darwin"]
    - mise_install.rc is defined
    - mise_install.rc != 0
    - mise_install_retry.rc | default(1) != 0
  ansible.builtin.debug:
    msg: |
      mise install exited with rc={{ mise_install.rc }} — some tools may have failed
      (official-server retry rc={{ mise_install_retry.rc | default('skipped') }}).
      Re-run manually to retry: `{{ mise_bin }} install --yes`
      Stderr tail: {{ (mise_install_retry.stderr_lines | default(mise_install.stderr_lines))[-5:] | default([]) | join(' | ') }}

# fzf - upstream clone is managed by .chezmoiexternal.toml.tmpl (Linux only,
# since the apt version is outdated and lacks --zsh). We only need to build
# the binary here; `creates:` makes the task idempotent and lets it re-run
# after chezmoi pulls a new release that bumps ~/.fzf/install.
- name: Install fzf (binary only, shell integration handled by zsh config)
  when: ansible_facts["os_family"] in ["Debian", "RedHat"]
  ansible.builtin.command:
    cmd: "{{ ansible_facts['env']['HOME'] }}/.fzf/install --bin"
    creates: "{{ ansible_facts['env']['HOME'] }}/.fzf/bin/fzf"

# LazyGit >= 0.64 is required by dot_config/lazygit/config.yml: that release
# renamed git.pagers to git.diffRenderers. Older binaries silently ignore the
# managed renderer and show a raw diff, so presence-only checks are insufficient.
- name: Check current LazyGit version
  when: ansible_facts["os_family"] in ["Debian", "RedHat", "Darwin"]
  ansible.builtin.shell: >-
    lazygit --version 2>/dev/null
    | grep -oE 'version=[0-9]+\.[0-9]+\.[0-9]+'
    | head -1
    | cut -d= -f2
  args:
    executable: /bin/bash
  register: lazygit_version_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: Set LazyGit version fact
  when: ansible_facts["os_family"] in ["Debian", "RedHat", "Darwin"]
  ansible.builtin.set_fact:
    lazygit_current_version: >-
      {{ lazygit_version_check.stdout | default('0.0.0', true) | trim or '0.0.0' }}

- name: Display current LazyGit version
  when: ansible_facts["os_family"] in ["Debian", "RedHat", "Darwin"]
  ansible.builtin.debug:
    msg: "Current LazyGit version: {{ lazygit_current_version }} (required: >= {{ lazygit_min_version }})"

# Minimum-version exception to the repo's install-only policy. Detect the
# install style before upgrading: `brew upgrade` errors for non-formula installs
# and a fake brew stub can return success for every command while doing nothing.
- name: Detect Homebrew-managed LazyGit below minimum version
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat", "Darwin"]
    - lazygit_current_version is version(lazygit_min_version, '<')
  ansible.builtin.shell: |
    [ -n "$(brew --prefix 2>/dev/null)" ] || exit 1
    brew list --formula lazygit >/dev/null 2>&1
  args:
    executable: /bin/bash
  register: lazygit_brew_managed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Report Homebrew LazyGit minimum-version upgrade in check mode
  when:
    - lazygit_current_version is version(lazygit_min_version, '<')
    - lazygit_brew_managed.rc | default(1) == 0
    - ansible_check_mode
  ansible.builtin.debug:
    msg: "Would run brew upgrade lazygit to satisfy >= {{ lazygit_min_version }}"

- name: Upgrade Homebrew-managed LazyGit to minimum version
  when:
    - lazygit_current_version is version(lazygit_min_version, '<')
    - lazygit_brew_managed.rc | default(1) == 0
    - not ansible_check_mode
  ansible.builtin.command: brew upgrade lazygit
  register: lazygit_brew_upgrade
  changed_when: true
  failed_when: false

- name: Re-check LazyGit version after Homebrew upgrade attempt
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat", "Darwin"]
    - lazygit_current_version is version(lazygit_min_version, '<')
  ansible.builtin.shell: >-
    lazygit --version 2>/dev/null
    | grep -oE 'version=[0-9]+\.[0-9]+\.[0-9]+'
    | head -1
    | cut -d= -f2
  args:
    executable: /bin/bash
  register: lazygit_brew_version_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: Set effective LazyGit version after Homebrew attempt
  when: ansible_facts["os_family"] in ["Debian", "RedHat", "Darwin"]
  ansible.builtin.set_fact:
    lazygit_effective_version: >-
      {{ lazygit_brew_version_check.stdout
         | default(lazygit_current_version, true)
         | trim
         or lazygit_current_version }}

# The lazygit PPA (ppa:lazygit-team/release) was deprecated upstream in 2021
# (jesseduffield/lazygit#1399) — it has no Release file for focal+ and adding
# it breaks `apt-get update` for the whole machine. We used to add it here;
# purge any leftover source file from previously provisioned hosts so the
# base role's cache update stops failing. Install now goes straight to the
# GitHub-release path below.
# See pitfalls/apt-update-fails-base-role-empty-error.md.
- name: Find stale lazygit PPA source files (PPA deprecated upstream)
  when: ansible_facts["distribution"] == "Ubuntu"
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns:
      - "*lazygit*"
      - "ppa_lazygit_team_*"
  register: lazygit_ppa_leftovers

- name: Remove stale lazygit PPA source files
  when:
    - ansible_facts["distribution"] == "Ubuntu"
    - lazygit_ppa_leftovers.files | length > 0
  become: true
  tags: [sudo]
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ lazygit_ppa_leftovers.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Set LazyGit release architecture
  when: ansible_facts["os_family"] in ["Debian", "RedHat", "Darwin"]
  ansible.builtin.set_fact:
    lazygit_arch: >-
      {{
        'x86_64' if target_architecture in ['x86_64', 'amd64']
        else 'arm64' if target_architecture in ['aarch64', 'arm64']
        else ''
      }}

- name: Install LazyGit from GitHub releases (system-level)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - lazygit_effective_version is version(lazygit_min_version, '<')
    - lazygit_arch | trim != ''
    - not ansible_check_mode
  become: true
  tags: [sudo]
  block:
    - name: Get latest LazyGit release (system)
      ansible.builtin.uri:
        url: https://api.github.com/repos/jesseduffield/lazygit/releases/latest
        return_content: true
        timeout: 30
      register: lazygit_release

    - name: Set LazyGit system release asset name
      ansible.builtin.set_fact:
        lazygit_system_asset_name: >-
          lazygit_{{ lazygit_release.json.tag_name | regex_replace('^v', '') }}_linux_{{ lazygit_arch }}.tar.gz

    - name: Select LazyGit system release asset
      ansible.builtin.set_fact:
        lazygit_system_asset: >-
          {{
            (
              lazygit_release.json.assets
              | selectattr('name', 'equalto', lazygit_system_asset_name)
              | list
              | first
            ) | default({})
          }}

    - name: Validate LazyGit system release asset
      ansible.builtin.assert:
        that:
          - lazygit_system_asset.browser_download_url is defined
          - lazygit_system_asset.digest is defined
          - lazygit_system_asset.digest is match('^sha256:[0-9a-f]{64}$')
        fail_msg: >-
          The latest LazyGit release does not contain {{ lazygit_system_asset_name }}
          with a SHA-256 digest

    - name: Download LazyGit binary (system)
      ansible.builtin.get_url:
        url: "{{ lazygit_system_asset.browser_download_url }}"
        dest: /tmp/lazygit.tar.gz
        checksum: "{{ lazygit_system_asset.digest }}"
        mode: '0644'
        timeout: 120
      retries: 3
      delay: 5

    - name: Extract LazyGit (system)
      ansible.builtin.command:
        argv:
          - /usr/bin/tar
          - -xzf
          - /tmp/lazygit.tar.gz
          - -C
          - /usr/local/bin
          - lazygit

    - name: Check installed LazyGit system release version
      ansible.builtin.shell: >-
        /usr/local/bin/lazygit --version 2>/dev/null
        | grep -oE 'version=[0-9]+\.[0-9]+\.[0-9]+'
        | head -1
        | cut -d= -f2
      args:
        executable: /bin/bash
      register: lazygit_system_release_version
      changed_when: false

    - name: Validate installed LazyGit system release version
      ansible.builtin.assert:
        that:
          - lazygit_system_release_version.stdout is version(lazygit_min_version, '>=')
        fail_msg: >-
          Installed LazyGit {{ lazygit_system_release_version.stdout | default('unknown', true) }}
          is older than required {{ lazygit_min_version }}
  rescue:
    - name: Warn LazyGit system install failed
      ansible.builtin.debug:
        msg: "LazyGit system-level installation failed — continuing with the user-level fallback"
  always:
    - name: Clean up LazyGit system release archive
      ansible.builtin.file:
        path: /tmp/lazygit.tar.gz
        state: absent

- name: Re-check LazyGit version after system install attempt
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat", "Darwin"]
    - lazygit_effective_version is version(lazygit_min_version, '<')
  ansible.builtin.shell: >-
    lazygit --version 2>/dev/null
    | grep -oE 'version=[0-9]+\.[0-9]+\.[0-9]+'
    | head -1
    | cut -d= -f2
  args:
    executable: /bin/bash
  register: lazygit_system_version_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: Set LazyGit version after system install attempt
  when: ansible_facts["os_family"] in ["Debian", "RedHat", "Darwin"]
  ansible.builtin.set_fact:
    lazygit_post_system_version: >-
      {{ lazygit_system_version_check.stdout
         | default(lazygit_effective_version, true)
         | trim
         or lazygit_effective_version }}

- name: Report LazyGit user-level release fallback in check mode
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat", "Darwin"]
    - lazygit_post_system_version is version(lazygit_min_version, '<')
    - lazygit_arch | default('') | trim != ''
    - ansible_check_mode
  ansible.builtin.debug:
    msg: "Would install the latest official LazyGit release to ~/.local/bin"

# User-level install runs when Homebrew/system installation was unavailable,
# failed, or remains shadowed by an older binary on PATH.
- name: Install LazyGit from GitHub releases (user-level, no sudo)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat", "Darwin"]
    - lazygit_post_system_version is version(lazygit_min_version, '<')
    - lazygit_arch | default('') | trim != ''
    - not ansible_check_mode
  block:
    - name: Get latest LazyGit release (user)
      ansible.builtin.uri:
        url: https://api.github.com/repos/jesseduffield/lazygit/releases/latest
        return_content: true
        timeout: 30
      register: lazygit_release_user

    - name: Set LazyGit user release asset name
      ansible.builtin.set_fact:
        lazygit_user_asset_name: >-
          lazygit_{{ lazygit_release_user.json.tag_name | regex_replace('^v', '') }}_{{ 'darwin' if ansible_facts['os_family'] == 'Darwin' else 'linux' }}_{{ lazygit_arch }}.tar.gz

    - name: Select LazyGit user release asset
      ansible.builtin.set_fact:
        lazygit_user_asset: >-
          {{
            (
              lazygit_release_user.json.assets
              | selectattr('name', 'equalto', lazygit_user_asset_name)
              | list
              | first
            ) | default({})
          }}

    - name: Validate LazyGit user release asset
      ansible.builtin.assert:
        that:
          - lazygit_user_asset.browser_download_url is defined
          - lazygit_user_asset.digest is defined
          - lazygit_user_asset.digest is match('^sha256:[0-9a-f]{64}$')
        fail_msg: >-
          The latest LazyGit release does not contain {{ lazygit_user_asset_name }}
          with a SHA-256 digest

    - name: Ensure ~/.local/bin exists for LazyGit
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        state: directory
        mode: '0755'

    - name: Download LazyGit binary (user)
      ansible.builtin.get_url:
        url: "{{ lazygit_user_asset.browser_download_url }}"
        dest: /tmp/lazygit.tar.gz
        checksum: "{{ lazygit_user_asset.digest }}"
        mode: '0644'
        timeout: 120
      retries: 3
      delay: 5

    - name: Extract LazyGit to user bin
      ansible.builtin.command:
        argv:
          - /usr/bin/tar
          - -xzf
          - /tmp/lazygit.tar.gz
          - -C
          - "{{ ansible_facts['env']['HOME'] }}/.local/bin"
          - lazygit

    - name: Check installed LazyGit user release version
      ansible.builtin.shell: >-
        {{ ansible_facts['env']['HOME'] }}/.local/bin/lazygit --version 2>/dev/null
        | grep -oE 'version=[0-9]+\.[0-9]+\.[0-9]+'
        | head -1
        | cut -d= -f2
      args:
        executable: /bin/bash
      register: lazygit_user_version
      changed_when: false

    - name: Validate installed LazyGit user release version
      ansible.builtin.assert:
        that:
          - lazygit_user_version.stdout is version(lazygit_min_version, '>=')
        fail_msg: >-
          Installed LazyGit {{ lazygit_user_version.stdout | default('unknown', true) }}
          is older than required {{ lazygit_min_version }}
  rescue:
    - name: Warn LazyGit user install failed
      ansible.builtin.debug:
        msg: "LazyGit user-level installation failed — the final version check will report the stale binary"
  always:
    - name: Clean up LazyGit user release archive
      ansible.builtin.file:
        path: /tmp/lazygit.tar.gz
        state: absent

- name: Validate effective LazyGit version
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat", "Darwin"]
    - lazygit_arch | default('') | trim != ''
    - not ansible_check_mode
  ansible.builtin.shell: >-
    PATH="{{ ansible_facts['env']['HOME'] }}/.local/bin:$PATH"
    lazygit --version 2>/dev/null
    | grep -oE 'version=[0-9]+\.[0-9]+\.[0-9]+'
    | head -1
    | cut -d= -f2
  args:
    executable: /bin/bash
  register: lazygit_final_version
  changed_when: false
  failed_when: >-
    lazygit_final_version.rc != 0
    or (lazygit_final_version.stdout | default('0.0.0', true) | trim or '0.0.0')
       is version(lazygit_min_version, '<')

# tree-sitter-cli
- name: Check if tree-sitter --version works (any install path)
  # Search standard PATH dirs INCLUDING ~/.cargo/bin (cargo install target)
  # so re-applies don't reinstall on hosts that fell through to the cargo
  # fallback path. ansible.builtin.command doesn't honour ~ expansion in
  # PATH; use shell with explicit ${HOME}.
  when: ansible_facts["os_family"] in ["Debian", "RedHat"]
  ansible.builtin.shell: |
    PATH="${HOME}/.cargo/bin:${PATH}" tree-sitter --version
  args:
    executable: /bin/bash
  register: treesitter_version_check
  changed_when: false
  failed_when: false

- name: Purge broken tree-sitter-cli native binary in mise node installs (if any)
  # tree-sitter-cli's npm postinstall (install.js) downloads a prebuilt
  # binary from GitHub release-assets (Azure blob CDN). On flaky networks
  # the gunzip stream can fail silently, leaving a 0-byte file with mode
  # 0600 next to cli.js while postinstall exits 0. `tree-sitter --version`
  # still reports OK because cli.js reads package.json — it never spawns
  # the native binary. Every :TSInstall / parser build then explodes with
  # EACCES. Scan all mise node installs directly and purge empty/
  # non-executable native binaries so the install block below re-runs
  # npm install and heals them. Does NOT touch cargo's monolithic binary
  # (different install shape, can't exhibit this failure mode).
  when: ansible_facts["os_family"] in ["Debian", "RedHat"]
  ansible.builtin.shell: |
    set +e
    any_broken=0
    for d in "${HOME}/.local/share/mise/installs/node/"*/lib/node_modules/tree-sitter-cli; do
      [[ -d "$d" ]] || continue
      native="$d/tree-sitter"
      [[ -e "$native" ]] || continue
      if [[ ! -s "$native" ]] || [[ ! -x "$native" ]]; then
        echo "BROKEN: $native"
        rm -f "$native"
        any_broken=1
      fi
    done
    exit 0
  args:
    executable: /bin/bash
  register: treesitter_mise_cleanup
  changed_when: "'BROKEN' in (treesitter_mise_cleanup.stdout | default(''))"

- name: Compute treesitter_check aggregate
  # Re-install needed if --version failed (no tree-sitter anywhere) OR
  # we just purged a broken mise binary (force npm path to re-download
  # the prebuilt native binary so nvim-treesitter can spawn it).
  ansible.builtin.set_fact:
    treesitter_check:
      rc: >-
        {{ 0 if (treesitter_version_check.rc | default(1) == 0
                 and not treesitter_mise_cleanup.changed)
           else 1 }}

- name: Skip tree-sitter-cli on armv7l (no working node and cargo build too slow)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - treesitter_check.rc != 0
    - target_architecture in ['armv7l', 'armv6l']
  ansible.builtin.debug:
    msg: "tree-sitter-cli skipped on {{ target_architecture }}: no armv7l node prebuilt; cargo build needs libclang and takes 15+ min"

- name: Install tree-sitter-cli via mise npm (Debian/Ubuntu)
  # The npm tarball comes from npmmirror (when useChineseMirror=true), but the
  # postinstall script `node install.js` ALWAYS downloads a prebuilt binary
  # from `https://github.com/tree-sitter/tree-sitter/releases/download/...`
  # which redirects to release-assets.githubusercontent.com (Azure blob CDN).
  # That CDN is frequently unreachable / extremely slow from China, and
  # tree-sitter's install.js has no env-var override for the download URL.
  # Without an outer timeout the whole `chezmoi apply` hangs indefinitely.
  #
  # `timeout 180` exits 124 on timeout → treesitter_npm.rc != 0 → cargo
  # fallback fires (cargo crates.io is mirrored via TUNA when
  # useChineseMirror=true, so cargo path is reliable behind GFW). 180s is
  # enough for a working network (full install ~30s) but bounded enough not
  # to burn the fleet-apply outer budget.
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - treesitter_check.rc != 0
    - target_architecture not in ['armv7l', 'armv6l']
    - not (oldEL | default(false))   # EL7: mise has no node; system node 16 too old
  ansible.builtin.shell: |
    timeout 180 {{ mise_bin }} exec -- npm install -g tree-sitter-cli
  args:
    executable: /bin/bash
  register: treesitter_npm
  changed_when: "'added' in treesitter_npm.stdout or 'added' in treesitter_npm.stderr"
  failed_when: false  # Don't fail the play; downstream cargo task handles it.

# cargo build of tree-sitter-cli requires libclang (via bindgen). Install on
# Debian/Ubuntu when we might fall through to the cargo path.
#
# Why os_family and not ansible_pkg_mgr? On CentOS 7 the ansible-core
# 2.18+ pkg_mgr auto-detection fails (no dnf binary), leaving
# ansible_pkg_mgr undefined. os_family is always populated.
- name: Install libclang-dev for tree-sitter-cli cargo build (Debian/Ubuntu)
  # rc != 0 covers both: regular npm failure AND `timeout` exit 124.
  # `is failed` alone wouldn't catch rc=124 because failed_when: false above.
  when:
    - ansible_facts["os_family"] == "Debian"
    - treesitter_check.rc != 0
    - target_architecture not in ['armv7l', 'armv6l']
    - treesitter_npm.rc | default(1) != 0
  become: true
  tags: [sudo]
  ansible.builtin.apt:
    name: libclang-dev
    state: present
  ignore_errors: true

# RedHat equivalent: `clang-devel` (provides libclang). yum CLI for CentOS 7
# compat — see pitfalls/centos7-ansible-yum-dnf-backend.md.
- name: Install clang-devel for tree-sitter-cli cargo build (RedHat/CentOS)
  when:
    - ansible_facts["os_family"] == "RedHat"
    - treesitter_check.rc != 0
    - target_architecture not in ['armv7l', 'armv6l']
    - treesitter_npm.rc | default(1) != 0
    - not (oldEL | default(false))   # EL7 cargo path skipped — see next task
  become: true
  tags: [sudo]
  ansible.builtin.shell: |
    set -e
    if rpm -q clang-devel >/dev/null 2>&1; then
      echo "ALL_INSTALLED"
      exit 0
    fi
    yum install -y clang-devel
  args:
    executable: /bin/bash
  register: clang_yum_result
  changed_when: "'ALL_INSTALLED' not in clang_yum_result.stdout"
  ignore_errors: true

- name: Notify tree-sitter-cli skipped on CentOS/RHEL 7
  when:
    - oldEL | default(false)
    - treesitter_check.rc != 0
  ansible.builtin.debug:
    msg: >-
      tree-sitter-cli skipped on CentOS/RHEL 7: mise has no managed node
      (glibc 2.17 baseline) and the cargo+bindgen build needs a libclang
      setup not provided by clang-devel on EL7. Install manually if needed:
      enable SCL llvm-toolset-7 and rerun `cargo install tree-sitter-cli`.

- name: Install tree-sitter-cli via cargo (fallback)
  # Triggered when npm install times out or fails. Cargo pulls from
  # crates.io which is TUNA-mirrored when useChineseMirror=true (via
  # ~/.cargo/config.toml sparse index), so this path works behind GFW.
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - treesitter_check.rc != 0
    - target_architecture not in ['armv7l', 'armv6l']
    - treesitter_npm.rc | default(1) != 0
    - not (oldEL | default(false))   # EL7: bindgen can't find libclang
  # Probe `cargo --version`, NOT `command -v cargo`: when a rust install
  # failed half-way (e.g. mise's rust@latest dies on a GFW mirror), the
  # rustup proxy shim at ~/.cargo/bin/cargo still exists but errors with
  # "rustup could not choose a version of cargo to run ... no default is
  # configured". Treat that the same as "no cargo": skip gracefully —
  # the rust_cargo_tools role (runs later, has mirror fallbacks) repairs
  # rust, and the next `chezmoi apply` retries this task.
  ansible.builtin.shell: |
    if cargo --version >/dev/null 2>&1; then
      cargo install tree-sitter-cli
    else
      echo "No working cargo toolchain for tree-sitter-cli (rust missing or rustup has no default toolchain)"
      echo "Will retry on next chezmoi apply once rust is installed; or run manually: cargo install tree-sitter-cli"
      exit 0
    fi
  args:
    executable: /bin/bash
  register: treesitter_cargo
  changed_when: "'No working cargo toolchain' not in (treesitter_cargo.stdout | default(''))"
  ignore_errors: true
