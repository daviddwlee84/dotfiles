---
# Networking CLI tools role
# Tools: nmap, arp-scan, mtr, iperf3, doggo, httpie, gping, trippy, bandwhich, speedtest, rustscan

# =============================================================================
# macOS - all via Homebrew
# =============================================================================

- name: Install networking tools (macOS)
  when: ansible_facts["os_family"] == "Darwin"
  community.general.homebrew:
    name:
      - nmap
      - arp-scan
      - mtr
      - iperf3
      - doggo
      - httpie
      - gping
      - trippy
      - bandwhich
      - rustscan
    state: present

- name: Install Ookla Speedtest CLI (macOS)
  when: ansible_facts["os_family"] == "Darwin"
  block:
    - name: Check if teamookla/speedtest tap is present
      ansible.builtin.command: brew tap
      register: speedtest_taps
      changed_when: false

    - name: Tap teamookla/speedtest
      ansible.builtin.command: brew tap teamookla/speedtest
      when: "'teamookla/speedtest' not in speedtest_taps.stdout_lines"

    - name: Install speedtest
      community.general.homebrew:
        name: speedtest
        state: present

# =============================================================================
# Linux (Debian/Ubuntu)
# =============================================================================

# --- apt packages (system-level) ---
- name: Install networking tools from apt (Debian/Ubuntu)
  when: ansible_facts["os_family"] == "Debian"
  become: true
  tags: [sudo]
  ansible.builtin.apt:
    name:
      - nmap
      - arp-scan
      - mtr
      - iperf3
      - httpie
      - tcpdump
    state: present

# --- Architecture mapping for GitHub release downloads ---
- name: Set networking tools release architecture
  when: ansible_facts["os_family"] == "Debian"
  ansible.builtin.set_fact:
    net_arch_deb: >-
      {{
        'amd64' if target_architecture in ['x86_64', 'amd64']
        else 'arm64' if target_architecture in ['aarch64', 'arm64']
        else target_architecture
      }}

# --- doggo (modern DNS lookup) ---
- name: Check if doggo is installed
  when: ansible_facts["os_family"] == "Debian"
  ansible.builtin.command: doggo --version
  register: doggo_check
  changed_when: false
  failed_when: false

- name: Install doggo from GitHub releases (Debian/Ubuntu)
  when:
    - ansible_facts["os_family"] == "Debian"
    - doggo_check.rc != 0
    - target_architecture in ['x86_64', 'amd64', 'aarch64', 'arm64']
  block:
    - name: Ensure ~/.local/bin exists (doggo)
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        state: directory
        mode: '0755'

    - name: Get latest doggo release
      ansible.builtin.uri:
        url: https://api.github.com/repos/mr-karan/doggo/releases/latest
        return_content: true
      register: doggo_release

    - name: Set doggo version (strip v prefix)
      ansible.builtin.set_fact:
        doggo_version: "{{ doggo_release.json.tag_name | regex_replace('^v', '') }}"

    - name: Set doggo arch mapping
      ansible.builtin.set_fact:
        doggo_arch: >-
          {{
            'x86_64' if target_architecture in ['x86_64', 'amd64']
            else 'arm64' if target_architecture in ['aarch64', 'arm64']
            else target_architecture
          }}

    - name: Download doggo tarball
      ansible.builtin.get_url:
        url: "https://github.com/mr-karan/doggo/releases/download/{{ doggo_release.json.tag_name }}/doggo_{{ doggo_version }}_Linux_{{ doggo_arch }}.tar.gz"
        dest: /tmp/doggo.tar.gz
        mode: '0644'
        timeout: 120
      retries: 3
      delay: 5

    - name: Create doggo temp directory
      ansible.builtin.file:
        path: /tmp/doggo
        state: directory
        mode: '0755'

    - name: Extract doggo
      ansible.builtin.unarchive:
        src: /tmp/doggo.tar.gz
        dest: /tmp/doggo
        remote_src: true

    - name: Find doggo binary
      ansible.builtin.find:
        paths: /tmp/doggo
        patterns: doggo
        file_type: file
        recurse: true
      register: doggo_find

    - name: Fail if doggo binary was not found in extracted archive
      when: doggo_find.matched | default(0) | int == 0
      ansible.builtin.fail:
        msg: "doggo binary was not found under /tmp/doggo after extraction"

    - name: Install doggo to ~/.local/bin
      ansible.builtin.copy:
        src: "{{ doggo_find.files[0].path }}"
        dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/doggo"
        mode: '0755'
        remote_src: true

    - name: Clean up doggo temp files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/doggo.tar.gz
        - /tmp/doggo
        - /tmp/LICENSE
        - /tmp/README.md
  rescue:
    - name: Warn doggo installation failed
      ansible.builtin.debug:
        msg: "doggo installation failed — skipping. Error: {{ ansible_failed_result.msg | default('unknown') }}"

    - name: Clean up doggo temp files (rescue)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/doggo.tar.gz
        - /tmp/doggo

# --- gping (graphical ping) ---
- name: Check if gping is installed
  when: ansible_facts["os_family"] == "Debian"
  ansible.builtin.command: gping --version
  register: gping_check
  changed_when: false
  failed_when: false

- name: Install gping from GitHub releases (Debian/Ubuntu)
  when:
    - ansible_facts["os_family"] == "Debian"
    - gping_check.rc != 0
    - target_architecture in ['x86_64', 'amd64', 'aarch64', 'arm64']
  block:
    - name: Ensure ~/.local/bin exists (gping)
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        state: directory
        mode: '0755'

    - name: Set gping arch mapping
      ansible.builtin.set_fact:
        gping_arch: >-
          {{
            'x86_64' if target_architecture in ['x86_64', 'amd64']
            else 'arm64' if target_architecture in ['aarch64', 'arm64']
            else target_architecture
          }}

    - name: Get latest gping release
      ansible.builtin.uri:
        url: https://api.github.com/repos/orf/gping/releases/latest
        return_content: true
      register: gping_release

    - name: Download gping tarball
      ansible.builtin.get_url:
        url: "https://github.com/orf/gping/releases/download/{{ gping_release.json.tag_name }}/gping-Linux-musl-{{ gping_arch }}.tar.gz"
        dest: /tmp/gping.tar.gz
        mode: '0644'
        timeout: 120
      retries: 3
      delay: 5

    - name: Extract gping to ~/.local/bin
      ansible.builtin.unarchive:
        src: /tmp/gping.tar.gz
        dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        remote_src: true

    - name: Clean up gping tarball
      ansible.builtin.file:
        path: /tmp/gping.tar.gz
        state: absent
  rescue:
    - name: Warn gping installation failed
      ansible.builtin.debug:
        msg: "gping installation failed — skipping. Error: {{ ansible_failed_result.msg | default('unknown') }}"

    - name: Clean up gping temp files (rescue)
      ansible.builtin.file:
        path: /tmp/gping.tar.gz
        state: absent

# --- trippy (TUI traceroute) ---
- name: Check if trippy is installed
  when: ansible_facts["os_family"] == "Debian"
  ansible.builtin.command: trip --version
  register: trippy_check
  changed_when: false
  failed_when: false

- name: Set trippy target mappings
  when:
    - ansible_facts["os_family"] == "Debian"
    - trippy_check.rc != 0
  ansible.builtin.set_fact:
    trippy_gnu_target: >-
      {{
        'x86_64-unknown-linux-gnu' if target_architecture in ['x86_64', 'amd64']
        else 'aarch64-unknown-linux-gnu' if target_architecture in ['aarch64', 'arm64']
        else 'armv7-unknown-linux-gnueabihf' if target_architecture in ['armv7l', 'armv7', 'armhf']
        else ''
      }}
    trippy_musl_target: >-
      {{
        'x86_64-unknown-linux-musl' if target_architecture in ['x86_64', 'amd64']
        else 'aarch64-unknown-linux-musl' if target_architecture in ['aarch64', 'arm64']
        else 'armv7-unknown-linux-musleabihf' if target_architecture in ['armv7l', 'armv7', 'armhf']
        else ''
      }}

- name: Skip trippy on unsupported architecture
  when:
    - ansible_facts["os_family"] == "Debian"
    - trippy_check.rc != 0
    - trippy_gnu_target | trim == '' or trippy_musl_target | trim == ''
  ansible.builtin.debug:
    msg: "trippy skipped: no release for {{ target_architecture }}"

- name: Install trippy from GitHub releases (Debian/Ubuntu, system-level)
  # Use the musl target for parity with the user fallback below: gnu binaries
  # compiled on modern CI can require a glibc newer than Jammy's 2.35 and fail
  # to start. Upstream ships musl builds for x86_64, aarch64, and armv7.
  when:
    - ansible_facts["os_family"] == "Debian"
    - trippy_check.rc != 0
  become: true
  tags: [sudo]
  block:
    - name: Get latest trippy release
      ansible.builtin.uri:
        url: https://api.github.com/repos/fujiapple852/trippy/releases/latest
        return_content: true
      register: trippy_release

    - name: Download trippy tarball (musl)
      ansible.builtin.get_url:
        url: "https://github.com/fujiapple852/trippy/releases/download/{{ trippy_release.json.tag_name }}/trippy-{{ trippy_release.json.tag_name }}-{{ trippy_musl_target }}.tar.gz"
        dest: /tmp/trippy.tar.gz
        mode: '0644'
        timeout: 120
      retries: 3
      delay: 5

    - name: Create trippy temp directory
      ansible.builtin.file:
        path: /tmp/trippy
        state: directory
        mode: '0755'

    - name: Extract trippy
      ansible.builtin.unarchive:
        src: /tmp/trippy.tar.gz
        dest: /tmp/trippy
        remote_src: true

    - name: Find trip binary
      ansible.builtin.find:
        paths: /tmp/trippy
        patterns: trip
        file_type: file
        recurse: true
      register: trippy_find

    - name: Fail if trip binary was not found in extracted archive
      when: trippy_find.matched | default(0) | int == 0
      ansible.builtin.fail:
        msg: "trip binary was not found under /tmp/trippy after extraction"

    - name: Install trip to /usr/local/bin
      ansible.builtin.copy:
        src: "{{ trippy_find.files[0].path }}"
        dest: /usr/local/bin/trip
        mode: '0755'
        remote_src: true

    - name: Clean up trippy temp files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/trippy.tar.gz
        - /tmp/trippy
  rescue:
    - name: Warn trippy installation failed (system-level)
      ansible.builtin.debug:
        msg: "trippy system-level installation failed — skipping. Error: {{ ansible_failed_result.msg | default('unknown') }}"

    - name: Clean up trippy temp files (rescue)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/trippy.tar.gz
        - /tmp/trippy

# --- trippy (user-level fallback) ---
- name: Re-check if trippy is installed
  when: ansible_facts["os_family"] == "Debian"
  ansible.builtin.shell: command -v trip
  register: trippy_recheck
  changed_when: false
  failed_when: false

- name: Install trippy from GitHub releases (user-level, no sudo)
  when:
    - ansible_facts["os_family"] == "Debian"
    - trippy_recheck.rc != 0
  block:
    - name: Ensure ~/.local/bin exists (trippy)
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        state: directory
        mode: '0755'

    - name: Get latest trippy release (user)
      ansible.builtin.uri:
        url: https://api.github.com/repos/fujiapple852/trippy/releases/latest
        return_content: true
      register: trippy_release_user

    - name: Download trippy tarball (user)
      ansible.builtin.get_url:
        url: "https://github.com/fujiapple852/trippy/releases/download/{{ trippy_release_user.json.tag_name }}/trippy-{{ trippy_release_user.json.tag_name }}-{{ trippy_musl_target }}.tar.gz"
        dest: /tmp/trippy.tar.gz
        mode: '0644'
        timeout: 120
      retries: 3
      delay: 5

    - name: Create trippy temp directory (user)
      ansible.builtin.file:
        path: /tmp/trippy-user
        state: directory
        mode: '0755'

    - name: Extract trippy (user)
      ansible.builtin.unarchive:
        src: /tmp/trippy.tar.gz
        dest: /tmp/trippy-user
        remote_src: true

    - name: Find trip binary (user)
      ansible.builtin.find:
        paths: /tmp/trippy-user
        patterns: trip
        file_type: file
        recurse: true
      register: trippy_find_user

    - name: Fail if trip binary was not found in extracted archive (user)
      when: trippy_find_user.matched | default(0) | int == 0
      ansible.builtin.fail:
        msg: "trip binary was not found under /tmp/trippy-user after extraction"

    - name: Install trip to ~/.local/bin
      ansible.builtin.copy:
        src: "{{ trippy_find_user.files[0].path }}"
        dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/trip"
        mode: '0755'
        remote_src: true

    - name: Clean up trippy temp files (user)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/trippy.tar.gz
        - /tmp/trippy-user
  rescue:
    - name: Warn trippy installation failed (user-level)
      ansible.builtin.debug:
        msg: "trippy user-level installation failed — skipping. Error: {{ ansible_failed_result.msg | default('unknown') }}"

    - name: Clean up trippy temp files (user rescue)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/trippy.tar.gz
        - /tmp/trippy-user

# --- bandwhich (bandwidth monitor) ---
- name: Check if bandwhich is installed
  when: ansible_facts["os_family"] == "Debian"
  ansible.builtin.command: bandwhich --version
  register: bandwhich_check
  changed_when: false
  failed_when: false

- name: Install bandwhich from GitHub releases (Debian/Ubuntu)
  when:
    - ansible_facts["os_family"] == "Debian"
    - bandwhich_check.rc != 0
    - target_architecture in ['x86_64', 'amd64', 'aarch64', 'arm64']
  block:
    - name: Ensure ~/.local/bin exists (bandwhich)
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        state: directory
        mode: '0755'

    - name: Get latest bandwhich release
      ansible.builtin.uri:
        url: https://api.github.com/repos/imsnif/bandwhich/releases/latest
        return_content: true
      register: bandwhich_release

    - name: Download bandwhich tarball
      ansible.builtin.get_url:
        url: "https://github.com/imsnif/bandwhich/releases/download/{{ bandwhich_release.json.tag_name }}/bandwhich-{{ bandwhich_release.json.tag_name }}-{{ target_architecture }}-unknown-linux-musl.tar.gz"
        dest: /tmp/bandwhich.tar.gz
        mode: '0644'
        timeout: 120
      retries: 3
      delay: 5

    - name: Extract bandwhich to ~/.local/bin
      ansible.builtin.unarchive:
        src: /tmp/bandwhich.tar.gz
        dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        remote_src: true
        extra_opts:
          - --wildcards
          - bandwhich

    - name: Clean up bandwhich tarball
      ansible.builtin.file:
        path: /tmp/bandwhich.tar.gz
        state: absent
  rescue:
    - name: Warn bandwhich installation failed
      ansible.builtin.debug:
        msg: "bandwhich installation failed — skipping. Error: {{ ansible_failed_result.msg | default('unknown') }}"

    - name: Clean up bandwhich temp files (rescue)
      ansible.builtin.file:
        path: /tmp/bandwhich.tar.gz
        state: absent

# --- Ookla Speedtest CLI ---
- name: Check if speedtest is installed
  when: ansible_facts["os_family"] == "Debian"
  ansible.builtin.command: speedtest --version
  register: speedtest_check
  changed_when: false
  failed_when: false

- name: Install Ookla Speedtest CLI (Debian/Ubuntu)
  when:
    - ansible_facts["os_family"] == "Debian"
    - speedtest_check.rc != 0
  block:
    - name: Ensure ~/.local/bin exists (speedtest)
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        state: directory
        mode: '0755'

    - name: Set speedtest arch mapping
      ansible.builtin.set_fact:
        speedtest_arch: >-
          {{
            'x86_64' if target_architecture in ['x86_64', 'amd64']
            else 'aarch64' if target_architecture in ['aarch64', 'arm64']
            else 'armhf' if target_architecture in ['armv7l', 'armhf']
            else ''
          }}

    - name: Download Ookla Speedtest CLI
      ansible.builtin.get_url:
        url: "https://install.speedtest.net/app/cli/ookla-speedtest-1.2.0-linux-{{ speedtest_arch }}.tgz"
        dest: /tmp/speedtest.tgz
        mode: '0644'
        timeout: 120
      retries: 3
      delay: 5

    - name: Extract speedtest
      ansible.builtin.unarchive:
        src: /tmp/speedtest.tgz
        dest: /tmp
        remote_src: true

    - name: Install speedtest to ~/.local/bin
      ansible.builtin.copy:
        src: /tmp/speedtest
        dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/speedtest"
        mode: '0755'
        remote_src: true

    - name: Clean up speedtest temp files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/speedtest.tgz
        - /tmp/speedtest
        - /tmp/speedtest.md
        - /tmp/speedtest.5

# --- rustscan (fast port scanner) ---
- name: Check if rustscan is installed
  when: ansible_facts["os_family"] == "Debian"
  ansible.builtin.command: rustscan --version
  register: rustscan_check
  changed_when: false
  failed_when: false

- name: Install rustscan from GitHub releases (Debian/Ubuntu)
  when:
    - ansible_facts["os_family"] == "Debian"
    - rustscan_check.rc != 0
  block:
    - name: Ensure ~/.local/bin exists (rustscan)
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        state: directory
        mode: '0755'

    - name: Set rustscan arch mapping
      ansible.builtin.set_fact:
        rustscan_arch: >-
          {{
            'x86_64' if target_architecture in ['x86_64', 'amd64']
            else 'aarch64' if target_architecture in ['aarch64', 'arm64']
            else target_architecture
          }}

    - name: Download rustscan archive (x86_64)
      when: rustscan_arch == 'x86_64'
      ansible.builtin.get_url:
        url: "https://github.com/RustScan/RustScan/releases/latest/download/x86_64-linux-rustscan.tar.gz.zip"
        dest: /tmp/rustscan.zip
        mode: '0644'
        timeout: 120
      retries: 3
      delay: 5

    - name: Download rustscan archive (aarch64)
      when: rustscan_arch == 'aarch64'
      ansible.builtin.get_url:
        url: "https://github.com/RustScan/RustScan/releases/latest/download/aarch64-linux-rustscan.zip"
        dest: /tmp/rustscan.zip
        mode: '0644'
        timeout: 120
      retries: 3
      delay: 5

    - name: Extract and install rustscan (x86_64 - double wrapped)
      when: rustscan_arch == 'x86_64'
      ansible.builtin.shell: |
        set -e
        cd /tmp
        python3 -m zipfile -e rustscan.zip .
        tar xzf x86_64-linux-rustscan.tar.gz
        cp rustscan "{{ ansible_facts['env']['HOME'] }}/.local/bin/rustscan"
        chmod 0755 "{{ ansible_facts['env']['HOME'] }}/.local/bin/rustscan"
      args:
        executable: /bin/bash
      changed_when: true

    - name: Extract and install rustscan (aarch64)
      when: rustscan_arch == 'aarch64'
      ansible.builtin.shell: |
        set -e
        cd /tmp
        python3 -m zipfile -e rustscan.zip .
        cp rustscan "{{ ansible_facts['env']['HOME'] }}/.local/bin/rustscan"
        chmod 0755 "{{ ansible_facts['env']['HOME'] }}/.local/bin/rustscan"
      args:
        executable: /bin/bash
      changed_when: true

    - name: Clean up rustscan temp files
      ansible.builtin.shell: |
        rm -f /tmp/rustscan.zip /tmp/rustscan /tmp/x86_64-linux-rustscan.tar.gz /tmp/aarch64-linux-rustscan
      args:
        executable: /bin/bash
      changed_when: false
  rescue:
    - name: Warn rustscan installation failed
      ansible.builtin.debug:
        msg: "rustscan installation failed — skipping. Error: {{ ansible_failed_result.msg | default('unknown') }}"

    - name: Clean up rustscan temp files (rescue)
      ansible.builtin.shell: |
        rm -f /tmp/rustscan.zip /tmp/rustscan /tmp/x86_64-linux-rustscan.tar.gz /tmp/aarch64-linux-rustscan
      args:
        executable: /bin/bash
      changed_when: false
