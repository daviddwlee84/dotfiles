# --- rustscan (fast port scanner) ---
- name: Check if rustscan is installed
  when: ansible_facts["os_family"] in ["Debian", "RedHat"]
  ansible.builtin.command: rustscan --version
  register: rustscan_check
  changed_when: false
  failed_when: false

- name: Install rustscan from GitHub releases (Debian/Ubuntu)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - rustscan_check.rc != 0
  block:
    - name: Ensure ~/.local/bin exists (rustscan)
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        state: directory
        mode: '0755'

    - name: Set rustscan arch mapping
      ansible.builtin.set_fact:
        rustscan_arch: >-
          {{
            'x86_64' if target_architecture in ['x86_64', 'amd64']
            else 'aarch64' if target_architecture in ['aarch64', 'arm64']
            else target_architecture
          }}

    - name: Download rustscan archive (x86_64)
      when: rustscan_arch == 'x86_64'
      ansible.builtin.get_url:
        url: "https://github.com/RustScan/RustScan/releases/latest/download/x86_64-linux-rustscan.tar.gz.zip"
        dest: /tmp/rustscan.zip
        mode: '0644'
        timeout: 120
      retries: 3
      delay: 5

    - name: Download rustscan archive (aarch64)
      when: rustscan_arch == 'aarch64'
      ansible.builtin.get_url:
        url: "https://github.com/RustScan/RustScan/releases/latest/download/aarch64-linux-rustscan.zip"
        dest: /tmp/rustscan.zip
        mode: '0644'
        timeout: 120
      retries: 3
      delay: 5

    - name: Extract and install rustscan (x86_64 - double wrapped)
      when: rustscan_arch == 'x86_64'
      ansible.builtin.shell: |
        set -e
        cd /tmp
        python3 -m zipfile -e rustscan.zip .
        tar xzf x86_64-linux-rustscan.tar.gz
        cp rustscan "{{ ansible_facts['env']['HOME'] }}/.local/bin/rustscan"
        chmod 0755 "{{ ansible_facts['env']['HOME'] }}/.local/bin/rustscan"
      args:
        executable: /bin/bash
      changed_when: true

    - name: Extract and install rustscan (aarch64)
      when: rustscan_arch == 'aarch64'
      ansible.builtin.shell: |
        set -e
        cd /tmp
        python3 -m zipfile -e rustscan.zip .
        cp rustscan "{{ ansible_facts['env']['HOME'] }}/.local/bin/rustscan"
        chmod 0755 "{{ ansible_facts['env']['HOME'] }}/.local/bin/rustscan"
      args:
        executable: /bin/bash
      changed_when: true

    - name: Clean up rustscan temp files
      ansible.builtin.shell: |
        rm -f /tmp/rustscan.zip /tmp/rustscan /tmp/x86_64-linux-rustscan.tar.gz /tmp/aarch64-linux-rustscan
      args:
        executable: /bin/bash
      changed_when: false
  rescue:
    - name: Warn rustscan installation failed
      ansible.builtin.debug:
        msg: "rustscan installation failed — skipping. Error: {{ ansible_failed_result.msg | default('unknown') }}"

    - name: Clean up rustscan temp files (rescue)
      ansible.builtin.shell: |
        rm -f /tmp/rustscan.zip /tmp/rustscan /tmp/x86_64-linux-rustscan.tar.gz /tmp/aarch64-linux-rustscan
      args:
        executable: /bin/bash
      changed_when: false

# =============================================================================
# Tunnel tools — ngrok + cloudflared
# Tags: tunnel_tools (gated by installTunnelTools chezmoi flag)
# =============================================================================

# --- ngrok ---

- name: Install ngrok (macOS)
  tags: [tunnel_tools]
  when: ansible_facts["os_family"] == "Darwin"
  block:
    # Skip the install when the binary is already on PATH — ngrok cask downloads
    # from bin.ngrok.com which periodically returns HTTP 52 "empty reply from
    # server" (Heroku-fronted, transient). Pre-checking lets re-applies short-
    # circuit instead of paying a 1-2 min download attempt that may fail.
    - name: Check if ngrok is already installed (macOS)
      ansible.builtin.command: which ngrok
      register: ngrok_present_macos
      changed_when: false
      failed_when: false

    - name: Install ngrok via Homebrew (with retries for flaky bin.ngrok.com CDN)
      when: ngrok_present_macos.rc != 0
      community.general.homebrew:
        name: ngrok
        state: present
      register: ngrok_brew_install
      until: ngrok_brew_install is succeeded
      retries: 3
      delay: 15

  rescue:
    # Most common failure: `Download failed: ... curl: (52) Empty reply from
    # server` from bin.ngrok.com (Heroku CDN). Transient — retrying minutes
    # later usually works. We don't fail the whole apply over it; user can
    # re-run `chezmoi apply --tag tunnel_tools` or `brew install --cask ngrok`
    # later. See pitfalls/ngrok-cask-download-flaky.md for the full story.
    - name: Warn ngrok installation failed (macOS)
      ansible.builtin.debug:
        msg: |-
          ngrok macOS installation failed after 3 retries — skipping. Re-run
          `brew install --cask ngrok` later. Error: {{ ansible_failed_result.msg | default('unknown') }}

- name: Install ngrok (Debian/Ubuntu)
  tags: [tunnel_tools]
  when: ansible_facts["os_family"] == "Debian"
  block:
    - name: Check if ngrok is installed
      ansible.builtin.command: ngrok version
      register: ngrok_check
      changed_when: false
      failed_when: false

    - name: Install ngrok via official apt repo (Debian/Ubuntu)
      when: ngrok_check.rc != 0
      become: true
      tags: [sudo]
      block:
        - name: Download ngrok apt GPG key
          ansible.builtin.get_url:
            url: https://ngrok-agent.s3.amazonaws.com/ngrok.asc
            dest: /tmp/ngrok.asc
            timeout: 60

        - name: Install ngrok GPG key
          ansible.builtin.shell: |
            gpg --dearmor < /tmp/ngrok.asc > /etc/apt/keyrings/ngrok.gpg
            chmod 0644 /etc/apt/keyrings/ngrok.gpg
          args:
            creates: /etc/apt/keyrings/ngrok.gpg

        - name: Add ngrok apt source
          ansible.builtin.copy:
            content: "deb [signed-by=/etc/apt/keyrings/ngrok.gpg] https://ngrok-agent.s3.amazonaws.com buster main\n"
            dest: /etc/apt/sources.list.d/ngrok.list
            mode: '0644'

        - name: Install ngrok from apt
          ansible.builtin.apt:
            name: ngrok
            update_cache: true
            state: present

    - name: Re-check ngrok after apt install
      ansible.builtin.command: ngrok version
      register: ngrok_recheck
      changed_when: false
      failed_when: false

    - name: Install ngrok from tgz (user-level fallback)
      when: ngrok_recheck.rc != 0
      block:
        - name: Set ngrok tgz architecture
          ansible.builtin.set_fact:
            ngrok_tgz_arch: >-
              {{ 'amd64' if target_architecture in ['x86_64', 'amd64']
                 else 'arm64' if target_architecture in ['aarch64', 'arm64']
                 else '' }}

        - name: Ensure ~/.local/bin exists
          ansible.builtin.file:
            path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
            state: directory
            mode: '0755'

        - name: Download ngrok tgz (user-level)
          ansible.builtin.get_url:
            url: "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-{{ ngrok_tgz_arch }}.tgz"
            dest: /tmp/ngrok.tgz
            timeout: 120
          when: ngrok_tgz_arch != ''

        - name: Extract and install ngrok (user-level)
          ansible.builtin.shell: |
            set -e
            tar -xzf /tmp/ngrok.tgz -C /tmp/
            install -m 0755 /tmp/ngrok "{{ ansible_facts['env']['HOME'] }}/.local/bin/ngrok"
          args:
            executable: /bin/bash
            creates: "{{ ansible_facts['env']['HOME'] }}/.local/bin/ngrok"
          changed_when: true

        - name: Clean up ngrok tgz
          ansible.builtin.file:
            path: /tmp/ngrok.tgz
            state: absent

  rescue:
    - name: Warn ngrok installation failed
      ansible.builtin.debug:
        msg: "ngrok installation failed — skipping. Error: {{ ansible_failed_result.msg | default('unknown') }}"

    - name: Clean up ngrok temp files (rescue)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/ngrok.tgz
        - /tmp/ngrok
        - /tmp/ngrok.asc

- name: Install ngrok (RedHat/CentOS — tgz user-level)
  tags: [tunnel_tools]
  when: ansible_facts["os_family"] == "RedHat"
  block:
    - name: Check if ngrok is installed (RedHat)
      ansible.builtin.command: ngrok version
      register: ngrok_rh_check
      changed_when: false
      failed_when: false

    - name: Set ngrok tgz architecture (RedHat)
      when: ngrok_rh_check.rc != 0
      ansible.builtin.set_fact:
        ngrok_rh_arch: >-
          {{ 'amd64' if target_architecture in ['x86_64', 'amd64']
             else 'arm64' if target_architecture in ['aarch64', 'arm64']
             else '' }}

    - name: Ensure ~/.local/bin exists (RedHat)
      when: ngrok_rh_check.rc != 0 and ngrok_rh_arch | default('') != ''
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        state: directory
        mode: '0755'

    - name: Download and install ngrok tgz (RedHat)
      when: ngrok_rh_check.rc != 0 and ngrok_rh_arch | default('') != ''
      ansible.builtin.shell: |
        set -e
        curl -fsSL "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-{{ ngrok_rh_arch }}.tgz" -o /tmp/ngrok.tgz
        tar -xzf /tmp/ngrok.tgz -C /tmp/
        install -m 0755 /tmp/ngrok "{{ ansible_facts['env']['HOME'] }}/.local/bin/ngrok"
        rm -f /tmp/ngrok.tgz /tmp/ngrok
      args:
        executable: /bin/bash
        creates: "{{ ansible_facts['env']['HOME'] }}/.local/bin/ngrok"
      changed_when: true

  rescue:
    - name: Warn ngrok installation failed (RedHat)
      ansible.builtin.debug:
        msg: "ngrok installation failed on RedHat — skipping."

    - name: Clean up ngrok temp files (RedHat rescue)
      ansible.builtin.shell: rm -f /tmp/ngrok.tgz /tmp/ngrok
      args:
        executable: /bin/bash
      changed_when: false

# --- cloudflared ---

- name: Install cloudflared (macOS)
  tags: [tunnel_tools]
  when: ansible_facts["os_family"] == "Darwin"
  community.general.homebrew:
    name: cloudflared
    state: present

- name: Install cloudflared (Debian/Ubuntu)
  tags: [tunnel_tools]
  when: ansible_facts["os_family"] == "Debian"
  block:
    - name: Check if cloudflared is installed
      ansible.builtin.command: cloudflared version
      register: cf_check
      changed_when: false
      failed_when: false

    - name: Set cloudflared deb architecture
      when: cf_check.rc != 0
      ansible.builtin.set_fact:
        cf_deb_arch: >-
          {{ 'amd64' if target_architecture in ['x86_64', 'amd64']
             else 'arm64' if target_architecture in ['aarch64', 'arm64']
             else 'arm' if target_architecture in ['armv7l', 'armhf']
             else '' }}

    - name: Install cloudflared .deb (system-level)
      when: cf_check.rc != 0 and cf_deb_arch | default('') != ''
      become: true
      tags: [sudo]
      block:
        - name: Get latest cloudflared release info
          ansible.builtin.uri:
            url: https://api.github.com/repos/cloudflare/cloudflared/releases/latest
            return_content: true
            timeout: 30
          register: cf_release
          retries: 3
          delay: 5
          until: cf_release is succeeded

        - name: Download cloudflared .deb
          ansible.builtin.get_url:
            url: "https://github.com/cloudflare/cloudflared/releases/download/{{ cf_release.json.tag_name }}/cloudflared-linux-{{ cf_deb_arch }}.deb"
            dest: /tmp/cloudflared.deb
            timeout: 120

        - name: Install cloudflared .deb
          ansible.builtin.apt:
            deb: /tmp/cloudflared.deb
            state: present

        - name: Clean up cloudflared .deb
          ansible.builtin.file:
            path: /tmp/cloudflared.deb
            state: absent

    - name: Re-check cloudflared after deb install
      ansible.builtin.command: cloudflared version
      register: cf_recheck
      changed_when: false
      failed_when: false

    - name: Install cloudflared binary (user-level fallback)
      when: cf_recheck.rc != 0 and cf_deb_arch | default('') != ''
      block:
        - name: Ensure ~/.local/bin exists
          ansible.builtin.file:
            path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
            state: directory
            mode: '0755'

        - name: Get latest cloudflared release info (fallback)
          ansible.builtin.uri:
            url: https://api.github.com/repos/cloudflare/cloudflared/releases/latest
            return_content: true
            timeout: 30
          register: cf_release_fb
          retries: 3
          delay: 5
          until: cf_release_fb is succeeded

        - name: Download cloudflared binary (user-level)
          ansible.builtin.get_url:
            url: "https://github.com/cloudflare/cloudflared/releases/download/{{ cf_release_fb.json.tag_name }}/cloudflared-linux-{{ cf_deb_arch }}"
            dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/cloudflared"
            mode: '0755'
            timeout: 120

  rescue:
    - name: Warn cloudflared installation failed
      ansible.builtin.debug:
        msg: "cloudflared installation failed — skipping. Error: {{ ansible_failed_result.msg | default('unknown') }}"

    - name: Clean up cloudflared temp files (rescue)
      ansible.builtin.file:
        path: /tmp/cloudflared.deb
        state: absent

- name: Install cloudflared (RedHat/CentOS — rpm)
  tags: [tunnel_tools]
  when: ansible_facts["os_family"] == "RedHat"
  block:
    - name: Check if cloudflared is installed (RedHat)
      ansible.builtin.command: cloudflared version
      register: cf_rh_check
      changed_when: false
      failed_when: false

    - name: Set cloudflared rpm architecture (RedHat)
      when: cf_rh_check.rc != 0
      ansible.builtin.set_fact:
        cf_rpm_arch: >-
          {{ 'x86_64' if target_architecture in ['x86_64', 'amd64']
             else 'aarch64' if target_architecture in ['aarch64', 'arm64']
             else '' }}

    - name: Get latest cloudflared release info (RedHat)
      when: cf_rh_check.rc != 0 and cf_rpm_arch | default('') != ''
      ansible.builtin.uri:
        url: https://api.github.com/repos/cloudflare/cloudflared/releases/latest
        return_content: true
        timeout: 30
      register: cf_rh_release
      retries: 3
      delay: 5
      until: cf_rh_release is succeeded

    - name: Install cloudflared .rpm (system-level)
      when: cf_rh_check.rc != 0 and cf_rpm_arch | default('') != ''
      become: true
      tags: [sudo]
      block:
        - name: Download cloudflared .rpm
          ansible.builtin.get_url:
            url: "https://github.com/cloudflare/cloudflared/releases/download/{{ cf_rh_release.json.tag_name }}/cloudflared-linux-{{ cf_rpm_arch }}.rpm"
            dest: /tmp/cloudflared.rpm
            timeout: 120

        - name: Install cloudflared .rpm
          ansible.builtin.shell: |
            rpm -i --force /tmp/cloudflared.rpm
          args:
            executable: /bin/bash
          changed_when: true

        - name: Clean up cloudflared .rpm
          ansible.builtin.file:
            path: /tmp/cloudflared.rpm
            state: absent

  rescue:
    - name: Warn cloudflared installation failed (RedHat)
      ansible.builtin.debug:
        msg: "cloudflared installation failed on RedHat — skipping."

    - name: Clean up cloudflared temp files (RedHat rescue)
      ansible.builtin.file:
        path: /tmp/cloudflared.rpm
        state: absent

# =============================================================================
# Tailscale (WireGuard mesh VPN)
# Tags: tailscale (gated by the installTailscale chezmoi flag)
#
# macOS is DELIBERATELY absent. The `tailscale-app` cask (Brewfile.darwin) ships
# the GUI, the daemon (a system extension) AND the /usr/local/bin/tailscale
# wrapper. Never add the `tailscale` brew FORMULA — it fights the cask over that
# same path on every upgrade and ships a redundant tailscaled.
# See docs/tools/Tailscale.md and
# pitfalls/tailscale-another-copy-app-store-leftover.md.
#
# Install-only, per the repo's install-vs-upgrade split: `tailscale up` and
# `tailscale set --operator=` both need an interactive login / sudo and stay
# manual. The `tsnet` CLI's preflight prints the same two commands.
# =============================================================================

- name: Check if tailscale is installed
  when: ansible_facts["os_family"] in ["Debian", "RedHat"]
  tags: [tailscale]
  ansible.builtin.command: tailscale version
  register: tailscale_check
  changed_when: false
  failed_when: false
  check_mode: false   # read-only probe; must run even during --check

# pkgs.tailscale.com is laid out per-distro, and the suite is the distro
# codename — so a derivative whose codename is not an upstream suite (Mint's
# "vanessa", Pop!_OS, …) would 404 on the key or index an empty repo. Rather
# than guess a base, those fall through to the unsupported branch below with a
# pointer at the official installer, which does the derivative mapping itself.
- name: Resolve the Tailscale repo distro name
  when: ansible_facts["os_family"] in ["Debian", "RedHat"]
  tags: [tailscale]
  ansible.builtin.set_fact:
    tailscale_distro: "{{ _ts_distro_map.get(ansible_facts['distribution'], '') }}"
  vars:
    _ts_distro_map:
      Ubuntu: ubuntu
      Debian: debian
      Raspbian: raspbian
      Fedora: fedora
      CentOS: centos
      Rocky: centos
      AlmaLinux: centos
      RedHat: rhel

- name: Warn that this distribution has no first-party Tailscale repo
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - tailscale_check.rc | default(1) != 0
    - tailscale_distro | default('') == ''
  tags: [tailscale]
  ansible.builtin.debug:
    msg: >-
      No first-party Tailscale repo for {{ ansible_facts['distribution'] }}
      ({{ ansible_facts['distribution_release'] | default('?') }}) — skipping.
      Install by hand: curl -fsSL https://tailscale.com/install.sh | sh

- name: Install Tailscale (Debian/Ubuntu)
  when:
    - ansible_facts["os_family"] == "Debian"
    - tailscale_check.rc | default(1) != 0
    - tailscale_distro | default('') != ''
  tags: [tailscale]
  block:
    - name: Install Tailscale apt repo + package
      become: true
      tags: [sudo]
      block:
        - name: Download Tailscale signing key
          ansible.builtin.get_url:
            url: "https://pkgs.tailscale.com/stable/{{ tailscale_distro }}/{{ ansible_facts['distribution_release'] }}.noarmor.gpg"
            dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
            mode: "0644"
            timeout: 60

        - name: Add Tailscale apt repository (deb822)
          ansible.builtin.deb822_repository:
            name: tailscale
            types: deb
            uris: "https://pkgs.tailscale.com/stable/{{ tailscale_distro }}"
            suites: "{{ ansible_facts['distribution_release'] }}"
            components: main
            signed_by: /usr/share/keyrings/tailscale-archive-keyring.gpg

        # Refresh ONLY the Tailscale source — same reasoning as the Steam block
        # in gui_apps_linux (whose comment already names tailscale as one of the
        # third-party sources that makes an unscoped `apt-get update` flaky).
        # A sibling source failing must not leave the just-added Tailscale repo
        # unindexed. No ansible.builtin.apt equivalent can target one source.
        - name: Refresh apt cache for the Tailscale source only
          ansible.builtin.command:
            cmd: >-
              apt-get update
              -o Dir::Etc::sourcelist=sources.list.d/tailscale.sources
              -o Dir::Etc::sourceparts=-
              -o APT::Get::List-Cleanup=0
          changed_when: false

        - name: Install tailscale
          ansible.builtin.apt:
            name: tailscale
            state: present
            update_cache: false
  rescue:
    - name: Remove Tailscale apt repository (install failed; avoid a broken source)
      become: true
      tags: [sudo]
      ansible.builtin.deb822_repository:
        name: tailscale
        state: absent
      ignore_errors: true

    - name: Warn Tailscale install failed (Debian)
      ansible.builtin.debug:
        msg: >-
          Tailscale install failed — skipping. Manual fallback:
          curl -fsSL https://tailscale.com/install.sh | sh

- name: Install Tailscale (RedHat)
  when:
    - ansible_facts["os_family"] == "RedHat"
    - tailscale_check.rc | default(1) != 0
    - tailscale_distro | default('') != ''
  tags: [tailscale]
  block:
    - name: Add Tailscale yum repo + install
      become: true
      tags: [sudo]
      block:
        # Fedora's repo file is unversioned; the EL family (centos/rhel) nests
        # under the major version.
        - name: Add Tailscale yum repository
          ansible.builtin.get_url:
            url: >-
              https://pkgs.tailscale.com/stable/{{ tailscale_distro }}/{{
              '' if tailscale_distro == 'fedora'
              else ansible_facts['distribution_major_version'] + '/'
              }}tailscale.repo
            dest: /etc/yum.repos.d/tailscale.repo
            mode: "0644"
            timeout: 60

        - name: Install tailscale (RedHat)
          ansible.builtin.package:
            name: tailscale
            state: present
  rescue:
    - name: Warn Tailscale install failed (RedHat)
      ansible.builtin.debug:
        msg: >-
          Tailscale installation failed on RedHat — skipping. Manual fallback:
          curl -fsSL https://tailscale.com/install.sh | sh

# Re-probe rather than assuming success. The Debian/RedHat blocks both have a
# `rescue:` that swallows a failed install (by design — a broken apt source must
# not fail the whole play), so without this gate the "Tailscale installed"
# message below prints even when the install just failed. Verified: a run whose
# install died on `sudo: a password is required` still claimed success.
- name: Re-check tailscale after the install attempt
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - tailscale_check.rc | default(1) != 0
    - tailscale_distro | default('') != ''
  tags: [tailscale]
  ansible.builtin.command: tailscale version
  register: tailscale_post
  changed_when: false
  failed_when: false
  check_mode: false   # read-only probe; must run even during --check

# The two steps ansible deliberately does NOT take. Printed with the exact
# strings `tsnet doctor` prints, so a user who hits the preflight later
# recognises them.
- name: Tailscale post-install manual steps
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - tailscale_check.rc | default(1) != 0
    - tailscale_distro | default('') != ''
    - tailscale_post.rc | default(1) == 0
  tags: [tailscale]
  ansible.builtin.debug:
    msg: |-
      Tailscale installed. Two manual steps remain (interactive / need sudo):
        sudo tailscale up                      # browser login, joins the tailnet
        sudo tailscale set --operator=$USER    # lets `tsnet serve` run without sudo
      Then: tsnet doctor
