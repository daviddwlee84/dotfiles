---
# Networking CLI tools role
# Tools: nmap, arp-scan, mtr, iperf3, doggo, httpie, gping, trippy, bandwhich, speedtest, rustscan

# =============================================================================
# macOS - all via Homebrew
# =============================================================================

- name: Install networking tools (macOS)
  when: ansible_facts["os_family"] == "Darwin"
  community.general.homebrew:
    name:
      - nmap
      - arp-scan
      - mtr
      - iperf3
      - doggo
      - httpie
      - gping
      - trippy
      - bandwhich
      - rustscan
      - wakeonlan
    state: present

- name: Install Ookla Speedtest CLI (macOS)
  when: ansible_facts["os_family"] == "Darwin"
  block:
    - name: Check if teamookla/speedtest tap is present
      ansible.builtin.command: brew tap
      register: speedtest_taps
      changed_when: false

    - name: Tap teamookla/speedtest
      ansible.builtin.command: brew tap teamookla/speedtest
      when: "'teamookla/speedtest' not in speedtest_taps.stdout_lines"

    - name: Check trust state of teamookla/speedtest tap (Homebrew >= 6.0 trust gate)
      ansible.builtin.command: brew tap-info teamookla/speedtest
      register: speedtest_tap_info
      changed_when: false
      failed_when: false

    - name: Trust teamookla/speedtest tap when Homebrew marks it untrusted
      when: "'Untrusted' in speedtest_tap_info.stdout"
      ansible.builtin.command: brew trust teamookla/speedtest
      changed_when: true

    - name: Install speedtest
      community.general.homebrew:
        name: speedtest
        state: present

# =============================================================================
# Linux (Debian/Ubuntu)
# =============================================================================

# --- system-level packages (apt) ---
- name: Install networking tools from apt (Debian/Ubuntu)
  when: ansible_facts["os_family"] == "Debian"
  become: true
  tags: [sudo]
  ansible.builtin.apt:
    name:
      - nmap
      - arp-scan
      - mtr
      - iperf3
      - httpie
      - tcpdump
      - wakeonlan
    state: present

# --- system-level packages (yum/CentOS 7+) ---
# yum CLI for CentOS 7 compat — see pitfalls/centos7-ansible-yum-dnf-backend.md
- name: Install networking tools from yum (RedHat/CentOS) — yum CLI for CentOS 7 + Rocky/Alma compat
  when: ansible_facts["os_family"] == "RedHat"
  become: true
  tags: [sudo]
  ansible.builtin.shell: |
    set -e
    missing=()
    for p in nmap arp-scan mtr iperf3 tcpdump; do
      rpm -q "$p" >/dev/null 2>&1 || missing+=("$p")
    done
    # NOTE: httpie is in EPEL on CentOS 7 and pip-installed via uv elsewhere
    # if missing, so we skip it here to avoid hard-requiring EPEL.
    if [ -z "${missing[*]:-}" ]; then
      echo "ALL_INSTALLED"
      exit 0
    fi
    yum install -y "${missing[@]}"
  args:
    executable: /bin/bash
  register: networking_yum_result
  changed_when: "'ALL_INSTALLED' not in networking_yum_result.stdout"
  ignore_errors: true

# --- Architecture mapping for GitHub release downloads ---
- name: Set networking tools release architecture
  when: ansible_facts["os_family"] in ["Debian", "RedHat"]
  ansible.builtin.set_fact:
    net_arch_deb: >-
      {{
        'amd64' if target_architecture in ['x86_64', 'amd64']
        else 'arm64' if target_architecture in ['aarch64', 'arm64']
        else target_architecture
      }}

# --- doggo (modern DNS lookup) ---
- name: Check if doggo is installed
  when: ansible_facts["os_family"] in ["Debian", "RedHat"]
  ansible.builtin.command: doggo --version
  register: doggo_check
  changed_when: false
  failed_when: false

- name: Install doggo from GitHub releases (Debian/Ubuntu)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - doggo_check.rc != 0
    - target_architecture in ['x86_64', 'amd64', 'aarch64', 'arm64']
  block:
    - name: Ensure ~/.local/bin exists (doggo)
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        state: directory
        mode: '0755'

    - name: Get latest doggo release
      ansible.builtin.uri:
        url: https://api.github.com/repos/mr-karan/doggo/releases/latest
        return_content: true
      register: doggo_release

    - name: Set doggo version (strip v prefix)
      ansible.builtin.set_fact:
        doggo_version: "{{ doggo_release.json.tag_name | regex_replace('^v', '') }}"

    - name: Set doggo arch mapping
      ansible.builtin.set_fact:
        doggo_arch: >-
          {{
            'x86_64' if target_architecture in ['x86_64', 'amd64']
            else 'arm64' if target_architecture in ['aarch64', 'arm64']
            else target_architecture
          }}

    - name: Download doggo tarball
      ansible.builtin.get_url:
        url: "https://github.com/mr-karan/doggo/releases/download/{{ doggo_release.json.tag_name }}/doggo_{{ doggo_version }}_Linux_{{ doggo_arch }}.tar.gz"
        dest: /tmp/doggo.tar.gz
        mode: '0644'
        timeout: 120
      retries: 3
      delay: 5

    - name: Create doggo temp directory
      ansible.builtin.file:
        path: /tmp/doggo
        state: directory
        mode: '0755'

    - name: Extract doggo
      ansible.builtin.unarchive:
        src: /tmp/doggo.tar.gz
        dest: /tmp/doggo
        remote_src: true

    - name: Find doggo binary
      ansible.builtin.find:
        paths: /tmp/doggo
        patterns: doggo
        file_type: file
        recurse: true
      register: doggo_find

    - name: Fail if doggo binary was not found in extracted archive
      when: doggo_find.matched | default(0) | int == 0
      ansible.builtin.fail:
        msg: "doggo binary was not found under /tmp/doggo after extraction"

    - name: Install doggo to ~/.local/bin
      ansible.builtin.copy:
        src: "{{ doggo_find.files[0].path }}"
        dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/doggo"
        mode: '0755'
        remote_src: true

    - name: Clean up doggo temp files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/doggo.tar.gz
        - /tmp/doggo
        - /tmp/LICENSE
        - /tmp/README.md
  rescue:
    - name: Warn doggo installation failed
      ansible.builtin.debug:
        msg: "doggo installation failed — skipping. Error: {{ ansible_failed_result.msg | default('unknown') }}"

    - name: Clean up doggo temp files (rescue)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/doggo.tar.gz
        - /tmp/doggo

