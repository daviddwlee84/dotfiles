---
# Coding Agents Installation
# Installs various AI coding assistants and companion tools
# All installations include idempotency checks to avoid slow reinstalls

# === Notification Tools (from claude_deps) ===

# macOS - terminal-notifier
- name: Install terminal-notifier (macOS)
  when: ansible_facts["os_family"] == "Darwin"
  community.general.homebrew:
    name: terminal-notifier
    state: present

# Linux - libnotify-bin (provides notify-send). apt-only because the sister
# RedHat package is `libnotify` (different name) and rarely needed on
# headless servers — skip on RedHat without a yum fallback. Rocky/Alma
# users who need notify-send can `sudo yum install libnotify` manually.
#
# Why os_family and not ansible_pkg_mgr? On CentOS 7 the ansible-core
# 2.18+ pkg_mgr auto-detection fails (no dnf binary), leaving
# ansible_pkg_mgr undefined. os_family is always populated.
- name: Install libnotify-bin (Debian/Ubuntu)
  when: ansible_facts["os_family"] == "Debian"
  become: true
  tags: [sudo]
  ansible.builtin.apt:
    name: libnotify-bin
    state: present

# === Claude Code ===

- name: Check if Claude Code is installed (macOS)
  when: ansible_facts["os_family"] == "Darwin"
  ansible.builtin.command: which claude
  register: claude_macos_check
  changed_when: false
  failed_when: false

- name: Install Claude Code (macOS)
  when:
    - ansible_facts["os_family"] == "Darwin"
    - claude_macos_check.rc != 0
  community.general.homebrew_cask:
    name: claude-code
    state: present

- name: Check if Claude Code is installed (Linux)
  when: ansible_facts["os_family"] in ["Debian", "RedHat"]
  ansible.builtin.command: which claude
  register: claude_check
  changed_when: false
  failed_when: false

- name: Skip Claude Code on unsupported architecture (Linux)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - claude_check.rc != 0
    - target_architecture not in ['x86_64', 'amd64', 'aarch64', 'arm64']
  ansible.builtin.debug:
    msg: "Claude Code skipped: install.sh downloads arm64/amd64 binaries; no build for {{ target_architecture }}"

- name: Install Claude Code (Linux)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - claude_check.rc != 0
    - target_architecture in ['x86_64', 'amd64', 'aarch64', 'arm64']
  ansible.builtin.shell: |
    curl -fsSL https://claude.ai/install.sh | bash
  args:
    creates: "{{ ansible_facts['env']['HOME'] }}/.claude/local/bin/claude"

# === OpenCode ===
# Cross-platform: use the official installer everywhere. We dropped the macOS
# Homebrew path (anomalyco/tap formula) because:
#   1. The formula version lags the official releases (was stuck at 1.14.48
#      when 1.15.10 was out), with extra latency on Chinese brew mirrors.
#   2. The Homebrew install pins the version in the Cellar dir, so OpenCode's
#      built-in `opencode upgrade` / Update Available prompt cannot actually
#      swap binaries — every restart still showed the old version, even after
#      "Confirm".
# Both platforms now land at ~/.opencode/bin/opencode (already prepended to
# PATH by dot_config/shell/00_exports.sh.tmpl), so `opencode upgrade` works
# natively and the explicit upgrade path in scripts/upgrade_tools.sh's
# cat_agents() keeps doing the right thing on macOS too.
#
# SHELL MUTATION (same gotcha as the Antigravity CLI block above): the
# upstream installer appends `export PATH=...opencode/bin:$PATH` to ~/.zshrc
# / ~/.bashrc by default. Those files are chezmoi-managed and PATH is
# already exported by dot_config/shell/00_exports.sh.tmpl, so we pass
# `--no-modify-path` to keep the installer binary-only (no profile writes).

- name: Check if OpenCode is installed
  ansible.builtin.command: which opencode
  register: opencode_check
  changed_when: false
  failed_when: false
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.opencode/bin:{{ ansible_facts['env']['PATH'] }}"

- name: Install OpenCode (official installer, no shell-profile mutation)
  when: opencode_check.rc != 0
  ansible.builtin.shell: |
    curl -fsSL https://opencode.ai/install | bash -s -- --no-modify-path
  args:
    executable: /bin/bash
    creates: "{{ ansible_facts['env']['HOME'] }}/.opencode/bin/opencode"

# === Cursor CLI ===
# Use official install script instead of Homebrew cask (cursor-cli cask has code signing issues on macOS)

- name: Check if Cursor CLI is installed
  ansible.builtin.command: which cursor-agent
  register: cursor_check
  changed_when: false
  failed_when: false

- name: Install Cursor CLI
  when: cursor_check.rc != 0
  ansible.builtin.shell: |
    curl -fsSL https://cursor.com/install | bash
  args:
    creates: "{{ ansible_facts['env']['HOME'] }}/.local/bin/cursor-agent"
  ignore_errors: true

# === GitHub Copilot CLI ===

- name: Check if npm is available
  ansible.builtin.command: which npm
  register: npm_check
  changed_when: false
  failed_when: false

- name: Check if GitHub Copilot CLI is installed
  ansible.builtin.command: which github-copilot-cli
  register: copilot_check
  changed_when: false
  failed_when: false

- name: Install GitHub Copilot CLI (npm - macOS)
  when:
    - ansible_facts["os_family"] == "Darwin"
    - npm_check.rc == 0
    - copilot_check.rc != 0
  community.general.npm:
    name: "@githubnext/github-copilot-cli"
    global: true
    state: present
  ignore_errors: true

- name: Install GitHub Copilot CLI via mise npm (Linux, user-level no-sudo)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - copilot_check.rc != 0
    - not (oldEL | default(false))   # EL7: mise has no node; system node 16 < required 18-20
  ansible.builtin.shell: |
    if [ -x "{{ ansible_facts['env']['HOME'] }}/.local/bin/mise" ]; then
      {{ ansible_facts['env']['HOME'] }}/.local/bin/mise exec -- npm install -g @githubnext/github-copilot-cli
    elif command -v mise >/dev/null 2>&1; then
      mise exec -- npm install -g @githubnext/github-copilot-cli
    else
      echo "mise not found, skipping GitHub Copilot CLI install" >&2
      exit 0
    fi
  args:
    executable: /bin/bash
  changed_when: true
  ignore_errors: true

# === OpenAI Codex CLI ===

- name: Check if OpenAI Codex CLI is installed via Homebrew cask (macOS)
  when: ansible_facts["os_family"] == "Darwin"
  ansible.builtin.command: brew list --cask codex
  register: codex_macos_brew_check
  changed_when: false
  failed_when: false

- name: Install OpenAI Codex CLI (Homebrew cask - macOS)
  when:
    - ansible_facts["os_family"] == "Darwin"
    - codex_macos_brew_check.rc != 0
  community.general.homebrew_cask:
    name: codex
    state: present

- name: Get Homebrew prefix (macOS)
  when: ansible_facts["os_family"] == "Darwin"
  ansible.builtin.command: brew --prefix
  register: codex_macos_brew_prefix
  changed_when: false

- name: Verify OpenAI Codex CLI binary is available from Homebrew path (macOS)
  when: ansible_facts["os_family"] == "Darwin"
  ansible.builtin.stat:
    path: "{{ codex_macos_brew_prefix.stdout }}/bin/codex"
  register: codex_macos_bin_stat
  failed_when: not codex_macos_bin_stat.stat.exists

- name: Check if OpenAI Codex CLI is installed (Linux)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
  ansible.builtin.shell: |
    if [ -x "{{ ansible_facts['env']['HOME'] }}/.local/bin/mise" ]; then
      {{ ansible_facts['env']['HOME'] }}/.local/bin/mise exec -- npm list -g --depth=0 @openai/codex >/dev/null 2>&1
    elif command -v mise >/dev/null 2>&1; then
      mise exec -- npm list -g --depth=0 @openai/codex >/dev/null 2>&1
    elif command -v npm >/dev/null 2>&1; then
      npm list -g --depth=0 @openai/codex >/dev/null 2>&1
    else
      exit 1
    fi
  args:
    executable: /bin/bash
  register: codex_linux_npm_check
  changed_when: false
  failed_when: false

- name: Install OpenAI Codex CLI via mise npm (Linux fallback, user-level no-sudo)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - codex_linux_npm_check.rc != 0
    - not (oldEL | default(false))   # EL7: mise has no node; system node 16 < required 18-20
  ansible.builtin.shell: |
    if [ -x "{{ ansible_facts['env']['HOME'] }}/.local/bin/mise" ]; then
      {{ ansible_facts['env']['HOME'] }}/.local/bin/mise exec -- npm install -g @openai/codex
    elif command -v mise >/dev/null 2>&1; then
      mise exec -- npm install -g @openai/codex
    else
      echo "mise not found, skipping OpenAI Codex CLI install" >&2
      exit 0
    fi
  args:
    executable: /bin/bash
  changed_when: true
  ignore_errors: true

# === Gemini CLI ===

- name: Check if Gemini CLI is installed (macOS)
  when: ansible_facts["os_family"] == "Darwin"
  ansible.builtin.command: which gemini
  register: gemini_macos_check
  changed_when: false
  failed_when: false

- name: Install Gemini CLI (macOS)
  when:
    - ansible_facts["os_family"] == "Darwin"
    - gemini_macos_check.rc != 0
  community.general.homebrew:
    name: gemini-cli
    state: present

- name: Re-check Gemini CLI after Homebrew install (macOS)
  when:
    - ansible_facts["os_family"] == "Darwin"
    - gemini_macos_check.rc != 0
  ansible.builtin.command: which gemini
  register: gemini_macos_postbrew_check
  changed_when: false
  failed_when: false

- name: Install Gemini CLI via npm fallback (macOS)
  when:
    - ansible_facts["os_family"] == "Darwin"
    - gemini_macos_check.rc != 0
    - gemini_macos_postbrew_check.rc != 0
    - npm_check.rc == 0
  community.general.npm:
    name: "@google/gemini-cli"
    global: true
    state: present

- name: Check if Gemini CLI is installed (Linux)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
  ansible.builtin.command: which gemini
  register: gemini_check
  changed_when: false
  failed_when: false

- name: Install Gemini CLI via mise npm (Linux, user-level no-sudo)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - gemini_check.rc != 0
    - not (oldEL | default(false))   # EL7: mise has no node; system node 16 < required 20
  ansible.builtin.shell: |
    if [ -x "{{ ansible_facts['env']['HOME'] }}/.local/bin/mise" ]; then
      {{ ansible_facts['env']['HOME'] }}/.local/bin/mise exec -- npm install -g @google/gemini-cli
    elif command -v mise >/dev/null 2>&1; then
      mise exec -- npm install -g @google/gemini-cli
    else
      echo "mise not found, skipping Gemini CLI install" >&2
      exit 0
    fi
  args:
    executable: /bin/bash
  changed_when: true
  ignore_errors: true

# === Antigravity CLI ===
# Google's agentic terminal CLI (replaces Gemini CLI for consumer tiers, GA 2026-05-19).
# Cross-platform installer self-detects darwin/linux + arch + musl; binary lands at
# ~/.local/bin/agy.
#
# Two gotchas, both handled below:
#   1. NAME COLLISION — the Antigravity *IDE* also ships an `agy` (a VS Code-fork editor
#      launcher, no agent). To give the AICAP stack an unambiguous handle we create a
#      collision-free `agyc` symlink and key autodetect on that (see
#      dot_config/shell/04_ai_agents.sh). `agyc -p "<prompt>"` is the one-shot form.
#   2. SHELL MUTATION — the upstream installer's final `agy install` step APPENDS to PATH
#      and PURGES aliases in shell profiles. PATH is chezmoi-managed and ~/.local/bin is
#      already on PATH, so we rewrite that handoff to run with --skip-path --skip-aliases
#      (binary-only install, no profile writes). Install-only per repo invariant.

- name: Check if Antigravity CLI is installed
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/agy"
  register: agy_bin
  changed_when: false

- name: Install Antigravity CLI binary (skip installer shell-profile mutation)
  when: not agy_bin.stat.exists
  ansible.builtin.shell: |
    set -euo pipefail
    tmp="$(mktemp)"
    curl -fsSL https://antigravity.google/cli/install.sh -o "$tmp"
    # Neutralize the `agy install` handoff (it edits shell profiles): rewrite both
    # invocations to pass --skip-path --skip-aliases so no profile is touched.
    sed -i.bak 's#"$BINARY_PATH" install#"$BINARY_PATH" install --skip-path --skip-aliases#g' "$tmp"
    bash "$tmp"
    rm -f "$tmp" "$tmp.bak"
  args:
    executable: /bin/bash
    creates: "{{ ansible_facts['env']['HOME'] }}/.local/bin/agy"
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:/usr/local/bin:{{ ansible_facts['env']['PATH'] }}"
  failed_when: false
  register: agy_install_result

- name: Re-check Antigravity CLI binary after install
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/agy"
  register: agy_bin_post
  changed_when: false

- name: Ensure collision-free agyc symlink for the Antigravity CLI
  when: agy_bin_post.stat.exists
  ansible.builtin.file:
    src: "{{ ansible_facts['env']['HOME'] }}/.local/bin/agy"
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/agyc"
    state: link
    force: true
  failed_when: false

# === RTK ===

- name: Check if RTK is installed (macOS)
  when: ansible_facts["os_family"] == "Darwin"
  ansible.builtin.command: which rtk
  register: rtk_macos_check
  changed_when: false
  failed_when: false

- name: Install RTK (macOS)
  when:
    - ansible_facts["os_family"] == "Darwin"
    - rtk_macos_check.rc != 0
  community.general.homebrew:
    name: rtk
    state: present

- name: Check if RTK is installed (Linux)
  when: ansible_facts["os_family"] in ["Debian", "RedHat"]
  ansible.builtin.command: which rtk
  register: rtk_check
  changed_when: false
  failed_when: false
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:/usr/local/bin:{{ ansible_facts['env']['PATH'] }}"

- name: Ensure ~/.local/bin exists (RTK)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - rtk_check.rc != 0
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
    state: directory
    mode: "0755"

- name: Install RTK (Linux)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - rtk_check.rc != 0
  ansible.builtin.shell: |
    curl -fsSL https://raw.githubusercontent.com/rtk-ai/rtk/refs/heads/master/install.sh | sh
  args:
    executable: /bin/bash
    creates: "{{ ansible_facts['env']['HOME'] }}/.local/bin/rtk"
  environment:
    RTK_INSTALL_DIR: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:/usr/local/bin:{{ ansible_facts['env']['PATH'] }}"
  failed_when: false
  register: rtk_install_result

- name: Warn RTK installation failed (Linux)
  when:
    - rtk_install_result is defined
    - rtk_install_result.rc is defined
    - rtk_install_result.rc != 0
  ansible.builtin.debug:
    msg: "RTK installation failed (likely network timeout) - skipping"

# === SpecStory ===

- name: Check if SpecStory is installed (macOS)
  when: ansible_facts["os_family"] == "Darwin"
  ansible.builtin.command: which specstory
  register: specstory_macos_check
  changed_when: false
  failed_when: false

- name: Tap specstoryai/tap for SpecStory (macOS)
  when:
    - ansible_facts["os_family"] == "Darwin"
    - specstory_macos_check.rc != 0
  community.general.homebrew_tap:
    name: specstoryai/tap
    state: present

- name: Install SpecStory via Homebrew (macOS)
  when:
    - ansible_facts["os_family"] == "Darwin"
    - specstory_macos_check.rc != 0
  community.general.homebrew:
    name: specstory
    state: present
  ignore_errors: true

- name: Re-check if SpecStory is installed after Homebrew attempt (macOS)
  when:
    - ansible_facts["os_family"] == "Darwin"
    - specstory_macos_check.rc != 0
  ansible.builtin.command: which specstory
  register: specstory_macos_recheck
  changed_when: false
  failed_when: false

- name: Set SpecStory architecture for GitHub release (macOS)
  when:
    - ansible_facts["os_family"] == "Darwin"
    - specstory_macos_check.rc != 0
    - specstory_macos_recheck.rc != 0
  ansible.builtin.set_fact:
    specstory_macos_arch: "{{ 'arm64' if target_architecture == 'arm64' else 'x86_64' }}"

- name: Get latest SpecStory release (macOS fallback)
  when:
    - ansible_facts["os_family"] == "Darwin"
    - specstory_macos_check.rc != 0
    - specstory_macos_recheck.rc != 0
  ansible.builtin.uri:
    url: https://api.github.com/repos/specstoryai/getspecstory/releases/latest
    return_content: true
  register: specstory_macos_release

- name: Ensure ~/.local/bin exists (SpecStory macOS fallback)
  when:
    - ansible_facts["os_family"] == "Darwin"
    - specstory_macos_check.rc != 0
    - specstory_macos_recheck.rc != 0
    - specstory_macos_release is defined
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
    state: directory
    mode: "0755"

- name: Install SpecStory from GitHub release (macOS fallback)
  when:
    - ansible_facts["os_family"] == "Darwin"
    - specstory_macos_check.rc != 0
    - specstory_macos_recheck.rc != 0
    - specstory_macos_release is defined
  block:
    - name: Download SpecStory from GitHub release (macOS fallback)
      ansible.builtin.get_url:
        url: "https://github.com/specstoryai/getspecstory/releases/download/{{ specstory_macos_release.json.tag_name }}/SpecStoryCLI_Darwin_{{ specstory_macos_arch }}.zip"
        dest: /tmp/specstory-macos.zip
        mode: "0644"
        timeout: 120
      retries: 3
      delay: 5

    - name: Extract SpecStory to ~/.local/bin (macOS fallback)
      ansible.builtin.unarchive:
        src: /tmp/specstory-macos.zip
        dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        remote_src: true
        mode: "0755"

    - name: Clean up SpecStory zip (macOS fallback)
      ansible.builtin.file:
        path: /tmp/specstory-macos.zip
        state: absent

  rescue:
    - name: Warn SpecStory installation failed (macOS fallback)
      ansible.builtin.debug:
        msg: "SpecStory installation failed (likely network timeout) - skipping"

    - name: Clean up SpecStory temp files after failure (macOS fallback)
      ansible.builtin.file:
        path: /tmp/specstory-macos.zip
        state: absent

- name: Check if SpecStory is installed (Linux)
  when: ansible_facts["os_family"] in ["Debian", "RedHat"]
  ansible.builtin.command: which specstory
  register: specstory_check
  changed_when: false
  failed_when: false

- name: Get latest SpecStory release version (Linux)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - specstory_check.rc != 0
  ansible.builtin.uri:
    url: https://api.github.com/repos/specstoryai/getspecstory/releases/latest
    return_content: true
  register: specstory_release

- name: Set SpecStory architecture (Linux)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - specstory_check.rc != 0
  ansible.builtin.set_fact:
    specstory_linux_arch: >-
      {{
        'x86_64' if target_architecture in ['x86_64', 'amd64']
        else 'arm64' if target_architecture in ['aarch64', 'arm64']
        else ''
      }}

- name: Skip SpecStory on unsupported architecture (Linux)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - specstory_check.rc != 0
    - specstory_linux_arch | trim == ''
  ansible.builtin.debug:
    msg: "SpecStory skipped: no release for {{ target_architecture }}"

- name: Install SpecStory from GitHub release (Linux)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - specstory_check.rc != 0
    - specstory_release is defined
    - specstory_linux_arch | trim != ''
  block:
    - name: Download SpecStory from GitHub release (Linux)
      ansible.builtin.get_url:
        url: "https://github.com/specstoryai/getspecstory/releases/download/{{ specstory_release.json.tag_name }}/SpecStoryCLI_Linux_{{ specstory_linux_arch }}.tar.gz"
        dest: /tmp/specstory-linux.tar.gz
        mode: "0644"
        timeout: 120
      retries: 3
      delay: 5

    - name: Ensure ~/.local/bin exists (SpecStory)
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        state: directory
        mode: "0755"

    - name: Extract SpecStory to ~/.local/bin (Linux)
      ansible.builtin.unarchive:
        src: /tmp/specstory-linux.tar.gz
        dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        remote_src: true
        mode: "0755"

    - name: Clean up SpecStory tarball (Linux)
      ansible.builtin.file:
        path: /tmp/specstory-linux.tar.gz
        state: absent

  rescue:
    - name: Warn SpecStory installation failed (Linux)
      ansible.builtin.debug:
        msg: "SpecStory installation failed (likely network timeout) - skipping"

    - name: Clean up SpecStory temp files after failure (Linux)
      ansible.builtin.file:
        path: /tmp/specstory-linux.tar.gz
        state: absent

# === CodexBar ===
#
# macOS installs the GUI cask, which is a SUPERSET of the CLI: the cask's
# `binary "…/CodexBar.app/Contents/Helpers/CodexBarCLI", target: "codexbar"`
# stanza puts the same `codexbar` on PATH that the steipete/tap FORMULA does.
# Two upstream changes make the cask the right default everywhere:
#   - v0.17.0 (2026-02): cask moved into homebrew-cask CORE, so no tap.
#   - v0.26.0 (2026-05): the app ships as `CodexBar-macos-universal-*.zip` and
#     the cask dropped `depends_on arch: :arm64`. Intel Macs are supported;
#     the only requirement left is macOS 14+ (Sonoma).
# Do NOT reintroduce an arm64 gate — it silently skipped every Intel Mac.
#
# Guard on the APP, not on `which codexbar`: the formula and the cask both own
# that binary name, so a `which` guard makes a CLI-only host skip the GUI
# forever, and brew aborts the cask link with "It seems there is already a
# Binary at …" when the formula owns it. Same conflicting-formula shape as td
# below, with a rescue so a failed cask install never leaves the host with no
# codexbar at all.

- name: Check if CodexBar.app is installed (macOS)
  when: ansible_facts["os_family"] == "Darwin"
  ansible.builtin.stat:
    path: /Applications/CodexBar.app
  register: codexbar_macos_app

- name: Check whether the CLI-only formula owns the codexbar binary (macOS)
  when:
    - ansible_facts["os_family"] == "Darwin"
    - not codexbar_macos_app.stat.exists
  # Probe brew by OUTPUT, not exit status — a fake `brew` stub returns 0 for
  # everything. See pitfalls/ansible-homebrew-expecting-value-line-1-column-1.md.
  ansible.builtin.shell: |
    [ -n "$(brew --prefix 2>/dev/null)" ] || exit 1
    brew list --formula 2>/dev/null | grep -qx codexbar
  args:
    executable: /bin/bash
  register: codexbar_macos_formula
  changed_when: false
  failed_when: false

- name: Install CodexBar (macOS)
  when:
    - ansible_facts["os_family"] == "Darwin"
    - not codexbar_macos_app.stat.exists
    # The cask's own `depends_on macos: :sonoma` would hard-fail the play on an
    # older mac; skip explicitly instead so the message is ours.
    - ansible_facts["distribution_version"] is version('14.0', '>=')
  block:
    - name: Remove conflicting CodexBar CLI formula (macOS)
      when: codexbar_macos_formula.rc == 0
      community.general.homebrew:
        name: codexbar
        state: absent

    - name: Install CodexBar cask (macOS)
      # homebrew-cask core, no tap needed (see block comment above).
      community.general.homebrew_cask:
        name: codexbar
        state: present
  rescue:
    - name: Restore CodexBar CLI formula after failed cask install (macOS)
      when: codexbar_macos_formula.rc == 0
      community.general.homebrew:
        name: steipete/tap/codexbar
        state: present
      failed_when: false

    - name: Warn CodexBar cask installation failed (macOS)
      ansible.builtin.debug:
        msg: "CodexBar cask install failed - skipping (CLI formula restored if it was present)"

- name: Warn CodexBar skipped on macOS older than 14 (Sonoma)
  when:
    - ansible_facts["os_family"] == "Darwin"
    - not codexbar_macos_app.stat.exists
    - ansible_facts["distribution_version"] is version('14.0', '<')
  ansible.builtin.debug:
    msg: "CodexBar skipped: requires macOS 14+ (Sonoma), found {{ ansible_facts['distribution_version'] }}"

- name: Check if CodexBar is installed (Linux)
  when: ansible_facts["os_family"] in ["Debian", "RedHat"]
  ansible.builtin.command: which codexbar
  register: codexbar_check
  changed_when: false
  failed_when: false

- name: Detect whether the prebuilt glibc CLI can run here (Linux)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - codexbar_check.rc != 0
  # The floor is glibc >= 2.38, NOT the usual 2.28 Linuxbrew line. Verified by
  # reading `.gnu.version_r` out of v0.45.2's own tarballs (`objdump -p`):
  # BOTH `linux-x86_64` and `linux-aarch64` require `GLIBC_2.38` from libc.so.6
  # plus `GLIBCXX_3.4.30` (GCC 12+) from libstdc++. That excludes far more than
  # CentOS 7 — Ubuntu 22.04 (2.35), Debian 12 (2.36) and RHEL 9 (2.34) all fail
  # too; only Ubuntu 23.10+/24.04 (2.39) clears it. The static-musl variant
  # (upstream since v0.37.0, 2026-06) has an empty NEEDED list and zero GLIBC
  # references, so it runs anywhere.
  #
  # This gates the LINUXBREW path as well, on purpose: `steipete/tap/codexbar`
  # is a binary-download formula that fetches the same glibc tarball, so on a
  # Jammy/bookworm/RHEL-9 host `brew install` would "succeed" and leave a
  # binary that cannot execute — and the `which codexbar` guard above would
  # then skip the working fallback on every later run.
  #
  # rc != 0 also covers "could not determine glibc"; failing towards the static
  # build is the safe direction, it just costs ~36 MB more download.
  ansible.builtin.shell: |
    ver="$(ldd --version 2>/dev/null | head -1 | grep -oE '[0-9]+\.[0-9]+([0-9.]*)?$' || true)"
    [ -n "$ver" ] || exit 1
    awk -v v="$ver" 'BEGIN { split(v, a, "."); exit !((a[1] > 2) || (a[1] == 2 && a[2] >= 38)) }'
  args:
    executable: /bin/bash
  register: codexbar_glibc_check
  changed_when: false
  failed_when: false

- name: Decide CodexBar Linux install path (Linux)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - codexbar_check.rc != 0
  ansible.builtin.set_fact:
    codexbar_static_required: "{{ codexbar_glibc_check.rc | default(1) != 0 }}"

- name: Check if Homebrew (Linuxbrew) is available
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - codexbar_check.rc != 0
    - not (codexbar_static_required | bool)
  # Probe brew by OUTPUT, not exit status — a fake `brew` stub returns 0 for
  # everything. See pitfalls/ansible-homebrew-expecting-value-line-1-column-1.md.
  ansible.builtin.shell: '[ -n "$(brew --prefix 2>/dev/null)" ]'
  args:
    executable: /bin/bash
  register: codexbar_brew_check
  changed_when: false
  failed_when: false

- name: Install CodexBar via Linuxbrew (preferred)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - codexbar_check.rc != 0
    - not (codexbar_static_required | bool)
    - codexbar_brew_check.rc | default(1) == 0
  block:
    - name: Tap steipete/tap for CodexBar (Linuxbrew)
      community.general.homebrew_tap:
        name: steipete/tap
        state: present

    - name: Install CodexBar (Linuxbrew)
      community.general.homebrew:
        name: steipete/tap/codexbar
        state: present
  rescue:
    - name: Mark Linuxbrew install as failed
      ansible.builtin.set_fact:
        codexbar_brew_failed: true

- name: Ensure ~/.local/bin exists (CodexBar fallback)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - codexbar_check.rc != 0
    - codexbar_static_required | bool or codexbar_brew_check.rc | default(1) != 0 or (codexbar_brew_failed | default(false))
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
    state: directory
    mode: '0755'

- name: Get latest CodexBar release (Linux fallback)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - codexbar_check.rc != 0
    - codexbar_static_required | bool or codexbar_brew_check.rc | default(1) != 0 or (codexbar_brew_failed | default(false))
  ansible.builtin.uri:
    url: https://api.github.com/repos/steipete/CodexBar/releases/latest
    return_content: true
  register: codexbar_release

- name: Compute CodexBar arch and tag (Linux fallback)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - codexbar_check.rc != 0
    - codexbar_static_required | bool or codexbar_brew_check.rc | default(1) != 0 or (codexbar_brew_failed | default(false))
    - codexbar_release is defined
    - target_architecture in ['x86_64', 'amd64', 'aarch64', 'arm64']
  ansible.builtin.set_fact:
    codexbar_arch: "{{ target_architecture }}"
    codexbar_tag: "{{ codexbar_release.json.tag_name.startswith('v') | ternary(codexbar_release.json.tag_name, 'v' ~ codexbar_release.json.tag_name) }}"

- name: Compute CodexBar release asset name (Linux fallback)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - codexbar_check.rc != 0
    - codexbar_static_required | bool or codexbar_brew_check.rc | default(1) != 0 or (codexbar_brew_failed | default(false))
    - codexbar_tag is defined
  ansible.builtin.set_fact:
    codexbar_asset: >-
      CodexBarCLI-{{ codexbar_tag }}-linux-{{ 'musl-' if codexbar_static_required | bool else '' }}{{ codexbar_arch }}.tar.gz

- name: Install CodexBar from GitHub releases (Linux fallback)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - codexbar_check.rc != 0
    - codexbar_static_required | bool or codexbar_brew_check.rc | default(1) != 0 or (codexbar_brew_failed | default(false))
    - codexbar_asset is defined
  block:
    - name: Download CodexBar release (Linux fallback)
      # No `checksum:` — upstream's sibling `<asset>.sha256` records the
      # build machine's absolute temp path (`/tmp/tmp.XXXX/CodexBarCLI-…`),
      # not a bare filename, so get_url's checksum-URL lookup can never match
      # it. Don't "fix" this by pointing checksum at that URL.
      ansible.builtin.get_url:
        url: "https://github.com/steipete/CodexBar/releases/download/{{ codexbar_tag }}/{{ codexbar_asset }}"
        dest: /tmp/codexbar.tar.gz
        mode: '0644'
        timeout: 120
      retries: 3
      delay: 5

    - name: Create temp directory for CodexBar extraction (Linux fallback)
      ansible.builtin.file:
        path: /tmp/codexbar
        state: directory
        mode: '0755'

    - name: Extract CodexBar release (Linux fallback)
      ansible.builtin.unarchive:
        src: /tmp/codexbar.tar.gz
        dest: /tmp/codexbar
        remote_src: true

    - name: Find codexbar binary (Linux fallback)
      ansible.builtin.find:
        paths: /tmp/codexbar
        patterns: CodexBarCLI
        file_type: file
      register: codexbar_find

    - name: Install CodexBar to ~/.local/bin (Linux fallback)
      when: codexbar_find.matched | default(0) | int > 0
      ansible.builtin.copy:
        src: "{{ codexbar_find.files[0].path }}"
        dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/codexbar"
        mode: '0755'
        remote_src: true

    - name: Clean up CodexBar temp files (Linux fallback)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/codexbar.tar.gz
        - /tmp/codexbar

  rescue:
    - name: Warn CodexBar installation failed
      ansible.builtin.debug:
        msg: "CodexBar installation failed (likely network timeout) - skipping"

    - name: Clean up CodexBar temp files after failure
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/codexbar.tar.gz
        - /tmp/codexbar

# === td ===

- name: Check if td is installed (macOS)
  when: ansible_facts["os_family"] == "Darwin"
  ansible.builtin.command: which td
  register: td_macos_check
  changed_when: false
  failed_when: false

- name: Check whether installed td is Sidecar-compatible (macOS)
  when:
    - ansible_facts["os_family"] == "Darwin"
    - td_macos_check.rc == 0
  ansible.builtin.shell: td --help 2>&1 | grep -Eq '\bsession\b'
  register: td_macos_compatible_check
  changed_when: false
  failed_when: false

- name: Remove conflicting td formula (macOS)
  when:
    - ansible_facts["os_family"] == "Darwin"
    - td_macos_check.rc == 0
    - td_macos_compatible_check.rc != 0
  community.general.homebrew:
    name: td
    state: absent

- name: Tap marcus/tap for td (macOS)
  when:
    - ansible_facts["os_family"] == "Darwin"
    - td_macos_check.rc != 0 or (td_macos_compatible_check.rc is defined and td_macos_compatible_check.rc != 0)
  community.general.homebrew_tap:
    name: marcus/tap
    state: present

- name: Install td (macOS)
  when:
    - ansible_facts["os_family"] == "Darwin"
    - td_macos_check.rc != 0 or (td_macos_compatible_check.rc is defined and td_macos_compatible_check.rc != 0)
  community.general.homebrew:
    name: marcus/tap/td
    state: present

- name: Check if td is installed (Linux)
  when: ansible_facts["os_family"] in ["Debian", "RedHat"]
  ansible.builtin.command: which td
  register: td_check
  changed_when: false
  failed_when: false

- name: Check whether installed td is Sidecar-compatible (Linux)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - td_check.rc == 0
  ansible.builtin.shell: td --help 2>&1 | grep -Eq '\bsession\b'
  register: td_compatible_check
  changed_when: false
  failed_when: false

- name: Check if Homebrew (Linuxbrew) is available for td
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - td_check.rc != 0 or (td_compatible_check.rc is defined and td_compatible_check.rc != 0)
  # Probe brew by OUTPUT, not exit status — a fake `brew` stub returns 0 for
  # everything. See pitfalls/ansible-homebrew-expecting-value-line-1-column-1.md.
  ansible.builtin.shell: '[ -n "$(brew --prefix 2>/dev/null)" ]'
  args:
    executable: /bin/bash
  register: td_brew_check
  changed_when: false
  failed_when: false

- name: Remove conflicting td formula (Linuxbrew)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - td_check.rc == 0
    - td_compatible_check.rc != 0
    - td_brew_check.rc == 0
  community.general.homebrew:
    name: td
    state: absent

- name: Install td via Linuxbrew (preferred)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - td_check.rc != 0 or (td_compatible_check.rc is defined and td_compatible_check.rc != 0)
    - td_brew_check.rc == 0
  block:
    - name: Tap marcus/tap for td (Linuxbrew)
      community.general.homebrew_tap:
        name: marcus/tap
        state: present

    - name: Install td (Linuxbrew)
      community.general.homebrew:
        name: marcus/tap/td
        state: present
  rescue:
    - name: Continue with GitHub release fallback when td Linuxbrew install fails
      ansible.builtin.debug:
        msg: "td Linuxbrew installation failed, continuing with GitHub release fallback."

- name: Re-check if td is installed after Linuxbrew attempt
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - td_check.rc != 0 or (td_compatible_check.rc is defined and td_compatible_check.rc != 0)
  ansible.builtin.command: which td
  register: td_recheck
  changed_when: false
  failed_when: false

- name: Ensure ~/.local/bin exists (td fallback)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - td_check.rc != 0 or (td_compatible_check.rc is defined and td_compatible_check.rc != 0)
    - td_recheck.rc != 0
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
    state: directory
    mode: "0755"

- name: Get latest td release (Linux fallback)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - td_check.rc != 0 or (td_compatible_check.rc is defined and td_compatible_check.rc != 0)
    - td_recheck.rc != 0
  ansible.builtin.uri:
    url: https://api.github.com/repos/marcus/td/releases/latest
    return_content: true
  register: td_release

- name: Compute td release arch and version (Linux fallback)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - td_check.rc != 0 or (td_compatible_check.rc is defined and td_compatible_check.rc != 0)
    - td_recheck.rc != 0
    - td_release is defined
  ansible.builtin.set_fact:
    td_linux_arch: "{{ 'amd64' if target_architecture in ['x86_64', 'amd64'] else 'arm64' if target_architecture in ['aarch64', 'arm64'] else 'unsupported' }}"
    td_linux_version: "{{ td_release.json.tag_name | regex_replace('^v', '') }}"
    td_linux_tag: "{{ td_release.json.tag_name }}"

- name: Warn when td release fallback does not support current architecture
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - td_check.rc != 0 or (td_compatible_check.rc is defined and td_compatible_check.rc != 0)
    - td_recheck.rc != 0
    - td_linux_arch == "unsupported"
  ansible.builtin.debug:
    msg: "td fallback skipped: unsupported architecture {{ target_architecture }}."

- name: Install td from GitHub releases (Linux fallback)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - td_check.rc != 0 or (td_compatible_check.rc is defined and td_compatible_check.rc != 0)
    - td_recheck.rc != 0
    - td_linux_arch != "unsupported"
  block:
    - name: Download td release (Linux fallback)
      ansible.builtin.get_url:
        url: "https://github.com/marcus/td/releases/download/{{ td_linux_tag }}/td_{{ td_linux_version }}_linux_{{ td_linux_arch }}.tar.gz"
        dest: /tmp/td.tar.gz
        mode: "0644"
        timeout: 120
      retries: 3
      delay: 5

    - name: Create temp directory for td extraction (Linux fallback)
      ansible.builtin.file:
        path: /tmp/td
        state: directory
        mode: "0755"

    - name: Extract td release (Linux fallback)
      ansible.builtin.unarchive:
        src: /tmp/td.tar.gz
        dest: /tmp/td
        remote_src: true

    - name: Find td binary (Linux fallback)
      ansible.builtin.find:
        paths: /tmp/td
        patterns: td
        file_type: file
      register: td_find

    - name: Install td to ~/.local/bin (Linux fallback)
      when: td_find.matched | default(0) | int > 0
      ansible.builtin.copy:
        src: "{{ td_find.files[0].path }}"
        dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/td"
        mode: "0755"
        remote_src: true

    - name: Clean up td temp files (Linux fallback)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/td.tar.gz
        - /tmp/td

  rescue:
    - name: Warn td installation failed
      ansible.builtin.debug:
        msg: "td installation failed (likely network timeout) - skipping"

    - name: Clean up td temp files after failure
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/td.tar.gz
        - /tmp/td

