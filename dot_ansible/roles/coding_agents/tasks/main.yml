# === Specify CLI ===

- name: Check if uv is available
  ansible.builtin.command: which uv
  register: uv_check
  changed_when: false
  failed_when: false

- name: Check if Specify CLI is installed
  ansible.builtin.command: which specify
  register: specify_check
  changed_when: false
  failed_when: false

- name: Install Specify CLI via uv
  when:
    - uv_check.rc == 0
    - specify_check.rc != 0
  ansible.builtin.command: uv tool install specify-cli --from git+https://github.com/github/spec-kit.git
  register: specify_install
  until: specify_install is succeeded
  retries: 3
  delay: 5
  args:
    creates: "{{ ansible_facts['env']['HOME'] }}/.local/bin/specify"
  environment:
    GIT_HTTP_VERSION: HTTP/1.1

- name: Warn when uv is missing and Specify CLI is not installed
  when:
    - uv_check.rc != 0
    - specify_check.rc != 0
  ansible.builtin.debug:
    msg: "uv not found; skipping Specify CLI installation. Install uv first or install specify manually."

# === OpenChamber ===

- name: Check if OpenChamber is installed
  ansible.builtin.command: which openchamber
  register: openchamber_check
  changed_when: false
  failed_when: false

- name: Install OpenChamber (npm - macOS)
  when:
    - ansible_facts["os_family"] == "Darwin"
    - npm_check.rc == 0
    - openchamber_check.rc != 0
  community.general.npm:
    name: "@openchamber/web"
    global: true
    state: present
  ignore_errors: true

- name: Install OpenChamber via mise npm (Linux, user-level no-sudo)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - openchamber_check.rc != 0
    - not (oldEL | default(false))   # EL7: mise has no node; system node 16 < required 18-20
  ansible.builtin.shell: |
    if [ -x "{{ ansible_facts['env']['HOME'] }}/.local/bin/mise" ]; then
      {{ ansible_facts['env']['HOME'] }}/.local/bin/mise exec -- npm install -g @openchamber/web
    elif command -v mise >/dev/null 2>&1; then
      mise exec -- npm install -g @openchamber/web
    else
      echo "mise not found, skipping OpenChamber install" >&2
      exit 0
    fi
  args:
    executable: /bin/bash
  changed_when: true
  ignore_errors: true

# === Claude HUD Plugin ===

# Install-only by design: the helper exits early without any network access when
# a claude-hud cache or installed_plugins.json entry already exists. Explicit
# upgrades are handled by `just upgrade-plugins`.
#
# Why `ansible_facts.python.executable` instead of literal `python3`?
# claude_hud_sync.py uses `from __future__ import annotations` (Py3.7+
# syntax) plus `@dataclass`. CentOS 7's `/usr/bin/python3` is 3.6.8 which
# can't parse `from __future__ import annotations` and aborts with
# `SyntaxError: future feature annotations is not defined`.
# `ansible_facts.python.executable` is the interpreter ansible itself
# discovered/was-told-to-use (which on CentOS 7 is the uv-managed 3.13
# we override via the controlling chezmoi script — see
# .chezmoiscripts/global/run_onchange_after_20_ansible_roles.sh.tmpl).
- name: Install claude-hud plugin on first apply only
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts.python.executable | default('python3') }}"
      - "{{ role_path }}/files/claude_hud_sync.py"
      - --only-if-missing
  register: claude_hud_sync
  changed_when: "'status=changed' in claude_hud_sync.stdout"
  ignore_errors: true
