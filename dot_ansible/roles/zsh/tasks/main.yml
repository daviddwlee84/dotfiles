---
# Zsh role - install zsh, oh-my-zsh, and plugins

# Install zsh package
- name: Install zsh (macOS)
  when: ansible_facts["os_family"] == "Darwin"
  community.general.homebrew:
    name: zsh
    state: present

- name: Install zsh (Debian/Ubuntu)
  when: ansible_facts["os_family"] == "Debian"
  become: true
  tags: [sudo]
  ansible.builtin.apt:
    name: zsh
    state: present

# Install oh-my-zsh (manual installation)
- name: Check if oh-my-zsh is installed
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh"
  register: ohmyzsh_check

- name: Clone oh-my-zsh
  when: not ohmyzsh_check.stat.exists
  ansible.builtin.git:
    repo: "{{ oh_my_zsh_repo }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh"
    depth: 1

# Clone zsh plugins to ZSH_CUSTOM/plugins
- name: Clone zsh plugins
  ansible.builtin.git:
    repo: "{{ item.repo }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh/custom/plugins/{{ item.name }}"
    depth: 1
    update: false
  loop: "{{ zsh_plugins }}"

# Switch the user's login shell to zsh (requires sudo to edit /etc/passwd)
- name: Locate zsh binary
  ansible.builtin.shell: command -v zsh
  register: zsh_path
  changed_when: false
  check_mode: false
  failed_when: false

- name: Get current login shell (macOS)
  when: ansible_facts["os_family"] == "Darwin"
  ansible.builtin.command:
    cmd: "dscl . -read /Users/{{ ansible_facts['user_id'] }} UserShell"
  register: current_shell_macos
  changed_when: false
  check_mode: false
  failed_when: false

- name: Get current login shell (Linux)
  when: ansible_facts["os_family"] != "Darwin"
  ansible.builtin.command:
    cmd: "getent passwd {{ ansible_facts['user_id'] }}"
  register: current_shell_linux
  changed_when: false
  check_mode: false
  failed_when: false

- name: Set current shell fact
  ansible.builtin.set_fact:
    current_login_shell: >-
      {{ (current_shell_macos.stdout | default('')).split()[-1]
         if ansible_facts["os_family"] == "Darwin"
         else (current_shell_linux.stdout | default('')).split(':')[-1] }}

- name: Change login shell to zsh
  become: true
  tags: [sudo]
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    shell: "{{ zsh_path.stdout }}"
  when:
    - zsh_path.rc == 0
    - zsh_path.stdout | length > 0
    - not current_login_shell.endswith('/zsh')
