---
# .NET global tools installation
# .NET SDK is installed via mise (`mise use -g dotnet@<version>`), which puts
# a dotnet shim under ~/.local/share/mise/shims/dotnet and lets `dotnet tool
# install --global` drop binaries into ~/.dotnet/tools (hardcoded by dotnet).
# ~/.dotnet/tools is prepended to PATH by dot_config/zsh/00_exports.zsh when it
# exists.

# =============================================================================
# Ensure dotnet SDK is installed via mise
# =============================================================================

- name: Check for user-installed mise (dotnet_tools)
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/mise"
  register: dotnet_mise_user_install

- name: Set mise binary path (dotnet_tools)
  ansible.builtin.set_fact:
    dotnet_mise_bin: >-
      {{
        (ansible_facts['env']['HOME'] + '/.local/bin/mise')
        if dotnet_mise_user_install.stat.exists
        else ('/opt/homebrew/bin/mise' if ansible_facts['os_family'] == 'Darwin' else '/usr/local/bin/mise')
      }}

- name: Verify mise binary is reachable (dotnet_tools)
  ansible.builtin.stat:
    path: "{{ dotnet_mise_bin }}"
  register: dotnet_mise_bin_stat

- name: Skip dotnet_tools when mise is unavailable
  when: not dotnet_mise_bin_stat.stat.exists
  ansible.builtin.debug:
    msg: >-
      dotnet_tools: mise not found at {{ dotnet_mise_bin }} — skipping install
      of {{ dotnet_tools | map(attribute='name') | list | join(', ') }}.
      Install mise first (bootstrap script / curl https://mise.run | sh) and
      re-run `chezmoi apply` or `ansible-playbook ... --tags dotnet_tools`.

- name: Install and pin dotnet via mise
  when: dotnet_mise_bin_stat.stat.exists
  ansible.builtin.command: "{{ dotnet_mise_bin }} use -g dotnet@{{ dotnet_version }}"
  args:
    creates: "{{ ansible_facts['env']['HOME'] }}/.local/share/mise/installs/dotnet"
  register: dotnet_mise_use
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:/opt/homebrew/bin:/usr/local/bin:{{ ansible_facts['env']['PATH'] }}"

# =============================================================================
# Install .NET global tools (loop over dotnet_tools)
# =============================================================================

# `dotnet tool install --global` is NOT idempotent (exits 1 when already
# installed), so we probe each binary first and skip when present. To catch
# upstream updates, users can re-run with the explicit `update` command:
#   dotnet tool update --global <name>

- name: Check whether each dotnet_tool binary is present
  when:
    - dotnet_mise_bin_stat.stat.exists
    - dotnet_tools | length > 0
  ansible.builtin.shell: |
    export PATH="$HOME/.dotnet/tools:$HOME/.local/share/mise/shims:$PATH"
    command -v {{ item.binary }}
  args:
    executable: /bin/bash
  register: dotnet_tool_presence
  changed_when: false
  failed_when: false
  loop: "{{ dotnet_tools }}"
  loop_control:
    label: "{{ item.binary }}"

- name: Build list of dotnet_tools still missing
  when:
    - dotnet_mise_bin_stat.stat.exists
    - dotnet_tools | length > 0
  ansible.builtin.set_fact:
    dotnet_tools_to_install: >-
      {{
        dotnet_tool_presence.results
        | selectattr('rc', 'ne', 0)
        | map(attribute='item')
        | list
      }}

- name: Install missing dotnet_tools via `dotnet tool install --global`
  when:
    - dotnet_mise_bin_stat.stat.exists
    - dotnet_tools_to_install is defined
    - dotnet_tools_to_install | length > 0
  ansible.builtin.shell: |
    export PATH="$HOME/.dotnet/tools:$HOME/.local/share/mise/shims:$PATH"
    {{ dotnet_mise_bin }} exec dotnet@{{ dotnet_version }} -- dotnet tool install --global {{ item.name }}
  args:
    executable: /bin/bash
  register: dotnet_tool_install
  until: dotnet_tool_install is succeeded
  retries: 3
  delay: 10
  changed_when: >-
    'was successfully installed' in dotnet_tool_install.stdout
    or 'Installed' in dotnet_tool_install.stdout
  loop: "{{ dotnet_tools_to_install }}"
  loop_control:
    label: "{{ item.name }}"
