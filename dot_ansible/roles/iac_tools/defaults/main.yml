---
# Per-tool toggles for the iac_tools role.
# Override via --extra-vars to disable individual tools while keeping
# the single installIacTools chezmoi prompt.
iac_install_azure_cli: true
iac_install_terraform: true
iac_install_opentofu: true

# Opt-in add-ons (default off — pull in heavier dependencies)
# azure-cost-cli: https://github.com/mivano/azure-cost-cli
#   Requires .NET SDK 8.0+ (installed on demand if missing).
#   Enable via: --extra-vars "iac_install_azure_cost_cli=true"
iac_install_azure_cost_cli: false
