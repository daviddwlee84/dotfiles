---
# Infrastructure-as-Code tools role
# Tools: Azure CLI (az), Terraform (terraform), OpenTofu (tofu)

# =============================================================================
# macOS - all via Homebrew
# =============================================================================

# Each brew install is wrapped in block + rescue with retries because
# ghcr.io (Homebrew's bottle CDN) can be slow/unstable on some networks
# (especially behind GFW), and `community.general.homebrew` has no built-in
# retry. Without retries, a single `curl: (18) Transferred a partial file`
# would fail the whole task. Tools also install independently so one failure
# doesn't block the others. For GFW users: set `HOMEBREW_BOTTLE_DOMAIN` to a
# mirror (see docs/tools/infrastructure-as-code.md).

- name: Install Azure CLI (macOS)
  when:
    - ansible_facts["os_family"] == "Darwin"
    - iac_install_azure_cli
  block:
    - name: Install azure-cli via Homebrew
      community.general.homebrew:
        name: azure-cli
        state: present
      register: az_brew_install
      until: az_brew_install is succeeded
      retries: 3
      delay: 20
  rescue:
    - name: Warn Azure CLI installation failed (macOS)
      ansible.builtin.debug:
        msg: "Azure CLI installation failed after retries — skipping. {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}"

- name: Tap hashicorp/tap (macOS)
  when:
    - ansible_facts["os_family"] == "Darwin"
    - iac_install_terraform
  block:
    - name: Check if hashicorp/tap is present
      ansible.builtin.command: brew tap
      register: hashicorp_taps
      changed_when: false

    - name: Tap hashicorp/tap
      ansible.builtin.command: brew tap hashicorp/tap
      when: "'hashicorp/tap' not in hashicorp_taps.stdout_lines"
      register: hashicorp_tap_result
      until: hashicorp_tap_result is succeeded
      retries: 3
      delay: 20
      changed_when: hashicorp_tap_result.rc == 0

- name: Install Terraform (macOS)
  when:
    - ansible_facts["os_family"] == "Darwin"
    - iac_install_terraform
  block:
    - name: Install terraform via Homebrew
      community.general.homebrew:
        name: hashicorp/tap/terraform
        state: present
      register: terraform_brew_install
      until: terraform_brew_install is succeeded
      retries: 3
      delay: 20
  rescue:
    - name: Warn Terraform installation failed (macOS)
      ansible.builtin.debug:
        msg: "Terraform installation failed after retries — skipping. {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}"

- name: Install OpenTofu (macOS)
  when:
    - ansible_facts["os_family"] == "Darwin"
    - iac_install_opentofu
  block:
    - name: Install opentofu via Homebrew
      community.general.homebrew:
        name: opentofu
        state: present
      register: opentofu_brew_install
      until: opentofu_brew_install is succeeded
      retries: 3
      delay: 20
  rescue:
    - name: Warn OpenTofu installation failed (macOS)
      ansible.builtin.debug:
        msg: "OpenTofu installation failed after retries — skipping. {{ ansible_failed_result.msg | default('unknown') | truncate(200) }}"

# =============================================================================
# Linux (Debian/Ubuntu) - apt with sudo
# =============================================================================

# --- Azure CLI via Microsoft apt repo ---
- name: Install Azure CLI from Microsoft apt repo (Debian/Ubuntu)
  when:
    - ansible_facts["os_family"] == "Debian"
    - iac_install_azure_cli
  become: true
  tags: [sudo]
  block:
    - name: Install Azure CLI prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present

    - name: Create keyrings directory for Azure CLI
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Microsoft signing key
      ansible.builtin.shell: |
        curl -sLS https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor -o /etc/apt/keyrings/microsoft.gpg
        chmod go+r /etc/apt/keyrings/microsoft.gpg
      args:
        executable: /bin/bash
        creates: /etc/apt/keyrings/microsoft.gpg

    - name: Add Azure CLI apt repository
      ansible.builtin.shell: |
        AZ_DIST=$(lsb_release -cs)
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/microsoft.gpg] https://packages.microsoft.com/repos/azure-cli/ ${AZ_DIST} main" > /etc/apt/sources.list.d/azure-cli.list
      args:
        executable: /bin/bash
        creates: /etc/apt/sources.list.d/azure-cli.list

    - name: Update apt cache for Azure CLI
      ansible.builtin.apt:
        update_cache: true

    - name: Install azure-cli package
      ansible.builtin.apt:
        name: azure-cli
        state: present
  rescue:
    - name: Warn Azure CLI installation failed
      ansible.builtin.debug:
        msg: "Azure CLI installation failed — skipping. Error: {{ ansible_failed_result.msg | default('unknown') }}"

# --- Terraform via HashiCorp apt repo ---
- name: Install Terraform from HashiCorp apt repo (Debian/Ubuntu)
  when:
    - ansible_facts["os_family"] == "Debian"
    - iac_install_terraform
  become: true
  tags: [sudo]
  block:
    - name: Install Terraform prerequisites
      ansible.builtin.apt:
        name:
          - gnupg
          - software-properties-common
        state: present

    - name: Create keyrings directory for HashiCorp
      ansible.builtin.file:
        path: /usr/share/keyrings
        state: directory
        mode: '0755'

    - name: Download HashiCorp GPG key
      ansible.builtin.shell: |
        wget -O- https://apt.releases.hashicorp.com/gpg | gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
      args:
        executable: /bin/bash
        creates: /usr/share/keyrings/hashicorp-archive-keyring.gpg

    - name: Add HashiCorp apt repository
      ansible.builtin.shell: |
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" > /etc/apt/sources.list.d/hashicorp.list
      args:
        executable: /bin/bash
        creates: /etc/apt/sources.list.d/hashicorp.list

    - name: Update apt cache for HashiCorp
      ansible.builtin.apt:
        update_cache: true

    - name: Install terraform package
      ansible.builtin.apt:
        name: terraform
        state: present
  rescue:
    - name: Warn Terraform installation failed
      ansible.builtin.debug:
        msg: "Terraform installation failed — skipping. Error: {{ ansible_failed_result.msg | default('unknown') }}"

# --- OpenTofu via official deb repo ---
- name: Install OpenTofu from official repo (Debian/Ubuntu)
  when:
    - ansible_facts["os_family"] == "Debian"
    - iac_install_opentofu
  become: true
  tags: [sudo]
  block:
    - name: Install OpenTofu prerequisites
      ansible.builtin.apt:
        name:
          - curl
          - gnupg
        state: present

    - name: Create keyrings directory for OpenTofu
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    # Single-key setup: the `InRelease` file is signed by the key at
    # packages.opentofu.org/.../gpgkey (subkey 70DF59811A8B9109). The old
    # dual-key approach also included get.opentofu.org/opentofu.gpg, but that
    # is an unrelated OpenTofu project key that does NOT sign the repo —
    # carrying it in signed-by= bought nothing. `deb-src` is dropped because
    # this Cloudsmith-style repo has no source packages and apt-get update
    # fails on the missing Sources file.
    # Dearmor the key to a temp file on the SAME dir, verify it is non-empty,
    # then atomically mv it into place. A cut-off download (flaky proxy / GFW)
    # otherwise leaves a 0-byte /etc/apt/keyrings/opentofu.gpg; since the .list
    # references it via signed-by=, every later apt-get update on the whole
    # machine then dies with NO_PUBKEY 70DF59811A8B9109 and wedges unrelated
    # roles. Never truncate the live keyring on a failed download. The refresh
    # is scoped to this one source so a sibling flaky repo cannot fail it.
    # See pitfalls/apt-update-fails-base-role-empty-error.md.
    - name: Install OpenTofu repo and package
      ansible.builtin.shell: |
        set -eo pipefail
        tmpkey=/etc/apt/keyrings/opentofu.gpg.tmp
        rm -f "$tmpkey"
        curl -fsSL https://packages.opentofu.org/opentofu/tofu/gpgkey | gpg --no-tty --batch --yes --dearmor -o "$tmpkey"
        test -s "$tmpkey"
        mv -f "$tmpkey" /etc/apt/keyrings/opentofu.gpg
        rm -f /etc/apt/keyrings/opentofu-repo.gpg
        echo "deb [signed-by=/etc/apt/keyrings/opentofu.gpg] https://packages.opentofu.org/opentofu/tofu/any/ any main" > /etc/apt/sources.list.d/opentofu.list
        apt-get update -o Dir::Etc::sourcelist=sources.list.d/opentofu.list -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0
        apt-get install -y tofu
      args:
        executable: /bin/bash
      changed_when: true
  rescue:
    - name: Warn OpenTofu installation failed
      ansible.builtin.debug:
        msg: "OpenTofu installation failed — skipping. Error: {{ ansible_failed_result.msg | default('unknown') }}"

# =============================================================================
# Linux - user-level fallbacks (noRoot / no sudo)
# =============================================================================
# Gates broadened from `os_family == "Debian"` to `["Debian", "RedHat"]` per
# pitfalls/centos7-noroot.md — these are Go-static / pip / HashiCorp .zip
# binaries with no glibc dependency, so they run on CentOS 7's glibc 2.17.

# --- Architecture mapping ---
- name: Set IaC tools release architecture
  when: ansible_facts["os_family"] in ["Debian", "RedHat"]
  ansible.builtin.set_fact:
    iac_arch: >-
      {{
        'amd64' if target_architecture in ['x86_64', 'amd64']
        else 'arm64' if target_architecture in ['aarch64', 'arm64']
        else ''
      }}

# --- Azure CLI user-level via uv (pip-installable) ---
- name: Check if az is installed
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - iac_install_azure_cli
  ansible.builtin.shell: command -v az
  register: az_check
  changed_when: false
  failed_when: false

- name: Install Azure CLI via uv tool (user-level, no sudo)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - iac_install_azure_cli
    - az_check.rc != 0
  block:
    - name: Check if uv is available
      ansible.builtin.shell: command -v uv
      register: uv_check
      changed_when: false
      failed_when: false

    - name: Install azure-cli via uv tool
      when: uv_check.rc == 0
      ansible.builtin.command: uv tool install azure-cli
      register: az_uv_install
      changed_when: "'Installed' in az_uv_install.stdout"

    - name: Warn uv not available for Azure CLI
      when: uv_check.rc != 0
      ansible.builtin.debug:
        msg: "uv not found — cannot install Azure CLI in user-level mode. Install uv first or use sudo."
  rescue:
    - name: Warn Azure CLI user-level installation failed
      ansible.builtin.debug:
        msg: "Azure CLI user-level installation failed — skipping. Error: {{ ansible_failed_result.msg | default('unknown') }}"

# --- Terraform user-level via GitHub releases ---
- name: Check if terraform is installed
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - iac_install_terraform
  ansible.builtin.shell: command -v terraform
  register: terraform_check
  changed_when: false
  failed_when: false

- name: Install Terraform from releases.hashicorp.com (user-level)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - iac_install_terraform
    - terraform_check.rc != 0
    - iac_arch | trim != ''
  block:
    - name: Ensure ~/.local/bin exists (terraform)
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        state: directory
        mode: '0755'

    - name: Get latest Terraform version from checkpoint API
      ansible.builtin.uri:
        url: https://checkpoint-api.hashicorp.com/v1/check/terraform
        return_content: true
      register: terraform_version_check

    - name: Set Terraform version
      ansible.builtin.set_fact:
        terraform_version: "{{ terraform_version_check.json.current_version }}"

    - name: Download Terraform zip
      ansible.builtin.get_url:
        url: "https://releases.hashicorp.com/terraform/{{ terraform_version }}/terraform_{{ terraform_version }}_linux_{{ iac_arch | trim }}.zip"
        dest: /tmp/terraform.zip
        mode: '0644'
        timeout: 120
      retries: 3
      delay: 5

    - name: Extract Terraform to ~/.local/bin
      ansible.builtin.unarchive:
        src: /tmp/terraform.zip
        dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        remote_src: true

    - name: Clean up Terraform zip
      ansible.builtin.file:
        path: /tmp/terraform.zip
        state: absent
  rescue:
    - name: Warn Terraform user-level installation failed
      ansible.builtin.debug:
        msg: "Terraform user-level installation failed — skipping. Error: {{ ansible_failed_result.msg | default('unknown') }}"

    - name: Clean up Terraform temp files (rescue)
      ansible.builtin.file:
        path: /tmp/terraform.zip
        state: absent

# --- OpenTofu user-level via GitHub releases ---
- name: Check if tofu is installed
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - iac_install_opentofu
  ansible.builtin.shell: command -v tofu
  register: tofu_check
  changed_when: false
  failed_when: false

- name: Install OpenTofu from GitHub releases (user-level)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - iac_install_opentofu
    - tofu_check.rc != 0
    - iac_arch | trim != ''
  block:
    - name: Ensure ~/.local/bin exists (tofu)
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        state: directory
        mode: '0755'

    - name: Get latest OpenTofu release
      ansible.builtin.uri:
        url: https://api.github.com/repos/opentofu/opentofu/releases/latest
        return_content: true
      register: tofu_release

    - name: Set OpenTofu version (strip v prefix)
      ansible.builtin.set_fact:
        tofu_version: "{{ tofu_release.json.tag_name | regex_replace('^v', '') }}"

    - name: Download OpenTofu zip
      ansible.builtin.get_url:
        url: "https://github.com/opentofu/opentofu/releases/download/{{ tofu_release.json.tag_name }}/tofu_{{ tofu_version }}_linux_{{ iac_arch | trim }}.zip"
        dest: /tmp/tofu.zip
        mode: '0644'
        timeout: 120
      retries: 3
      delay: 5

    - name: Extract OpenTofu to ~/.local/bin
      ansible.builtin.unarchive:
        src: /tmp/tofu.zip
        dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        remote_src: true

    - name: Clean up OpenTofu zip
      ansible.builtin.file:
        path: /tmp/tofu.zip
        state: absent
  rescue:
    - name: Warn OpenTofu user-level installation failed
      ansible.builtin.debug:
        msg: "OpenTofu user-level installation failed — skipping. Error: {{ ansible_failed_result.msg | default('unknown') }}"

    - name: Clean up OpenTofu temp files (rescue)
      ansible.builtin.file:
        path: /tmp/tofu.zip
        state: absent

# Note: azure-cost-cli and other .NET global tools are handled by the
# dedicated `dotnet_tools` role (see dot_ansible/roles/dotnet_tools/), which
# installs the .NET SDK via mise and loops over `dotnet tool install --global`.
# Kept out of iac_tools so enabling IaC CLIs doesn't drag in .NET.
