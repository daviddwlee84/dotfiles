---
# Ruby gem CLI tools installation
# Ruby is installed via mise

# =============================================================================
# Install Ruby compile-time dependencies (requires sudo)
# =============================================================================

- name: Install Ruby compile dependencies (Debian/Ubuntu)
  when: ansible_facts["os_family"] == "Debian"
  become: true
  tags: [sudo]
  ansible.builtin.apt:
    name:
      - libffi-dev
      - libyaml-dev
    state: present
    update_cache: true
    cache_valid_time: 3600

# yum CLI instead of `ansible.builtin.yum:` so this works on CentOS 7
# (no dnf binary) — see pitfalls/centos7-ansible-yum-dnf-backend.md.
- name: Install Ruby compile dependencies (RedHat/CentOS) — yum CLI for CentOS 7 + Rocky/Alma compat
  when: ansible_facts["os_family"] == "RedHat"
  become: true
  tags: [sudo]
  # See pitfalls/centos7-ansible-yum-dnf-backend.md for why we avoid
  # `${#missing[@]}` (collides with Jinja2 comment syntax `{# #}`).
  ansible.builtin.shell: |
    set -e
    missing=()
    for p in libffi-devel libyaml-devel; do
      rpm -q "$p" >/dev/null 2>&1 || missing+=("$p")
    done
    if [ -z "${missing[*]:-}" ]; then
      echo "ALL_INSTALLED"
      exit 0
    fi
    yum install -y "${missing[@]}"
  args:
    executable: /bin/bash
  register: ruby_yum_result
  changed_when: "'ALL_INSTALLED' not in ruby_yum_result.stdout"
  ignore_errors: true

# =============================================================================
# Ensure Ruby is installed via mise
# =============================================================================

- name: Check for user-installed mise
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/mise"
  register: mise_user_install

- name: Set mise binary path
  ansible.builtin.set_fact:
    mise_bin: "{{ mise_user_install.stat.exists | ternary(ansible_facts['env']['HOME'] + '/.local/bin/mise', '/opt/homebrew/bin/mise' if ansible_facts['os_family'] == 'Darwin' else '/usr/local/bin/mise') }}"

- name: Install Ruby via mise
  ansible.builtin.command: "{{ mise_bin }} install ruby@3"
  args:
    creates: "{{ ansible_facts['env']['HOME'] }}/.local/share/mise/installs/ruby"
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:/opt/homebrew/bin:/usr/local/bin:{{ ansible_facts['env']['PATH'] }}"
  ignore_errors: true
  register: ruby_install_result

- name: Check if Ruby is available via mise shims
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/share/mise/shims/ruby"
  register: ruby_shim

# =============================================================================
# Install gem tools
# =============================================================================

- name: Install Ruby gem CLI tools via gem install
  when: ruby_shim.stat.exists
  ansible.builtin.command: gem install {{ item.name }}
  args:
    creates: "{{ ansible_facts['env']['HOME'] }}/.local/share/mise/shims/{{ item.binary }}"
  loop: "{{ ruby_gem_tools }}"
  loop_control:
    label: "{{ item.name }}"
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/share/mise/shims:{{ ansible_facts['env']['PATH'] }}"

# =============================================================================
# toolkami (single-file Ruby tool from GitHub)
# =============================================================================
# Managed by .chezmoiexternal.toml.tmpl as a `file` external pointing to
# raw.githubusercontent.com. chezmoi refreshes it weekly; nothing to do here.
