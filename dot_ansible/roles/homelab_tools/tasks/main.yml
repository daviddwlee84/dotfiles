---
# homelab_tools role — hardware-monitoring CLIs for physical servers.
# See docs/sysadmin/hardware.md and docs/sysadmin/helpers.md (#hardware).
#
# Tools: lm-sensors, smartmontools, ipmitool, nvme-cli, storcli.
#
# Two layers of gating:
#   1. This whole role is a no-op on non-Linux and inside VMs (BMC / RAID /
#      SMART sensors are meaningless there). The chezmoi `installHomelabTools`
#      prompt gates whether the `homelab_tools` tag runs at all (see
#      .chezmoiscripts/global/run_onchange_after_20_ansible_roles.sh.tmpl).
#   2. Each tool is then gated on whether its hardware is actually present, so
#      we never install storcli on a box with no MegaRAID controller, etc.

- name: Skip homelab_tools role on non-Linux
  when: ansible_facts["os_family"] not in ["Debian", "RedHat"]
  ansible.builtin.meta: end_play

- name: Skip homelab_tools role inside a virtual machine
  when: ansible_facts["virtualization_role"] | default("") == "guest"
  ansible.builtin.meta: end_play

# -----------------------------------------------------------------------------
# Prerequisites for detection (pciutils -> lspci, dmidecode -> DMI tables)
# -----------------------------------------------------------------------------

- name: Install detection prerequisites (Debian / Ubuntu)
  when: ansible_facts["os_family"] == "Debian"
  become: true
  tags: [sudo]
  ansible.builtin.apt:
    name:
      - pciutils
      - dmidecode
    state: present
    # Main-archive packages covered by base's best-effort cache refresh; don't
    # re-run apt-get update here (a broken/flaky source would abort the play).
    # See pitfalls/apt-update-fails-base-role-empty-error.md.
    update_cache: false

- name: Install detection prerequisites (RHEL / CentOS / Rocky / Alma)
  when: ansible_facts["os_family"] == "RedHat"
  become: true
  tags: [sudo]
  ansible.builtin.yum:
    name:
      - pciutils
      - dmidecode
    state: present

# -----------------------------------------------------------------------------
# Hardware detection — register facts that gate the per-tool installs below.
# All probes are read-only and never fail the play.
# -----------------------------------------------------------------------------

- name: Probe PCI devices for RAID controller (MegaRAID / LSI / Smart Array)
  ansible.builtin.shell: >-
    set -o pipefail;
    lspci -nn 2>/dev/null | grep -iE 'raid bus controller|megaraid|lsi logic|smart array' || true
  args:
    executable: /bin/bash
  register: homelab_raid_probe
  changed_when: false
  failed_when: false
  check_mode: false   # read-only probe; must run even during --check

- name: Probe PCI devices for NVMe controller
  ansible.builtin.shell: >-
    set -o pipefail;
    lspci -nn 2>/dev/null | grep -iE 'non-volatile memory controller|nvme' || true
  args:
    executable: /bin/bash
  register: homelab_nvme_probe
  changed_when: false
  failed_when: false
  check_mode: false   # read-only probe; must run even during --check

- name: Probe for a BMC / IPMI device (/dev/ipmi*)
  ansible.builtin.find:
    paths: /dev
    patterns: "ipmi*"
    file_type: any
  register: homelab_ipmi_dev

# liquidctl only pays for itself when there is a USB-controlled cooler or a
# telemetry-capable PSU to talk to. Match the vendor IDs that actually ship such
# devices (NZXT / Corsair / Asetek / EVGA), plus ASUS ROG AIOs by name — the ASUS
# vendor ID alone would false-positive on the board's own audio + Aura devices.
- name: Probe USB for a liquid cooler / telemetry-capable PSU
  ansible.builtin.shell: >-
    set -o pipefail;
    lsusb 2>/dev/null
    | grep -iE '\b(1e71|1b1c|2433|3842):|ryujin|ryuo|kraken|commander|hydro' || true
  args:
    executable: /bin/bash
  register: homelab_liquid_probe
  changed_when: false
  failed_when: false
  check_mode: false   # read-only probe; must run even during --check

- name: Probe DMI for an IPMI device (type 38) when no /dev/ipmi* present
  when: homelab_ipmi_dev.matched | default(0) | int == 0
  become: true
  tags: [sudo]
  ansible.builtin.shell: >-
    set -o pipefail;
    dmidecode -t 38 2>/dev/null | grep -i 'IPMI Device Information' || true
  args:
    executable: /bin/bash
  register: homelab_ipmi_dmi
  changed_when: false
  failed_when: false
  check_mode: false   # read-only probe; must run even during --check

- name: Consolidate hardware-presence facts
  ansible.builtin.set_fact:
    homelab_has_raid: "{{ (homelab_raid_probe.stdout | default('') | trim) | length > 0 }}"
    homelab_has_nvme: "{{ (homelab_nvme_probe.stdout | default('') | trim) | length > 0 }}"
    homelab_has_bmc: >-
      {{ (homelab_ipmi_dev.matched | default(0) | int > 0)
         or ((homelab_ipmi_dmi.stdout | default('') | trim) | length > 0) }}
    homelab_has_liquid: "{{ (homelab_liquid_probe.stdout | default('') | trim) | length > 0 }}"

- name: Show detected hardware
  ansible.builtin.debug:
    msg: >-
      homelab_tools detection — RAID controller: {{ homelab_has_raid }},
      NVMe: {{ homelab_has_nvme }}, BMC/IPMI: {{ homelab_has_bmc }},
      USB cooler/PSU: {{ homelab_has_liquid }}

# -----------------------------------------------------------------------------
# Always-useful installs on physical Linux (sensors + SMART work everywhere)
# -----------------------------------------------------------------------------

- name: Build base package list (lm-sensors + smartmontools)
  ansible.builtin.set_fact:
    homelab_pkgs: >-
      {{ (([('lm-sensors' if ansible_facts['os_family'] == 'Debian' else 'lm_sensors')]
            if homelab_install_lm_sensors else [])
          + (['smartmontools'] if homelab_install_smartmontools else [])
          + (['ipmitool'] if (homelab_install_ipmitool and homelab_has_bmc) else [])
          + (['nvme-cli'] if (homelab_install_nvme_cli and homelab_has_nvme) else [])
          + (['liquidctl'] if (homelab_install_liquidctl and homelab_has_liquid) else [])) }}

- name: Install homelab hardware tools (Debian / Ubuntu)
  when:
    - ansible_facts["os_family"] == "Debian"
    - homelab_pkgs | length > 0
  become: true
  tags: [sudo]
  ansible.builtin.apt:
    name: "{{ homelab_pkgs }}"
    state: present
    # Main-archive packages covered by base's best-effort cache refresh; don't
    # re-run apt-get update here (a broken/flaky source would abort the play).
    # See pitfalls/apt-update-fails-base-role-empty-error.md.
    update_cache: false

- name: Install homelab hardware tools (RHEL / CentOS / Rocky / Alma)
  when:
    - ansible_facts["os_family"] == "RedHat"
    - homelab_pkgs | length > 0
  become: true
  tags: [sudo]
  ansible.builtin.yum:
    name: "{{ homelab_pkgs }}"
    state: present

# -----------------------------------------------------------------------------
# storcli — only when a RAID controller is present. Not in distro repos, so
# this is a best-effort vendor/mirror download gated on `homelab_storcli_url`.
# -----------------------------------------------------------------------------

- name: Check whether storcli is already installed
  when: homelab_install_storcli and homelab_has_raid
  ansible.builtin.shell: command -v storcli || command -v storcli64 || true
  args:
    executable: /bin/bash
  register: homelab_storcli_check
  changed_when: false
  failed_when: false
  check_mode: false   # read-only probe; must run even during --check

- name: Install storcli from vendor URL (RAID present, not installed, URL set)
  when:
    - homelab_install_storcli
    - homelab_has_raid
    - (homelab_storcli_check.stdout | default('') | trim) | length == 0
    - homelab_storcli_url | length > 0
    - target_architecture in ['x86_64', 'amd64']
  block:
    - name: Ensure ~/.local/bin exists (storcli)
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        state: directory
        mode: "0755"

    - name: Download storcli archive
      ansible.builtin.get_url:
        url: "{{ homelab_storcli_url }}"
        dest: /tmp/storcli_dl
        mode: "0644"
        timeout: 120
      retries: 3
      delay: 5

    - name: Create storcli extract directory
      ansible.builtin.file:
        path: /tmp/storcli_extract
        state: directory
        mode: "0755"

    - name: Extract storcli archive
      ansible.builtin.unarchive:
        src: /tmp/storcli_dl
        dest: /tmp/storcli_extract
        remote_src: true

    - name: Find storcli binary in extracted tree
      ansible.builtin.find:
        paths: /tmp/storcli_extract
        patterns: "storcli,storcli64"
        file_type: file
        recurse: true
      register: homelab_storcli_find

    - name: Fail if storcli binary not found after extraction
      when: homelab_storcli_find.matched | default(0) | int == 0
      ansible.builtin.fail:
        msg: "storcli binary not found under /tmp/storcli_extract — check homelab_storcli_url"

    - name: Install storcli to ~/.local/bin
      ansible.builtin.copy:
        src: "{{ homelab_storcli_find.files[0].path }}"
        dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/storcli"
        mode: "0755"
        remote_src: true
  rescue:
    - name: Warn storcli install failed
      ansible.builtin.debug:
        msg: >-
          storcli install failed — skipping. Install manually (see
          docs/sysadmin/hardware.md "Installing storcli").
          Error: {{ ansible_failed_result.msg | default('unknown') }}
  always:
    - name: Clean up storcli temp files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/storcli_dl
        - /tmp/storcli_extract

- name: Hint when RAID present but storcli unavailable and no URL configured
  when:
    - homelab_install_storcli
    - homelab_has_raid
    - (homelab_storcli_check.stdout | default('') | trim) | length == 0
    - homelab_storcli_url | length == 0
  ansible.builtin.debug:
    msg: >-
      A RAID controller was detected but storcli is not installed and
      homelab_storcli_url is empty. Set that var to a reachable storcli tarball,
      or install manually — see docs/sysadmin/hardware.md "Installing storcli".

# -----------------------------------------------------------------------------
# Super-I/O module — the difference between "sensors installed" and "fans visible"
#
# Installing lm-sensors does NOT make the board's Super-I/O chip appear: that needs
# the nct6775 / it87 kernel module, and no distro loads it on its own. Until it is
# loaded, /sys/class/hwmon has CPU and NVMe temperatures but *zero fan channels* —
# which silently costs you pump RPM, the first thing `crash-blackbox report` looks
# for when a machine hard-powers-off. Detecting that months later, from an empty
# column, is exactly the failure a black box must not have.
#
# We do not run `sensors-detect` here — it probes I2C/SMBus buses and is not
# something to fire unattended. Instead: detect the chip that is already known to
# the kernel via modalias, and if a Super-I/O driver matches, persist it. If none
# matches, say so and point at the one-time manual step.
# -----------------------------------------------------------------------------

# Resolve the module that actually backs the fan channels rather than assuming
# nct6775 — ITE-based boards use it87, and writing the wrong name would leave a
# modules-load.d entry that fails silently at boot.
- name: Find the kernel module currently providing fan channels
  ansible.builtin.shell: >-
    set -o pipefail;
    for f in /sys/class/hwmon/hwmon*/fan*_input; do
      [ -e "$f" ] || continue;
      d=$(dirname "$f");
      m=$(readlink -f "$d/device/driver/module" 2>/dev/null);
      [ -n "$m" ] && basename "$m" && break;
    done || true
  args:
    executable: /bin/bash
  register: homelab_siochip
  changed_when: false
  failed_when: false
  check_mode: false   # read-only probe; must run even during --check

- name: Persist the Super-I/O module so fan channels survive a reboot
  when:
    - homelab_install_lm_sensors
    - (homelab_siochip.stdout | default('') | trim) | length > 0
  become: true
  tags: [sudo]
  ansible.builtin.copy:
    dest: /etc/modules-load.d/board-sensors.conf
    content: |
      # Managed by dotfiles (homelab_tools). Super-I/O chip driver — without this
      # the board's fan/pump tachometers are absent from /sys/class/hwmon, and a
      # dying pump becomes invisible to crash-blackbox.
      {{ homelab_siochip.stdout | trim }}
    mode: "0644"

- name: Hint when no fan channels are visible at all
  when: (homelab_siochip.stdout | default('') | trim) | length == 0
  ansible.builtin.debug:
    msg: >-
      No fan channels in /sys/class/hwmon — the Super-I/O module is not loaded, so
      pump/fan RPM is invisible (crash-blackbox cannot detect a dying pump). Run
      `sudo sensors-detect` once, answer YES to the safe probes, then re-run.

# -----------------------------------------------------------------------------
# Note: smartd / ipmievd services are intentionally NOT enabled. This repo is
# install-only (see CLAUDE.md "Install vs upgrade is split on purpose"); a
# monitoring/alerting timer would be a separate opt-in feature.
#
# `crash-blackbox` (dot_dotfiles/bin/) follows the same rule: the CLI ships on
# every machine, but its always-on recorder is a systemd service you enable by
# hand on the box you are debugging (`crash-blackbox install`). Nothing here
# starts a daemon for you. See docs/playbooks/random-hard-poweroff.md.
