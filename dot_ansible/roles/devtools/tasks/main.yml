# --- diffnav (user-level fallback) ---
- name: Re-check if diffnav is installed
  when: ansible_facts["os_family"] == "Debian"
  ansible.builtin.shell: command -v diffnav
  register: diffnav_recheck
  changed_when: false
  failed_when: false
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:/usr/local/bin:{{ ansible_facts['env']['PATH'] }}"

- name: Install diffnav from GitHub releases (user-level, no sudo)
  when:
    - ansible_facts["os_family"] == "Debian"
    - diffnav_recheck.rc != 0
    - diffnav_release_arch | default('') != ''
  block:
    - name: Ensure ~/.local/bin exists (diffnav)
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        state: directory
        mode: '0755'

    - name: Get latest diffnav release (user)
      ansible.builtin.uri:
        url: https://api.github.com/repos/dlvhdr/diffnav/releases/latest
        return_content: true
      register: diffnav_release_user

    - name: Download diffnav tarball (user)
      ansible.builtin.get_url:
        url: "https://github.com/dlvhdr/diffnav/releases/download/{{ diffnav_release_user.json.tag_name }}/diffnav_Linux_{{ diffnav_release_arch }}.tar.gz"
        dest: /tmp/diffnav.tar.gz
        mode: '0644'
        timeout: 120
      retries: 3
      delay: 5

    - name: Extract and install diffnav (user)
      ansible.builtin.shell: |
        set -euo pipefail
        rm -rf /tmp/diffnav-extract
        mkdir -p /tmp/diffnav-extract
        tar -xzf /tmp/diffnav.tar.gz -C /tmp/diffnav-extract
        diffnav_bin="$(find /tmp/diffnav-extract -type f -name diffnav | head -n 1)"
        install -m 0755 "$diffnav_bin" "{{ ansible_facts['env']['HOME'] }}/.local/bin/diffnav"
      args:
        executable: /bin/bash
      changed_when: true

    - name: Clean up diffnav temp files (user)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/diffnav.tar.gz
        - /tmp/diffnav-extract

  rescue:
    - name: Warn diffnav (user) installation failed
      ansible.builtin.debug:
        msg: "diffnav (user) installation failed (likely network timeout) - skipping"

    - name: Clean up diffnav (user) temp files after failure
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/diffnav.tar.gz
        - /tmp/diffnav-extract

