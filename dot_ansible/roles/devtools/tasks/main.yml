- name: Check if tldr is installed
  when: ansible_facts["os_family"] == "Debian"
  ansible.builtin.command: tldr --version
  register: tldr_check
  changed_when: false
  failed_when: false

- name: Check for system npm
  when:
    - ansible_facts["os_family"] == "Debian"
    - tldr_check.rc != 0
  ansible.builtin.command: command -v npm
  register: system_npm_check
  changed_when: false
  failed_when: false

- name: Install tldr via npm (Debian/Ubuntu, system-level)
  when:
    - ansible_facts["os_family"] == "Debian"
    - tldr_check.rc != 0
    - system_npm_check.rc == 0
  become: true
  tags: [sudo]
  community.general.npm:
    name: tldr
    global: true
    state: present
  ignore_errors: true

# --- tldr (user-level fallback) ---
- name: Re-check if tldr is installed
  when: ansible_facts["os_family"] == "Debian"
  ansible.builtin.shell: command -v tldr
  register: tldr_recheck
  changed_when: false
  failed_when: false

- name: Install tldr via mise npm (user-level, no sudo)
  when:
    - ansible_facts["os_family"] == "Debian"
    - tldr_recheck.rc != 0
  ansible.builtin.shell: |
    if [ -x "{{ ansible_facts['env']['HOME'] }}/.local/bin/mise" ]; then
      {{ ansible_facts['env']['HOME'] }}/.local/bin/mise exec -- npm install -g tldr
    elif command -v mise >/dev/null 2>&1; then
      mise exec -- npm install -g tldr
    else
      echo "mise not found, skipping tldr install" >&2
      exit 0
    fi
  args:
    executable: /bin/bash
  changed_when: true
  ignore_errors: true

# --- glow ---
- name: Check if glow is installed
  when: ansible_facts["os_family"] == "Debian"
  ansible.builtin.command: glow --version
  register: glow_check
  changed_when: false
  failed_when: false
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:/usr/local/bin:{{ ansible_facts['env']['PATH'] }}"

- name: Set glow release architecture
  when:
    - ansible_facts["os_family"] == "Debian"
    - glow_check.rc != 0
  ansible.builtin.set_fact:
    glow_release_arch: >-
      {{
        'x86_64' if target_architecture in ['x86_64', 'amd64']
        else 'arm64' if target_architecture in ['aarch64', 'arm64']
        else 'arm' if target_architecture in ['armv7l', 'armv6l', 'arm']
        else ''
      }}

- name: Skip glow on unsupported architecture
  when:
    - ansible_facts["os_family"] == "Debian"
    - glow_check.rc != 0
    - glow_release_arch == ''
  ansible.builtin.debug:
    msg: "glow skipped: no release for {{ target_architecture }}"

- name: Install glow from GitHub releases (Debian/Ubuntu, user-level)
  when:
    - ansible_facts["os_family"] == "Debian"
    - glow_check.rc != 0
    - glow_release_arch != ''
  block:
    - name: Ensure ~/.local/bin exists (glow)
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        state: directory
        mode: '0755'

    - name: Get latest glow release
      ansible.builtin.uri:
        url: https://api.github.com/repos/charmbracelet/glow/releases/latest
        return_content: true
      register: glow_release

    - name: Set glow version facts
      ansible.builtin.set_fact:
        glow_version: "{{ glow_release.json.tag_name | regex_replace('^v', '') }}"

    - name: Download glow tarball
      ansible.builtin.get_url:
        url: "https://github.com/charmbracelet/glow/releases/download/{{ glow_release.json.tag_name }}/glow_{{ glow_version }}_Linux_{{ glow_release_arch }}.tar.gz"
        dest: /tmp/glow.tar.gz
        mode: '0644'
        timeout: 120
      retries: 3
      delay: 5

    - name: Create glow temp directory
      ansible.builtin.file:
        path: /tmp/glow
        state: directory
        mode: '0755'

    - name: Extract glow
      ansible.builtin.unarchive:
        src: /tmp/glow.tar.gz
        dest: /tmp/glow
        remote_src: true

    - name: Find glow binary
      ansible.builtin.find:
        paths: /tmp/glow
        patterns: glow
        file_type: file
        recurse: true
      register: glow_find

    - name: Fail if glow binary was not found in extracted archive
      when: glow_find.matched | default(0) | int == 0
      ansible.builtin.fail:
        msg: "glow binary was not found under /tmp/glow after extraction"

    - name: Install glow to ~/.local/bin
      ansible.builtin.copy:
        src: "{{ glow_find.files[0].path }}"
        dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/glow"
        mode: '0755'
        remote_src: true

    - name: Clean up glow temp files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/glow.tar.gz
        - /tmp/glow

  rescue:
    - name: Warn glow installation failed
      ansible.builtin.debug:
        msg: "glow installation failed (likely network timeout) - skipping"

    - name: Clean up glow temp files after failure
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/glow.tar.gz
        - /tmp/glow

- name: Verify glow is available
  when: ansible_facts["os_family"] == "Debian"
  ansible.builtin.command: glow --version
  changed_when: false
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:/usr/local/bin:{{ ansible_facts['env']['PATH'] }}"

# --- duckdb ---
- name: Check if DuckDB CLI is installed
  when: ansible_facts["os_family"] == "Debian"
  ansible.builtin.command: duckdb --version
  register: duckdb_check
  changed_when: false
  failed_when: false
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:/usr/local/bin:{{ ansible_facts['env']['PATH'] }}"

- name: Install DuckDB CLI via official installer (Debian/Ubuntu, user-level)
  when:
    - ansible_facts["os_family"] == "Debian"
    - duckdb_check.rc != 0
    - target_architecture in ['x86_64', 'amd64', 'aarch64', 'arm64']
  block:
    - name: Ensure ~/.local/bin exists (duckdb)
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        state: directory
        mode: '0755'

    - name: Set DuckDB release architecture
      ansible.builtin.set_fact:
        duckdb_release_arch: >-
          {{
            'amd64' if target_architecture in ['x86_64', 'amd64']
            else 'arm64' if target_architecture in ['aarch64', 'arm64']
            else ''
          }}

    - name: Get latest DuckDB release
      ansible.builtin.uri:
        url: https://api.github.com/repos/duckdb/duckdb/releases/latest
        return_content: true
      register: duckdb_release

    - name: Set DuckDB download URL facts
      ansible.builtin.set_fact:
        duckdb_download_url: >-
          {{
            (
              duckdb_release.json.assets
              | selectattr('name', 'equalto', 'duckdb_cli-linux-' ~ duckdb_release_arch ~ '.zip')
              | map(attribute='browser_download_url')
              | first
            )
            | default('', true)
          }}

    - name: Fail if DuckDB download URL could not be determined
      when: duckdb_download_url == ''
      ansible.builtin.fail:
        msg: "Could not determine DuckDB download URL for architecture {{ duckdb_release_arch }} from the latest GitHub release"

    - name: Download DuckDB CLI zip
      ansible.builtin.get_url:
        url: "{{ duckdb_download_url }}"
        dest: /tmp/duckdb_cli.zip
        mode: '0644'
        timeout: 120
      retries: 3
      delay: 5

    - name: Create DuckDB temp directory
      ansible.builtin.file:
        path: /tmp/duckdb
        state: directory
        mode: '0755'

    - name: Extract DuckDB CLI zip
      ansible.builtin.unarchive:
        src: /tmp/duckdb_cli.zip
        dest: /tmp/duckdb
        remote_src: true

    - name: Find DuckDB binary
      ansible.builtin.find:
        paths: /tmp/duckdb
        patterns: duckdb
        file_type: file
        recurse: true
      register: duckdb_find

    - name: Fail if DuckDB binary was not found in extracted archive
      when: duckdb_find.matched | default(0) | int == 0
      ansible.builtin.fail:
        msg: "DuckDB binary was not found under /tmp/duckdb after extraction"

    - name: Install DuckDB CLI
      ansible.builtin.copy:
        src: "{{ duckdb_find.files[0].path }}"
        dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/duckdb"
        mode: '0755'
        remote_src: true

    - name: Clean up DuckDB temp files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/duckdb_cli.zip
        - /tmp/duckdb

  rescue:
    - name: Warn DuckDB installation failed
      ansible.builtin.debug:
        msg: "DuckDB installation failed (likely network timeout) - skipping"

    - name: Clean up DuckDB temp files after failure
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/duckdb_cli.zip
        - /tmp/duckdb

- name: Verify DuckDB CLI is available
  when:
    - ansible_facts["os_family"] == "Debian"
    - target_architecture in ['x86_64', 'amd64', 'aarch64', 'arm64']
  ansible.builtin.command: duckdb --version
  changed_when: false
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:/usr/local/bin:{{ ansible_facts['env']['PATH'] }}"

# --- rclone ---
- name: Check if rclone is installed
  when: ansible_facts["os_family"] == "Debian"
  ansible.builtin.command: rclone version
  register: rclone_check
  changed_when: false
  failed_when: false
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:/usr/local/bin:{{ ansible_facts['env']['PATH'] }}"

- name: Set rclone release architecture
  when:
    - ansible_facts["os_family"] == "Debian"
    - rclone_check.rc != 0
  ansible.builtin.set_fact:
    rclone_release_arch: >-
      {{
        'amd64' if target_architecture in ['x86_64', 'amd64']
        else 'arm64' if target_architecture in ['aarch64', 'arm64']
        else 'arm-v7' if target_architecture == 'armv7l'
        else 'arm-v6' if target_architecture == 'armv6l'
        else ''
      }}

- name: Fail on unsupported architecture for rclone
  when:
    - ansible_facts["os_family"] == "Debian"
    - rclone_check.rc != 0
    - rclone_release_arch == ''
  ansible.builtin.fail:
    msg: "Unsupported architecture for rclone official downloads: {{ target_architecture }}"

- name: Install rclone from official downloads (Debian/Ubuntu, user-level)
  when:
    - ansible_facts["os_family"] == "Debian"
    - rclone_check.rc != 0
    - rclone_release_arch != ''
  block:
    - name: Ensure ~/.local/bin exists (rclone)
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        state: directory
        mode: '0755'

    - name: Download rclone archive
      ansible.builtin.get_url:
        url: "https://downloads.rclone.org/rclone-current-linux-{{ rclone_release_arch }}.zip"
        dest: /tmp/rclone.zip
        mode: '0644'
        force: true
        timeout: 120
      retries: 3
      delay: 5

    - name: Install rclone to ~/.local/bin
      ansible.builtin.shell: |
        set -e
        rm -rf /tmp/rclone-extract
        mkdir -p /tmp/rclone-extract
        python3 -m zipfile -e /tmp/rclone.zip /tmp/rclone-extract
        cp /tmp/rclone-extract/rclone-*-linux-{{ rclone_release_arch }}/rclone "{{ ansible_facts['env']['HOME'] }}/.local/bin/rclone"
        chmod 0755 "{{ ansible_facts['env']['HOME'] }}/.local/bin/rclone"
      args:
        executable: /bin/bash
      changed_when: true

    - name: Clean up rclone temp files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/rclone.zip
        - /tmp/rclone-extract

- name: Verify rclone is available
  when: ansible_facts["os_family"] == "Debian"
  ansible.builtin.command: rclone version
  changed_when: false
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:/usr/local/bin:{{ ansible_facts['env']['PATH'] }}"

