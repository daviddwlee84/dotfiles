# --- sesh (tmux session manager) ---
- name: Check if sesh is installed
  when: ansible_facts["os_family"] == "Debian"
  ansible.builtin.command: sesh --version
  register: sesh_check
  changed_when: false
  failed_when: false

- name: Install sesh from GitHub releases (Debian/Ubuntu, user-level)
  when:
    - ansible_facts["os_family"] == "Debian"
    - sesh_check.rc != 0
    - target_architecture in ['x86_64', 'amd64', 'aarch64', 'arm64']
  block:
    - name: Ensure ~/.local/bin exists (sesh)
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        state: directory
        mode: '0755'

    - name: Get latest sesh release
      ansible.builtin.uri:
        url: https://api.github.com/repos/joshmedeski/sesh/releases/latest
        return_content: true
      register: sesh_release

    - name: Set sesh architecture mapping
      ansible.builtin.set_fact:
        sesh_arch: >-
          {{
            'x86_64' if target_architecture in ['x86_64', 'amd64']
            else 'arm64' if target_architecture in ['aarch64', 'arm64']
            else ''
          }}

    - name: Skip sesh on unsupported architecture
      when: sesh_arch | trim == ''
      ansible.builtin.debug:
        msg: "sesh skipped: no release for {{ target_architecture }}"

    - name: Set sesh download URL facts
      ansible.builtin.set_fact:
        sesh_download_url: >-
          {{
            (
              sesh_release.json.assets
              | selectattr('name', 'equalto', 'sesh_Linux_' ~ sesh_arch ~ '.tar.gz')
              | map(attribute='browser_download_url')
              | first
            )
            | default('', true)
          }}

    - name: Skip sesh if download URL could not be determined
      when: sesh_download_url | trim == ''
      ansible.builtin.debug:
        msg: "sesh skipped: could not determine download URL for architecture {{ sesh_arch }}"

    - name: Download sesh tarball
      ansible.builtin.get_url:
        url: "{{ sesh_download_url }}"
        dest: /tmp/sesh.tar.gz
        mode: '0644'
        timeout: 120
      retries: 3
      delay: 5

    - name: Create sesh temp directory
      ansible.builtin.file:
        path: /tmp/sesh
        state: directory
        mode: '0755'

    - name: Extract sesh
      ansible.builtin.unarchive:
        src: /tmp/sesh.tar.gz
        dest: /tmp/sesh
        remote_src: true

    - name: Find sesh binary
      ansible.builtin.find:
        paths: /tmp/sesh
        patterns: sesh
        file_type: file
        recurse: true
      register: sesh_find

    - name: Fail if sesh binary was not found in extracted archive
      when: sesh_find.matched | default(0) | int == 0
      ansible.builtin.fail:
        msg: "sesh binary was not found under /tmp/sesh after extraction"

    - name: Install sesh to ~/.local/bin
      ansible.builtin.copy:
        src: "{{ sesh_find.files[0].path }}"
        dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/sesh"
        mode: '0755'
        remote_src: true

    - name: Clean up sesh temp files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/sesh.tar.gz
        - /tmp/sesh
        - /tmp/README.md
        - /tmp/LICENSE

  rescue:
    - name: Warn sesh installation failed
      ansible.builtin.debug:
        msg: "sesh installation failed (likely network timeout) - skipping"

    - name: Clean up sesh temp files after failure
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/sesh.tar.gz
        - /tmp/sesh
        - /tmp/README.md
        - /tmp/LICENSE

