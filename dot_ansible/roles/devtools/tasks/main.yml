# --- duckdb ---
- name: Check if DuckDB CLI is installed
  when: ansible_facts["os_family"] == "Debian"
  ansible.builtin.command: duckdb --version
  register: duckdb_check
  changed_when: false
  failed_when: false
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:/usr/local/bin:{{ ansible_facts['env']['PATH'] }}"

- name: Install DuckDB CLI via official installer (Debian/Ubuntu, user-level)
  when:
    - ansible_facts["os_family"] == "Debian"
    - duckdb_check.rc != 0
    - target_architecture in ['x86_64', 'amd64', 'aarch64', 'arm64']
  block:
    - name: Ensure ~/.local/bin exists (duckdb)
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        state: directory
        mode: '0755'

    - name: Set DuckDB release architecture
      ansible.builtin.set_fact:
        duckdb_release_arch: >-
          {{
            'amd64' if target_architecture in ['x86_64', 'amd64']
            else 'arm64' if target_architecture in ['aarch64', 'arm64']
            else ''
          }}

    - name: Get latest DuckDB release
      ansible.builtin.uri:
        url: https://api.github.com/repos/duckdb/duckdb/releases/latest
        return_content: true
      register: duckdb_release

    - name: Set DuckDB download URL facts
      ansible.builtin.set_fact:
        duckdb_download_url: >-
          {{
            (
              duckdb_release.json.assets
              | selectattr('name', 'equalto', 'duckdb_cli-linux-' ~ duckdb_release_arch ~ '.zip')
              | map(attribute='browser_download_url')
              | first
            )
            | default('', true)
          }}

    - name: Fail if DuckDB download URL could not be determined
      when: duckdb_download_url == ''
      ansible.builtin.fail:
        msg: "Could not determine DuckDB download URL for architecture {{ duckdb_release_arch }} from the latest GitHub release"

    - name: Download DuckDB CLI zip
      ansible.builtin.get_url:
        url: "{{ duckdb_download_url }}"
        dest: /tmp/duckdb_cli.zip
        mode: '0644'
        timeout: 120
      retries: 3
      delay: 5

    - name: Create DuckDB temp directory
      ansible.builtin.file:
        path: /tmp/duckdb
        state: directory
        mode: '0755'

    - name: Extract DuckDB CLI zip
      ansible.builtin.unarchive:
        src: /tmp/duckdb_cli.zip
        dest: /tmp/duckdb
        remote_src: true

    - name: Find DuckDB binary
      ansible.builtin.find:
        paths: /tmp/duckdb
        patterns: duckdb
        file_type: file
        recurse: true
      register: duckdb_find

    - name: Fail if DuckDB binary was not found in extracted archive
      when: duckdb_find.matched | default(0) | int == 0
      ansible.builtin.fail:
        msg: "DuckDB binary was not found under /tmp/duckdb after extraction"

    - name: Install DuckDB CLI
      ansible.builtin.copy:
        src: "{{ duckdb_find.files[0].path }}"
        dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/duckdb"
        mode: '0755'
        remote_src: true

    - name: Clean up DuckDB temp files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/duckdb_cli.zip
        - /tmp/duckdb

  rescue:
    - name: Warn DuckDB installation failed
      ansible.builtin.debug:
        msg: "DuckDB installation failed (likely network timeout) - skipping"

    - name: Clean up DuckDB temp files after failure
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/duckdb_cli.zip
        - /tmp/duckdb

- name: Verify DuckDB CLI is available
  when:
    - ansible_facts["os_family"] == "Debian"
    - target_architecture in ['x86_64', 'amd64', 'aarch64', 'arm64']
  ansible.builtin.command: duckdb --version
  changed_when: false
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:/usr/local/bin:{{ ansible_facts['env']['PATH'] }}"

# --- rclone ---
- name: Check if rclone is installed
  when: ansible_facts["os_family"] == "Debian"
  ansible.builtin.command: rclone version
  register: rclone_check
  changed_when: false
  failed_when: false
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:/usr/local/bin:{{ ansible_facts['env']['PATH'] }}"

- name: Set rclone release architecture
  when:
    - ansible_facts["os_family"] == "Debian"
    - rclone_check.rc != 0
  ansible.builtin.set_fact:
    rclone_release_arch: >-
      {{
        'amd64' if target_architecture in ['x86_64', 'amd64']
        else 'arm64' if target_architecture in ['aarch64', 'arm64']
        else 'arm-v7' if target_architecture == 'armv7l'
        else 'arm-v6' if target_architecture == 'armv6l'
        else ''
      }}

- name: Fail on unsupported architecture for rclone
  when:
    - ansible_facts["os_family"] == "Debian"
    - rclone_check.rc != 0
    - rclone_release_arch == ''
  ansible.builtin.fail:
    msg: "Unsupported architecture for rclone official downloads: {{ target_architecture }}"

- name: Install rclone from official downloads (Debian/Ubuntu, user-level)
  when:
    - ansible_facts["os_family"] == "Debian"
    - rclone_check.rc != 0
    - rclone_release_arch != ''
  block:
    - name: Ensure ~/.local/bin exists (rclone)
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        state: directory
        mode: '0755'

    - name: Download rclone archive
      ansible.builtin.get_url:
        url: "https://downloads.rclone.org/rclone-current-linux-{{ rclone_release_arch }}.zip"
        dest: /tmp/rclone.zip
        mode: '0644'
        force: true
        timeout: 120
      retries: 3
      delay: 5

    - name: Install rclone to ~/.local/bin
      ansible.builtin.shell: |
        set -e
        rm -rf /tmp/rclone-extract
        mkdir -p /tmp/rclone-extract
        python3 -m zipfile -e /tmp/rclone.zip /tmp/rclone-extract
        cp /tmp/rclone-extract/rclone-*-linux-{{ rclone_release_arch }}/rclone "{{ ansible_facts['env']['HOME'] }}/.local/bin/rclone"
        chmod 0755 "{{ ansible_facts['env']['HOME'] }}/.local/bin/rclone"
      args:
        executable: /bin/bash
      changed_when: true

    - name: Clean up rclone temp files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/rclone.zip
        - /tmp/rclone-extract

- name: Verify rclone is available
  when: ansible_facts["os_family"] == "Debian"
  ansible.builtin.command: rclone version
  changed_when: false
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:/usr/local/bin:{{ ansible_facts['env']['PATH'] }}"

# --- thefuck ---
# NOTE: thefuck is now installed via uv tool (python_uv_tools role)
# This avoids conda/virtualenv Python path conflicts

# --- shellcheck + shfmt ---
# Shell linting / formatting. macOS gets both via brew (block above).
# Linux: shellcheck is in standard Debian/Ubuntu apt; shfmt is a Go binary
# not in apt main — best-effort install via Linuxbrew if present, else the
# user can `go install mvdan.cc/sh/v3/cmd/shfmt@latest` or rely on the
# pre-commit-shfmt hook which bundles its own binary.
# actionlint (GitHub Actions linter) rides the same Linuxbrew best-effort
# path — not in apt; on non-Linuxbrew Linux hosts the rhysd/actionlint
# pre-commit hook still lints workflows (bundles its own binary via Go).
- name: Install shellcheck (Debian/Ubuntu)
  when: ansible_facts["os_family"] == "Debian"
  become: true
  tags: [sudo]
  ansible.builtin.apt:
    name: shellcheck
    state: present

- name: Detect Linuxbrew for shfmt (Debian/Ubuntu)
  when: ansible_facts["os_family"] == "Debian"
  ansible.builtin.shell: command -v brew || true
  args:
    executable: /bin/bash
  register: shfmt_brew_probe
  changed_when: false

- name: Install shfmt via Linuxbrew when available (Debian/Ubuntu)
  when:
    - ansible_facts["os_family"] == "Debian"
    - shfmt_brew_probe.stdout | default('') | trim != ''
  community.general.homebrew:
    name: shfmt
    state: present

- name: Install actionlint via Linuxbrew when available (Debian/Ubuntu)
  when:
    - ansible_facts["os_family"] == "Debian"
    - shfmt_brew_probe.stdout | default('') | trim != ''
  community.general.homebrew:
    name: actionlint
    state: present

# --- direnv ---
- name: Install direnv (Debian/Ubuntu)
  when: ansible_facts["os_family"] == "Debian"
  become: true
  tags: [sudo]
  ansible.builtin.apt:
    name: direnv
    state: present

- name: Check installed direnv version
  when: ansible_facts["os_family"] == "Debian"
  ansible.builtin.shell: |
    if [ -x "{{ ansible_facts['env']['HOME'] }}/.local/bin/direnv" ]; then
      "{{ ansible_facts['env']['HOME'] }}/.local/bin/direnv" --version | sed 's/^v//'
    elif command -v direnv >/dev/null 2>&1; then
      direnv --version | sed 's/^v//'
    else
      echo "0.0.0"
    fi
  args:
    executable: /bin/bash
  register: direnv_version
  changed_when: false

- name: Set direnv release architecture
  when:
    - ansible_facts["os_family"] == "Debian"
    - direnv_version.stdout | trim is version('2.32.1', '<')
  ansible.builtin.set_fact:
    direnv_release_arch: >-
      {{
        'amd64' if target_architecture in ['x86_64', 'amd64']
        else 'arm64' if target_architecture in ['aarch64', 'arm64']
        else 'arm' if target_architecture in ['armv7l', 'armv6l', 'arm']
        else target_architecture
      }}

- name: Install direnv from GitHub releases (user-level fallback, min v2.32.1)
  when:
    - ansible_facts["os_family"] == "Debian"
    - direnv_version.stdout | trim is version('2.32.1', '<')
  block:
    - name: Ensure ~/.local/bin exists (direnv)
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        state: directory
        mode: '0755'

    - name: Get latest direnv release
      ansible.builtin.uri:
        url: https://api.github.com/repos/direnv/direnv/releases/latest
        return_content: true
      register: direnv_release

    - name: Download direnv binary (user)
      ansible.builtin.get_url:
        url: "https://github.com/direnv/direnv/releases/download/{{ direnv_release.json.tag_name }}/direnv.linux-{{ direnv_release_arch }}"
        dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/direnv"
        mode: '0755'
        timeout: 120
      retries: 3
      delay: 5

  rescue:
    - name: Warn direnv installation failed
      ansible.builtin.debug:
        msg: "direnv installation failed (likely network timeout) - skipping"

# --- yazi ---
- name: Check if yazi is installed
  when: ansible_facts["os_family"] == "Debian"
  ansible.builtin.command: yazi --version
  register: yazi_check
  changed_when: false
  failed_when: false

- name: Install yazi from GitHub releases (Debian/Ubuntu)
  # Upstream ships musl `.deb` assets for x86_64 and aarch64; use those over
  # `unknown-linux-gnu.zip` so Jammy (glibc 2.35) stays compatible even when
  # upstream CI bumps to a newer glibc. See docs/linux-package-sources.md.
  when:
    - ansible_facts["os_family"] == "Debian"
    - yazi_check.rc != 0
    - target_architecture in ['x86_64', 'amd64', 'aarch64', 'arm64']
  become: true
  tags: [sudo]
  block:
    - name: Get latest yazi release
      ansible.builtin.uri:
        url: https://api.github.com/repos/sxyazi/yazi/releases/latest
        return_content: true
      register: yazi_release

    - name: Download yazi musl .deb package
      ansible.builtin.get_url:
        url: "https://github.com/sxyazi/yazi/releases/download/{{ yazi_release.json.tag_name }}/yazi-{{ target_architecture }}-unknown-linux-musl.deb"
        dest: /tmp/yazi.deb
        mode: '0644'
        force: true
        timeout: 120
      retries: 3
      delay: 5

    - name: Install yazi .deb package
      ansible.builtin.apt:
        deb: /tmp/yazi.deb

    - name: Clean up yazi .deb
      ansible.builtin.file:
        path: /tmp/yazi.deb
        state: absent

  rescue:
    - name: Warn yazi installation failed
      ansible.builtin.debug:
        msg: "yazi installation failed (likely network timeout) - skipping"

    - name: Clean up yazi temp files after failure
      ansible.builtin.file:
        path: /tmp/yazi.deb
        state: absent

# --- yazi (user-level fallback) ---
# Gate broadened to RedHat per pitfalls/centos7-noroot.md — yazi ships
# `-unknown-linux-musl.zip` and works on glibc 2.17.
- name: Re-check if yazi is installed
  when: ansible_facts["os_family"] in ["Debian", "RedHat"]
  ansible.builtin.shell: command -v yazi
  register: yazi_recheck
  changed_when: false
  failed_when: false

- name: Install yazi from GitHub releases (user-level, no sudo)
  # Prefer the musl .zip asset over unknown-linux-gnu.zip. See sudo-path
  # comment above for the glibc rationale.
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - yazi_recheck.rc != 0
    - target_architecture in ['x86_64', 'amd64', 'aarch64', 'arm64']
  block:
    - name: Ensure ~/.local/bin exists (yazi)
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        state: directory
        mode: '0755'

    - name: Get latest yazi release (user)
      ansible.builtin.uri:
        url: https://api.github.com/repos/sxyazi/yazi/releases/latest
        return_content: true
      register: yazi_release_user

    - name: Download yazi musl binary (user)
      ansible.builtin.get_url:
        url: "https://github.com/sxyazi/yazi/releases/download/{{ yazi_release_user.json.tag_name }}/yazi-{{ target_architecture }}-unknown-linux-musl.zip"
        dest: /tmp/yazi.zip
        mode: '0644'
        force: true
        timeout: 120
      retries: 3
      delay: 5

    - name: Extract and install yazi (user)
      ansible.builtin.shell: |
        cd /tmp
        rm -rf /tmp/yazi-{{ target_architecture }}-unknown-linux-*
        python3 -m zipfile -e yazi.zip .
        cp /tmp/yazi-{{ target_architecture }}-unknown-linux-musl/yazi {{ ansible_facts['env']['HOME'] }}/.local/bin/yazi
        chmod 755 {{ ansible_facts['env']['HOME'] }}/.local/bin/yazi
      args:
        executable: /bin/bash
      changed_when: true

    - name: Clean up yazi files (user)
      ansible.builtin.shell: |
        rm -f /tmp/yazi.zip
        rm -rf /tmp/yazi-{{ target_architecture }}-unknown-linux-*
      args:
        executable: /bin/bash
      changed_when: false

  rescue:
    - name: Warn yazi (user) installation failed
      ansible.builtin.debug:
        msg: "yazi (user) installation failed (likely network timeout) - skipping"

    - name: Clean up yazi (user) temp files after failure
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/yazi.zip

# --- superfile ---
- name: Check if superfile (spf) is installed
  when: ansible_facts["os_family"] == "Debian"
  ansible.builtin.command: spf --version
  register: spf_check
  changed_when: false
  failed_when: false

- name: Map target_architecture to superfile arch name
  when:
    - ansible_facts["os_family"] == "Debian"
    - spf_check.rc != 0
    - target_architecture in ['x86_64', 'amd64', 'aarch64', 'arm64']
  ansible.builtin.set_fact:
    spf_arch: "{{ {'x86_64': 'amd64', 'amd64': 'amd64', 'aarch64': 'arm64', 'arm64': 'arm64'}[target_architecture] }}"

- name: Install superfile from GitHub releases (Debian/Ubuntu)
  when:
    - ansible_facts["os_family"] == "Debian"
    - spf_check.rc != 0
    - target_architecture in ['x86_64', 'amd64', 'aarch64', 'arm64']
  become: true
  tags: [sudo]
  block:
    - name: Get latest superfile release
      ansible.builtin.uri:
        url: https://api.github.com/repos/yorukot/superfile/releases/latest
        return_content: true
      register: spf_release

    - name: Set superfile version fact
      ansible.builtin.set_fact:
        spf_version: "{{ spf_release.json.tag_name | regex_replace('^v', '') }}"

    - name: Download superfile tarball
      ansible.builtin.get_url:
        url: "https://github.com/yorukot/superfile/releases/download/v{{ spf_version }}/superfile-linux-v{{ spf_version }}-{{ spf_arch }}.tar.gz"
        dest: /tmp/superfile.tar.gz
        mode: '0644'
        force: true
        timeout: 120
      retries: 3
      delay: 5

    - name: Extract and install superfile
      ansible.builtin.shell: |
        cd /tmp
        rm -rf /tmp/dist
        tar xzf superfile.tar.gz
        cp /tmp/dist/superfile-linux-v{{ spf_version }}-{{ spf_arch }}/spf /usr/local/bin/spf
        chmod 755 /usr/local/bin/spf
      args:
        executable: /bin/bash
      changed_when: true

    - name: Clean up superfile files
      ansible.builtin.shell: |
        rm -f /tmp/superfile.tar.gz
        rm -rf /tmp/dist
      args:
        executable: /bin/bash
      changed_when: false

  rescue:
    - name: Warn superfile installation failed
      ansible.builtin.debug:
        msg: "superfile installation failed (likely network timeout) - skipping"

    - name: Clean up superfile temp files after failure
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/superfile.tar.gz
        - /tmp/dist

