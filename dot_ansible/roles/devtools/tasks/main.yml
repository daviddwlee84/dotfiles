      loop:
        - /tmp/git-graph.tar.gz
        - /tmp/git-graph

# --- tldr ---
- name: Check if tldr is installed
  when: ansible_facts["os_family"] == "Debian"
  ansible.builtin.command: tldr --version
  register: tldr_check
  changed_when: false
  failed_when: false

- name: Check for system npm
  when:
    - ansible_facts["os_family"] == "Debian"
    - tldr_check.rc != 0
  ansible.builtin.command: command -v npm
  register: system_npm_check
  changed_when: false
  failed_when: false

- name: Install tldr via npm (Debian/Ubuntu, system-level)
  when:
    - ansible_facts["os_family"] == "Debian"
    - tldr_check.rc != 0
    - system_npm_check.rc == 0
  become: true
  tags: [sudo]
  community.general.npm:
    name: tldr
    global: true
    state: present
  ignore_errors: true

# --- tldr (user-level fallback) ---
# Gate broadened to RedHat per pitfalls/centos7-noroot.md — but note this
# uses `mise exec -- npm`, and `dot_config/mise/config.toml.tmpl` omits node
# on oldEL (CentOS 7) per the glibc 2.17 baseline. On EL7 mise falls back
# to system node (often missing or too old) and this task no-ops via the
# `mise not found` branch. Live with it; tldr is non-critical.
- name: Re-check if tldr is installed
  when: ansible_facts["os_family"] in ["Debian", "RedHat"]
  ansible.builtin.shell: command -v tldr
  register: tldr_recheck
  changed_when: false
  failed_when: false

- name: Install tldr via mise npm (user-level, no sudo)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - tldr_recheck.rc != 0
  ansible.builtin.shell: |
    if [ -x "{{ ansible_facts['env']['HOME'] }}/.local/bin/mise" ]; then
      {{ ansible_facts['env']['HOME'] }}/.local/bin/mise exec -- npm install -g tldr
    elif command -v mise >/dev/null 2>&1; then
      mise exec -- npm install -g tldr
    else
      echo "mise not found, skipping tldr install" >&2
      exit 0
    fi
  args:
    executable: /bin/bash
  changed_when: true
  ignore_errors: true

# --- glow ---
- name: Check if glow is installed
  when: ansible_facts["os_family"] == "Debian"
  ansible.builtin.command: glow --version
  register: glow_check
  changed_when: false
  failed_when: false
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:/usr/local/bin:{{ ansible_facts['env']['PATH'] }}"

- name: Set glow release architecture
  when:
    - ansible_facts["os_family"] == "Debian"
    - glow_check.rc != 0
  ansible.builtin.set_fact:
    glow_release_arch: >-
      {{
        'x86_64' if target_architecture in ['x86_64', 'amd64']
        else 'arm64' if target_architecture in ['aarch64', 'arm64']
        else 'arm' if target_architecture in ['armv7l', 'armv6l', 'arm']
        else ''
      }}

- name: Skip glow on unsupported architecture
  when:
    - ansible_facts["os_family"] == "Debian"
    - glow_check.rc != 0
    - glow_release_arch == ''
  ansible.builtin.debug:
    msg: "glow skipped: no release for {{ target_architecture }}"

- name: Install glow from GitHub releases (Debian/Ubuntu, user-level)
  when:
    - ansible_facts["os_family"] == "Debian"
    - glow_check.rc != 0
    - glow_release_arch != ''
  block:
    - name: Ensure ~/.local/bin exists (glow)
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        state: directory
        mode: '0755'

    - name: Get latest glow release
      ansible.builtin.uri:
        url: https://api.github.com/repos/charmbracelet/glow/releases/latest
        return_content: true
      register: glow_release

    - name: Set glow version facts
      ansible.builtin.set_fact:
        glow_version: "{{ glow_release.json.tag_name | regex_replace('^v', '') }}"

    - name: Download glow tarball
      ansible.builtin.get_url:
        url: "https://github.com/charmbracelet/glow/releases/download/{{ glow_release.json.tag_name }}/glow_{{ glow_version }}_Linux_{{ glow_release_arch }}.tar.gz"
        dest: /tmp/glow.tar.gz
        mode: '0644'
        timeout: 120
      retries: 3
      delay: 5

    - name: Create glow temp directory
      ansible.builtin.file:
        path: /tmp/glow
        state: directory
        mode: '0755'

    - name: Extract glow
      ansible.builtin.unarchive:
        src: /tmp/glow.tar.gz
        dest: /tmp/glow
        remote_src: true

    - name: Find glow binary
      ansible.builtin.find:
        paths: /tmp/glow
        patterns: glow
        file_type: file
        recurse: true
      register: glow_find

    - name: Fail if glow binary was not found in extracted archive
      when: glow_find.matched | default(0) | int == 0
      ansible.builtin.fail:
        msg: "glow binary was not found under /tmp/glow after extraction"

    - name: Install glow to ~/.local/bin
      ansible.builtin.copy:
        src: "{{ glow_find.files[0].path }}"
        dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/glow"
        mode: '0755'
        remote_src: true

    - name: Clean up glow temp files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/glow.tar.gz
        - /tmp/glow

  rescue:
    - name: Warn glow installation failed
      ansible.builtin.debug:
        msg: "glow installation failed (likely network timeout) - skipping"

    - name: Clean up glow temp files after failure
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/glow.tar.gz
        - /tmp/glow

- name: Verify glow is available
  when: ansible_facts["os_family"] == "Debian"
  ansible.builtin.command: glow --version
  changed_when: false
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:/usr/local/bin:{{ ansible_facts['env']['PATH'] }}"

