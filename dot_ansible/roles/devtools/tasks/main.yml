# --- bat ---
- name: Install bat (Debian/Ubuntu)
  when: ansible_facts["os_family"] == "Debian"
  become: true
  tags: [sudo]
  ansible.builtin.apt:
    name: bat
    state: present

- name: Create bat symlink on Debian/Ubuntu
  when: ansible_facts["os_family"] == "Debian"
  become: true
  tags: [sudo]
  ansible.builtin.file:
    src: /usr/bin/batcat
    dest: /usr/bin/bat
    state: link
  ignore_errors: true

- name: Detect Linuxbrew for bat (Debian/Ubuntu)
  when: ansible_facts["os_family"] == "Debian"
  ansible.builtin.shell: command -v brew || true
  args:
    executable: /bin/bash
  register: bat_brew_probe
  changed_when: false

- name: Install bat via Linuxbrew when available (Debian/Ubuntu)
  when:
    - ansible_facts["os_family"] == "Debian"
    - bat_brew_probe.stdout | default('') | trim != ''
  community.general.homebrew:
    name: bat
    state: present

# --- bat (user-level fallback) ---
# Gate broadened to RedHat per pitfalls/centos7-noroot.md — bat ships
# `-unknown-linux-musl.tar.gz` and works on glibc 2.17.
- name: Re-check if bat is installed
  when: ansible_facts["os_family"] in ["Debian", "RedHat"]
  ansible.builtin.shell: command -v bat
  register: bat_recheck
  changed_when: false
  failed_when: false

- name: Install bat from GitHub releases (user-level, no sudo)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - bat_recheck.rc != 0
  block:
    - name: Ensure ~/.local/bin exists (bat)
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        state: directory
        mode: '0755'

    - name: Get latest bat release
      ansible.builtin.uri:
        url: https://api.github.com/repos/sharkdp/bat/releases/latest
        return_content: true
      register: bat_release

    - name: Download bat binary
      ansible.builtin.get_url:
        url: "https://github.com/sharkdp/bat/releases/download/{{ bat_release.json.tag_name }}/bat-{{ bat_release.json.tag_name }}-{{ target_architecture }}-unknown-linux-musl.tar.gz"
        dest: /tmp/bat.tar.gz
        mode: '0644'
        timeout: 120
      retries: 3
      delay: 5

    - name: Extract bat
      ansible.builtin.unarchive:
        src: /tmp/bat.tar.gz
        dest: /tmp
        remote_src: true

    - name: Install bat to ~/.local/bin
      ansible.builtin.copy:
        src: "/tmp/bat-{{ bat_release.json.tag_name }}-{{ target_architecture }}-unknown-linux-musl/bat"
        dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/bat"
        mode: '0755'
        remote_src: true

    - name: Clean up bat temp files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/bat.tar.gz
        - "/tmp/bat-{{ bat_release.json.tag_name }}-{{ target_architecture }}-unknown-linux-musl"

  rescue:
    - name: Warn bat installation failed
      ansible.builtin.debug:
        msg: "bat installation failed (likely network timeout) - skipping"

    - name: Clean up bat temp files after failure
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/bat.tar.gz

# --- bats (bats-core: Bash test runner) ---
- name: Install bats (Debian/Ubuntu)
  when: ansible_facts["os_family"] == "Debian"
  become: true
  tags: [sudo]
  ansible.builtin.apt:
    name: bats
    state: present

# --- bats (user-level fallback) ---
# Gate broadened to RedHat per pitfalls/centos7-noroot.md — the user-level
# install (curl GitHub release tarball, run install.sh) has no apt-specific
# behaviour and works on any glibc-2.17+ system.
- name: Re-check if bats is installed
  when: ansible_facts["os_family"] in ["Debian", "RedHat"]
  ansible.builtin.shell: command -v bats
  register: bats_recheck
  changed_when: false
  failed_when: false
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:/usr/local/bin:{{ ansible_facts['env']['PATH'] }}"

- name: Install bats-core from GitHub releases (user-level, no sudo)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - bats_recheck.rc != 0
  block:
    - name: Ensure ~/.local/bin exists (bats)
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        state: directory
        mode: '0755'

    - name: Get latest bats-core release
      ansible.builtin.uri:
        url: https://api.github.com/repos/bats-core/bats-core/releases/latest
        return_content: true
      register: bats_release

    - name: Download bats-core tarball
      ansible.builtin.get_url:
        url: "https://github.com/bats-core/bats-core/archive/refs/tags/{{ bats_release.json.tag_name }}.tar.gz"
        dest: /tmp/bats.tar.gz
        mode: '0644'
        timeout: 120
      retries: 3
      delay: 5

    - name: Extract and install bats-core to ~/.local
      ansible.builtin.shell: |
        set -euo pipefail
        rm -rf /tmp/bats-extract
        mkdir -p /tmp/bats-extract
        tar -xzf /tmp/bats.tar.gz -C /tmp/bats-extract --strip-components=1
        /tmp/bats-extract/install.sh "{{ ansible_facts['env']['HOME'] }}/.local"
      args:
        executable: /bin/bash
      changed_when: true

    - name: Clean up bats temp files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/bats.tar.gz
        - /tmp/bats-extract

  rescue:
    - name: Warn bats-core installation failed
      ansible.builtin.debug:
        msg: "bats-core installation failed (likely network timeout) - skipping"

    - name: Clean up bats temp files after failure
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/bats.tar.gz
        - /tmp/bats-extract

# --- zoxide ---
- name: Check if zoxide is installed
  when: ansible_facts["os_family"] == "Debian"
  ansible.builtin.command: zoxide --version
  register: zoxide_check
  changed_when: false
  failed_when: false

- name: Install zoxide via official installer (Debian/Ubuntu)
  when:
    - ansible_facts["os_family"] == "Debian"
    - zoxide_check.rc != 0
  ansible.builtin.shell: |
    curl -sSfL https://raw.githubusercontent.com/ajeetdsouza/zoxide/main/install.sh | sh
  args:
    creates: "{{ ansible_facts.env.HOME }}/.local/bin/zoxide"
  failed_when: false
  register: zoxide_install_result

- name: Warn zoxide installation failed
  when:
    - zoxide_install_result is defined
    - zoxide_install_result.rc is defined
    - zoxide_install_result.rc != 0
  ansible.builtin.debug:
    msg: "zoxide installation failed (likely network timeout) - skipping"

# --- eza ---
- name: Check if eza is installed
  when: ansible_facts["os_family"] == "Debian"
  ansible.builtin.command: eza --version
  register: eza_check
  changed_when: false
  failed_when: false

- name: Install eza via official installer (Debian/Ubuntu)
  when:
    - ansible_facts["os_family"] == "Debian"
    - eza_check.rc != 0
  become: true
  tags: [sudo]
  block:
    - name: Add eza GPG key
      ansible.builtin.shell: |
        mkdir -p /etc/apt/keyrings
        wget -qO- https://raw.githubusercontent.com/eza-community/eza/main/deb.asc | gpg --dearmor -o /etc/apt/keyrings/gierens.gpg
      args:
        creates: /etc/apt/keyrings/gierens.gpg

    # deb822_repository (apt_repository is deprecated, removed in
    # ansible-core 2.25) writes the .sources file WITHOUT running
    # `apt update`, so we verify reachability ourselves and roll the file
    # back when the repo is broken/unreachable (GFW hosts) — a leftover
    # broken source would otherwise fail the base role's cache update on
    # every subsequent run. The GitHub-release fallback below installs eza
    # in that case. Requires python3-debian (installed by the base role).
    - name: Remove legacy one-line eza source (pre-deb822 format)
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/gierens.list
        state: absent

    - name: Add eza repository (deb822)
      ansible.builtin.deb822_repository:
        name: gierens
        types: deb
        uris: http://deb.gierens.de
        suites: stable
        components: main
        signed_by: /etc/apt/keyrings/gierens.gpg
      ignore_errors: true
      register: eza_repo

    - name: Refresh apt cache (eza repo)
      when: eza_repo is succeeded
      ansible.builtin.apt:
        update_cache: true
      ignore_errors: true

    # The apt module treats a partially-failed `apt update` (one unreachable
    # source, others fine) as SUCCESS-with-warnings, so its failed/succeeded
    # status can't tell us whether the gierens repo actually works. Probe
    # deterministically: eza resolvable from deb.gierens.de ⇒ keep + install;
    # otherwise roll the .sources file back so it can't slow down / break
    # later apt updates, and let the GitHub fallback below take over.
    - name: Check eza is resolvable from the gierens repo
      when: eza_repo is succeeded
      ansible.builtin.command: apt-cache policy eza
      register: eza_policy
      changed_when: false
      failed_when: false

    - name: Remove eza repository (broken or unreachable)
      when:
        - eza_repo is succeeded
        - "'deb.gierens.de' not in (eza_policy.stdout | default(''))"
      ansible.builtin.deb822_repository:
        name: gierens
        state: absent

    - name: Install eza from repository
      ansible.builtin.apt:
        name: eza
        state: present
      when: "'deb.gierens.de' in (eza_policy.stdout | default(''))"
      ignore_errors: true
  rescue:
    - name: Warn eza apt install failed
      ansible.builtin.debug:
        msg: "eza apt install failed (likely broken third-party repo) — will try GitHub fallback"

# --- eza (user-level fallback) ---
# Upstream publishes a musl tarball for x86_64 only. aarch64 has just
# `unknown-linux-gnu.tar.gz`, which can break on Jammy when upstream CI uses a
# newer glibc. Split the user fallback by arch:
#   - x86_64: switch to `eza_x86_64-unknown-linux-musl.tar.gz`.
#   - aarch64: probe Linuxbrew; install via brew if present, otherwise skip
#     with an explicit warning.
- name: Re-check if eza is installed
  when: ansible_facts["os_family"] == "Debian"
  ansible.builtin.shell: command -v eza
  register: eza_recheck
  changed_when: false
  failed_when: false

- name: Install eza musl from GitHub releases (user-level, x86_64)
  when:
    - ansible_facts["os_family"] == "Debian"
    - eza_recheck.rc != 0
    - target_architecture in ['x86_64', 'amd64']
  block:
    - name: Ensure ~/.local/bin exists (eza)
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        state: directory
        mode: '0755'

    - name: Get latest eza release
      ansible.builtin.uri:
        url: https://api.github.com/repos/eza-community/eza/releases/latest
        return_content: true
      register: eza_release

    - name: Download eza musl binary (x86_64)
      ansible.builtin.get_url:
        url: "https://github.com/eza-community/eza/releases/download/{{ eza_release.json.tag_name }}/eza_x86_64-unknown-linux-musl.tar.gz"
        dest: /tmp/eza.tar.gz
        mode: '0644'
        timeout: 120
      retries: 3
      delay: 5

    - name: Extract eza to ~/.local/bin
      ansible.builtin.unarchive:
        src: /tmp/eza.tar.gz
        dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        remote_src: true

    - name: Clean up eza tarball
      ansible.builtin.file:
        path: /tmp/eza.tar.gz
        state: absent

  rescue:
    - name: Warn eza installation failed
      ansible.builtin.debug:
        msg: "eza installation failed (likely network timeout) - skipping"

    - name: Clean up eza temp files after failure
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/eza.tar.gz

# --- eza (aarch64 user fallback: brew or skip — no upstream musl asset) ---
- name: Detect Linuxbrew for eza user fallback (Debian/Ubuntu, aarch64)
  when:
    - ansible_facts["os_family"] == "Debian"
    - eza_recheck.rc != 0
    - target_architecture in ['aarch64', 'arm64']
  ansible.builtin.shell: command -v brew || true
  args:
    executable: /bin/bash
  register: eza_brew_probe
  changed_when: false

- name: Install eza via Linuxbrew (user fallback, aarch64, brew available)
  when:
    - ansible_facts["os_family"] == "Debian"
    - eza_recheck.rc != 0
    - target_architecture in ['aarch64', 'arm64']
    - eza_brew_probe is defined
    - eza_brew_probe.stdout | default('') | trim != ''
  community.general.homebrew:
    name: eza
    state: present

- name: Warn eza cannot be installed safely (aarch64, no brew)
  when:
    - ansible_facts["os_family"] == "Debian"
    - eza_recheck.rc != 0
    - target_architecture in ['aarch64', 'arm64']
    - (eza_brew_probe is not defined) or (eza_brew_probe.stdout | default('') | trim == '')
  ansible.builtin.debug:
    msg: >-
      eza skipped on aarch64: upstream publishes only `unknown-linux-gnu`
      tarball for aarch64 which may require a newer glibc than Jammy (2.35).
      Install Linuxbrew (`brew install eza`) or wait for an upstream musl
      arm64 build.

# --- git-delta ---
# Delta can start successfully but crash when reading stdin if bat's binary
# theme cache was built by an incompatible bat version. Verify by actually
# feeding delta an empty diff, not only by checking `--version`.
# Glibc landscape:
#   - x86_64: upstream publishes `unknown-linux-musl` (static, glibc-independent).
#     User-level fallback now uses it (was `unknown-linux-gnu` until the
#     centos7-noroot.md sweep). Works on glibc 2.17.
#   - aarch64: only `unknown-linux-gnu` assets exist, and delta 0.19.x briefly
#     required glibc 2.39 (unavailable on Jammy). We therefore:
#       1) sudo path (apt .deb) is Debian/Ubuntu-only.
#       2) aarch64 falls through to Linuxbrew (`brew install git-delta`) or
#          skips with a clear debug message rather than silently pulling a
#          glibc-risky binary.
- name: Check if delta is installed
  when: ansible_facts["os_family"] == "Debian"
  ansible.builtin.shell: printf '' | delta --no-gitconfig --paging=never
  args:
    executable: /bin/bash
  register: delta_check
  changed_when: false
  failed_when: false

- name: Skip git-delta on unsupported architecture
  when:
    - ansible_facts["os_family"] == "Debian"
    - delta_check.rc != 0
    - target_architecture not in ['x86_64', 'amd64', 'aarch64', 'arm64']
  ansible.builtin.debug:
    msg: "git-delta skipped: no release for {{ target_architecture }}"

- name: Install git-delta .deb (Debian/Ubuntu, x86_64)
  when:
    - ansible_facts["os_family"] == "Debian"
    - delta_check.rc != 0
    - target_architecture in ['x86_64', 'amd64']
  become: true
  tags: [sudo]
  block:
    - name: Get latest delta release
      ansible.builtin.uri:
        url: https://api.github.com/repos/dandavison/delta/releases/latest
        return_content: true
      register: delta_release

    - name: Download git-delta .deb package
      ansible.builtin.get_url:
        url: "https://github.com/dandavison/delta/releases/download/{{ delta_release.json.tag_name }}/git-delta_{{ delta_release.json.tag_name }}_amd64.deb"
        dest: /tmp/git-delta.deb
        mode: '0644'
        timeout: 120
      retries: 3
      delay: 5

    - name: Install delta .deb package
      ansible.builtin.apt:
        deb: /tmp/git-delta.deb

    - name: Clean up delta .deb
      ansible.builtin.file:
        path: /tmp/git-delta.deb
        state: absent

  rescue:
    - name: Warn git-delta installation failed
      ansible.builtin.debug:
        msg: "git-delta installation failed (likely network timeout) - skipping"

    - name: Clean up git-delta temp files after failure
      ansible.builtin.file:
        path: /tmp/git-delta.deb
        state: absent

# --- git-delta (aarch64: brew or skip — no upstream musl asset) ---
- name: Detect Linuxbrew for git-delta (Debian/Ubuntu, aarch64)
  when:
    - ansible_facts["os_family"] == "Debian"
    - delta_check.rc != 0
    - target_architecture in ['aarch64', 'arm64']
  ansible.builtin.shell: command -v brew || true
  args:
    executable: /bin/bash
  register: delta_brew_probe
  changed_when: false

- name: Install git-delta via Linuxbrew (Debian/Ubuntu, aarch64, brew available)
  when:
    - ansible_facts["os_family"] == "Debian"
    - delta_check.rc != 0
    - target_architecture in ['aarch64', 'arm64']
    - delta_brew_probe is defined
    - delta_brew_probe.stdout | default('') | trim != ''
  community.general.homebrew:
    name: git-delta
    state: present

- name: Warn git-delta cannot be installed safely (aarch64, no brew)
  when:
    - ansible_facts["os_family"] == "Debian"
    - delta_check.rc != 0
    - target_architecture in ['aarch64', 'arm64']
    - (delta_brew_probe is not defined) or (delta_brew_probe.stdout | default('') | trim == '')
  ansible.builtin.debug:
    msg: >-
      git-delta skipped on aarch64: upstream publishes only `unknown-linux-gnu`
      assets, which historically require glibc >= 2.39 and may fail on Jammy
      (glibc 2.35). Install Linuxbrew (`brew install git-delta`) or wait for
      an upstream musl arm64 build.

# --- git-delta (user-level fallback) ---
# Gate broadened to RedHat per pitfalls/centos7-noroot.md — x86_64 uses the
# upstream `unknown-linux-musl` tarball (glibc-independent). aarch64 still
# has no upstream musl; that path stays Debian-only (Linuxbrew aarch64 on
# CentOS 7 is not a typical setup we support).
- name: Re-check if delta is installed
  when: ansible_facts["os_family"] in ["Debian", "RedHat"]
  ansible.builtin.shell: command -v delta && printf '' | delta --no-gitconfig --paging=never
  args:
    executable: /bin/bash
  register: delta_recheck
  changed_when: false
  failed_when: false

- name: Install git-delta tarball (user-level, no sudo, x86_64)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - delta_recheck.rc != 0
    - target_architecture in ['x86_64', 'amd64']
  block:
    - name: Ensure ~/.local/bin exists (delta)
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        state: directory
        mode: '0755'

    - name: Get latest delta release (user)
      ansible.builtin.uri:
        url: https://api.github.com/repos/dandavison/delta/releases/latest
        return_content: true
      register: delta_release_user

    - name: Download delta musl tarball (user)
      # Switched from `-x86_64-unknown-linux-gnu.tar.gz` to the musl variant
      # so CentOS 7 (glibc 2.17) can install it without source build. The
      # gnu tarball historically required glibc 2.39 on aarch64 too.
      ansible.builtin.get_url:
        url: "https://github.com/dandavison/delta/releases/download/{{ delta_release_user.json.tag_name }}/delta-{{ delta_release_user.json.tag_name }}-x86_64-unknown-linux-musl.tar.gz"
        dest: /tmp/delta.tar.gz
        mode: '0644'
        timeout: 120
      retries: 3
      delay: 5

    - name: Extract delta (user)
      ansible.builtin.unarchive:
        src: /tmp/delta.tar.gz
        dest: /tmp
        remote_src: true

    - name: Install delta to ~/.local/bin
      ansible.builtin.copy:
        src: "/tmp/delta-{{ delta_release_user.json.tag_name }}-x86_64-unknown-linux-musl/delta"
        dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/delta"
        mode: '0755'
        remote_src: true

    - name: Clean up delta temp files (user)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/delta.tar.gz
        - "/tmp/delta-{{ delta_release_user.json.tag_name }}-x86_64-unknown-linux-musl"

  rescue:
    - name: Warn git-delta (user) installation failed
      ansible.builtin.debug:
        msg: "git-delta (user) installation failed (likely network timeout) - skipping"

    - name: Clean up git-delta (user) temp files after failure
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/delta.tar.gz

# --- git-delta (aarch64 user fallback: brew or skip) ---
- name: Detect Linuxbrew for git-delta user fallback (Debian/Ubuntu, aarch64)
  when:
    - ansible_facts["os_family"] == "Debian"
    - delta_recheck.rc != 0
    - target_architecture in ['aarch64', 'arm64']
  ansible.builtin.shell: command -v brew || true
  args:
    executable: /bin/bash
  register: delta_brew_probe_user
  changed_when: false

- name: Install git-delta via Linuxbrew (user fallback, aarch64, brew available)
  when:
    - ansible_facts["os_family"] == "Debian"
    - delta_recheck.rc != 0
    - target_architecture in ['aarch64', 'arm64']
    - delta_brew_probe_user is defined
    - delta_brew_probe_user.stdout | default('') | trim != ''
  community.general.homebrew:
    name: git-delta
    state: present

- name: Warn git-delta (user) cannot be installed safely (aarch64, no brew)
  when:
    - ansible_facts["os_family"] == "Debian"
    - delta_recheck.rc != 0
    - target_architecture in ['aarch64', 'arm64']
    - (delta_brew_probe_user is not defined) or (delta_brew_probe_user.stdout | default('') | trim == '')
  ansible.builtin.debug:
    msg: >-
      git-delta (user) skipped on aarch64: no upstream musl asset. Install
      Linuxbrew for a safe `brew install git-delta`, or wait for an upstream
      musl arm64 build.

# --- diffnav ---
- name: Check if diffnav is installed
  when: ansible_facts["os_family"] == "Debian"
  ansible.builtin.shell: command -v diffnav
  register: diffnav_check
  changed_when: false
  failed_when: false
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:/usr/local/bin:{{ ansible_facts['env']['PATH'] }}"

- name: Set diffnav release architecture
  # Broadened to RedHat + decoupled from diffnav_check so the user-level
  # fallback works on CentOS 7 where the sudo .deb install is skipped.
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
  ansible.builtin.set_fact:
    diffnav_release_arch: >-
      {{
        'x86_64' if target_architecture in ['x86_64', 'amd64']
        else 'arm64' if target_architecture in ['aarch64', 'arm64']
        else ''
      }}

- name: Skip diffnav on unsupported architecture
  when:
    - ansible_facts["os_family"] == "Debian"
    - diffnav_check.rc != 0
    - diffnav_release_arch == ''
  ansible.builtin.debug:
    msg: "diffnav skipped: no release for {{ target_architecture }}"

- name: Install diffnav from GitHub releases (Debian/Ubuntu)
  when:
    - ansible_facts["os_family"] == "Debian"
    - diffnav_check.rc != 0
    - diffnav_release_arch != ''
  become: true
  tags: [sudo]
  block:
    - name: Get latest diffnav release
      ansible.builtin.uri:
        url: https://api.github.com/repos/dlvhdr/diffnav/releases/latest
        return_content: true
      register: diffnav_release

    - name: Download diffnav tarball
      ansible.builtin.get_url:
        url: "https://github.com/dlvhdr/diffnav/releases/download/{{ diffnav_release.json.tag_name }}/diffnav_Linux_{{ diffnav_release_arch }}.tar.gz"
        dest: /tmp/diffnav.tar.gz
        mode: '0644'
        timeout: 120
      retries: 3
      delay: 5

    - name: Extract and install diffnav
      ansible.builtin.shell: |
        set -euo pipefail
        rm -rf /tmp/diffnav-extract
        mkdir -p /tmp/diffnav-extract
        tar -xzf /tmp/diffnav.tar.gz -C /tmp/diffnav-extract
        diffnav_bin="$(find /tmp/diffnav-extract -type f -name diffnav | head -n 1)"
        install -m 0755 "$diffnav_bin" /usr/local/bin/diffnav
      args:
        executable: /bin/bash
      changed_when: true

    - name: Clean up diffnav temp files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/diffnav.tar.gz
        - /tmp/diffnav-extract

  rescue:
    - name: Warn diffnav installation failed
      ansible.builtin.debug:
        msg: "diffnav installation failed (likely network timeout) - skipping"

    - name: Clean up diffnav temp files after failure
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/diffnav.tar.gz
        - /tmp/diffnav-extract

# --- diffnav (user-level fallback) ---
# Gate broadened to RedHat per pitfalls/centos7-noroot.md — diffnav is a
