    - ansible_facts["os_family"] == "Debian"
    - delta_check.rc != 0
    - target_architecture not in ['x86_64', 'amd64', 'aarch64', 'arm64']
  ansible.builtin.debug:
    msg: "git-delta skipped: no release for {{ target_architecture }}"

- name: Install git-delta from GitHub releases (Debian/Ubuntu)
  when:
    - ansible_facts["os_family"] == "Debian"
    - delta_check.rc != 0
    - target_architecture in ['x86_64', 'amd64', 'aarch64', 'arm64']
  become: true
  tags: [sudo]
  block:
