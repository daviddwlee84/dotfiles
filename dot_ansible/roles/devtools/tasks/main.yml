# Used by the `readraw` zsh function (dot_config/zsh/tools/55_web_reader.zsh)
# to convert raw HTML pages to markdown. Package is in the default Ubuntu
# repos; no-root / armv7l installs simply won't get it and `readraw` will
# print an install hint.
- name: Install pandoc (Debian/Ubuntu)
  when: ansible_facts["os_family"] == "Debian"
  become: true
  tags: [sudo]
  ansible.builtin.apt:
    name: pandoc
    state: present

# --- btop ---
- name: Install btop (Debian/Ubuntu)
  when: ansible_facts["os_family"] == "Debian"
  become: true
  tags: [sudo]
  ansible.builtin.apt:
    name: btop
    state: present
  ignore_errors: true

# --- btop (user-level fallback) ---
- name: Re-check if btop is installed
  when: ansible_facts["os_family"] == "Debian"
  ansible.builtin.shell: command -v btop
  register: btop_recheck
  changed_when: false
  failed_when: false

- name: Install btop from GitHub releases (user-level, no sudo)
  when:
    - ansible_facts["os_family"] == "Debian"
    - btop_recheck.rc != 0
  block:
    - name: Ensure ~/.local/bin exists (btop)
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        state: directory
        mode: '0755'

    - name: Get latest btop release
      ansible.builtin.uri:
        url: https://api.github.com/repos/aristocratos/btop/releases/latest
        return_content: true
      register: btop_release

    - name: Download btop binary
      ansible.builtin.get_url:
        url: "https://github.com/aristocratos/btop/releases/download/{{ btop_release.json.tag_name }}/btop-{{ target_architecture }}-linux-musl.tbz"
        dest: /tmp/btop.tbz
        mode: '0644'
        timeout: 120
      retries: 3
      delay: 5

    - name: Create btop temp directory
      ansible.builtin.file:
        path: /tmp/btop-extract
        state: directory
        mode: '0755'

    - name: Extract btop
      ansible.builtin.shell: |
        cd /tmp/btop-extract && tar xjf /tmp/btop.tbz
      args:
        executable: /bin/bash
      changed_when: true

    - name: Install btop to ~/.local/bin
      ansible.builtin.copy:
        src: /tmp/btop-extract/btop/bin/btop
        dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/btop"
        mode: '0755'
        remote_src: true

    - name: Clean up btop temp files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/btop.tbz
        - /tmp/btop-extract

  rescue:
    - name: Warn btop installation failed
      ansible.builtin.debug:
        msg: "btop installation failed (likely network timeout) - skipping"

    - name: Clean up btop temp files after failure
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/btop.tbz
        - /tmp/btop-extract

