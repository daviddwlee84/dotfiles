# --- btop (user-level fallback) ---
# Broadened from `os_family == "Debian"` to `["Debian", "RedHat"]` per
# pitfalls/centos7-noroot.md — btop ships an `-unknown-linux-musl.tar.gz`
# static binary that runs on glibc 2.17 (CentOS 7) and modern glibc alike.
- name: Re-check if btop is installed
  when: ansible_facts["os_family"] in ["Debian", "RedHat"]
  ansible.builtin.shell: command -v btop
  register: btop_recheck
  changed_when: false
  failed_when: false

- name: Install btop from GitHub releases (user-level, no sudo)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - btop_recheck.rc != 0
  block:
    - name: Ensure ~/.local/bin exists (btop)
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        state: directory
        mode: '0755'

    - name: Get latest btop release
      ansible.builtin.uri:
        url: https://api.github.com/repos/aristocratos/btop/releases/latest
        return_content: true
      register: btop_release

    # Upstream asset naming changed at v1.4.7 from
    #   btop-<arch>-linux-musl.tbz        (bzip2; pre-v1.4.7)
    # to
    #   btop-<arch>-unknown-linux-musl.tar.gz   (gzip; v1.4.7+)
    # The new format is also static-musl so it stays glibc-independent.
    - name: Download btop binary
      ansible.builtin.get_url:
        url: "https://github.com/aristocratos/btop/releases/download/{{ btop_release.json.tag_name }}/btop-{{ target_architecture }}-unknown-linux-musl.tar.gz"
        dest: /tmp/btop.tar.gz
        mode: '0644'
        timeout: 120
      retries: 3
      delay: 5

    - name: Create btop temp directory
      ansible.builtin.file:
        path: /tmp/btop-extract
        state: directory
        mode: '0755'

    - name: Extract btop
      ansible.builtin.shell: |
        cd /tmp/btop-extract && tar xzf /tmp/btop.tar.gz
      args:
        executable: /bin/bash
      changed_when: true

    - name: Install btop to ~/.local/bin
      ansible.builtin.copy:
        src: /tmp/btop-extract/btop/bin/btop
        dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/btop"
        mode: '0755'
        remote_src: true

    - name: Clean up btop temp files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/btop.tar.gz
        - /tmp/btop-extract

  rescue:
    - name: Warn btop installation failed
      ansible.builtin.debug:
        msg: "btop installation failed (likely network timeout) - skipping"

    - name: Clean up btop temp files after failure
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/btop.tar.gz
        - /tmp/btop-extract

