        remote_src: true

    - name: Clean up taplo temp files
      ansible.builtin.file:
        path: /tmp/taplo
        state: absent

  rescue:
    - name: Warn taplo installation failed
      ansible.builtin.debug:
        msg: "taplo installation failed (likely network timeout) - skipping"

# --- television (tv) - fuzzy finder TUI ---
# Upstream currently ships only `unknown-linux-gnu` assets (no musl on any
# arch as of 0.15.6). Recent builds require glibc >= 2.39, which breaks on
# Ubuntu 22.04 Jammy (glibc 2.35) with:
#   tv: /lib/x86_64-linux-gnu/libc.so.6: version `GLIBC_2.39' not found
# Policy: prefer Linuxbrew (bottles track an older glibc baseline); if brew
# is unavailable, skip with an explicit warning instead of silently installing
# a potentially incompatible gnu binary. See docs/linux-package-sources.md.
- name: Check if tv is installed
  when: ansible_facts["os_family"] == "Debian"
  ansible.builtin.command: tv --version
  register: tv_check
  changed_when: false
  failed_when: false

- name: Detect Linuxbrew for television install (Debian/Ubuntu)
  when:
    - ansible_facts["os_family"] == "Debian"
    - tv_check.rc != 0
    - target_architecture in ['x86_64', 'amd64', 'aarch64', 'arm64']
  ansible.builtin.shell: command -v brew || true
  args:
    executable: /bin/bash
  register: tv_brew_probe
  changed_when: false

- name: Install television via Linuxbrew (Debian/Ubuntu, brew available)
  when:
    - ansible_facts["os_family"] == "Debian"
    - tv_check.rc != 0
    - target_architecture in ['x86_64', 'amd64', 'aarch64', 'arm64']
    - tv_brew_probe is defined
    - tv_brew_probe.stdout | default('') | trim != ''
  community.general.homebrew:
    name: television
    state: present

- name: Warn television cannot be installed safely (no brew, gnu-only upstream)
  when:
    - ansible_facts["os_family"] == "Debian"
    - tv_check.rc != 0
    - target_architecture in ['x86_64', 'amd64', 'aarch64', 'arm64']
    - (tv_brew_probe is not defined) or (tv_brew_probe.stdout | default('') | trim == '')
  ansible.builtin.debug:
    msg: >-
      television (tv) skipped: upstream publishes only `unknown-linux-gnu`
      assets, which require glibc >= 2.39 and fail on Ubuntu 22.04 (glibc
      2.35) with `GLIBC_2.39 not found`. Install Linuxbrew
      (`brew install television`) for a bottle built against an older glibc,
      or wait for upstream to ship musl builds.

- name: Skip television on unsupported architecture
  when:
    - ansible_facts["os_family"] == "Debian"
    - tv_check.rc != 0
    - target_architecture not in ['x86_64', 'amd64', 'aarch64', 'arm64']
  ansible.builtin.debug:
    msg: "television skipped: no release for {{ target_architecture }}"

- name: Check if tv binary ended up on PATH
  ansible.builtin.shell: command -v tv
  register: tv_final_probe
  changed_when: false
  failed_when: false
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:/home/linuxbrew/.linuxbrew/bin:/opt/homebrew/bin:/usr/local/bin:{{ ansible_facts['env']['PATH'] }}"

# tv update-channels always does a ~18s GitHub fetch even when all channels exist.
# Skip unless the tv version changed since we last ran it (sentinel = version string).
- name: Get current tv version (for channel update guard)
  when: tv_final_probe.rc == 0
  ansible.builtin.command: tv --version
  register: tv_version_current
  changed_when: false
  failed_when: false
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:/home/linuxbrew/.linuxbrew/bin:/opt/homebrew/bin:/usr/local/bin:{{ ansible_facts['env']['PATH'] }}"

- name: Check tv channel version sentinel
  when: tv_final_probe.rc == 0
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/television/.cable-version"
  register: tv_cable_sentinel

- name: Update television channel prototypes
  when:
    - tv_final_probe.rc == 0
    - >-
      not tv_cable_sentinel.stat.exists or
      (lookup('file', ansible_facts['env']['HOME'] + '/.config/television/.cable-version') | trim) != (tv_version_current.stdout | trim)
  ansible.builtin.command: tv update-channels
  register: tv_update_channels
  changed_when: true
  failed_when: false
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:/home/linuxbrew/.linuxbrew/bin:/opt/homebrew/bin:/usr/local/bin:{{ ansible_facts['env']['PATH'] }}"

- name: Write tv channel version sentinel
  when:
    - tv_final_probe.rc == 0
    - tv_update_channels is changed
  ansible.builtin.copy:
    content: "{{ tv_version_current.stdout | trim }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/television/.cable-version"
    mode: "0644"

# =============================================================================
# Log viewers (Linux)
# =============================================================================
# See docs/tools/log-tools.md for the toolbelt rationale. On macOS these are
# installed via the Homebrew list at the top of this file. Here we handle the
# Linux side: lnav/grc/ccze are in Debian/Ubuntu apt repos, tailspin (binary
# `tspin`) is only on GitHub releases as a Rust musl binary.

# --- lnav/grc/ccze (Debian/Ubuntu) ---
- name: Install log viewers via apt (Debian/Ubuntu)
  when: ansible_facts["os_family"] == "Debian"
  become: true
  tags: [sudo]
  ansible.builtin.apt:
    name:
      - lnav
      - grc
      - ccze
    state: present
  ignore_errors: true

# --- lnav (user-level fallback) ---
# Gate broadened to RedHat per pitfalls/centos7-noroot.md — lnav ships
# `linux-musl-<arch>.zip` and works on glibc 2.17.
- name: Re-check if lnav is installed
  when: ansible_facts["os_family"] in ["Debian", "RedHat"]
  ansible.builtin.shell: command -v lnav
  register: lnav_recheck
  changed_when: false
  failed_when: false
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:/usr/local/bin:{{ ansible_facts['env']['PATH'] }}"

- name: Install lnav from GitHub releases (user-level, no sudo)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - lnav_recheck.rc != 0
    - target_architecture in ['x86_64', 'amd64', 'aarch64', 'arm64']
  block:
    - name: Ensure ~/.local/bin exists (lnav)
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        state: directory
        mode: '0755'

    - name: Get latest lnav release
      ansible.builtin.uri:
        url: https://api.github.com/repos/tstack/lnav/releases/latest
        return_content: true
      register: lnav_release

    - name: Set lnav architecture mapping
      # Upstream asset naming: lnav-<version>-linux-musl-<arch>.zip
      # where <arch> is literally "x86_64" or "arm64".
      ansible.builtin.set_fact:
        lnav_arch: >-
          {{
            'x86_64' if target_architecture in ['x86_64', 'amd64']
            else 'arm64' if target_architecture in ['aarch64', 'arm64']
            else ''
          }}

    - name: Set lnav download URL
      ansible.builtin.set_fact:
        lnav_download_url: >-
          {{
            (
              lnav_release.json.assets
              | selectattr('name', 'match', '^lnav-.*-linux-musl-' ~ lnav_arch ~ '\.zip$')
              | map(attribute='browser_download_url')
              | first
            )
            | default('', true)
          }}

    - name: Skip lnav if download URL could not be determined
      when: lnav_download_url | trim == ''
      ansible.builtin.debug:
        msg: "lnav skipped: could not find musl asset for architecture {{ lnav_arch }}"

    - name: Download lnav zip (user)
      when: lnav_download_url | trim != ''
      ansible.builtin.get_url:
        url: "{{ lnav_download_url }}"
        dest: /tmp/lnav.zip
        mode: '0644'
        timeout: 120
      retries: 3
      delay: 5

    - name: Create lnav temp directory
      when: lnav_download_url | trim != ''
      ansible.builtin.file:
        path: /tmp/lnav-extract
        state: directory
        mode: '0755'

    - name: Extract lnav zip
      when: lnav_download_url | trim != ''
      ansible.builtin.shell: |
        set -euo pipefail
        python3 -m zipfile -e /tmp/lnav.zip /tmp/lnav-extract
      args:
        executable: /bin/bash
      changed_when: true

    - name: Find lnav binary
      when: lnav_download_url | trim != ''
      ansible.builtin.find:
        paths: /tmp/lnav-extract
        patterns: lnav
        file_type: file
        recurse: true
      register: lnav_find

    - name: Install lnav to ~/.local/bin
      when:
        - lnav_download_url | trim != ''
        - lnav_find.matched | default(0) | int > 0
      ansible.builtin.copy:
        src: "{{ lnav_find.files[0].path }}"
        dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/lnav"
        mode: '0755'
        remote_src: true

    - name: Clean up lnav temp files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/lnav.zip
        - /tmp/lnav-extract

  rescue:
    - name: Warn lnav (user) installation failed
      ansible.builtin.debug:
        msg: "lnav (user) installation failed (likely network timeout) - skipping"

    - name: Clean up lnav temp files after failure
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/lnav.zip
        - /tmp/lnav-extract

# --- tailspin (tspin) ---
- name: Check if tailspin (tspin) is installed
  when: ansible_facts["os_family"] == "Debian"
  ansible.builtin.command: tspin --version
  register: tspin_check
  changed_when: false
  failed_when: false
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:/usr/local/bin:{{ ansible_facts['env']['PATH'] }}"

- name: Skip tailspin on unsupported architecture
  when:
    - ansible_facts["os_family"] == "Debian"
    - tspin_check.rc != 0
    - target_architecture not in ['x86_64', 'amd64', 'aarch64', 'arm64']
  ansible.builtin.debug:
    msg: "tailspin skipped: no release for {{ target_architecture }}"

- name: Install tailspin from GitHub releases (Debian/Ubuntu, user-level)
  when:
    - ansible_facts["os_family"] == "Debian"
    - tspin_check.rc != 0
    - target_architecture in ['x86_64', 'amd64', 'aarch64', 'arm64']
  block:
    - name: Ensure ~/.local/bin exists (tailspin)
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        state: directory
        mode: '0755'

    - name: Get latest tailspin release
      ansible.builtin.uri:
        url: https://api.github.com/repos/bensadeh/tailspin/releases/latest
        return_content: true
      register: tspin_release

    - name: Set tailspin architecture mapping
      ansible.builtin.set_fact:
        tspin_arch: >-
          {{
            'x86_64' if target_architecture in ['x86_64', 'amd64']
            else 'aarch64' if target_architecture in ['aarch64', 'arm64']
            else ''
          }}

    - name: Set tailspin download URL
      ansible.builtin.set_fact:
        tspin_download_url: >-
          {{
            (
              tspin_release.json.assets
              | selectattr('name', 'match', '^tailspin-.*' ~ tspin_arch ~ '-unknown-linux-musl\.tar\.gz$')
              | map(attribute='browser_download_url')
              | first
            )
            | default('', true)
          }}

    - name: Skip tailspin if download URL could not be determined
      when: tspin_download_url | trim == ''
      ansible.builtin.debug:
        msg: "tailspin skipped: could not determine download URL for architecture {{ tspin_arch }}"

    - name: Download tailspin tarball
      when: tspin_download_url | trim != ''
      ansible.builtin.get_url:
        url: "{{ tspin_download_url }}"
        dest: /tmp/tailspin.tar.gz
        mode: '0644'
        timeout: 120
      retries: 3
      delay: 5

    - name: Create tailspin temp directory
      when: tspin_download_url | trim != ''
      ansible.builtin.file:
        path: /tmp/tailspin-extract
        state: directory
        mode: '0755'

    - name: Extract tailspin
      when: tspin_download_url | trim != ''
      ansible.builtin.unarchive:
        src: /tmp/tailspin.tar.gz
        dest: /tmp/tailspin-extract
        remote_src: true

    - name: Find tspin binary
      when: tspin_download_url | trim != ''
      ansible.builtin.find:
        paths: /tmp/tailspin-extract
        patterns: tspin
        file_type: file
        recurse: true
      register: tspin_find

    - name: Install tspin to ~/.local/bin
      when:
        - tspin_download_url | trim != ''
        - tspin_find.matched | default(0) | int > 0
      ansible.builtin.copy:
        src: "{{ tspin_find.files[0].path }}"
        dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/tspin"
        mode: '0755'
        remote_src: true

    - name: Clean up tailspin temp files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/tailspin.tar.gz
        - /tmp/tailspin-extract

  rescue:
    - name: Warn tailspin installation failed
      ansible.builtin.debug:
        msg: "tailspin installation failed (likely network timeout) - skipping"

    - name: Clean up tailspin temp files after failure
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/tailspin.tar.gz
        - /tmp/tailspin-extract

# =============================================================================
# TPM (Tmux Plugin Manager) - All platforms
# =============================================================================
# TPM itself is cloned by .chezmoiexternal.toml.tmpl (.tmux/plugins/tpm).
# We only run `install_plugins` here to populate the rest of ~/.tmux/plugins/
# on the first run. The sentinel at ~/.tmux/plugins/.ansible-installed prevents
# re-running on every ansible invocation; user can `rm` it to force re-install.

- name: Check if TPM install_plugins has already run
  ansible.builtin.stat:
    path: "{{ ansible_facts.env.HOME }}/.tmux/plugins/.ansible-installed"
  register: tpm_sentinel

- name: Check if TPM binary is present (from chezmoi external)
  ansible.builtin.stat:
    path: "{{ ansible_facts.env.HOME }}/.tmux/plugins/tpm/bin/install_plugins"
  register: tpm_bin

# ignore_errors: a flaky network (GFW) can fail individual plugin clones
# (install_plugins exits 1 if ANY plugin fails) — that must not abort the
# whole play. The sentinel below is only written on success, so the next
# `chezmoi apply` retries; plugins can also be installed in-tmux via
# `prefix + I` at any time.
- name: Install tmux plugins via TPM
  when:
    - tpm_bin.stat.exists
    - not tpm_sentinel.stat.exists
  ansible.builtin.shell: |
    # Source config to set TMUX_PLUGIN_MANAGER_PATH (works with running
    # server; errors harmlessly when no server is up — install_plugins
    # reads ~/.tmux.conf itself in that case)
    tmux source-file {{ ansible_facts.env.HOME }}/.tmux.conf || true
    # Now install plugins
    {{ ansible_facts.env.HOME }}/.tmux/plugins/tpm/bin/install_plugins
  args:
    executable: /bin/bash
  changed_when: true
  register: tpm_install_result
  ignore_errors: true

- name: Warn TPM plugin install had failures
  when:
    - tpm_install_result is failed
  ansible.builtin.debug:
    msg: |
      Some tmux plugins failed to download (likely network timeout) — will
      retry on next `chezmoi apply`, or run `prefix + I` inside tmux.
      Failed: {{ (tpm_install_result.stdout_lines | default([]) + tpm_install_result.stderr_lines | default([]))
                 | select('search', 'download fail') | list }}

- name: Mark TPM plugins as installed
  when:
    - tpm_bin.stat.exists
    - not tpm_sentinel.stat.exists
    - tpm_install_result is succeeded
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.tmux/plugins/.ansible-installed"
    state: touch
    mode: '0644'

# --- dasel (YAML/TOML/XML/JSON/CSV query & modify; user-level fallback) ---
# Single static binary, no apt package on Debian/Ubuntu. Pattern mirrors jq.
# Gate broadened to RedHat per pitfalls/centos7-noroot.md — dasel is a Go
# static binary (no glibc dependency).
- name: Re-check if dasel is installed
  when: ansible_facts["os_family"] in ["Debian", "RedHat"]
  ansible.builtin.shell: command -v dasel
  register: dasel_recheck
  changed_when: false
  failed_when: false

- name: Set dasel release architecture
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - dasel_recheck.rc != 0
  ansible.builtin.set_fact:
    dasel_arch: >-
      {{
        'amd64' if target_architecture in ['x86_64', 'amd64']
        else 'arm64' if target_architecture in ['aarch64', 'arm64']
        else 'arm32' if target_architecture in ['armv7l', 'armhf']
        else ''
      }}

- name: Install dasel from GitHub releases (user-level, no sudo)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - dasel_recheck.rc != 0
    - dasel_arch | default('') != ''
  block:
    - name: Ensure ~/.local/bin exists (dasel)
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        state: directory
        mode: '0755'

    - name: Download dasel binary
      ansible.builtin.get_url:
        url: "https://github.com/TomWright/dasel/releases/latest/download/dasel_linux_{{ dasel_arch }}"
        dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/dasel"
        mode: '0755'
        timeout: 120
      retries: 3
      delay: 5

  rescue:
    - name: Warn dasel installation failed
      ansible.builtin.debug:
        msg: "dasel installation failed (likely network timeout) - skipping"

    - name: Clean up dasel temp files after failure
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/dasel"
        state: absent

# --- yq (Mike Farah's Go yq: YAML/JSON/XML; user-level fallback) ---
# Note: Ubuntu's `yq` apt package is the unrelated Python wrapper around jq;
# we deliberately bypass it and ship the canonical Go binary upstream ships.
# Gate broadened to RedHat per pitfalls/centos7-noroot.md.
- name: Re-check if yq is installed
  when: ansible_facts["os_family"] in ["Debian", "RedHat"]
  ansible.builtin.shell: command -v yq
  register: yq_recheck
  changed_when: false
  failed_when: false

- name: Set yq release architecture
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - yq_recheck.rc != 0
  ansible.builtin.set_fact:
    yq_arch: >-
      {{
        'amd64' if target_architecture in ['x86_64', 'amd64']
        else 'arm64' if target_architecture in ['aarch64', 'arm64']
        else 'arm' if target_architecture in ['armv7l', 'armhf']
        else ''
      }}

- name: Install yq from GitHub releases (user-level, no sudo)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - yq_recheck.rc != 0
    - yq_arch | default('') != ''
  block:
    - name: Ensure ~/.local/bin exists (yq)
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        state: directory
        mode: '0755'

    - name: Download yq binary
      ansible.builtin.get_url:
        url: "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_{{ yq_arch }}"
        dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/yq"
        mode: '0755'
        timeout: 120
      retries: 3
      delay: 5

  rescue:
    - name: Warn yq installation failed
      ansible.builtin.debug:
        msg: "yq installation failed (likely network timeout) - skipping"

    - name: Clean up yq temp files after failure
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/yq"
        state: absent

# --- jnv (interactive JSON viewer with jq filter; user-level fallback) ---
# Upstream ships .tar.xz; ensure xz-utils is present (default on Ubuntu but
# missing from minimal Debian images and some containers).
# Gate broadened to RedHat per pitfalls/centos7-noroot.md — jnv x86_64 ships
# musl (glibc 2.17 OK). aarch64 currently uses gnu (no musl asset upstream);
# rescue catches glibc failures on EL7 aarch64.
- name: Re-check if jnv is installed
  when: ansible_facts["os_family"] in ["Debian", "RedHat"]
  ansible.builtin.shell: command -v jnv
  register: jnv_recheck
  changed_when: false
  failed_when: false

- name: Ensure xz-utils is available for jnv tarball extraction
  # Debian-only: yum equivalent (xz) is usually already present on RedHat
  # base; if not, the user-level extract rescue catches the failure.
  when:
    - ansible_facts["os_family"] == "Debian"
    - jnv_recheck.rc != 0
  become: true
  tags: [sudo]
  ansible.builtin.apt:
    name: xz-utils
    state: present
  failed_when: false

- name: Set jnv release target
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - jnv_recheck.rc != 0
  ansible.builtin.set_fact:
    jnv_target: >-
      {{
        'x86_64-unknown-linux-musl'
        if target_architecture in ['x86_64', 'amd64']
        else 'aarch64-unknown-linux-gnu'
        if target_architecture in ['aarch64', 'arm64']
        else 'armv7-unknown-linux-gnueabihf'
        if target_architecture in ['armv7l', 'armhf']
        else ''
      }}

# Upstream jnv publishes no `aarch64-unknown-linux-musl` tarball — the
# aarch64 build is glibc-only. On oldEL aarch64 (glibc 2.17) the gnu binary
# would crash with `version GLIBC_2.28 not found`. Skip with a clear hint
# instead of letting the rescue silently drop it.
- name: Skip jnv on oldEL aarch64 (no upstream musl for arm64)
  when:
    - ansible_facts["os_family"] == "RedHat"
    - oldEL | default(false)
    - jnv_recheck.rc != 0
    - target_architecture in ['aarch64', 'arm64']
  ansible.builtin.debug:
    msg: >-
      jnv skipped on oldEL aarch64: no upstream musl asset. Install via
      `cargo install jnv --locked` once Rust is set up (rust_cargo_tools
      role), or skip — non-critical interactive JSON viewer.

- name: Install jnv from GitHub releases (user-level, no sudo)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - jnv_recheck.rc != 0
    - jnv_target | trim != ''
    # Drop oldEL aarch64 — handled by the explicit skip above to avoid
    # a confusing glibc 2.28 crash inside the rescue block.
    - not (
        (oldEL | default(false))
        and (target_architecture in ['aarch64', 'arm64'])
      )
  block:
    - name: Ensure ~/.local/bin exists (jnv)
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        state: directory
        mode: '0755'

    - name: Get latest jnv release
      ansible.builtin.uri:
        url: https://api.github.com/repos/ynqa/jnv/releases/latest
        return_content: true
      register: jnv_release

    - name: Download jnv tarball
      ansible.builtin.get_url:
        url: "https://github.com/ynqa/jnv/releases/download/{{ jnv_release.json.tag_name }}/jnv-{{ jnv_target }}.tar.xz"
        dest: /tmp/jnv.tar.xz
        mode: '0644'
        timeout: 120
      retries: 3
      delay: 5

    - name: Extract and install jnv to ~/.local/bin
      ansible.builtin.shell: |
        set -euo pipefail
        rm -rf /tmp/jnv-extract
        mkdir -p /tmp/jnv-extract
        tar -xJf /tmp/jnv.tar.xz -C /tmp/jnv-extract
        jnv_bin="$(find /tmp/jnv-extract -type f -name jnv -perm -u+x | head -n 1)"
        install -m 0755 "$jnv_bin" "{{ ansible_facts['env']['HOME'] }}/.local/bin/jnv"
      args:
        executable: /bin/bash
      changed_when: true

    - name: Clean up jnv temp files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/jnv.tar.xz
        - /tmp/jnv-extract

  rescue:
    - name: Warn jnv installation failed
      ansible.builtin.debug:
        msg: "jnv installation failed (likely network timeout, missing xz-utils, or unsupported arch) - skipping"

    - name: Clean up jnv temp files after failure
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/jnv.tar.xz
        - /tmp/jnv-extract

# --- witr (Why Is This Running? — process ancestry / supervision tracer) ---
- name: Re-check if witr is installed
  when: ansible_facts["os_family"] in ["Debian", "RedHat"]
  ansible.builtin.shell: command -v witr
  register: witr_check
  changed_when: false
  failed_when: false

- name: Set witr release architecture
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - witr_check.rc != 0
  ansible.builtin.set_fact:
    witr_arch: >-
      {{
        'amd64' if target_architecture in ['x86_64', 'amd64']
        else 'arm64' if target_architecture in ['aarch64', 'arm64']
        else ''
      }}

- name: Install witr from GitHub releases (user-level, no sudo)
  # Gate broadened to RedHat per pitfalls/centos7-noroot.md — witr is a
  # Go static binary (no glibc dependency).
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - witr_check.rc != 0
    - witr_arch | default('') != ''
  block:
    - name: Ensure ~/.local/bin exists (witr)
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        state: directory
        mode: '0755'

    - name: Download witr binary
      ansible.builtin.get_url:
        url: "https://github.com/pranshuparmar/witr/releases/latest/download/witr-linux-{{ witr_arch }}"
        dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/witr"
        mode: '0755'
        timeout: 120
      retries: 3
      delay: 5

  rescue:
    - name: Warn witr installation failed
      ansible.builtin.debug:
        msg: "witr installation failed (likely network timeout or unsupported arch) - skipping"

    - name: Clean up witr temp files after failure
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/witr"
        state: absent

# =============================================================================
# Banner / MOTD CLI tools (figlet, toilet, lolcat)
# =============================================================================
# All three live in Ubuntu/Debian universe; no GitHub-release fallback needed.
# Used by the SSH-gated ~/.zlogin banner (see dot_zlogin.tmpl).
- name: Install banner CLI tools (Debian/Ubuntu)
  when: ansible_facts["os_family"] == "Debian"
  become: true
  tags: [sudo]
  ansible.builtin.apt:
    name:
      - figlet
      - toilet
      - lolcat
    state: present

# =============================================================================
# fastfetch — system info CLI (replaces deprecated neofetch)
# =============================================================================
# - Ubuntu 24.04+ / Debian 13+: in apt → ansible.builtin.apt picks it up
# - Ubuntu 22.04 / Debian 12: not in apt → fall through to GitHub .deb
# - .zlogin's fastfetch-slim/full styles depend on this; falls back to plain
#   figlet metadata if fastfetch is missing.
- name: Try installing fastfetch via apt (Debian/Ubuntu)
  when: ansible_facts["os_family"] == "Debian"
  become: true
  tags: [sudo]
  ansible.builtin.apt:
    name: fastfetch
    state: present
  failed_when: false
  register: fastfetch_apt

- name: Re-check if fastfetch is installed
  when: ansible_facts["os_family"] == "Debian"
  ansible.builtin.shell: command -v fastfetch
  register: fastfetch_recheck
  changed_when: false
  failed_when: false
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:/usr/local/bin:{{ ansible_facts['env']['PATH'] }}"

- name: Set fastfetch release architecture
  when:
    - ansible_facts["os_family"] == "Debian"
    - fastfetch_recheck.rc != 0
  ansible.builtin.set_fact:
    fastfetch_release_arch: >-
      {{
        'amd64' if target_architecture in ['x86_64', 'amd64']
        else 'aarch64' if target_architecture in ['aarch64', 'arm64']
        else ''
      }}

- name: Skip fastfetch on unsupported architecture
  when:
    - ansible_facts["os_family"] == "Debian"
    - fastfetch_recheck.rc != 0
    - fastfetch_release_arch == ''
  ansible.builtin.debug:
    msg: "fastfetch skipped: no release for {{ target_architecture }}"

- name: Install fastfetch from GitHub releases (Debian/Ubuntu)
  when:
    - ansible_facts["os_family"] == "Debian"
    - fastfetch_recheck.rc != 0
    - fastfetch_release_arch | default('') != ''
  become: true
  tags: [sudo]
  block:
    - name: Get latest fastfetch release
      ansible.builtin.uri:
        url: https://api.github.com/repos/fastfetch-cli/fastfetch/releases/latest
        return_content: true
      register: fastfetch_release

    - name: Download fastfetch .deb package
      ansible.builtin.get_url:
        url: "https://github.com/fastfetch-cli/fastfetch/releases/download/{{ fastfetch_release.json.tag_name }}/fastfetch-linux-{{ fastfetch_release_arch }}.deb"
        dest: /tmp/fastfetch.deb
        mode: '0644'
        timeout: 120
      retries: 3
      delay: 5

    - name: Install fastfetch .deb package
      ansible.builtin.apt:
        deb: /tmp/fastfetch.deb

    - name: Clean up fastfetch .deb
      ansible.builtin.file:
        path: /tmp/fastfetch.deb
        state: absent

  rescue:
    - name: Warn fastfetch installation failed
      ansible.builtin.debug:
        msg: "fastfetch installation failed (likely network timeout or unsupported version) - skipping"

    - name: Clean up fastfetch temp files after failure
      ansible.builtin.file:
        path: /tmp/fastfetch.deb
        state: absent

# --- herdr (Rust terminal multiplexer + AI-agent orchestrator) ---
# Trial tool that COEXISTS with tmux/zellij; not a replacement. macOS gets it
# from the brew list above (homebrew-core formula). On Linux, releases ship a
# SINGLE static binary (herdr-linux-{x86_64,aarch64}) — no tarball, so this is
# simpler than the workmux/worktrunk release tasks (no unarchive, sidesteps the
# macOS BSD-tar .tar.gz pitfall entirely). Config in ~/.config/herdr/config.toml
# (chezmoi-managed). Self-managed installs upgrade via `herdr update`.
- name: Check if herdr is installed
  when: ansible_facts["os_family"] == "Debian"
  ansible.builtin.command: herdr --version
  register: herdr_check
  changed_when: false
  failed_when: false
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:/usr/local/bin:{{ ansible_facts['env']['PATH'] }}"

- name: Install herdr from GitHub releases (Debian/Ubuntu, user-level)
  when:
    - ansible_facts["os_family"] == "Debian"
    - herdr_check.rc != 0
    - target_architecture in ['x86_64', 'amd64', 'aarch64', 'arm64']
  block:
    - name: Ensure ~/.local/bin exists (herdr)
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        state: directory
        mode: '0755'

    - name: Set herdr architecture mapping
      ansible.builtin.set_fact:
        herdr_arch: >-
          {{
            'x86_64' if target_architecture in ['x86_64', 'amd64']
            else 'aarch64' if target_architecture in ['aarch64', 'arm64']
            else ''
          }}

    - name: Skip herdr on unsupported architecture
      when: herdr_arch | trim == ''
      ansible.builtin.debug:
        msg: "herdr skipped: no release for {{ target_architecture }}"

    - name: Get latest herdr release
      when: herdr_arch | trim != ''
      ansible.builtin.uri:
        url: https://api.github.com/repos/ogulcancelik/herdr/releases/latest
        return_content: true
      register: herdr_release

    - name: Set herdr download URL fact
      when: herdr_arch | trim != ''
      ansible.builtin.set_fact:
        herdr_download_url: >-
          {{
            (
              herdr_release.json.assets
              | selectattr('name', 'equalto', 'herdr-linux-' ~ herdr_arch)
              | map(attribute='browser_download_url')
              | first
            )
            | default('', true)
          }}

    - name: Skip herdr if download URL could not be determined
      when:
        - herdr_arch | trim != ''
        - herdr_download_url | trim == ''
      ansible.builtin.debug:
        msg: "herdr skipped: could not determine download URL for architecture {{ herdr_arch }}"

    - name: Download herdr binary to ~/.local/bin
      when: herdr_download_url | default('') | trim != ''
      ansible.builtin.get_url:
        url: "{{ herdr_download_url }}"
        dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/herdr"
        mode: '0755'
        timeout: 120
      retries: 3
      delay: 5

  rescue:
    - name: Warn herdr installation failed
      ansible.builtin.debug:
        msg: "herdr installation failed (likely network timeout) - skipping"

# --- herdr-plus plugin (Projects + Quick Actions; sesh/tmuxp/menu analog) ---
# Installed via `herdr plugin install`, which downloads a prebuilt release binary
# when no Go toolchain is found, so it works with or without Go. When a Go build
# IS attempted it needs a modern Go; we prepend mise's Go (if present) so a stale
# system Go (e.g. an old /usr/local/go) does not break the build. Go is managed
# by mise now (not brew), so we resolve it via `mise which go`. OS-agnostic
# (runs on macOS + Linux once herdr is installed). Idempotent (skipped when the
# plugin is already present) and wrapped in rescue so a network/build hiccup
# never fails the play — it's a trial nicety. See docs/tools/herdr.md.
- name: Check herdr-plus plugin status
  ansible.builtin.shell: |
    set -o pipefail
    command -v herdr >/dev/null 2>&1 || { echo "no-herdr"; exit 0; }
    if herdr plugin list --json 2>/dev/null | grep -q 'cloudmanic.herdr-plus'; then
      echo "present"
    else
      echo "absent"
    fi
  args:
    executable: /bin/bash
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:/opt/homebrew/bin:/usr/local/bin:{{ ansible_facts['env']['PATH'] }}"
  register: herdr_plus_check
  changed_when: false
  failed_when: false

- name: Install herdr-plus plugin (herdr present, plugin absent)
  when: herdr_plus_check.stdout | default('') | trim == "absent"
  block:
    - name: Resolve mise Go bin dir for the herdr-plus build (optional; prebuilt fallback otherwise)
      # `mise which go` prints the absolute path to the managed go binary
      # (e.g. ~/.local/share/mise/installs/go/<ver>/bin/go); dirname is the bin
      # dir we prepend. Empty/failed → prebuilt download path inside herdr.
      ansible.builtin.shell: |
        set -o pipefail
        gobin="$(mise which go 2>/dev/null)" || exit 0
        [ -n "$gobin" ] && dirname "$gobin"
      args:
        executable: /bin/bash
      environment:
        PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:/opt/homebrew/bin:/usr/local/bin:{{ ansible_facts['env']['PATH'] }}"
      register: herdr_go_bindir
      changed_when: false
      failed_when: false

    - name: herdr plugin install cloudmanic/herdr-plus
      ansible.builtin.command: herdr plugin install cloudmanic/herdr-plus --yes
      environment:
        PATH: "{{ ((herdr_go_bindir.stdout | trim) ~ ':') if (herdr_go_bindir.stdout | default('') | trim) else '' }}{{ ansible_facts['env']['HOME'] }}/.local/bin:/opt/homebrew/bin:/usr/local/bin:{{ ansible_facts['env']['PATH'] }}"
      register: herdr_plus_install
      changed_when: "'Installed' in (herdr_plus_install.stdout | default(''))"
  rescue:
    - name: Warn herdr-plus install failed (non-fatal)
      ansible.builtin.debug:
        msg: "herdr-plus plugin install failed (network/build) — skipping. Run manually: herdr plugin install cloudmanic/herdr-plus"
