# --- bat ---
- name: Install bat (Debian/Ubuntu)
  when: ansible_facts["os_family"] == "Debian"
  become: true
  tags: [sudo]
  ansible.builtin.apt:
    name: bat
    state: present

- name: Create bat symlink on Debian/Ubuntu
  when: ansible_facts["os_family"] == "Debian"
  become: true
  tags: [sudo]
  ansible.builtin.file:
    src: /usr/bin/batcat
    dest: /usr/bin/bat
    state: link
  ignore_errors: true

# --- bat (user-level fallback) ---
- name: Re-check if bat is installed
  when: ansible_facts["os_family"] == "Debian"
  ansible.builtin.shell: command -v bat
  register: bat_recheck
  changed_when: false
  failed_when: false

- name: Install bat from GitHub releases (user-level, no sudo)
  when:
    - ansible_facts["os_family"] == "Debian"
    - bat_recheck.rc != 0
  block:
    - name: Ensure ~/.local/bin exists (bat)
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        state: directory
        mode: '0755'

    - name: Get latest bat release
      ansible.builtin.uri:
        url: https://api.github.com/repos/sharkdp/bat/releases/latest
        return_content: true
      register: bat_release

    - name: Download bat binary
      ansible.builtin.get_url:
        url: "https://github.com/sharkdp/bat/releases/download/{{ bat_release.json.tag_name }}/bat-{{ bat_release.json.tag_name }}-{{ target_architecture }}-unknown-linux-musl.tar.gz"
        dest: /tmp/bat.tar.gz
        mode: '0644'
        timeout: 120
      retries: 3
      delay: 5

    - name: Extract bat
      ansible.builtin.unarchive:
        src: /tmp/bat.tar.gz
        dest: /tmp
        remote_src: true

    - name: Install bat to ~/.local/bin
      ansible.builtin.copy:
        src: "/tmp/bat-{{ bat_release.json.tag_name }}-{{ target_architecture }}-unknown-linux-musl/bat"
        dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/bat"
        mode: '0755'
        remote_src: true

    - name: Clean up bat temp files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/bat.tar.gz
        - "/tmp/bat-{{ bat_release.json.tag_name }}-{{ target_architecture }}-unknown-linux-musl"

  rescue:
    - name: Warn bat installation failed
      ansible.builtin.debug:
        msg: "bat installation failed (likely network timeout) - skipping"

    - name: Clean up bat temp files after failure
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/bat.tar.gz

# --- zoxide ---
- name: Check if zoxide is installed
  when: ansible_facts["os_family"] == "Debian"
  ansible.builtin.command: zoxide --version
  register: zoxide_check
  changed_when: false
  failed_when: false

- name: Install zoxide via official installer (Debian/Ubuntu)
  when:
    - ansible_facts["os_family"] == "Debian"
    - zoxide_check.rc != 0
  ansible.builtin.shell: |
    curl -sSfL https://raw.githubusercontent.com/ajeetdsouza/zoxide/main/install.sh | sh
  args:
    creates: "{{ ansible_facts.env.HOME }}/.local/bin/zoxide"
  failed_when: false
  register: zoxide_install_result

- name: Warn zoxide installation failed
  when:
    - zoxide_install_result is defined
    - zoxide_install_result.rc is defined
    - zoxide_install_result.rc != 0
  ansible.builtin.debug:
    msg: "zoxide installation failed (likely network timeout) - skipping"

# --- eza ---
- name: Check if eza is installed
  when: ansible_facts["os_family"] == "Debian"
  ansible.builtin.command: eza --version
  register: eza_check
  changed_when: false
  failed_when: false

- name: Install eza via official installer (Debian/Ubuntu)
  when:
    - ansible_facts["os_family"] == "Debian"
    - eza_check.rc != 0
  become: true
  tags: [sudo]
  block:
    - name: Add eza GPG key
      ansible.builtin.shell: |
        mkdir -p /etc/apt/keyrings
        wget -qO- https://raw.githubusercontent.com/eza-community/eza/main/deb.asc | gpg --dearmor -o /etc/apt/keyrings/gierens.gpg
      args:
        creates: /etc/apt/keyrings/gierens.gpg

    - name: Add eza repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/gierens.gpg] http://deb.gierens.de stable main"
        state: present
        filename: gierens

    - name: Install eza from repository
      ansible.builtin.apt:
        name: eza
        state: present
        update_cache: true

# --- eza (user-level fallback) ---
- name: Re-check if eza is installed
  when: ansible_facts["os_family"] == "Debian"
  ansible.builtin.shell: command -v eza
  register: eza_recheck
  changed_when: false
  failed_when: false

- name: Install eza from GitHub releases (user-level, no sudo)
  when:
    - ansible_facts["os_family"] == "Debian"
    - eza_recheck.rc != 0
    - target_architecture in ['x86_64', 'amd64', 'aarch64', 'arm64']
  block:
    - name: Ensure ~/.local/bin exists (eza)
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        state: directory
        mode: '0755'

    - name: Get latest eza release
      ansible.builtin.uri:
        url: https://api.github.com/repos/eza-community/eza/releases/latest
        return_content: true
      register: eza_release

    - name: Download eza binary
      ansible.builtin.get_url:
        url: "https://github.com/eza-community/eza/releases/download/{{ eza_release.json.tag_name }}/eza_{{ target_architecture }}-unknown-linux-gnu.tar.gz"
        dest: /tmp/eza.tar.gz
        mode: '0644'
        timeout: 120
      retries: 3
      delay: 5

    - name: Extract eza to ~/.local/bin
      ansible.builtin.unarchive:
        src: /tmp/eza.tar.gz
        dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        remote_src: true

    - name: Clean up eza tarball
      ansible.builtin.file:
        path: /tmp/eza.tar.gz
        state: absent

  rescue:
    - name: Warn eza installation failed
      ansible.builtin.debug:
        msg: "eza installation failed (likely network timeout) - skipping"

    - name: Clean up eza temp files after failure
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/eza.tar.gz

