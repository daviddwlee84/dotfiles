        /tmp/bats-extract/install.sh "{{ ansible_facts['env']['HOME'] }}/.local"
      args:
        executable: /bin/bash
      changed_when: true

    - name: Clean up bats temp files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/bats.tar.gz
        - /tmp/bats-extract

  rescue:
