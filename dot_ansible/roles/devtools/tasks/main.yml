---
# Developer CLI tools role
# Tools: bat, gh, glab, diffnav, gh-dash, eza, git-delta, git-graph, tldr, glow, thefuck, zoxide, direnv, yazi, superfile, tmux, sesh, zellij, btop, htop, duckdb, rclone, coreutils, taplo, television

# =============================================================================
# macOS - all via Homebrew
# =============================================================================

- name: Tap diffnav formula (macOS)
  when: ansible_facts["os_family"] == "Darwin"
  community.general.homebrew_tap:
    name: dlvhdr/formulae
    state: present

- name: Install developer CLI tools (macOS)
  when: ansible_facts["os_family"] == "Darwin"
  community.general.homebrew:
    name:
      - bat
      - gh
      - glab
      - diffnav
      - git-delta
      - git-graph
      - eza
      - tlrc
      - glow
      - thefuck
      - zoxide
      - direnv
      - yazi
      - superfile
      - tmux
      - sesh
      - zellij
      - btop
      - htop
      - duckdb
      - rclone
      - coreutils
      - taplo
      - television
    state: present

# =============================================================================
# Linux (Debian/Ubuntu)
# =============================================================================

# --- gh ---
- name: Check if gh is installed
  when: ansible_facts["os_family"] == "Debian"
  ansible.builtin.command: gh --version
  register: gh_check
  changed_when: false
  failed_when: false
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:/usr/local/bin:{{ ansible_facts['env']['PATH'] }}"

- name: Set gh release architecture
  when:
    - ansible_facts["os_family"] == "Debian"
    - gh_check.rc != 0
  ansible.builtin.set_fact:
    gh_release_arch: >-
      {{
        'amd64' if target_architecture in ['x86_64', 'amd64']
        else 'arm64' if target_architecture in ['aarch64', 'arm64']
        else ''
      }}

- name: Skip gh on unsupported architecture
  when:
    - ansible_facts["os_family"] == "Debian"
    - gh_check.rc != 0
    - gh_release_arch == ''
  ansible.builtin.debug:
    msg: "gh skipped: no release for {{ target_architecture }}"

- name: Install gh from GitHub releases (Debian/Ubuntu)
  when:
    - ansible_facts["os_family"] == "Debian"
    - gh_check.rc != 0
    - gh_release_arch != ''
  become: true
  tags: [sudo]
  block:
    - name: Get latest gh release
      ansible.builtin.uri:
        url: https://api.github.com/repos/cli/cli/releases/latest
        return_content: true
      register: gh_release

    - name: Download gh .deb package
      ansible.builtin.get_url:
        url: "https://github.com/cli/cli/releases/download/{{ gh_release.json.tag_name }}/gh_{{ gh_release.json.tag_name | regex_replace('^v', '') }}_linux_{{ gh_release_arch }}.deb"
        dest: /tmp/gh.deb
        mode: '0644'
        timeout: 120
      retries: 3
      delay: 5

    - name: Install gh .deb package
      ansible.builtin.apt:
        deb: /tmp/gh.deb

    - name: Clean up gh .deb
      ansible.builtin.file:
        path: /tmp/gh.deb
        state: absent

  rescue:
    - name: Warn gh installation failed
      ansible.builtin.debug:
        msg: "gh installation failed (likely network timeout) - skipping"

    - name: Clean up gh temp files after failure
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/gh.deb

# --- gh (user-level fallback) ---
- name: Re-check if gh is installed
  when: ansible_facts["os_family"] == "Debian"
  ansible.builtin.shell: command -v gh
  register: gh_recheck
  changed_when: false
  failed_when: false
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:/usr/local/bin:{{ ansible_facts['env']['PATH'] }}"

- name: Install gh from GitHub releases (user-level, no sudo)
  when:
    - ansible_facts["os_family"] == "Debian"
    - gh_recheck.rc != 0
    - gh_release_arch | default('') != ''
  block:
    - name: Ensure ~/.local/bin exists (gh)
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        state: directory
        mode: '0755'

    - name: Get latest gh release (user)
      ansible.builtin.uri:
        url: https://api.github.com/repos/cli/cli/releases/latest
        return_content: true
      register: gh_release_user

    - name: Download gh tarball (user)
      ansible.builtin.get_url:
        url: "https://github.com/cli/cli/releases/download/{{ gh_release_user.json.tag_name }}/gh_{{ gh_release_user.json.tag_name | regex_replace('^v', '') }}_linux_{{ gh_release_arch }}.tar.gz"
        dest: /tmp/gh.tar.gz
        mode: '0644'
        timeout: 120
      retries: 3
      delay: 5

    - name: Extract and install gh (user)
      ansible.builtin.shell: |
        set -euo pipefail
        rm -rf /tmp/gh-extract
        mkdir -p /tmp/gh-extract
        tar -xzf /tmp/gh.tar.gz -C /tmp/gh-extract
        gh_bin="$(find /tmp/gh-extract -type f -path '*/bin/gh' | head -n 1)"
        install -m 0755 "$gh_bin" "{{ ansible_facts['env']['HOME'] }}/.local/bin/gh"
      args:
        executable: /bin/bash
      changed_when: true

    - name: Clean up gh temp files (user)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/gh.tar.gz
        - /tmp/gh-extract

  rescue:
    - name: Warn gh (user) installation failed
      ansible.builtin.debug:
        msg: "gh (user) installation failed (likely network timeout) - skipping"

    - name: Clean up gh (user) temp files after failure
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/gh.tar.gz
        - /tmp/gh-extract

