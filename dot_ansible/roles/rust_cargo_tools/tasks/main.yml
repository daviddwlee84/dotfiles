---
# Cargo CLI tools installation
# Rust is installed via mise

# =============================================================================
# Ensure Rust is installed via mise
# =============================================================================

- name: Check for user-installed mise
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/mise"
  register: mise_user_install

- name: Set mise binary path
  ansible.builtin.set_fact:
    mise_bin: "{{ mise_user_install.stat.exists | ternary(ansible_facts['env']['HOME'] + '/.local/bin/mise', '/opt/homebrew/bin/mise' if ansible_facts['os_family'] == 'Darwin' else '/usr/local/bin/mise') }}"

# Guard on the actual cargo binary, NOT the mise installs/rust dir. mise's rust
# backend is rustup, which symlinks installs/rust/<ver> → ~/.cargo/bin. If
# ~/.cargo/bin is later wiped, the installs/rust dir lingers full of DEAD symlinks
# — a `creates: …/installs/rust` guard then skips the (re)install forever and the
# cargo shim fails with "cargo is not a valid shim". Keying on ~/.cargo/bin/cargo
# (same as the cargo-tools + EL7 tasks below) self-heals that state.
# See pitfalls/mise-rust-cargo-shim-dead.md.
#
# The version spec MUST match `rust = "stable"` in dot_config/mise/config.toml.tmpl
# (the SSOT). Installing `rust@latest` here instead writes installs/rust/<semver>
# and leaves installs/rust/stable absent, so mise prints `WARN missing: rust@stable`
# on every shell prompt forever — the `creates:` guard below is already satisfied
# by ~/.cargo/bin/cargo, so the task never re-runs to correct it.
- name: Install Rust via mise (non-EL7) — configured mirror first
  when: not (oldEL | default(false))
  ansible.builtin.command: "{{ mise_bin }} install rust@stable"
  args:
    creates: "{{ ansible_facts['env']['HOME'] }}/.cargo/bin/cargo"
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:/opt/homebrew/bin:/usr/local/bin:{{ ansible_facts['env']['PATH'] }}"
  register: mise_rust_install
  failed_when: false

# Fallback when the user's RUSTUP_DIST_SERVER (e.g. the TUNA mirror behind the GFW)
# serves an obsolete/GC'd manifest for the rust channel — fails with "the server
# unexpectedly provided an obsolete version of the distribution manifest". Retry
# against the canonical rustup server (same reasoning as the CentOS-7 fallback
# below, now generalized to all platforms). crates.io stays on the user's mirror
# (~/.cargo/config.toml) so dependency builds keep their speed.
- name: Install Rust via mise (non-EL7) — official-server fallback (mirror manifest GC)
  when:
    - not (oldEL | default(false))
    - mise_rust_install.rc | default(0) != 0
  ansible.builtin.command: "{{ mise_bin }} install rust@stable"
  args:
    creates: "{{ ansible_facts['env']['HOME'] }}/.cargo/bin/cargo"
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:/opt/homebrew/bin:/usr/local/bin:{{ ansible_facts['env']['PATH'] }}"
    RUSTUP_DIST_SERVER: "https://static.rust-lang.org"
    RUSTUP_UPDATE_ROOT: "https://static.rust-lang.org/rustup"

# CentOS 7 / RHEL 7: mise's rustup channel goes through the TUNA mirror which
# garbage-collects old versions; `rust@latest` 404s when TUNA hasn't pulled the
# newest release yet (observed 2026-05 on 1.95.0). Use upstream rustup-init
# directly — it respects ~/.cargo/config.toml's crates.io mirror but bypasses
# TUNA for the toolchain download. Path documented in
# dot_config/mise/config.toml.tmpl:36-37.
- name: Install Rust via rustup-init (CentOS/RHEL 7 fallback)
  when: oldEL | default(false)
  ansible.builtin.shell: |
    set -e
    if [ -x "{{ ansible_facts['env']['HOME'] }}/.cargo/bin/cargo" ]; then
      echo "ALREADY_INSTALLED"
      exit 0
    fi
    curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
      | sh -s -- -y --default-toolchain stable --no-modify-path
  args:
    executable: /bin/bash
    creates: "{{ ansible_facts['env']['HOME'] }}/.cargo/bin/cargo"
  environment:
    RUSTUP_DIST_SERVER: "https://static.rust-lang.org"
    RUSTUP_UPDATE_ROOT: "https://static.rust-lang.org/rustup"

# =============================================================================
# Install cargo tools (all platforms)
# =============================================================================

- name: Install Cargo CLI tools via cargo install
  ansible.builtin.command: cargo install {{ item.name }}
  args:
    creates: "{{ ansible_facts['env']['HOME'] }}/.cargo/bin/{{ item.binary }}"
  loop: "{{ cargo_tools }}"
  loop_control:
    label: "{{ item.name }}"
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/share/mise/shims:{{ ansible_facts['env']['HOME'] }}/.cargo/bin:{{ ansible_facts['env']['PATH'] }}"

# =============================================================================
# recon — tmux-native dashboard for managing live Claude Code sessions
# https://github.com/gavraz/recon  (no crates.io release; install from git)
# Used by the `Agents` tmux popup submenu (dot_config/tmux/menu-agents.sh).
# Companion to `tv agent-panes` for the multi-agent overview.
# =============================================================================

- name: Install recon (Claude Code tmux dashboard) via cargo install --git
  ansible.builtin.command: cargo install --git https://github.com/gavraz/recon --locked
  args:
    creates: "{{ ansible_facts['env']['HOME'] }}/.cargo/bin/recon"
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/share/mise/shims:{{ ansible_facts['env']['HOME'] }}/.cargo/bin:{{ ansible_facts['env']['PATH'] }}"

# =============================================================================
# Pueue - macOS (via Homebrew)
# =============================================================================

- name: Install pueue via Homebrew (macOS)
  when: ansible_facts["os_family"] == "Darwin"
  community.general.homebrew:
    name: pueue
    state: present

# =============================================================================
# Pueue - Linux (via cargo + systemd)
# =============================================================================

- name: Install pueue via cargo (Linux)
  when: ansible_facts["os_family"] in ["Debian", "RedHat"]
  ansible.builtin.command: cargo install pueue --locked
  args:
    creates: "{{ ansible_facts['env']['HOME'] }}/.cargo/bin/pueue"
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/share/mise/shims:{{ ansible_facts['env']['HOME'] }}/.cargo/bin:{{ ansible_facts['env']['PATH'] }}"

# =============================================================================
# Pueue version checks (warn by default, optional strict enforcement)
# =============================================================================

- name: Check installed pueue version
  when: ansible_facts["os_family"] in ["Darwin", "Debian", "RedHat"]
  ansible.builtin.shell: pueue --version 2>/dev/null | awk '{print $2}'
  args:
    executable: /bin/bash
  register: pueue_version_raw
  changed_when: false
  failed_when: false

- name: Check installed pueued version
  when: ansible_facts["os_family"] in ["Darwin", "Debian", "RedHat"]
  ansible.builtin.shell: pueued --version 2>/dev/null | awk '{print $2}'
  args:
    executable: /bin/bash
  register: pueued_version_raw
  changed_when: false
  failed_when: false

- name: Parse installed pueue versions
  when: ansible_facts["os_family"] in ["Darwin", "Debian", "RedHat"]
  ansible.builtin.set_fact:
    pueue_version_installed: "{{ (pueue_version_raw.stdout | trim | regex_search('[0-9]+\\.[0-9]+\\.[0-9]+')) | default('0.0.0', true) }}"
    pueued_version_installed: "{{ (pueued_version_raw.stdout | trim | regex_search('[0-9]+\\.[0-9]+\\.[0-9]+')) | default('0.0.0', true) }}"

- name: Display installed pueue versions
  when: ansible_facts["os_family"] in ["Darwin", "Debian", "RedHat"]
  ansible.builtin.debug:
    msg: "Installed pueue versions: pueue={{ pueue_version_installed }}, pueued={{ pueued_version_installed }} (required: >= {{ pueue_min_version }}, enforce={{ pueue_version_enforce | bool }})"

- name: Warn if pueue versions are below minimum (non-enforcing mode)
  when:
    - ansible_facts["os_family"] in ["Darwin", "Debian"]
    - not (pueue_version_enforce | bool)
    - pueue_version_installed is version(pueue_min_version, '<') or pueued_version_installed is version(pueue_min_version, '<')
  ansible.builtin.debug:
    msg: "WARNING: pueue={{ pueue_version_installed }}, pueued={{ pueued_version_installed }} are below required {{ pueue_min_version }}. Set pueue_version_enforce=true to fail on this condition."

- name: Enforce minimum pueue versions
  when:
    - ansible_facts["os_family"] in ["Darwin", "Debian"]
    - pueue_version_enforce | bool
  ansible.builtin.assert:
    that:
      - pueue_version_installed is version(pueue_min_version, '>=')
      - pueued_version_installed is version(pueue_min_version, '>=')
    fail_msg: "pueue version requirement failed: required >= {{ pueue_min_version }}, found pueue={{ pueue_version_installed }}, pueued={{ pueued_version_installed }}"
    success_msg: "pueue version requirement satisfied: pueue={{ pueue_version_installed }}, pueued={{ pueued_version_installed }}"

- name: Create systemd user directory
  when: ansible_facts["os_family"] in ["Debian", "RedHat"]
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user"
    state: directory
    mode: '0755'

- name: Install pueued systemd user service
  when: ansible_facts["os_family"] in ["Debian", "RedHat"]
  ansible.builtin.copy:
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user/pueued.service"
    mode: '0644'
    content: |
      [Unit]
      Description=Pueue Daemon - CLI Process Queue
      Documentation=https://github.com/Nukesor/pueue

      [Service]
      ExecStart=%h/.cargo/bin/pueued --verbose
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=default.target

- name: Enable and start pueued service
  when: ansible_facts["os_family"] in ["Debian", "RedHat"]
  ansible.builtin.systemd:
    name: pueued
    scope: user
    enabled: true
    state: started
    daemon_reload: true
  ignore_errors: true  # Fails when no user systemd instance is reachable:
                       #   - containers without systemd (PID 1 != systemd)
                       #   - SSH session before `loginctl enable-linger` took effect
                       #   - CentOS 7 / RHEL 7: stock systemd 219 has NO user@.service
                       #     template at all, so even with linger enabled there is no
                       #     user instance to talk to. See
                       #     pitfalls/centos7-systemd-user-instance-missing.md for the
                       #     full failure mode + manual workaround (run pueued under
                       #     tmux/nohup, or install as a system service with User=).
                       # The unit file we wrote above stays on disk regardless,
                       # ready for any of the manual paths.
