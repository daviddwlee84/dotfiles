---
# Install the summarize CLI.
# - Apple Silicon: homebrew-core formula (deps ffmpeg / node / tesseract / yt-dlp)
# - Intel macOS and Linux: npm global via mise (needs Node 24+)
#
# The zh-TW output defaults live in dot_summarize/modify_config.json, not here —
# this role only puts the binary on PATH.

- name: Check whether summarize is already installed
  ansible.builtin.command: command -v {{ summarize_binary }}
  register: summarize_presence
  changed_when: false
  failed_when: false

- name: Install summarize via Homebrew (macOS)
  when:
    - ansible_facts["os_family"] == "Darwin"
    - target_architecture in ["arm64", "aarch64"]
    - summarize_presence.rc != 0
  community.general.homebrew:
    name: summarize
    state: present

# --- Intel macOS/Linux: npm global, preferring mise's user-level Node prefix -
# Mirrors the js_cli_tools idiom: system npm on noRoot hosts has its prefix at
# /usr/local (unwritable without sudo), mise's prefix works for both OSes.
- name: Locate user-installed mise (summarize)
  when: ansible_facts["os_family"] in ["Debian", "RedHat", "Darwin"]
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/mise"
  register: summarize_mise_user_bin

- name: Set mise binary path (user install)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat", "Darwin"]
    - summarize_mise_user_bin.stat.exists | default(false)
  ansible.builtin.set_fact:
    summarize_mise_bin: "{{ ansible_facts['env']['HOME'] }}/.local/bin/mise"

- name: Detect system-installed mise (summarize)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat", "Darwin"]
    - summarize_mise_bin is not defined
  ansible.builtin.command: mise --version
  register: summarize_mise_system_check
  changed_when: false
  failed_when: false

- name: Set mise binary path (system install)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat", "Darwin"]
    - summarize_mise_bin is not defined
    - summarize_mise_system_check.rc | default(1) == 0
  ansible.builtin.set_fact:
    summarize_mise_bin: mise

# Intel Homebrew is Tier 3 and the formula forces an upgrade of pinned brew
# Node. Use the already-managed mise Node instead, without changing the pin.
# oldEL cannot run Node 24; mirrors the mise [tools] exclusion in linux.yml.
- name: Install summarize via mise npm (Linux and Intel macOS)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"] or (ansible_facts["os_family"] == "Darwin" and target_architecture in ["x86_64", "amd64"])
    - not (oldEL | default(false))
    - summarize_presence.rc != 0
    - summarize_mise_bin is defined
  ansible.builtin.shell: |
    {{ summarize_mise_bin }} exec -- npm install -g {{ summarize_npm_package }}
  args:
    executable: /bin/bash
  register: summarize_npm_install
  until: summarize_npm_install is succeeded
  retries: 3
  delay: 5
  changed_when: true
  failed_when: false

- name: Warn summarize installation failed
  when:
    - summarize_npm_install is defined
    - summarize_npm_install.rc is defined
    - summarize_npm_install.rc != 0
  ansible.builtin.debug:
    msg: "summarize installation failed (likely network timeout or Node < 24) - skipping"

- name: Warn when npm installation needs mise/Node
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"] or (ansible_facts["os_family"] == "Darwin" and target_architecture in ["x86_64", "amd64"])
    - not (oldEL | default(false))
    - summarize_presence.rc != 0
    - summarize_mise_bin is not defined
  ansible.builtin.debug:
    msg: >-
      summarize: mise not found -- skipping {{ summarize_npm_package }}.
      Ensure Node 24+ is available (e.g. via mise) and re-run.
