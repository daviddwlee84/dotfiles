---
# Python CLI tools via uv
# uv is bootstrapped before ansible runs (run_once_before_00_bootstrap.sh.tmpl
# curls the official installer to ~/.local/bin/uv when missing). This role
# additionally guarantees that uv is recent enough for the flags it uses.

# -----------------------------------------------------------------------------
# Minimum-uv-version gate (auto-upgrade aware)
# -----------------------------------------------------------------------------
#
# The role's `defaults/main.yml` uses `with_executables_from:` for the
# jupyterlab entry to expose `jupyter` / `jupyter-notebook` shims from
# jupyter-core / notebook. That is the `--with-executables-from` flag of
# `uv tool install`, added in uv 0.8.5 (PR astral-sh/uv#14014, released
# 2025-08-xx). Older uv aborts the install loop with:
#   error: unexpected argument '--with-executables-from' found
#
# The user's fleet currently spans:
#   * macOS w/ Homebrew uv  → /opt/homebrew/bin/uv         (`brew upgrade uv`)
#   * macOS w/ curl install → ~/.local/bin/uv              (`uv self update`)
#   * Ubuntu w/ curl install → ~/.local/bin/uv             (`uv self update`)
#   * Linuxbrew              → /home/linuxbrew/.linuxbrew/bin/uv (`brew upgrade uv`)
#
# `uv self update` REFUSES on brew installs ("self-update is disabled for
# this build"). So we detect the install style and dispatch to the right
# upgrade command rather than blindly trying one. See
# `pitfalls/uv-self-update-homebrew-noop.md` and
# `pitfalls/ansible-when-regex-replace-backslash-strip.md`.
- name: Set minimum required uv version
  ansible.builtin.set_fact:
    min_uv_version: "0.8.5"

# Probe current uv version. `uv --version` prints e.g.:
#   "uv 0.7.4 (6fbcd09b5 2025-05-15)"
#   "uv 0.10.2 (Homebrew 2026-02-10)"
#   "uv 0.7.18"
# We take field 2 with awk to avoid `regex_replace` inside `when:` clauses,
# which silently strips one layer of backslashes (\S → S, \1 → 1) and makes
# the regex never match — `regex_replace` then returns the original string,
# and the version test fails with a misleading
#   "'<' not supported between instances of 'str' and 'int'".
# See pitfalls/ansible-when-regex-replace-backslash-strip.md.
- name: Probe current uv version
  ansible.builtin.shell: |
    set -e
    uv --version | awk '{print $2}'
  args:
    executable: /bin/bash
  register: _uv_initial
  changed_when: false

- name: Set initial uv_version fact (clean string, safe for `is version()`)
  ansible.builtin.set_fact:
    _uv_initial_version: "{{ _uv_initial.stdout | trim }}"

# Detect install style by binary path + brew formula registry.
# Order matters: a path under */homebrew/* or */linuxbrew/* is
# unambiguous. /usr/local/bin/uv is shared between Intel-mac brew and the
# curl installer — disambiguate by asking brew if it owns the formula.
- name: Detect uv install style (brew vs curl-installer vs other)
  ansible.builtin.shell: |
    set -e
    p="$(command -v uv)"
    case "$p" in
      */homebrew/*|*/Cellar/*|*/linuxbrew/*)
        echo brew
        ;;
      /usr/local/bin/uv)
        # `-n "$(brew --prefix)"` not `command -v brew`: a fake brew stub
        # exits 0 for every subcommand (incl. `brew list`), which would
        # misclassify a curl-installed uv as brew-managed and make the
        # min-version upgrade a silent no-op.
        # See pitfalls/ansible-homebrew-expecting-value-line-1-column-1.md.
        if [ -n "$(brew --prefix 2>/dev/null)" ] \
           && brew list --formula uv >/dev/null 2>&1; then
          echo brew
        else
          echo curl
        fi
        ;;
      "$HOME"/.local/bin/uv|"$HOME"/.cargo/bin/uv)
        echo curl
        ;;
      *)
        # Best-effort fallback: if brew owns the formula, treat as brew;
        # else assume self-update-capable (curl style or stand-alone binary).
        # `-n "$(brew --prefix)"` not `command -v brew`: a fake brew stub
        # exits 0 for every subcommand (incl. `brew list`), which would
        # misclassify a curl-installed uv as brew-managed and make the
        # min-version upgrade a silent no-op.
        # See pitfalls/ansible-homebrew-expecting-value-line-1-column-1.md.
        if [ -n "$(brew --prefix 2>/dev/null)" ] \
           && brew list --formula uv >/dev/null 2>&1; then
          echo brew
        else
          echo curl
        fi
        ;;
    esac
  args:
    executable: /bin/bash
  register: _uv_install_style
  changed_when: false

- name: Show detected uv state
  ansible.builtin.debug:
    msg: >-
      uv {{ _uv_initial_version }}
      (install style: {{ _uv_install_style.stdout }};
      minimum required: {{ min_uv_version }})

# --- Upgrade dispatch (only fires when uv is too old) ---

# `community.general.homebrew state=latest` is idempotent and runs as the
# invoking user (no become). Covers macOS Homebrew + Linuxbrew.
- name: Upgrade uv via Homebrew (brew install detected, version too old)
  community.general.homebrew:
    name: uv
    state: latest
  when:
    - _uv_initial_version is version(min_uv_version, '<')
    - _uv_install_style.stdout == 'brew'
  register: _uv_brew_upgrade
  until: _uv_brew_upgrade is succeeded
  retries: 3
  delay: 10

# `uv self update` is the canonical refresh for the curl/standalone install.
# Network-dependent so retried; treat "already up to date" stdout as not-changed.
- name: Upgrade uv via self-update (curl install detected, version too old)
  ansible.builtin.command: uv self update
  register: _uv_self_update
  changed_when: >-
    'updated to' in (_uv_self_update.stdout | default(''))
    or 'updated to' in (_uv_self_update.stderr | default(''))
  until: _uv_self_update is succeeded
  retries: 3
  delay: 10
  when:
    - _uv_initial_version is version(min_uv_version, '<')
    - _uv_install_style.stdout == 'curl'

# Re-probe unconditionally — cheap, and gives us a clean post-upgrade fact
# regardless of which (or no) upgrade branch fired.
- name: Re-probe uv version after upgrade attempt
  ansible.builtin.shell: |
    set -e
    uv --version | awk '{print $2}'
  args:
    executable: /bin/bash
  register: _uv_final
  changed_when: false

- name: Set final uv_version fact
  ansible.builtin.set_fact:
    uv_version: "{{ _uv_final.stdout | trim }}"

- name: Fail if uv is still too old after auto-upgrade attempt
  ansible.builtin.fail:
    msg: |
      uv {{ uv_version }} is below the required minimum {{ min_uv_version }},
      and the auto-upgrade attempt did not help (install style detected:
      {{ _uv_install_style.stdout }}).

      Manual fix by install style:
        macOS Homebrew     →  brew upgrade uv
        Linuxbrew          →  brew upgrade uv
        curl/standalone    →  uv self update     (or: just upgrade-tools uv)
        unknown / other    →  reinstall via https://docs.astral.sh/uv/getting-started/installation/

      The --with-executables-from flag (used by the jupyterlab entry in
      this role's defaults/main.yml) was added in uv 0.8.5
      (PR astral-sh/uv#14014).
  when: uv_version is version(min_uv_version, '<')

# -----------------------------------------------------------------------------
# GCC capability gate (for tools that fall back to source builds)
# -----------------------------------------------------------------------------
# Modern wheel ecosystem dropped manylinux_2_17 (CentOS 7 baseline) so older
# glibc hosts fall back to compiling numpy / pandas / pyarrow from source —
# and the build now requires GCC >= 9.3 (numpy meson build asserts).
# CentOS 7 ships gcc 4.8.5; the tools tagged `needs_modern_gcc: true` get
# skipped there. See pitfalls/centos7-numpy-pandas-source-build.md.
- name: Detect host C compiler (gcc) version
  ansible.builtin.shell: |
    set -e
    if command -v gcc >/dev/null 2>&1; then
      gcc -dumpversion 2>/dev/null | head -1
    else
      echo "0"
    fi
  args:
    executable: /bin/bash
  register: gcc_version_probe
  changed_when: false
  failed_when: false

- name: Set fact gcc_too_old (true when major < 9)
  ansible.builtin.set_fact:
    gcc_too_old: >-
      {{ ((gcc_version_probe.stdout | trim).split('.')[0] | int) < 9 }}

- name: Resolve uv tool environment directory
  ansible.builtin.command: uv tool dir
  register: _uv_tool_dir
  changed_when: false

- name: Probe required Python distributions inside uv tool environments
  ansible.builtin.command:
    argv:
      - "{{ _uv_tool_dir.stdout | trim }}/{{ item.0.env_name }}/bin/python"
      - -c
      - "import importlib.metadata as m; m.version({{ item.1 | to_json }})"
  loop: >-
    {{ python_uv_tools
       | subelements('required_distributions', skip_missing=True) }}
  loop_control:
    label: "{{ item.0.name }} -> {{ item.1 }}"
  register: _uv_required_distributions_probe
  changed_when: false
  failed_when: false
  when:
    - not (item.0.needs_modern_gcc | default(false) and gcc_too_old)

- name: Probe extra_binaries presence (for entries using with_executables_from)
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/{{ item.1 }}"
  loop: >-
    {{ python_uv_tools
       | subelements('extra_binaries', skip_missing=True) }}
  loop_control:
    label: "{{ item.0.name }} -> {{ item.1 }}"
  register: _uv_extra_binaries_probe
  changed_when: false

- name: Install Python CLI tools via uv
  ansible.builtin.command: >-
    uv tool install
    {% if _force_reinstall %}--force {% endif %}
    {{ item.name }}
    {% if item.python is defined %}--python {{ item.python }} {% endif %}
    {% if item.with is defined %}{% for dep in item.with %}--with {{ dep }} {% endfor %}{% endif %}
    {% if item.with_executables_from is defined %}{% for dep in item.with_executables_from %}--with-executables-from {{ dep }} {% endfor %}{% endif %}
  vars:
    # True when ANY declared extra_binary is missing on disk. We can't use
    # `creates:` for these entries because the primary `binary` may already
    # exist from a previous apply (before `with_executables_from` was added
    # or extended), causing ansible to skip the command and never write the
    # new shims. See pitfalls/uv-tool-install-creates-guard-misses-executables-from.md.
    _extras: "{{ item.extra_binaries | default([]) }}"
    _missing_extras: >-
      {{ _uv_extra_binaries_probe.results
         | default([])
         | selectattr('item.0.name', 'equalto', item.name)
         | rejectattr('stat.exists')
         | map(attribute='item.1')
         | list }}
    _missing_distributions: >-
      {{ _uv_required_distributions_probe.results
         | default([])
         | selectattr('item.0.name', 'equalto', item.name)
         | selectattr('rc', 'defined')
         | rejectattr('rc', 'equalto', 0)
         | map(attribute='item.1')
         | list }}
    _force_reinstall: >-
      {{ (_missing_extras | length > 0) or (_missing_distributions | length > 0) }}
    _primary_binary_path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/{{ item.binary }}"
    _primary_exists: "{{ _primary_binary_path is exists }}"
  register: python_uv_tool_install
  until: python_uv_tool_install is succeeded
  retries: 3
  delay: 5
  # Skip when the primary binary exists, all declared entry-point shims
  # exist, and every required distribution is present inside the tool venv.
  changed_when: python_uv_tool_install.rc == 0 and (_force_reinstall or not _primary_exists)
  environment:
    UV_HTTP_TIMEOUT: "120"
    UV_HTTP_RETRIES: "5"
  when:
    - not (item.needs_modern_gcc | default(false) and gcc_too_old)
    - (not _primary_exists) or _force_reinstall
  loop: "{{ python_uv_tools }}"
  loop_control:
    label: >-
      {{ item.name
         }}{% if item.needs_modern_gcc | default(false) and gcc_too_old %} [SKIPPED: needs gcc >= 9]{% endif
         %}{% if item.extra_binaries is defined %} [extras: {{ item.extra_binaries | join(',') }}]{% endif
         %}{% if item.required_distributions is defined %} [distributions: {{ item.required_distributions | join(',') }}]{% endif %}

- name: Verify required Python distributions after uv tool install
  ansible.builtin.command:
    argv:
      - "{{ _uv_tool_dir.stdout | trim }}/{{ item.0.env_name }}/bin/python"
      - -c
      - "import importlib.metadata as m; print(m.version({{ item.1 | to_json }}))"
  loop: >-
    {{ python_uv_tools
       | subelements('required_distributions', skip_missing=True) }}
  loop_control:
    label: "{{ item.0.name }} -> {{ item.1 }}"
  register: _uv_required_distributions_verify
  changed_when: false
  failed_when: _uv_required_distributions_verify.rc != 0
  when:
    - not (item.0.needs_modern_gcc | default(false) and gcc_too_old)
