---
# Neovim role - install Neovim with version check

- name: Check current Neovim version
  ansible.builtin.shell: nvim --version 2>/dev/null | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+'
  register: nvim_version_check
  changed_when: false
  failed_when: false

- name: Set Neovim version fact
  ansible.builtin.set_fact:
    nvim_current_version: "{{ nvim_version_check.stdout | default('0.0.0', true) | trim or '0.0.0' }}"

- name: Display current Neovim version
  ansible.builtin.debug:
    msg: "Current Neovim version: {{ nvim_current_version }} (required: >= {{ neovim_min_version }})"

# macOS - use Homebrew
- name: Install Neovim (macOS)
  when: ansible_facts["os_family"] == "Darwin"
  community.general.homebrew:
    name: neovim
    state: latest

# Linux - try apt first, then snap
- name: Install Neovim from apt (Debian/Ubuntu)
  when: ansible_facts["os_family"] == "Debian"
  become: true
  tags: [sudo]
  ansible.builtin.apt:
    name: neovim
    state: present
  register: apt_neovim

- name: Check Neovim version after apt install
  when: ansible_facts["os_family"] == "Debian" and apt_neovim is defined and apt_neovim is succeeded
  ansible.builtin.shell: nvim --version 2>/dev/null | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+'
  register: nvim_apt_version
  changed_when: false
  failed_when: false

- name: Check if snap is available
  when: ansible_facts["os_family"] == "Debian"
  ansible.builtin.command: which snap
  register: snap_check
  changed_when: false
  failed_when: false

- name: Install Neovim from snap if apt version too old
  when:
    - ansible_facts["os_family"] == "Debian"
    - nvim_apt_version.stdout is defined
    - nvim_apt_version.stdout is version(neovim_min_version, '<')
    - snap_check.rc == 0
  become: true
  tags: [sudo]
  block:
    - name: Remove apt Neovim
      ansible.builtin.apt:
        name: neovim
        state: absent

    - name: Install Neovim from snap
      community.general.snap:
        name: nvim
        classic: true
        state: present

# Architecture fact applies to both Debian-family and RedHat-family
# Linux paths (system-level on Debian; user-level on either when noRoot or
# when the system package version is too old). Pure data, no package
# manager involved — broadened per pitfalls/centos7-noroot.md gate pattern.
- name: Set Neovim tarball architecture (system)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
  ansible.builtin.set_fact:
    nvim_sys_arch: >-
      {{
        'x86_64' if target_architecture in ['x86_64', 'amd64']
        else 'arm64' if target_architecture in ['aarch64', 'arm64']
        else ''
      }}

- name: Install Neovim from GitHub releases if snap unavailable
  when:
    - ansible_facts["os_family"] == "Debian"
    - nvim_apt_version.stdout is defined
    - nvim_apt_version.stdout is version(neovim_min_version, '<')
    - snap_check.rc != 0
    - nvim_sys_arch | default('') != ''
  become: true
  tags: [sudo]
  block:
    - name: Remove apt Neovim (before GitHub install)
      ansible.builtin.apt:
        name: neovim
        state: absent

    - name: Get latest Neovim release
      ansible.builtin.uri:
        url: https://api.github.com/repos/neovim/neovim/releases/latest
        return_content: true
      register: nvim_release

    - name: Download Neovim tarball
      ansible.builtin.get_url:
        url: "https://github.com/neovim/neovim/releases/download/{{ nvim_release.json.tag_name }}/nvim-linux-{{ nvim_sys_arch }}.tar.gz"
        dest: /tmp/nvim.tar.gz
        mode: '0644'
        timeout: 120
      retries: 3
      delay: 5

    - name: Create /opt/nvim directory
      ansible.builtin.file:
        path: /opt/nvim
        state: directory
        mode: '0755'

    - name: Extract Neovim
      ansible.builtin.unarchive:
        src: /tmp/nvim.tar.gz
        dest: /opt/nvim
        remote_src: true
        extra_opts:
          - --strip-components=1

    - name: Create nvim symlink
      ansible.builtin.file:
        src: /opt/nvim/bin/nvim
        dest: /usr/local/bin/nvim
        state: link

    - name: Clean up Neovim tarball
      ansible.builtin.file:
        path: /tmp/nvim.tar.gz
        state: absent

    - name: Display installed Neovim version
      ansible.builtin.debug:
        msg: "Installed Neovim {{ nvim_release.json.tag_name }} from GitHub releases"

  rescue:
    - name: Warn Neovim GitHub install failed (system-level)
      ansible.builtin.debug:
        msg: "Failed to install Neovim from GitHub releases — keeping existing version or install manually"

    - name: Clean up temp files after failed Neovim install (system-level)
      ansible.builtin.file:
        path: /tmp/nvim.tar.gz
        state: absent

# =============================================================================
# User-level install (noRoot mode) - AppImage to ~/.local/bin
# =============================================================================

- name: Warn about Neovim on unsupported architecture
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - nvim_current_version is version(neovim_min_version, '<')
    - nvim_sys_arch | default('') == ''
  ansible.builtin.debug:
    msg: "Neovim GitHub release not available for {{ target_architecture }} — keeping system version or install manually"

# User-level fallback fires when the system-level apt path either:
#   - never ran at all (`apt_neovim is not defined` → noRoot Debian where
#     --skip-tags sudo prevented even the task from being scheduled), OR
#   - ran but was skipped because the conditional was False
#     (`apt_neovim is skipped` → any RedHat-family box, with or without sudo,
#     because the apt task is `when: os_family == "Debian"`. Without the
#     `is skipped` branch the variable is defined-but-skipped and the
#     fallback never fires — see pitfalls/centos7-neovim-apt-register-defined.md).
# On RedHat (any glibc 2.17 box, e.g. CentOS 7): the mainline neovim/neovim
# binaries require glibc 2.28+. We branch on the `oldEL` fact set in
# `playbooks/linux.yml` and download from `neovim/neovim-releases` (the
# upstream older-glibc rebuild repo) when oldEL is true.
- name: Install Neovim tarball (user-level, no sudo required)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - nvim_current_version is version(neovim_min_version, '<')
    - (apt_neovim is not defined) or (apt_neovim is skipped)
    - nvim_sys_arch | default('') != ''
  block:
    - name: Ensure ~/.local exists
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local"
        state: directory
        mode: '0755'

    - name: Set Neovim tarball architecture
      ansible.builtin.set_fact:
        nvim_tarball_arch: "{{ nvim_sys_arch }}"

    # oldEL (CentOS/RHEL 7, glibc 2.17): main neovim releases require
    # glibc 2.28+. Use neovim/neovim-releases (upstream's older-glibc rebuild
    # repo) which publishes the same version per release. Only their semver
    # tags exist — no `stable` floating tag — so we fetch the latest first.
    # `check_mode: false` so the API call happens even under `--check`;
    # without it the registered var is a skip dict and the set_fact below
    # crashes dereferencing `.json.tag_name`.
    - name: Get latest neovim-releases tag (oldEL → glibc 2.17 build)
      when: oldEL | default(false)
      ansible.builtin.uri:
        url: https://api.github.com/repos/neovim/neovim-releases/releases/latest
        return_content: true
      register: nvim_oldel_release
      check_mode: false
      environment:
        http_proxy: "{{ lookup('env', 'http_proxy') | default('', true) }}"
        https_proxy: "{{ lookup('env', 'https_proxy') | default('', true) }}"

    - name: Set Neovim tarball URL (oldEL → neovim-releases; else → stable)
      ansible.builtin.set_fact:
        nvim_tarball_url: >-
          {% if oldEL | default(false) -%}
          https://github.com/neovim/neovim-releases/releases/download/{{ nvim_oldel_release.json.tag_name }}/nvim-linux-{{ nvim_tarball_arch }}.tar.gz
          {%- else -%}
          https://github.com/neovim/neovim/releases/download/stable/nvim-linux-{{ nvim_tarball_arch }}.tar.gz
          {%- endif %}

    - name: Download Neovim tarball
      ansible.builtin.get_url:
        url: "{{ nvim_tarball_url | trim }}"
        dest: "/tmp/nvim.tar.gz"
        mode: '0644'
        timeout: 600
      retries: 3
      delay: 5
      environment:
        http_proxy: "{{ lookup('env', 'http_proxy') | default('', true) }}"
        https_proxy: "{{ lookup('env', 'https_proxy') | default('', true) }}"

    - name: Extract Neovim tarball to ~/.local
      ansible.builtin.unarchive:
        src: /tmp/nvim.tar.gz
        dest: "{{ ansible_facts['env']['HOME'] }}/.local"
        remote_src: true
        extra_opts:
          - --strip-components=1

    - name: Clean up Neovim tarball
      ansible.builtin.file:
        path: /tmp/nvim.tar.gz
        state: absent

    - name: Check Neovim version
      ansible.builtin.shell: "{{ ansible_facts['env']['HOME'] }}/.local/bin/nvim --version | head -1"
      register: nvim_user_version
      changed_when: false

    - name: Display installed Neovim version
      ansible.builtin.debug:
        msg: "Installed Neovim (user-level): {{ nvim_user_version.stdout }}"

  rescue:
    - name: Warn Neovim user-level install failed
      ansible.builtin.debug:
        msg: "Failed to install Neovim from GitHub releases (user-level) — install manually"

    - name: Clean up temp files after failed Neovim install (user-level)
      ansible.builtin.file:
        path: /tmp/nvim.tar.gz
        state: absent
