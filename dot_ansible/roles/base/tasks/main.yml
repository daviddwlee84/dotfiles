---
# Base role - essential tools across platforms

- name: Install base packages (macOS)
  when: ansible_facts["os_family"] == "Darwin"
  community.general.homebrew:
    name:
      - git
      - git-lfs
      - curl
      - wget
      - ripgrep
      - fd
      - jq
      - tree
      - just
    state: present

- name: Install base packages (Debian/Ubuntu)
  when: ansible_facts["os_family"] == "Debian"
  become: true
  tags: [sudo]
  ansible.builtin.apt:
    name:
      - git
      - curl
      - wget
      - ripgrep
      - fd-find
      - jq
      - tree
      - build-essential
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create fd symlink on Debian/Ubuntu
  when: ansible_facts["os_family"] == "Debian"
  become: true
  tags: [sudo]
  ansible.builtin.file:
    src: /usr/bin/fdfind
    dest: /usr/bin/fd
    state: link
  ignore_errors: true

# --- ripgrep (user-level fallback) ---
- name: Re-check if ripgrep is installed
  when: ansible_facts["os_family"] == "Debian"
  ansible.builtin.shell: command -v rg
  register: rg_recheck
  changed_when: false
  failed_when: false

- name: Install ripgrep from GitHub releases (user-level, no sudo)
  when:
    - ansible_facts["os_family"] == "Debian"
    - rg_recheck.rc != 0
  block:
    - name: Ensure ~/.local/bin exists (ripgrep)
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        state: directory
        mode: '0755'

    - name: Set ripgrep release target
      ansible.builtin.set_fact:
        rg_target: >-
          {{
            ansible_facts['architecture'] ~ '-unknown-linux-musl'
            if ansible_facts['architecture'] in ['x86_64', 'aarch64']
            else 'arm-unknown-linux-gnueabihf'
            if ansible_facts['architecture'] in ['armv7l', 'armhf']
            else ''
          }}

    - name: Get latest ripgrep release
      when: rg_target | trim != ''
      ansible.builtin.uri:
        url: https://api.github.com/repos/BurntSushi/ripgrep/releases/latest
        return_content: true
      register: rg_release

    - name: Download ripgrep binary
      when: rg_target | trim != ''
      ansible.builtin.get_url:
        url: "https://github.com/BurntSushi/ripgrep/releases/download/{{ rg_release.json.tag_name }}/ripgrep-{{ rg_release.json.tag_name }}-{{ rg_target }}.tar.gz"
        dest: /tmp/ripgrep.tar.gz
        mode: '0644'

    - name: Extract ripgrep
      when: rg_target | trim != ''
      ansible.builtin.unarchive:
        src: /tmp/ripgrep.tar.gz
        dest: /tmp
        remote_src: true

    - name: Install ripgrep to ~/.local/bin
      when: rg_target | trim != ''
      ansible.builtin.copy:
        src: "/tmp/ripgrep-{{ rg_release.json.tag_name }}-{{ rg_target }}/rg"
        dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/rg"
        mode: '0755'
        remote_src: true

    - name: Clean up ripgrep temp files
      when: rg_target | trim != ''
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/ripgrep.tar.gz
        - "/tmp/ripgrep-{{ rg_release.json.tag_name }}-{{ rg_target }}"

