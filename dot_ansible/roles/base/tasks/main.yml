---
# Base role - essential tools across platforms

- name: Install base packages (macOS)
  when: ansible_facts["os_family"] == "Darwin"
  community.general.homebrew:
    name:
      - git
      - git-lfs
      - curl
      - wget
      - ripgrep
      - fd
      - jq
      - tree
      - just
    state: present

# apt cache update is split out as best-effort: a single broken third-party
# source (dead PPA, GFW-blocked host, expired Release file) makes
# `apt-get update` exit non-zero, and with `update_cache: true` inlined in the
# install task the whole play used to die right here with the unhelpful
# "Failed to update apt cache after 5 retries: ''". Base packages all live in
# the main Ubuntu/Debian archives, so installing against a stale cache is
# almost always fine. See pitfalls/apt-update-fails-base-role-empty-error.md.
- name: Update apt cache (Debian/Ubuntu, best-effort)
  when: ansible_facts["os_family"] == "Debian"
  become: true
  tags: [sudo]
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  register: base_apt_cache
  ignore_errors: true

# The apt module swallows the underlying fetch errors (empty msg above), so
# re-run `apt-get update` via CLI purely to surface WHICH source is broken.
- name: Diagnose broken apt sources (cache update failed)
  when:
    - ansible_facts["os_family"] == "Debian"
    - base_apt_cache is failed
  become: true
  tags: [sudo]
  ansible.builtin.command: apt-get update
  register: base_apt_diag
  changed_when: false
  failed_when: false

# `Err:` lines (which repo) land on stdout, `E:`/`W:` summaries on stderr.
# msg is a list so each broken source renders on its own output line.
- name: Report broken apt sources
  when:
    - ansible_facts["os_family"] == "Debian"
    - base_apt_cache is failed
  tags: [sudo]
  vars:
    base_apt_broken_lines: >-
      {{ base_apt_diag.stdout_lines | default([]) | select('match', '^(Err|Ign):.*') | list
         + base_apt_diag.stderr_lines | default([]) }}
  ansible.builtin.debug:
    msg: "{{ ['apt cache update FAILED — continuing with the existing (possibly stale) package lists.',
              'Broken source(s) reported by `apt-get update`:']
             + base_apt_broken_lines
             + ['Fix or remove the offending file under /etc/apt/sources.list.d/ and re-run: chezmoi apply'] }}"

- name: Install base packages (Debian/Ubuntu)
  when: ansible_facts["os_family"] == "Debian"
  become: true
  tags: [sudo]
  ansible.builtin.apt:
    name:
      - git
      - git-lfs
      - curl
      - wget
      - ripgrep
      - fd-find
      - jq
      - tree
      - build-essential
      # unzip: required by ansible.builtin.unarchive for .zip archives
      # (duckdb, etc.). Minimal cloud images (Azure Ubuntu 24.04) don't ship
      # it, which used to fail the devtools role with the misleading
      # "Unable to list files in the archive: bzip2: (stdin) is not a bzip2
      # file" before the real "'unzip' binary not in path" line.
      - unzip
      # python3-debian: required by ansible.builtin.deb822_repository (used in
      # devtools / gui_apps_linux roles after the apt_repository deprecation).
      - python3-debian
    state: present

- name: Create fd symlink on Debian/Ubuntu
  when: ansible_facts["os_family"] == "Debian"
  become: true
  tags: [sudo]
  ansible.builtin.file:
    src: /usr/bin/fdfind
    dest: /usr/bin/fd
    state: link
  ignore_errors: true

# RedHat (CentOS/Rocky/Alma) base packages. ripgrep + fd skipped here:
# they're EPEL-only on CentOS 7 and the GitHub-release fallback below
# handles them more reliably (musl tarballs ignore glibc 2.17). Skipped
# entirely on noRoot (tags: [sudo] → --skip-tags sudo).
#
# Why `command: yum install` instead of `ansible.builtin.yum:`?
# ansible-core 2.18+ collapsed the yum module into a wrapper that
# routes through the dnf module backend. On CentOS 7 there is no `dnf`
# binary, so `ansible.builtin.yum:` aborts with
# `Could not detect which major revision of dnf is in use`. Rocky/Alma 8+
# do ship dnf, but using yum CLI works on both — see
# pitfalls/centos7-ansible-yum-dnf-backend.md.
- name: Install base packages (RedHat/CentOS) — yum CLI for CentOS 7 + Rocky/Alma compat
  when: ansible_facts["os_family"] == "RedHat"
  become: true
  tags: [sudo]
  # Why `${missing[*]:-}` instead of `${#missing[@]}`?
  # Jinja2 templating in ansible reads `${#...}` as a comment block
  # (`{# ... #}` in Jinja syntax) and aborts with "unbalanced jinja2 block".
  # `${missing[*]:-}` expands to space-joined elements (empty when unset)
  # so `[ -z ... ]` cleanly tests "any missing packages" without `{#`.
  ansible.builtin.shell: |
    set -e
    missing=()
    for p in git git-lfs curl wget jq tree gcc gcc-c++ make; do
      rpm -q "$p" >/dev/null 2>&1 || missing+=("$p")
    done
    if [ -z "${missing[*]:-}" ]; then
      echo "ALL_INSTALLED"
      exit 0
    fi
    yum install -y "${missing[@]}"
  args:
    executable: /bin/bash
  register: base_yum_result
  changed_when: "'ALL_INSTALLED' not in base_yum_result.stdout"
  ignore_errors: true

# --- ripgrep (user-level fallback) ---
- name: Re-check if ripgrep is installed
  when: ansible_facts["os_family"] in ["Debian", "RedHat"]
  ansible.builtin.shell: command -v rg
  register: rg_recheck
  changed_when: false
  failed_when: false

- name: Install ripgrep from GitHub releases (user-level, no sudo)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - rg_recheck.rc != 0
  block:
    - name: Ensure ~/.local/bin exists (ripgrep)
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        state: directory
        mode: '0755'

    - name: Set ripgrep release target
      ansible.builtin.set_fact:
        rg_target: >-
          {{
            target_architecture ~ '-unknown-linux-musl'
            if target_architecture in ['x86_64', 'aarch64']
            else 'arm-unknown-linux-gnueabihf'
            if target_architecture in ['armv7l', 'armhf']
            else ''
          }}

    - name: Get latest ripgrep release
      when: rg_target | trim != ''
      ansible.builtin.uri:
        url: https://api.github.com/repos/BurntSushi/ripgrep/releases/latest
        return_content: true
      register: rg_release

    - name: Download ripgrep binary
      when: rg_target | trim != ''
      ansible.builtin.get_url:
        url: "https://github.com/BurntSushi/ripgrep/releases/download/{{ rg_release.json.tag_name }}/ripgrep-{{ rg_release.json.tag_name }}-{{ rg_target }}.tar.gz"
        dest: /tmp/ripgrep.tar.gz
        mode: '0644'
        timeout: 120
      retries: 3
      delay: 5

    - name: Extract ripgrep
      when: rg_target | trim != ''
      ansible.builtin.unarchive:
        src: /tmp/ripgrep.tar.gz
        dest: /tmp
        remote_src: true

    - name: Install ripgrep to ~/.local/bin
      when: rg_target | trim != ''
      ansible.builtin.copy:
        src: "/tmp/ripgrep-{{ rg_release.json.tag_name }}-{{ rg_target }}/rg"
        dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/rg"
        mode: '0755'
        remote_src: true

    - name: Clean up ripgrep temp files
      when: rg_target | trim != ''
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/ripgrep.tar.gz
        - "/tmp/ripgrep-{{ rg_release.json.tag_name }}-{{ rg_target }}"

  rescue:
    - name: Warn ripgrep installation failed
      ansible.builtin.debug:
        msg: "ripgrep installation failed (likely network timeout) - skipping"

    - name: Clean up ripgrep temp files after failure
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/ripgrep.tar.gz

# --- fd (user-level fallback) ---
- name: Re-check if fd is installed
  when: ansible_facts["os_family"] in ["Debian", "RedHat"]
  ansible.builtin.shell: command -v fd
  register: fd_recheck
  changed_when: false
  failed_when: false

- name: Install fd from GitHub releases (user-level, no sudo)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - fd_recheck.rc != 0
  block:
    - name: Ensure ~/.local/bin exists (fd)
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        state: directory
        mode: '0755'

    - name: Set fd release target
      # Prefer musl assets on Debian/Ubuntu: the `unknown-linux-gnu` tarballs
      # are built on modern CI (Ubuntu 24.04, glibc 2.38+) and fail with
      # `GLIBC_2.X not found` on Jammy (glibc 2.35). Upstream fd ships musl
      # builds for x86_64, aarch64, and armhf.
      ansible.builtin.set_fact:
        fd_target: >-
          {{
            target_architecture ~ '-unknown-linux-musl'
            if target_architecture in ['x86_64', 'aarch64']
            else 'arm-unknown-linux-musleabihf'
            if target_architecture in ['armv7l', 'armhf']
            else ''
          }}

    - name: Get latest fd release
      when: fd_target | trim != ''
      ansible.builtin.uri:
        url: https://api.github.com/repos/sharkdp/fd/releases/latest
        return_content: true
      register: fd_release

    - name: Download fd binary
      when: fd_target | trim != ''
      ansible.builtin.get_url:
        url: "https://github.com/sharkdp/fd/releases/download/{{ fd_release.json.tag_name }}/fd-{{ fd_release.json.tag_name }}-{{ fd_target }}.tar.gz"
        dest: /tmp/fd.tar.gz
        mode: '0644'
        timeout: 120
      retries: 3
      delay: 5

    - name: Extract fd
      when: fd_target | trim != ''
      ansible.builtin.unarchive:
        src: /tmp/fd.tar.gz
        dest: /tmp
        remote_src: true

    - name: Install fd to ~/.local/bin
      when: fd_target | trim != ''
      ansible.builtin.copy:
        src: "/tmp/fd-{{ fd_release.json.tag_name }}-{{ fd_target }}/fd"
        dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/fd"
        mode: '0755'
        remote_src: true

    - name: Clean up fd temp files
      when: fd_target | trim != ''
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/fd.tar.gz
        - "/tmp/fd-{{ fd_release.json.tag_name }}-{{ fd_target }}"

  rescue:
    - name: Warn fd installation failed
      ansible.builtin.debug:
        msg: "fd installation failed (likely network timeout) - skipping"

    - name: Clean up fd temp files after failure
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/fd.tar.gz

# --- jq (user-level fallback) ---
- name: Re-check if jq is installed
  when: ansible_facts["os_family"] in ["Debian", "RedHat"]
  ansible.builtin.shell: command -v jq
  register: jq_recheck
  changed_when: false
  failed_when: false

- name: Install jq from GitHub releases (user-level, no sudo)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - jq_recheck.rc != 0
  block:
    - name: Ensure ~/.local/bin exists (jq)
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        state: directory
        mode: '0755'

    - name: Download jq binary
      ansible.builtin.get_url:
        url: "https://github.com/jqlang/jq/releases/latest/download/jq-linux-{{ target_architecture | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') | replace('armv7l', 'armhf') }}"
        dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/jq"
        mode: '0755'
        timeout: 120
      retries: 3
      delay: 5

  rescue:
    - name: Warn jq installation failed
      ansible.builtin.debug:
        msg: "jq installation failed (likely network timeout) - skipping"

    - name: Clean up jq temp files after failure
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/jq"
        state: absent

# --- git-lfs (user-level fallback) ---
- name: Re-check if git-lfs is installed
  when: ansible_facts["os_family"] in ["Debian", "RedHat"]
  ansible.builtin.shell: command -v git-lfs
  register: git_lfs_recheck
  changed_when: false
  failed_when: false
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:/usr/local/bin:{{ ansible_facts['env']['PATH'] }}"

- name: Set git-lfs release architecture
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - git_lfs_recheck.rc != 0
  ansible.builtin.set_fact:
    git_lfs_arch: >-
      {{
        'amd64' if target_architecture in ['x86_64', 'amd64']
        else 'arm64' if target_architecture in ['aarch64', 'arm64']
        else 'arm' if target_architecture in ['armv7l', 'armhf']
        else ''
      }}

- name: Install git-lfs from GitHub releases (user-level, no sudo)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - git_lfs_recheck.rc != 0
    - git_lfs_arch | default('') != ''
  block:
    - name: Ensure ~/.local/bin exists (git-lfs)
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        state: directory
        mode: '0755'

    - name: Get latest git-lfs release
      ansible.builtin.uri:
        url: https://api.github.com/repos/git-lfs/git-lfs/releases/latest
        return_content: true
      register: git_lfs_release

    - name: Download git-lfs tarball
      ansible.builtin.get_url:
        url: "https://github.com/git-lfs/git-lfs/releases/download/{{ git_lfs_release.json.tag_name }}/git-lfs-linux-{{ git_lfs_arch }}-{{ git_lfs_release.json.tag_name }}.tar.gz"
        dest: /tmp/git-lfs.tar.gz
        mode: '0644'
        timeout: 120
      retries: 3
      delay: 5

    - name: Extract and install git-lfs
      ansible.builtin.shell: |
        set -euo pipefail
        rm -rf /tmp/git-lfs-extract
        mkdir -p /tmp/git-lfs-extract
        tar -xzf /tmp/git-lfs.tar.gz -C /tmp/git-lfs-extract
        git_lfs_bin="$(find /tmp/git-lfs-extract -type f -name git-lfs -perm -u+x | head -n 1)"
        install -m 0755 "$git_lfs_bin" "{{ ansible_facts['env']['HOME'] }}/.local/bin/git-lfs"
      args:
        executable: /bin/bash
      changed_when: true

    - name: Clean up git-lfs temp files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/git-lfs.tar.gz
        - /tmp/git-lfs-extract

  rescue:
    - name: Warn git-lfs installation failed
      ansible.builtin.debug:
        msg: "git-lfs installation failed (likely network timeout) - skipping"

    - name: Clean up git-lfs temp files after failure
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/git-lfs.tar.gz
        - /tmp/git-lfs-extract

# --- just ---
- name: Check if just is installed
  when: ansible_facts["os_family"] in ["Debian", "RedHat"]
  ansible.builtin.command: just --version
  register: just_check
  changed_when: false
  failed_when: false

- name: Install just via official installer (Debian/Ubuntu, system-level)
  when:
    - ansible_facts["os_family"] == "Debian"
    - just_check.rc != 0
  become: true
  tags: [sudo]
  ansible.builtin.shell: |
    curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin
  args:
    creates: /usr/local/bin/just

# --- just (user-level fallback) ---
- name: Re-check if just is installed
  when: ansible_facts["os_family"] in ["Debian", "RedHat"]
  ansible.builtin.command: just --version
  register: just_recheck
  changed_when: false
  failed_when: false

- name: Install just via official installer (user-level, no sudo)
  when:
    - ansible_facts["os_family"] in ["Debian", "RedHat"]
    - just_recheck.rc != 0
  block:
    - name: Ensure ~/.local/bin exists (just)
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        state: directory
        mode: '0755'

    - name: Download and install just to ~/.local/bin
      ansible.builtin.shell: |
        curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to {{ ansible_facts['env']['HOME'] }}/.local/bin
      args:
        creates: "{{ ansible_facts['env']['HOME'] }}/.local/bin/just"

# --- locale ---
- name: Generate en_US.UTF-8 locale (Debian/Ubuntu)
  when: ansible_facts["os_family"] == "Debian"
  become: true
  tags: [sudo]
  community.general.locale_gen:
    name: en_US.UTF-8
    state: present
